# Praatao lesson pack 2 — the spectrogram: window length, dynamic range, formants

version: 1
id: 02-spectrogram
file: 02-spectrogram.yaml
title: {en: "Reading a spectrogram", zh: "读频谱图"}
summary:
  en: "Turn on a spectrogram, understand window length and dynamic range, and find the formants of a vowel."
  zh: "打开频谱图、弄懂窗长与动态范围，并在元音上找到共振峰。"
prerequisites: [01-first-sound]

steps:
  - id: show-spectrogram
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Spectrogram", "Show spectrogram"]}
    tip: {en: "Spectrogram → Show spectrogram", zh: "Spectrogram → Show spectrogram（显示频谱图）"}
    detail:
      en: "The spectrogram is the time-by-frequency view of the sound: horizontally time, vertically frequency, and darkness proportional to energy density. It is computed for the **visible** part only, so it is redrawn whenever you zoom or scroll. That is also why the picture can change brightness as you scroll: the reference for the greyscale is the maximum energy in the current view."
      zh: "频谱图是声音的「时间乘频率」视图：横轴是时间，纵轴是频率，深浅代表能量密度。它只依据**可见范围**计算，所以缩放或卷动时会重画。画面亮度会随卷动改变，也是因为灰阶的参考值是当前视野里的最大能量。"

  - id: open-spectrogram-settings
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Spectrogram", "Spectrogram settings..."]}
    tip: {en: "The three numbers that matter", zh: "真正重要的三个数字"}
    detail:
      en: "**Spectrogram settings…** holds three numbers and together they are the whole analysis: **View range** (which frequencies you look at), **Window length** (how precisely you can locate them) and **Dynamic range** (how faint a detail stays visible). Praat remembers them across sessions, so once you have tuned them for one speaker they stay right for the next file from the same person."
      zh: "**Spectrogram settings…** 里有三个数字，合起来就是整个分析：**View range**（你看多宽的频率）、**Window length**（你能定位得多准）、**Dynamic range**（多弱的内容还看得见）。Praat 会把这些设定保留到下次开启动程式，所以为某个说话者调好之后，同一个人下一份档案直接沿用。"

  - id: choose-window-length
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Spectrogram", "Spectrogram settings..."]}
    tip: {en: "0.005 s for formants, 0.03 s for harmonics", zh: "0.005 秒看共振峰，0.03 秒看泛音"}
    detail:
      en: "The window length sets the frequency resolution: for a Gaussian window the -3 dB bandwidth is about 1.3 / window length, so 5 ms resolves roughly 260 Hz and 30 ms roughly 43 Hz. Use **0.005 s** to look at formants and vowels, **0.03 s** to look at harmonic structure and F0, and expect a 0.0025 s window to smear F2 of most vowels. Longer windows also blur transitions, so a window that is too long hides the very segment boundaries you are trying to label."
      zh: "窗长决定频率解析度：以 Gaussian 窗为例，-3 dB 频宽约等于 1.3 / 窗长，所以 5 毫秒约分辨 260 Hz，30 毫秒约 43 Hz。看共振峰与元音用 **0.005 s**，看谐波结构与 F0 用 **0.03 s**，而 0.0025 秒会把多数元音的 F2 抹糊。窗太长也会模糊过渡，正好把你想标的音段边界藏起来。"

  - id: choose-dynamic-range
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Spectrogram", "Spectrogram settings..."]}
    tip: {en: "40–60 dB reads well for speech", zh: "语音用 40–60 dB 最好读"}
    detail:
      en: "The dynamic range is a threshold in dB **relative to the maximum in the current view**: everything more than that far below the peak is drawn white. 60 dB is Praat's default and it is usually too generous for a classroom recording, which washes the picture out to near-white. Start at **50 dB** and lower it if the background noise is still too visible."
      zh: "动态范围是相对于**当前视野最大值**的 dB 门槛：比峰值低超过这个数的部分一律画成白色。Praat 预设 60 dB，对课堂录音通常太宽松，画面会洗到几乎全白。先用 **50 dB**，如果背景杂讯还是很明显就再往下调。"

  - id: choose-view-range
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Spectrogram", "Spectrogram settings..."]}
    tip: {en: "0–5000 Hz, but never above the Nyquist limit", zh: "0–5000 Hz，但绝不超过奈奎斯特上限"}
    detail:
      en: "Set **View range** to 0–5000 Hz for vowels and most consonants, and up to 8000 Hz when you need the high-frequency detail of sibilants. The upper limit can never usefully exceed half the sampling frequency: above the Nyquist limit the values are zero and that part of the picture is simply white, which students often report as a bug. If you see a white band at the top, check the sampling frequency with **Info**."
      zh: "**View range** 设成 0–5000 Hz 足以看元音与大多数辅音；要看清咝音的高频细节则上探到 8000 Hz。上限绝不可能有效超过取样频率的一半：超过奈奎斯特上限的数值为零，那一块会直接是白色，学生常把它当成程式错误。若看到顶端有白带，用 **Info** 查一下取样频率。"

  - id: understand-white-edges
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: button, name: "in"}
    tip: {en: "White stripes at the edges are normal", zh: "两端的白色条纹是正常的"}
    detail:
      en: "Spectral analysis needs an analysis window, so Praat cannot compute a spectrum closer than half a window length to the start or the end of the sound: the result is the familiar white stripe. Zoom in and the stripe moves out of view, because Praat then reads signal from just outside the visible range. The same mechanism explains why the picture changes slightly as you scroll."
      zh: "频谱分析需要一整个分析窗，所以 Praat 无法算出比声音起点或终点更靠近半个窗长的频谱，结果就是你看到的那道白边。放大之后白边就移出视野了，因为这时 Praat 会读到刚好在可见范围之外的讯号。同一个机制也解释了为什么卷动时画面会略有变化。"

  - id: find-the-formants
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Formants", "Show formant"]}
    tip: {en: "Formants → Show formant: the red speckles", zh: "Formants → Show formant：红色斑点就是共振峰"}
    detail:
      en: "The vocal tract acts as a filter, and its resonances shape the spectrum; on a vowel these appear as dark horizontal bands. **Show formant** overlays the LPC estimate as red speckles, one row per formant, so you can check the estimate against the bands your own eyes see. Read the formants in the **steady nucleus** of the vowel, not in the transition, where the red speckles scatter because the model cannot keep up."
      zh: "声道是一个滤波器，它的共振塑造了频谱；在元音上这些共振呈现为深色的水平频带。**Show formant** 把 LPC 估计叠成红色斑点，每一列一个共振峰，方便你把自己的眼睛看到的频带和估计值对照。要在元音**稳定的核心**读共振峰，不要在过渡区读，那里的红点会散开，因为模型跟不上变化。"

  - id: read-a-formant
    detect:
      object_types_present: ["Sound"]
      selected_types: ["Sound"]
      editor_open: true
    highlight: {kind: menu, path: ["Formants", "Get first formant"]}
    tip: {en: "Put the cursor in the vowel, then read F1", zh: "游标放进元音里，再读 F1"}
    detail:
      en: "Click in the steady part of the vowel to place the cursor, then use **Get first formant** (F1) and **Get second formant** (F2). F1 is mainly a jaw-height cue and F2 a front-back and tongue-body cue, so the pair F1–F2 is what you use to place a vowel in the vowel space. Write down the cursor time together with the value; a formant value without a time stamp cannot be reproduced."
      zh: "在元音稳定段点一下放置游标，再用 **Get first formant**（F1）与 **Get second formant**（F2）。F1 主要反映开口度，F2 主要反映舌位前后与舌体状态，所以 F1–F2 这一对数值才是把元音放进元音四边形的依据。请把游标时间与数值一起记下来，没有时间戳的共振峰数值无法重现。"

completion:
  message:
    en: "You can now read a spectrogram and measure formants. Next pack: the pitch contour."
    zh: "你已经会读频谱图、也会量共振峰了。下一包：基频曲线。"
  next_lesson: 03-pitch
