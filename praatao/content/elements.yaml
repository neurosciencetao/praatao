- id: new-sound-formula
  aliases:
  - Create Sound from formula...
  control_types:
  - MenuItemControl
  title:
    en: Create Sound from formula...
    zh: Create Sound from formula...（用公式造声音）
  what:
    en: Synthesises a Sound from a mathematical formula, which is how you build a test signal whose exact
      properties you know.
    zh: 用数学公式合成声音，用来制造一个性质完全在掌握之中的测试讯号。
  how:
    en: New → Sound → Create Sound from formula..., then type the formula, for example 1/2 * sin (2*pi*1000*x)
      for a 1 kHz tone, and set the sampling frequency and duration.
    zh: New → Sound → Create Sound from formula...，填入公式，例如 1/2 * sin (2*pi*1000*x) 是 1 kHz 正弦波，再设定取样频率与长度。
  concept:
    en: 'Because you chose the frequency, a synthetic tone is the perfect calibration for the spectrogram:
      with a 5 ms window a 1000 Hz tone appears as a band about 260 Hz wide, and with a 30 ms window about
      43 Hz.'
    zh: 因为频率是你自己挑的，合成音是频谱图最好的校正信号：5 毫秒窗下 1000 Hz 正弦波呈现约 260 Hz 宽的带，30 毫秒窗则约 43 Hz 宽。
  pitfalls:
  - en: The formula uses x as time in seconds, so sin (2*pi*1000*x) is 1000 Hz but sin (1000*x) is not.
    zh: 公式中的 x 是以秒为单位的時間，sin (2*pi*1000*x) 才是 1000 Hz，sin (1000*x) 不是。
  - en: A formula Sound has no noise and no natural harmonics; do not use it to test a voicing detector.
    zh: 公式合成的聲音沒有雜訊也沒有自然泛音，不要拿它來測試清浊偵測。
  keywords:
  - create sound
  - 合成
  - 公式
  - formula
  - sine
  - 正弦波
  - 测试信号
  - tone
  - 测试音
- id: new-table
  aliases:
  - Create Table with column names...
  - Create Table without column names...
  control_types:
  - MenuItemControl
  title:
    en: Create Table...
    zh: 建立 Table（Create Table...）
  what:
    en: Creates an empty Table object, with or without column names, ready for your own measurements.
    zh: 建立一个空的 Table 物件（可选择要不要栏位名称），等着填入你的量测结果。
  how:
    en: New → Tables → Create Table with column names..., name the columns, and confirm. Enter the data
      in the Table editor window that opens.
    zh: New → Tables → Create Table with column names...，为各栏命名并确认，接下来的输入就在打开的 Table 编辑窗口里进行。
  concept:
    en: A Table with one row per token and one column per variable is the standard bridge between Praat
      and any statistics package, and the format you should hand in with a lab report.
    zh: 一列一个语流、一栏一个变数的 Table，是 Praat 与任何统计软体之间的标准桥梁，也是实验报告该附上的格式。
  pitfalls:
  - en: Column names must be unique; Praat refuses duplicates and may append numbers instead.
    zh: 栏位名称不能重复，Praat 会拒绝重复名称，有时会自动加数字。
  - en: In Praat 6.4.12 the command is called "Create Table with column names...", not "New Table...";
      tutorials that use the older name will send you looking for something that is not there.
    zh: 在 Praat 6.4.12 这条指令叫「Create Table with column names...」，不是「New Table...」； 用旧名字的教程会让你去找一个根本不存在的东西。
  keywords:
  - new table
  - 建立
  - 表格
  - table
  - 试算表
  - column
  - 栏位
  - 数据
  - 资料
- id: new-matrix
  aliases:
  - New Matrix...
  - Create Matrix...
  control_types:
  - MenuItemControl
  title:
    en: New Matrix...
    zh: New Matrix...（建立 Matrix）
  what:
    en: Creates an empty Matrix object, a plain two-dimensional grid of numbers without row or column
      labels.
    zh: 建立一个空的 Matrix 物件，也就是没有行列标签的二维数字网格。
  how:
    en: New → Tables → New Matrix..., then give the number of rows and columns. Edit the numbers in the
      Matrix editor window.
    zh: New → Tables → New Matrix...，再填入列数与行数，接着在 Matrix 编辑窗口里输入数字。
  pitfalls:
  - en: Rows and columns are easy to swap by accident; a transposed matrix looks plausible but every value
      is in the wrong place.
    zh: 列与行很容易不小心对调，矩阵转置后看起来仍然合理，但每个数值都错位了。
  keywords:
  - new matrix
  - 建立
  - 矩阵
  - matrix
  - 网格
  - 数值
  - numbers
- id: save-as-wav
  aliases:
  - Save as WAV file...
  control_types:
  - MenuItemControl
  title:
    en: Save as WAV file...
    zh: Save as WAV file...（存成 WAV）
  what:
    en: Writes the selected Sound to disk as a standard uncompressed WAV file.
    zh: 把选中的 Sound 写成标准的未压缩 WAV 音档。
  how:
    en: Select the Sound, then Save → Save as WAV file..., choose a name and a folder. Praat writes 16-bit
      PCM by default.
    zh: 选中 Sound，再 Save → Save as WAV file...，指定档名与资料夹，Praat 预设写 16-bit PCM。
  concept:
    en: WAV is the interchange format of phonetics because it is lossless and keeps the sampling frequency
      exactly, so another lab gets the same signal you analysed.
    zh: WAV 是语音学的交换格式，因为它无损且完整保留取样频率，别组拿到的讯号跟你分析过的完全一致。
  pitfalls:
  - en: Saving 16-bit quantises the samples; if your source was 24-bit, keep a 24-bit copy for archival.
    zh: 存成 16-bit 会量化样本，原始是 24-bit 的话，典藏请留一份 24-bit 的。
  - en: Save as WAV file... saves the whole object; if you only want the selection, extract it first in
      the editor.
    zh: Save as WAV file... 存的是整个物件，只要选区就要先在编辑窗口里把它取出。
  keywords:
  - save as wav
  - 存成
  - wav
  - 音档
  - export
  - 汇出
  - 16 bit
  - 量化
- id: save-as-text-file
  aliases:
  - Save as text file...
  control_types:
  - MenuItemControl
  title:
    en: Save as text file...
    zh: Save as text file...（存成文字档）
  what:
    en: Writes the selected object as readable plain text, which is how Tables and other data objects
      leave Praat.
    zh: 把选中物件写成读得懂的纯文字，Table 等资料物件就是这样离开 Praat 的。
  how:
    en: Select a Table and use Save → Save as text file.... Write the file as tab-separated if you want
      to reopen it as a Table later.
    zh: 选中 Table，用 Save → Save as text file...，若之后要再用 Table 读回来，存成定位字元分隔最保险。
  pitfalls:
  - en: Text files are the safest archival format for annotation, but they lose Praat's internal types;
      keep the original object too if the type matters.
    zh: 文字档是标注最安全的典藏格式，但会失去 Praat 内部型别，型别重要的话原件也要留一份。
  keywords:
  - save as text file
  - 存成文字
  - 文字档
  - text
  - ascii
  - table
  - 表格
  - 汇出
- id: save-as-binary-file
  aliases:
  - Save as binary file...
  control_types:
  - MenuItemControl
  title:
    en: Save as binary file...
    zh: Save as binary file...（存成二进位档）
  what:
    en: Writes the selected data object as a compact binary file that Praat can read back exactly, including
      its internal types.
    zh: 把选中的资料物件写成精简的二进位档，Praat 能原样读回，连内部型别都保留。
  how:
    en: Select the object and choose Save → Save as binary file.... The file is smaller and lossless but
      only Praat can read it.
    zh: 选中物件选 Save → Save as binary file...，档案比较小而且无损，但只有 Praat 读得了。
  pitfalls:
  - en: A binary Praat file cannot be opened in Excel; use Save as text file... if other people need to
      read it.
    zh: Praat 的二进位档在 Excel 里打不开，别人要读就用 Save as text file...。
  keywords:
  - binary file
  - 二进位
  - 存成
  - save
  - 压缩
  - 精简
  - praat file
- id: save-textgrid-as-text-file
  aliases:
  - Save TextGrid as text file...
  - Save as short TextGrid...
  - Save as long TextGrid...
  control_types:
  - MenuItemControl
  title:
    en: Save TextGrid as text file...
    zh: Save TextGrid as text file...（把 TextGrid 存成文字档）
  what:
    en: Writes the TextGrid out as a plain text annotation file that any other tool can read, without
      going back to the Objects window.
    zh: 把 TextGrid 写成纯文字标注档，其他工具都读得到，不必绕回 Objects 窗口。
  how:
    en: In the TextGrid editor use File → Save TextGrid as text file...; in the Objects window the same
      job is done by selecting the TextGrid and using Save → Save as text file...
    zh: 在 TextGrid 编辑窗口用 File → Save TextGrid as text file...；在 Objects 窗口则是选中 TextGrid 后用 Save → Save
      as text file...。
  concept:
    en: The TextGrid text format stores one interval tier per line and one point tier per line, with the
      intervals separated by tabs; it is the lingua franca of phonetic annotation.
    zh: TextGrid 的文字格式是一行一个区间层、一行一个点层，区间之间以定位字元分开，是语音标注的通用交换格式。
  pitfalls:
  - en: Saving from the editor writes the visible annotation; make sure the cursor is where you want the
      file to end.
    zh: 从编辑窗口存档写的是目前的标注内容，要确认游标位置是你想要的终点。
  - en: 'The TextGrid and the sound are separate objects: saving the annotation does not save the audio.'
    zh: TextGrid 与声音是两个独立物件，存了标注不等于存了声音。
  keywords:
  - textgrid
  - 文本网格
  - save
  - 储存
  - annotation
  - 标注
  - text file
  - 文字档
  - export
  - 汇出
- id: help-menu-praat-intro
  aliases:
  - Praat Intro
  control_types:
  - MenuItemControl
  title:
    en: Praat Intro
    zh: Praat Intro（官方入门）
  what:
    en: 'Opens Praat''s built-in introductory course: a sequence of short lessons that walk through opening
      a sound, looking at it, analysing it and annotating it.'
    zh: 打开 Praat 内建的入门课程：一连串短课，带你从开启声音、看它、分析它到标注它。
  how:
    en: Help → Praat Intro (Ctrl-Shift-?). Follow the lessons in order the first time, because each one
      assumes the previous one.
    zh: Help → Praat Intro（Ctrl-Shift-?）。第一次请照顺序做，每一课都以上一课为前提。
  concept:
    en: Intro is the same material as the first laboratory sessions, in Praat's own words, so it is the
      fastest way to see the intended order of operations.
    zh: Intro 就是实验课前半段的内容，只是换成 Praat 自己的说法，所以它是看清正确操作顺序最快的途径。
  pitfalls:
  - en: The lessons are in English and quite dense, so a student who reads them once will miss the settings
      each step asks for.
    zh: 这些课是英文而且密度很高，只读一遍的同学会漏掉每一步要填的设定。
  - en: The small Demo window that Intro uses is separate from the Objects window and does not replace
      it.
    zh: Intro 用到的 Demo window 是一个独立的小窗口，不会取代 Objects 窗口。
  - en: The tutorial uses its own sound files; do not use them as your data.
    zh: 教学用的是它自己的音档，不要拿来当你的资料。
  keywords:
  - praat intro
  - 入门
  - 导览
  - tutorial
  - 教学
  - 课程
  - lesson
  - 练习
  - 示范
  - demonstration
- id: help-menu-objects-window
  aliases:
  - Objects window
  - Editors
  control_types:
  - MenuItemControl
  title:
    en: Objects window, Editors (Help menu)
    zh: Objects window、Editors（Help 菜单）
  what:
    en: Two manual pages. Objects window explains the window that lists your data and the dynamic buttons
      that follow the selection; Editors describes the windows in which you look at and change the data.
    zh: 两个手册页。Objects window 说明列出资料的窗口，以及随选择而变的动态按钮；Editors 介绍你检视与修改资料所用的各种编辑窗口。
  how:
    en: Help → Objects window is worth reading early, because it explains why the buttons on the right
      of the window change as soon as you select something else.
    zh: Help → Objects window 值得早点读，它解释了为什么换个选中物件，右边的按钮就跟着变。
  concept:
    en: Praat separates the list of data (the Objects window) from the views on that data (the editors),
      so one object can be seen as a waveform, a spectrogram or a table without being copied.
    zh: Praat 把资料清单（Objects 窗口）与资料的视图（编辑窗口）分开，所以同一个物件可以分别用波形、频谱图或表格来看，不必复制。
  pitfalls:
  - en: These pages describe the interface, not the analysis; the object-type pages tell you what each
      object can do.
    zh: 这些页讲的是介面而不是分析，物件类型那几页才告诉你每种物件能做什么。
  - en: The passage about the dynamic buttons is where beginners learn that the buttons are not broken,
      only different.
    zh: 动态按钮那一段正是初学者学会「按钮不是坏了，只是变了」的地方。
  - en: The manual describes the interface of the version it documents; your Praat may group the buttons
      slightly differently.
    zh: 手册描述的是它那一版的介面，你的 Praat 分组方式可能略有不同。
  keywords:
  - objects window
  - objects 窗口
  - editor
  - 编辑窗口
  - dynamic button
  - 动态按钮
  - manual
  - 手册
  - list
  - 清单
- id: help-menu-types-of-objects
  aliases:
  - Types of objects
  control_types:
  - MenuItemControl
  title:
    en: Types of objects
    zh: Types of objects（物件类型总览）
  what:
    en: A manual page listing every object type in Praat, what it contains, and which commands apply to
      it.
    zh: 一个手册页，列出 Praat 的每一种物件类型、它装什么资料，以及哪些指令可以用在它身上。
  how:
    en: Help → Types of objects. Read the entries for Sound, TextGrid, Pitch, Formant and Intensity, which
      are the five you will use all term.
    zh: Help → Types of objects。重点读 Sound、TextGrid、Pitch、Formant、Intensity 这五项，它们是你整学期都会用到的。
  concept:
    en: 'Each object type fixes what can be asked of the data: a Pitch object carries a fundamental frequency
      per frame, a Formant object carries formant frequencies and bandwidths, and neither is edited like
      a Sound.'
    zh: 每种物件类型都限定了可以对资料问什么：Pitch 物件存每一帧的基频，Formant 物件存共振峰频率与频宽，两者都不像 Sound 那样可以直接编辑。
  pitfalls:
  - en: 'The page is a reference, not a course: read the entry for the object you are holding rather than
      the whole list.'
    zh: 这一页是参考工具而不是课程，读你手上那一种物件的说明就好，不必整页读完。
  - en: Object types are not interchangeable; a Formant object cannot be drawn on a waveform.
    zh: 物件类型不能互换，Formant 物件没法画在波形上。
  - en: Students try to treat Pitch and Formant as pictures; they are data objects that can be queried,
      tabulated and plotted.
    zh: 有学生把 Pitch 和 Formant 当成图，它们其实是可查询、可制表、可绘图的数据物件。
  keywords:
  - types of objects
  - 物件类型
  - object type
  - 手册
  - manual
  - sound
  - textgrid
  - pitch
  - formant
  - intensity
  - 基频
- id: workflow-go-to-manual-page
  aliases:
  - Go to manual page...
  title:
    en: Jumping straight to a manual page
    zh: 直接跳到手册的某一页
  what:
    en: A Help-menu command that opens the page of the Praat manual that you name, so you do not have
      to hunt through the manual.
    zh: Help 菜单里的指令，能直接打开你指定名称的手册页面，不用自己在手册里翻找。
  how:
    en: Choose Help → Go to manual page..., type the name of the page you are looking for, and Praat opens
      it in your browser. Use it when you know roughly what the manual calls something but not where it
      lives.
    zh: 选 Help → Go to manual page...，输入你要找的页面名称，Praat 会在浏览器里打开它。大致知道手册怎么称呼某个东西、却不知道它在哪一页时就用它。
  concept:
    en: 'The manual is organised by object type, so page names follow the type: TextGrid, Pitch, Sound,
      and the commands that belong to each of them.'
    zh: 手册以物件类型分章，页面名称也依循类型：TextGrid、Pitch、Sound，以及各类型各自的指令。
  pitfalls:
  - en: It opens the online manual, so it needs an internet connection; with no network, keep a local
      copy of the manual.
    zh: 它打开的是线上手册，需要网路连线；没有网路时自己留一份本地手册。
  - en: The command opens the page that describes what you were looking for; it does not carry the command
      out for you.
    zh: 这个指令只是打开说明你要找的东西的那一页，并不会替你执行那个指令。
  - en: Search Praat manual... searches the online manual, so without internet access neither command
      has anything to open.
    zh: Search Praat manual... 搜寻的是线上手册，没有网路时这两条指令都无处可去。
  - en: Go to manual page... wants the exact page name, so a wrong spelling silently opens nothing.
    zh: Go to manual page... 要的是准确的页面名称，拼错就会什么也没打开。
  - en: The manual uses American spelling; searching for "analyse" will not find the pages that say "analyze"
      and vice versa.
    zh: 手册用美式拼字，搜寻「analyse」找不到写成「analyze」的页面，反之亦然。
  - en: Search runs on the online manual, so it needs an internet connection.
    zh: 搜寻用的是线上手册，需要网路连线。
  keywords:
  - manual
  - 手册
  - help
  - 说明
  - 帮助
  - go to
  - 前往
  - page
  - 页面
  - documentation
  - 文件
- id: praat-menu-about
  aliases:
  - About Praat
  control_types:
  - MenuItemControl
  title:
    en: About Praat
    zh: About Praat（关于）
  what:
    en: Opens the window that names the Praat version, the author, and the licence the program was released
      under.
    zh: 打开一个窗口，写明 Praat 的版本编号、作者，以及这个版本以什么授权发布。
  how:
    en: Praat → About Praat. Write the version number in your lab report, because a bug fixed in a later
      release is still a bug in the copy you ran.
    zh: Praat → About Praat。把版本编号写进实验报告，因为后来版本修掉的错，在你跑的这一版里还在。
  concept:
    en: Praat is free software released under the GNU General Public License; the About window is where
      you see which terms apply to the copy you are running.
    zh: Praat 是以 GNU General Public License 发布的自由软件，About 窗口就是看这份授权条款的地方。
  pitfalls:
  - en: About Praat lives in the Praat menu, not in the Help menu, even though the manual page for it
      sits under Help.
    zh: About Praat 在 Praat 菜单里，不在 Help 菜单里，虽然它对应的手册页列在 Help 之下。
  - en: The About window also lists the contributors; cite the manual and Praat in a report rather than
      only your own name.
    zh: About 窗口也列出贡献者名单，报告里引用手册与 Praat 时别只写自己的名字。
  - en: Menus and defaults change between versions; if a tutorial's button is missing, compare versions
      before assuming it is hidden.
    zh: 不同版本的菜单与预设值会变，若教学提到的按钮不见，先比版本，而不是直接假设它被隐藏了。
  keywords:
  - about
  - 关于
  - 版本
  - version
  - 授权
  - licence
  - license
  - 版权
  - gnu
- id: sound-object
  aliases:
  - Sound object
  title:
    en: Sound object
    zh: Sound 物件（声音）
  what:
    en: A sampled audio waveform held in memory, with a start time, a duration, a sampling frequency and
      one or more channels of samples.
    zh: 放在记忆体里的取样波形，带有起始时间、长度、取样频率，以及一个或多个声道的样本。
  how:
    en: It appears in the Objects list as "Sound name". Click it to select it, then use the dynamic buttons
      or View & Edit to work with it.
    zh: 在清单里显示为「Sound 名称」。点它选中，之后就能用动态按钮或 View & Edit 处理。
  concept:
    en: Sound is the raw evidence; everything else in Praat is an interpretation of it. The sampling frequency
      sets the Nyquist limit, so a 16 kHz recording simply cannot show you a 7 kHz fricative's fine detail.
    zh: Sound 是原始证据，Praat 里其他一切都是对它的解释。取样频率决定奈奎斯特上限，16 kHz 的录音根本显示不出 7 kHz 擦音的细节。
  pitfalls:
  - en: The number after the type is the object index, not a level or a channel number.
    zh: 类型后面的数字是物件编号，不是强度层级也不是声道编号。
  - en: Two Sounds can look identical in the list and be completely different recordings; check the sampling
      frequency with Info.
    zh: 清单里两个 Sound 看起来一样，录的却可能完全不同，用 Info 看看取样频率。
  keywords:
  - sound
  - 对象
  - 声音
  - 波形
  - waveform
  - 采样
  - sampling
  - type
  - 类型
- id: longsound-object
  aliases:
  - LongSound
  - LongSound object
  title:
    en: LongSound object
    zh: LongSound 物件（长声音）
  what:
    en: A reference to an audio file that stays on disk; Praat reads only a short window into memory when
      it needs to play or display part of it.
    zh: 指向硬盘上音档的参照物件，Praat 只在需要播放或显示时读一小段进记忆体。
  how:
    en: It appears in the list as "LongSound name". Open it with View & Edit to get a LongSound editor,
      which looks like the Sound editor but is read-only.
    zh: 清单里显示为「LongSound 名称」。用 View & Edit 打开得到 LongSound 编辑窗口，看起来像声音编辑窗口但是唯读。
  concept:
    en: The LongSound buffer defaults to 60 seconds and is set in Praat → Settings → LongSound settings....
      The trade-off is disk access against memory.
    zh: LongSound 的缓冲预设是 60 秒，在 Praat → Settings → LongSound settings... 里调整。这是用磁碟访问换取记忆体。
  pitfalls:
  - en: A LongSound cannot be analysed into Pitch or Formant objects, so it cannot be used for a full
      pitch contour over a long recording.
    zh: LongSound 无法分析成 Pitch 或 Formant 物件，因此无法对长录音做出完整的基频曲线。
  - en: Copying a LongSound copies the reference, not the audio, so the copy still points at the same
      file.
    zh: 复制 LongSound 复制的是参照而不是音讯，副本仍然指向同一个档案。
  keywords:
  - longsound
  - 长声音
  - 长音档
  - 大档案
  - streaming
  - 串流
  - memory
  - 记忆体
- id: textgrid-object
  aliases:
  - TextGrid object
  title:
    en: TextGrid object
    zh: TextGrid 物件（标注网格）
  what:
    en: A set of labelled intervals and points that share one time axis, used to record where things happen
      in the sound.
    zh: 一组共用同一时间轴的标注区间与点，用来记录声音里事情发生在哪些位置。
  how:
    en: It appears as "TextGrid name". Select it (together with its Sound) and click View & Edit to get
      the tier editor.
    zh: 清单里显示为「TextGrid 名称」。选中它（连同它的 Sound）再点 View & Edit 就进入层级编辑窗口。
  concept:
    en: Tiers are your hypothesis about the utterance. A common design is one interval tier for phones,
      one for syllables or words, and one point tier for events such as a release burst or a word boundary.
    zh: 各层就是你对这段语流的假设。常见设计是：音素用区间层、音节或词用另一层，释爆点或词界这类事件用点层。
  pitfalls:
  - en: A TextGrid knows nothing about acoustics; it is your labelling, and it can be wrong.
    zh: TextGrid 不含任何声学资讯，它就是你的标注，可能是错的。
  - en: The TextGrid and the Sound are separate objects; deleting one does not delete the other, but deleting
      the Sound makes annotation meaningless.
    zh: TextGrid 与 Sound 是两个独立物件，删掉一个不会删掉另一个，但删掉声音后标注就失去意义。
  keywords:
  - textgrid
  - 文本网格
  - 标注
  - annotation
  - tier
  - 层级
  - interval
  - 区间
  - point
  - 点
- id: pitch-object
  aliases:
  - Pitch object
  title:
    en: Pitch object
    zh: Pitch 物件（基频）
  what:
    en: A time series of fundamental frequency estimates, one value per analysis frame, with a voiced
      or unvoiced decision for each frame.
    zh: 随时间变化的基频（基频）估计序列，每个分析窗一个数值，并对每一格标出有声或无声。
  how:
    en: It appears as "Pitch name". Select it and click Plot to draw the contour, or View & Edit to open
      the pitch editor and edit the target values.
    zh: 清单里显示为「Pitch 名称」。选中后点 Plot 可画出曲线，或用 View & Edit 打开基频编辑器修改目标值。
  concept:
    en: 'Pitch is a physiological property converted into a number: the rate of vocal fold vibration.
      Because it is estimated, it can be wrong, and octave errors (a value exactly half or twice the true
      F0) are the classic failure.'
    zh: 基频是生理属性被换算成数字的结果，也就是声带振动的频率。因为它是估计值，就可能出错，最典型的失误是八度跳错（数值正好是真实 F0 的一半或两倍）。
  pitfalls:
  - en: 'A missing value is not zero: unvoiced frames are stored as undefined, and a gap in the contour
      means unvoiced, not silence at zero Hz.'
    zh: 缺失值不是零：无声格的数值是未定义的，曲线上的空缺代表无声，不代表 0 Hz 的静音。
  - en: Pitch is not the same as perceived pitch; a listener may hear a different melody than the F0 contour
      suggests.
    zh: 基频不等于知觉音高，听者听到的旋律可能与 F0 曲线暗示的不一样。
  keywords:
  - pitch
  - 基频
  - f0
  - 物件
  - object
  - contour
  - 曲线
  - voiced
  - 有声
  - octave
  - 八度
- id: formant-object
  aliases:
  - Formant object
  title:
    en: Formant object
    zh: Formant 物件（共振峰）
  what:
    en: A time series of formant frequency and bandwidth estimates, produced by fitting an all-pole (LPC)
      model to the spectrum.
    zh: 随时间变化的共振峰频率与频宽估计，由把全极点（LPC）模型套到频谱上得到。
  how:
    en: It appears as "Formant name". Select it and click Plot to draw the F1/F2/F3 contours over time.
    zh: 清单里显示为「Formant 名称」。选中后点 Plot 可把 F1/F2/F3 曲线画在时间轴上。
  concept:
    en: The vocal tract acts as a filter, and its resonances (formants) shape the spectrum. Because LPC
      assumes an all-pole model, it can model formants well but not the anti-resonances of nasals.
    zh: 声道是一个滤波器，它的共振（共振峰）塑造了频谱形状。LPC 假设全极点模型，对共振峰拟合得好，对鼻音的反共振却拟合不了。
  pitfalls:
  - en: Formants are only meaningful for vowels and voiced sonorants; the LPC fit on a fricative is meaningless
      even though Praat will still return numbers.
    zh: 共振峰只对元音与有声响音有意义，Praat 虽然照样给数值，但在擦音上得到的 LPC 拟合毫无意义。
  - en: A formant that jumps by a factor of two between frames is usually an LPC tracking failure, not
      a real acoustic event.
    zh: 共振峰在相邻两格之间跳了一倍，多半是 LPC 追踪失败，不是真实的声学事件。
  keywords:
  - formant
  - 共振峰
  - f1
  - f2
  - f3
  - lpc
  - 声道
  - vocal tract
  - 频宽
  - bandwidth
- id: intensity-object
  aliases:
  - Intensity object
  title:
    en: Intensity object
    zh: Intensity 物件（强度）
  what:
    en: A contour of the short-time energy of the sound in dB relative to the hearing threshold, one value
      per analysis frame.
    zh: 声音短时能量的 dB 曲线（以听觉阈值为零点），每个分析窗一个数值。
  how:
    en: It appears as "Intensity name"; Plot draws it. Use it to find syllabic peaks and stress, not to
      judge spectral shape.
    zh: 清单里显示为「Intensity 名称」，用 Plot 可画出来。它用来找音节峰值与重音，不用来判断频谱形状。
  concept:
    en: 'Intensity is derived from the waveform by squaring and smoothing, so it inherits the periodicity
      of the voice: with a low minimum pitch the curve ripples at the pitch period.'
    zh: 强度是把波形平方再平滑得到的，因此会带上声带周期的起伏：最低基频设定太低时，曲线上会出现音高周期的波纹。
  pitfalls:
  - en: Higher on the plot means more energy on an absolute scale (0 dB is the hearing threshold), but an
      uncalibrated recording means the level is not a true SPL.
    zh: 曲线较高表示能量较多，刻度是绝对的（0 dB 为听觉阈值），但未校正的录音得不到真正的声压级。
  keywords:
  - intensity
  - 强度
  - 能量
  - energy
  - db
  - contour
  - 曲线
  - stress
  - 重音
- id: spectrogram-object
  aliases:
  - Spectrogram object
  title:
    en: Spectrogram object
    zh: Spectrogram 物件（频谱图）
  what:
    en: A time-by-frequency array of energy densities, produced by sliding a window over the sound and
      taking the spectrum at each step.
    zh: 时间乘以频率的能量密度阵列，由分析窗在声音上滑动、每一步取一次频谱而成。
  how:
    en: Create it with Analyse spectrum → To Spectrogram..., then View & Edit to display it, or Draw →
      To Spectrogram... to put it on screen.
    zh: 用 Analyse spectrum → To Spectrogram... 产生，再用 View & Edit 显示，或用 Draw → To Spectrogram... 画出来。
  concept:
    en: A Spectrogram is a stack of spectra, so the window length and the dynamic range you chose are
      baked into the object; changing the editor's display settings does not recompute it.
    zh: Spectrogram 是一叠频谱，所以你选的窗长与动态范围已经写进物件里，之后改编辑窗口的显示设定并不会重新计算。
  pitfalls:
  - en: Re-drawing with different settings is not the same as recomputing; to change the analysis, redo
      To Spectrogram...
    zh: 改设定重画不等于重新分析，要改分析参数就得重跑 To Spectrogram...。
  keywords:
  - spectrogram
  - 频谱图
  - 物件
  - object
  - spectro-temporal
  - 时频
  - energy
  - 能量
- id: spectrum-object
  aliases:
  - Spectrum object
  title:
    en: Spectrum object
    zh: Spectrum 物件（频谱）
  what:
    en: The frequency-by-amplitude spectrum of one moment in time, or of a whole sound when averaged.
    zh: 某一瞬间的频率对振幅频谱，或整段声音取平均后的频谱。
  how:
    en: Create it with Analyse spectrum → To Spectrum..., then Draw → To Spectrum... to see it, or use
      it in the editor's spectral slice view.
    zh: 用 Analyse spectrum → To Spectrum... 产生，再用 Draw → To Spectrum... 看，或在编辑窗口用频谱切片检视。
  concept:
    en: A spectrum is the amplitude of each frequency component. Peaks in it are the resonances of the
      vocal tract; the spacing between harmonics tells you the F0.
    zh: 频谱是各频率成分的振幅，其中的峰就是声道的共振，泛音之间的间距告诉你 F0。
  pitfalls:
  - en: The amplitude scale of a spectrum is linear, so most of the action sits near zero; look at the
      dB scale instead.
    zh: 频谱的振幅刻度是线性的，几乎所有内容都挤在接近零的地方，应该看 dB 刻度。
  keywords:
  - spectrum
  - 频谱
  - 物件
  - object
  - harmonic
  - 泛音
  - 振幅
  - amplitude
  - slice
  - 切片
- id: table-object
  aliases:
  - Table object
  title:
    en: Table object
    zh: Table 物件（资料表）
  what:
    en: A spreadsheet-like object with named columns that can hold numbers or text, one row per observation.
    zh: 像试算表一样的物件，栏位有名称，可以放数字或文字，一列一个观察值。
  how:
    en: Create it with New → Tables → New Table..., or read one with Open → Read Table from tab-separated
      file...; edit it in the Table editor.
    zh: 用 New → Tables → New Table... 建立，或用 Open → Read Table from tab-separated file... 读入，再在 Table 编辑窗口里编辑。
  concept:
    en: 'The Table is where per-token measurements live: duration, mean F0, F1, F2, in one row per token
      so that any statistics package can read it.'
    zh: Table 是逐语流量测结果的归属地：时长、平均 F0、F1、F2，一列一个语流，任何统计软体都能直接读取。
  pitfalls:
  - en: Mixing text and numbers in one column turns the whole column into text and blocks arithmetic on
      it.
    zh: 同一栏混放文字与数字会让整栏变成文字，之后就无法对这一栏做算术。
  keywords:
  - table
  - 表格
  - 试算表
  - 资料
  - spreadsheet
  - column
  - 栏位
  - measurement
  - 量测
- id: matrix-object
  aliases:
  - Matrix object
  title:
    en: Matrix object
    zh: Matrix 物件（矩阵）
  what:
    en: A plain two-dimensional array of numbers with no row or column labels.
    zh: 没有行列标签的二维数字阵列。
  how:
    en: Create it with New → Tables → New Matrix..., edit the numbers in the Matrix editor, and Plot it
      if you want a picture of it.
    zh: 用 New → Tables → New Matrix... 建立，在 Matrix 编辑窗口填数字，需要图示再用 Plot。
  pitfalls:
  - en: A Matrix has no column names, so write down what the columns mean somewhere else.
    zh: Matrix 没有栏位名称，栏位代表什么要另外记下来。
  keywords:
  - matrix
  - 矩阵
  - 二维
  - 阵列
  - array
  - numbers
  - 数字
  - grid
  - 网格
- id: manipulation-object
  aliases:
  - Manipulation object
  - Manipulation
  title:
    en: Manipulation object
    zh: Manipulation 物件（操控结构）
  what:
    en: A set of time-aligned pitch, duration and intensity targets extracted from a sound, ready to be
      edited and resynthesised.
    zh: 从声音抽取出来、与时间轴对齐的基频、时长与强度目标，可以修改后再重合成。
  how:
    en: Create it with Manipulate → To Manipulation..., then View & Edit to open the Manipulation editor,
      where each target can be dragged.
    zh: 用 Manipulate → To Manipulation... 建立，再用 View & Edit 打开 Manipulation 编辑窗口，每个目标都可以拖动。
  concept:
    en: 'Manipulation is a target-based model of the utterance: because you keep the targets, you can
      change one dimension (say duration) while holding the others fixed.'
    zh: Manipulation 是以目标描述语流的模型：保留目标之后，你可以只改一个维度（例如时长）而让其他维度维持不变。
  pitfalls:
  - en: The Manipulation editor looks similar to the Sound editor, but the blue pitch line there is an
      editable target, not a measurement.
    zh: Manipulation 编辑窗口看起来像声音编辑窗口，但里面的蓝色基频线是可以编辑的目标，不是量测结果。
  keywords:
  - manipulation
  - 操控
  - 目标
  - target
  - resynthesis
  - 重合成
  - 音高
  - 音高目标
- id: wordsequence-object
  aliases:
  - WordSequence object
  - WordSequence
  title:
    en: WordSequence object
    zh: WordSequence 物件（词序列）
  what:
    en: A sequence of word tokens, used in speech recognition, forced alignment and text-to-speech work.
    zh: 一串词形词标，用在语音辨识、强制对齐与文字转语音的工作上。
  how:
    en: It is produced by recognition or alignment tools rather than by hand; in the list it appears as
      "WordSequence name".
    zh: 它通常由辨识或对齐工具产生而不是手动建立，在清单里显示为「WordSequence 名称」。
  pitfalls:
  - en: For a phonetics lab you almost never need it; TextGrid is the annotation object you will use.
    zh: 语音学实验几乎用不到它，你真正会用的标注物件是 TextGrid。
  keywords:
  - wordsequence
  - 词序列
  - recognition
  - 辨识
  - alignment
  - 对齐
  - words
  - 词
- id: to-spectrogram
  aliases:
  - To Spectrogram...
  control_types:
  - MenuItemControl
  title:
    en: To Spectrogram...
    zh: To Spectrogram...（产生频谱图）
  what:
    en: Computes a Spectrogram object from the selected Sound by windowing the signal and taking a spectrum
      at every time step.
    zh: 用分析窗把讯号分段、每一步取一次频谱，为选中的 Sound 算出一个 Spectrogram 物件。
  how:
    en: Select the Sound, then Analyse spectrum → To Spectrogram...; in the dialog set the window length,
      the frequency range and the dynamic range, then press OK.
    zh: 选中 Sound，再选 Analyse spectrum → To Spectrogram...，在对话框里设定窗长、频率范围与动态范围，按 OK。
  concept:
    en: Window length sets the frequency resolution (about 1.3 / window length in Hz) and the time resolution
      at the same time, so 5 ms suits formants and 30 ms suits harmonics; the dynamic range decides how
      many dB below the maximum stay visible.
    zh: 窗长同时决定频率解析度（约 1.3 / 窗长 Hz）与时间解析度，所以 5 毫秒适合看共振峰，30 毫秒适合看泛音；动态范围则决定低于最大值多少 dB 仍然可见。
  pitfalls:
  - en: 'The white stripes at the very start and end of the spectrogram are normal: the window has no
      data there.'
    zh: 频谱图最开头与最末尾的白边是正常现象，分析窗在那些位置没有资料。
  - en: The result is computed once with the settings you chose; changing the editor's display later does
      not change the object.
    zh: 结果只按你当时选的设定算一次，之后改编辑窗口的显示并不会改变这个物件。
  keywords:
  - to spectrogram
  - 频谱图
  - 产生
  - compute
  - spectrogram
  - 窗长
  - window length
  - dynamic range
  - 动态范围
- id: to-spectrum
  aliases:
  - To Spectrum...
  control_types:
  - MenuItemControl
  title:
    en: To Spectrum...
    zh: To Spectrum...（产生频谱）
  what:
    en: Computes a Spectrum object from a Sound, either at the cursor or averaged over the whole sound.
    zh: 为 Sound 算出一个 Spectrum 物件，可以取光标处的一刻，也可以取整段的平均。
  how:
    en: Select the Sound, then Analyse spectrum → To Spectrum...; in the editor you can also click on
      the spectrogram to inspect the spectrum at that instant.
    zh: 选中 Sound，再选 Analyse spectrum → To Spectrum...；在编辑窗口里也可以直接点频谱图检视那一瞬间的频谱。
  concept:
    en: A spectrum lets you read F0 from the spacing of the harmonics and read the formant peaks directly,
      but only at one moment; a spectrogram is the same measurement repeated over time.
    zh: 频谱让你能由泛音间距读出 F0，也能直接读出共振峰峰值，但只针对某一瞬间；频谱图就是同一量测在时间上的重复。
  pitfalls:
  - en: Do not measure a formant from a spectrum taken at the very edge of a segment, where the window
      overlaps the neighbouring sound.
    zh: 不要在音段边缘取频谱来量共振峰，那里分析窗会混入相邻的声音。
  keywords:
  - to spectrum
  - 频谱
  - 产生
  - harmonic
  - 泛音
  - dft
  - fft
  - 频谱切片
- id: to-filter-spectrogram
  aliases:
  - To Filter (Spectrogram)...
  control_types:
  - MenuItemControl
  title:
    en: To Filter (Spectrogram)...
    zh: To Filter (Spectrogram)...（频谱图反卷积）
  what:
    en: Estimates the impulse response of the vocal tract from a Spectrogram, that is the filter that
      would turn a glottal pulse train into the observed speech.
    zh: 从频谱图反推出声道的脉冲响应，也就是能把声门脉冲串变成所见语音的那个滤波器。
  how:
    en: First make a Spectrogram object from the sound, select it, then use this command; the resulting
      filter is an object you can inspect or apply.
    zh: 先由声音做出 Spectrogram 物件并选中它，再用这条指令；产生的结果是一个滤波器物件，可以检视或套用。
  concept:
    en: 'Deconvolution in the frequency domain is the most direct way to see the vocal tract filter: the
      residual after removing the glottal source is close to the transfer function of the tract.'
    zh: 在频域做反卷积是直接看声道滤波器的方法：扣掉声门音源之后的剩余讯号，就接近声道的传递函数。
  pitfalls:
  - en: It needs a voiced, reasonably steady segment; on a fricative or a glide the estimate is unstable.
    zh: 它需要一段稳定的有声材料，擦音或滑音上做出来的估计很不稳定。
  - en: It works on a Spectrogram, not directly on a Sound; make the Spectrogram first.
    zh: 它作用于 Spectrogram 物件，不是直接作用于 Sound，要先做出频谱图。
  keywords:
  - filter spectrogram
  - 反卷积
  - deconvolution
  - 声道
  - vocal tract
  - impulse response
  - 脉冲响应
- id: to-formant-burg
  aliases:
  - To Formant (burg)...
  - To Formants (burg)...
  - To Formant...
  - To Formants...
  control_types:
  - MenuItemControl
  title:
    en: To Formant (burg)...
    zh: To Formant (burg)...（产生共振峰）
  what:
    en: Estimates the formants of the selected Sound by Burg's method, which fits an all-pole LPC model
      to successive frames of the spectrum.
    zh: 用 Burg 法为选中的 Sound 估计共振峰：对频谱的连续分析窗套上全极点 LPC 模型。
  how:
    en: Select the Sound, then Analyse spectrum → To Formant (burg)...; the dialog asks for the time step,
      the maximum number of formants and the frequency range.
    zh: 选中 Sound，再选 Analyse spectrum → To Formant (burg)...，对话框会问时间步长、共振峰最大数目与频率范围。
  concept:
    en: 'The formant ceiling has to match the speaker: Praat''s standard 5500 Hz suits an adult female,
      an adult male wants about 5000 Hz and a young child about 8000 Hz. A ceiling that is too wide lets
      the model invent extra poles in the noise floor.'
    zh: 共振峰上限必须配合说话者：Praat 的预设 5500 Hz 适合成年女性，成年男性约 5000 Hz，幼童约 8000 Hz。上限过宽会让模型在杂讯底噪处凭空多造几个极点。
  pitfalls:
  - en: 'More formants is not better: the right number is roughly one per 1000 Hz of range, and extra
      poles usually fit noise.'
    zh: 共振峰不是越多越好，数目大致每 1000 Hz 一个，多出来的极点通常只是在拟合杂讯。
  - en: Formants of a nasal consonant are unreliable because the tract has anti-resonances that an all-pole
      model cannot represent.
    zh: 鼻音的共振峰不可靠，因为声道有反共振，而全极点模型表达不出来。
  - en: Older manuals and tutorials call this To Formants (burg)...; the two labels refer to the same
      command.
    zh: 旧手册与教学写的是 To Formants (burg)...，两个名称指的是同一条指令。
  keywords:
  - to formant
  - 共振峰
  - burg
  - lpc
  - 分析
  - analyse
  - formant range
  - 共振峰范围
  - pole
  - 极点
- id: to-pitch
  aliases:
  - To Pitch...
  control_types:
  - MenuItemControl
  title:
    en: To Pitch...
    zh: To Pitch...（产生基频）
  what:
    en: Tracks the fundamental frequency over time and produces a Pitch object, one estimate per analysis
      frame.
    zh: 随时间追踪基频，产生一个 Pitch 物件，每个分析窗一个估计值。
  how:
    en: Select the Sound, then Analyse periodicity → To Pitch...; set the pitch floor and ceiling (75
      to 600 Hz suits most adult speech) and the time step.
    zh: 选中 Sound，再选 Analyse periodicity → To Pitch...，设定基频下限与上限（一般成人语音用 75 到 600 Hz）与时间步长。
  concept:
    en: 'The floor and ceiling bound the search: the algorithm will look for repetitions between them,
      so a wrong range produces octave errors or a flat line rather than a wrong but plausible number.'
    zh: 上下限界定了搜索范围：演算法只在这之间找重复周期，所以范围设错就会得到八度跳错或一条平线，而不是看似合理的错值。
  pitfalls:
  - en: A flat line at the floor means the floor is too high, not that the speaker has no pitch.
    zh: 贴在下限的平线表示下限设得太高，不是说话者没有音高。
  - en: 'A child voice needs a higher ceiling, not a lower floor: inside the default 75 to 600 Hz range
      the tracker follows a 400 Hz voice correctly, and the octave error only starts at the ceiling.'
    zh: 儿童的声音要把上限调高，而不是把下限调低：在预设的 75 到 600 Hz 范围里，400 Hz 的声音追得好好的，八度跳错要等基频碰到上限才发生。
  - en: Pitch analysis on a noisy recording is only as good as the noise, so check the voiced/unvoiced
      decisions visually.
    zh: 有杂讯的录音做基频分析好不到哪去，所以一定要目视检查有声与无声的判定。
  keywords:
  - to pitch
  - 基频
  - f0
  - 产生
  - analyse
  - periodicity
  - 周期性
  - floor
  - ceiling
  - 上下限
  - 八度
  - octave
- id: to-pointprocess-cc
  aliases:
  - To PointProcess (periodic, cc)...
  - To Point Process (cc)...
  control_types:
  - MenuItemControl
  title:
    en: To PointProcess (periodic, cc)...
    zh: To PointProcess (periodic, cc)...（周期点程序）
  what:
    en: Finds the instants at which the vocal folds close, by cross-correlating the waveform with an impulse
      train whose period is taken from the pitch analysis.
    zh: 用音高分析得到的周期去与波形做跨相关，找出声带闭合的瞬间。
  how:
    en: Select the Sound and the Pitch object together, then use this command; the result is a PointProcess
      of glottal closure instants.
    zh: 同时选中 Sound 与 Pitch 物件再用这条指令，结果是一个声门闭合瞬间的 PointProcess。
  concept:
    en: Each pulse marks one glottal closure, so the spacing between pulses is the period T0 and the frequency
      is 1 / T0. This is the standard way to get a cycle-accurate basis for voice source analysis.
    zh: 每一个脉冲代表一次声门闭合，脉冲间距就是周期 T0，频率为 1 / T0。这是取得声源分析所需周期级精确基准的标准做法。
  pitfalls:
  - en: You need both the Sound and its Pitch object; with only the Sound the command is not available.
    zh: 必须同时有 Sound 与它的 Pitch 物件，只有声音时这条指令不会出现。
  - en: On voiceless stretches there are no pulses at all, which is a correct result rather than a failure.
    zh: 无声段根本没有脉冲，这是正确结果而不是失败。
  keywords:
  - pointprocess
  - 点程序
  - 脉冲
  - pulse
  - glottal closure
  - 声门闭合
  - cross-correlation
  - 跨相关
  - periodicity
- id: to-harmonicity-cc
  aliases:
  - To Harmonicity (cc)...
  control_types:
  - MenuItemControl
  title:
    en: To Harmonicity (cc)...
    zh: To Harmonicity (cc)...（谐振度）
  what:
    en: Measures how strongly periodic the signal is, by comparing the waveform with a pulse train of
      the right period (harmonic-to-noise ratio in dB).
    zh: 衡量讯号有多规律：把波形与正确周期的脉冲串比对，得到谐噪比（谐振度）的 dB 值。
  how:
    en: Select the Sound and use this command; the resulting Harmonicity object can be plotted and queried
      frame by frame.
    zh: 选中 Sound 用这条指令，产生的 Harmonicity 物件可以绘图，也可以逐格查询。
  concept:
    en: A harmonicity value around 0 dB means the signal is almost perfectly periodic; very negative values
      mean noise. It is a useful check on how clean your recording is.
    zh: 谐振度接近 0 dB 表示讯号几乎完全规律，负得很多表示几乎都是杂讯。它是检验录音品质是否干净的好工具。
  pitfalls:
  - en: Harmonicity drops sharply at voicing onset, and that dip is expected, not an error.
    zh: 有声起点的谐振度会陡降，那个凹陷是预期现象，不是错误。
  keywords:
  - harmonicity
  - 谐振度
  - 谐噪比
  - hnr
  - 周期性
  - periodicity
  - 杂讯
  - noise
- id: to-textgrid
  aliases:
  - To TextGrid...
  control_types:
  - MenuItemControl
  title:
    en: To TextGrid...
    zh: To TextGrid...（产生 TextGrid）
  what:
    en: Creates an empty TextGrid over the same time domain as the selected Sound, ready for you to type
      interval or point labels.
    zh: 在选中 Sound 的相同时间范围上建立一个空的 TextGrid，等你填入区间或点的标签。
  how:
    en: Select the Sound, then Annotate → To TextGrid...; type the tier names in the dialog and mark which
      of them are point tiers.
    zh: 选中 Sound，再选 Annotate → To TextGrid...，在对话框里输入层级名称并指定哪些是点层。
  concept:
    en: Creating the TextGrid from the Sound (rather than by hand) guarantees that the two time domains
      coincide, which is what lets a segment boundary sit exactly on a formant transition.
    zh: 由 Sound 生成 TextGrid（而不是手动建立）能保证两者时间范围完全重合，这正是音段边界能精确落在共振峰过渡上的原因。
  pitfalls:
  - en: The TextGrid starts empty. Nothing is transcribed for you, and an empty tier looks like a broken
      tool.
    zh: TextGrid 一开始是空的，不会帮你转写，空层级看起来很像工具坏了。
  - en: Marking every tier as a point tier leaves you unable to label segments.
    zh: 把所有层级都设成点层，结果就没办法标音段了。
  keywords:
  - to textgrid
  - 文本网格
  - 标注
  - annotation
  - tier
  - 层级
  - interval tier
  - 区间层
  - point tier
  - 点层
- id: to-intervaltier
  aliases:
  - To IntervalTier
  - To IntervalTier...
  control_types:
  - MenuItemControl
  title:
    en: To IntervalTier
    zh: To IntervalTier（转成区间层）
  what:
    en: Creates an IntervalTier object covering the whole sound, the simplest way to get one layer of
      segment labels.
    zh: 建立一个涵盖整段声音的 IntervalTier 物件，也就是取得一层音段标签最简单的做法。
  how:
    en: Select the Sound, then Annotate → To IntervalTier; the result appears as "IntervalTier name" in
      the list and can be opened with View & Edit.
    zh: 选中 Sound，再选 Annotate → To IntervalTier，结果会以「IntervalTier 名称」出现在清单里，可用 View & Edit 打开。
  concept:
    en: An IntervalTier is a sequence of non-overlapping consecutive intervals that cover the whole time
      domain, which is exactly the shape of a phonetic transcription.
    zh: IntervalTier 是一串首尾相接、互不重叠并覆盖整个时间范围的区间，正好是语音转写的形状。
  pitfalls:
  - en: A single IntervalTier is less useful than a TextGrid with several tiers, because you cannot keep
      phone and word labels apart.
    zh: 单一 IntervalTier 不如多层的 TextGrid 好用，因为你无法把音素标签与词标签分开保存。
  keywords:
  - intervaltier
  - 区间层
  - tier
  - 层级
  - annotation
  - 标注
  - segment
  - 音段
- id: to-texttier
  aliases:
  - To TextTier
  - To PointTier...
  control_types:
  - MenuItemControl
  title:
    en: To TextTier
    zh: To TextTier（转成点层）
  what:
    en: Creates a point tier over the sound, the right structure for events that happen at an instant
      rather than over an interval.
    zh: 在声音上建立一个点层，适合记录发生在某一瞬间而不是延续一段时间的事件。
  how:
    en: Select the Sound, then Annotate → To TextTier; insert points in the editor and type a label at
      each one.
    zh: 选中 Sound，再选 Annotate → To TextTier，在编辑窗口里插入点并为每个点输入标签。
  concept:
    en: 'Point tiers are for events: a fricative release burst, a glottal stop, a word boundary or a gesture
      onset all have a time but no duration.'
    zh: 点层用来记事件：擦音的释爆点、喉塞闭合、词界、手势起点，它们有发生时刻却没有延续时间。
  pitfalls:
  - en: A point cannot hold a duration, so putting a whole phone label in a point tier loses the timing
      of the phone.
    zh: 点不能记录时长，把整个音素的标签放进点层会丢掉音素的起止时间。
  keywords:
  - texttier
  - pointtier
  - 点层
  - tier
  - 层级
  - point
  - 点
  - event
  - 事件
  - 释爆
  - release
- id: extract-part
  aliases:
  - Extract part...
  control_types:
  - MenuItemControl
  title:
    en: Extract part...
    zh: Extract part...（截取片段）
  what:
    en: Cuts a time slice out of the sound and puts it into the Objects list as a new Sound object.
    zh: 从声音中切出一段时间，放进清单成为一个新的 Sound 物件。
  how:
    en: Select the Sound, then Convert → Extract part... (or Manipulate in some versions); give the start
      and end time in seconds.
    zh: 选中 Sound，再选 Convert → Extract part...（某些版本在 Manipulate 底下），输入起讫时间（秒）。
  concept:
    en: Extracting a steady vowel from a phrase gives you a segment that is long enough to be analysed
      cleanly, which is why phonetic measurement is usually done on extracted segments.
    zh: 从句子里截出一段稳定的元音，会得到足够长、可以干净分析的音段，所以语音量测通常都在截出的片段上做。
  pitfalls:
  - en: The extracted Sound starts at time 0 unless you ask otherwise, so time references in your notes
      must be shifted.
    zh: 截出的 Sound 默认从 0 秒开始，笔记里的时间必须相应平移。
  - en: Extract the part before you do formant analysis; analysing a moving boundary gives unstable numbers.
    zh: 先截取片段再做共振峰分析，分析正在移动的边界只会得到不稳定的数值。
  keywords:
  - extract part
  - 截取
  - 片段
  - 切割
  - slice
  - 音段
  - segment
  - 时间范围
  - time range
- id: extract-one-channel
  aliases:
  - Extract one channel...
  control_types:
  - MenuItemControl
  title:
    en: Extract one channel...
    zh: Extract one channel...（取出单一声道）
  what:
    en: Makes a new mono Sound from one channel of a stereo or multi-channel sound.
    zh: 从立体声或多声道声音中取出某一个声道，做成新的单声道 Sound。
  how:
    en: Select the Sound, then Convert → Extract one channel..., and choose which channel; the result
      is a separate object.
    zh: 选中 Sound，再选 Convert → Extract one channel...，挑一个声道，结果是独立的物件。
  concept:
    en: 'Channel choice changes the acoustics: a close-talking microphone and a lavalier in the same recording
      give different spectra for the same phoneme.'
    zh: 选哪个声道会改变声学结果：同一段录音里，领夹麦与远距麦对同一个音给出不同的频谱。
  pitfalls:
  - en: Do not average the channels unless the recording was made with one microphone in two paths; averaging
      destroys phase differences.
    zh: 除非录音真的是同一支麦克风分两路，否则不要把声道平均，平均会毁掉相位差异。
  keywords:
  - extract channel
  - 声道
  - channel
  - mono
  - 单声道
  - stereo
  - 立体声
  - 麦克风
- id: resample
  aliases:
  - Resample...
  control_types:
  - MenuItemControl
  title:
    en: Resample...
    zh: Resample...（重取样）
  what:
    en: Converts the sound to a new sampling frequency by interpolation and, when downsampling, by filtering
      out what would alias.
    zh: 用内插把声音转成新的取样频率，向上时插值，向下时先滤掉会造成混叠的高频。
  how:
    en: Select the Sound, then Convert → Resample..., and type the new sampling frequency in Hz, for example
      16000.
    zh: 选中 Sound，再选 Convert → Resample...，输入新的取样频率（Hz），例如 16000。
  concept:
    en: The sampling theorem says the highest recoverable frequency is half the sampling frequency. Downsampling
      to 16 kHz therefore declares that nothing above 8 kHz matters.
    zh: 取样定理说最高可还原频率是取样频率的一半，降到 16 kHz 等于宣布 8 kHz 以上的内容都不重要。
  pitfalls:
  - en: 'Resample to 8 kHz and you lose every sibilant: /s/ and /ʃ/ become almost identical.'
    zh: 重取样到 8 kHz 会失去所有咝音，/s/ 与 /ʃ/ 几乎变得一样。
  - en: Keep the original sampling frequency for any published measurement; resample only for a specific
      tool that demands it.
    zh: 要发表的量测请保留原始取样频率，只在某个工具明确要求时才重取样。
  keywords:
  - resample
  - 重取样
  - 采样率
  - sampling rate
  - nyquist
  - 奈奎斯特
  - aliasing
  - 混叠
- id: to-manipulation
  aliases:
  - To Manipulation...
  control_types:
  - MenuControl
  title:
    en: To Manipulation...
    zh: To Manipulation...（转成操控结构）
  what:
    en: 'Turns the Sound into a Manipulation object: a set of pitch, duration and intensity targets that
      you can edit and resynthesise.'
    zh: 把 Sound 转成 Manipulation 物件：一组可编辑、可重合成的基频、时长与强度目标。
  how:
    en: Select the Sound, then Manipulate → To Manipulation...; the Manipulation editor opens with the
      targets drawn as blue, green and red lines.
    zh: 选中 Sound，再选 Manipulate → To Manipulation...，Manipulation 编辑窗口会打开，目标以蓝、绿、红三条线画出。
  concept:
    en: 'Manipulation is a target model: it lets you change one dimension of the prosody while keeping
      the others fixed, which is the basis of most intonation teaching and manipulation experiments.'
    zh: Manipulation 是目标模型：可以只改变语调的一个维度而让其他维度维持不变，这是大多数语调教学与操控实验的基础。
  pitfalls:
  - en: The pitch targets in a Manipulation are only meaningful where the sound was voiced; check the
      voiced regions before editing.
    zh: Manipulation 里的基频目标只有在原音有声的地方才有意义，编辑前先确认有声区。
  keywords:
  - to manipulation
  - 操控
  - 目标
  - target
  - pitch target
  - 基频目标
  - duration
  - 时长
  - resynthesis
- id: concatenate
  aliases:
  - Concatenate
  control_types:
  - MenuItemControl
  title:
    en: Concatenate
    zh: Concatenate（串接）
  what:
    en: Joins two or more Sounds end to end into one longer Sound.
    zh: 把两个或多个 Sound 首尾相接接成一个更长的 Sound。
  how:
    en: Select several Sounds (Ctrl+click), then Combine → Concatenate; the order is the order in the
      list.
    zh: 选中多个 Sound（按住 Ctrl），再选 Combine → Concatenate，串接顺序就是清单里的顺序。
  concept:
    en: Concatenation preserves the spectrum of each piece, so it is a clean way to test whether a particular
      transition is a genuine coarticulation or an artefact of the recording.
    zh: 串接保留每个片段自己的频谱，因此可以用来干净地检验某个过渡到底是真正的协同发音，还是录音的假象。
  pitfalls:
  - en: Concatenate does not crossfade, so an audible click can appear at the join if the waveform does
      not start and end at zero.
    zh: Concatenate 不会做交叉淡化，接缝处若波形不是从零开始就会听到爆音。
  - en: Praat concatenates in list order; move objects with Rename... and Copy... if you need a different
      order.
    zh: Praat 按清单顺序串接，需要换顺序就得先复制、删除再重建。
  keywords:
  - concatenate
  - 串接
  - 拼接
  - join
  - 接合
  - splice
  - 顺序
  - order
- id: combine-to-stereo
  aliases:
  - Combine to stereo
  control_types:
  - MenuItemControl
  title:
    en: Combine to stereo
    zh: Combine to stereo（合成为立体声）
  what:
    en: Puts two mono Sounds into the two channels of one stereo Sound.
    zh: 把两个单声道 Sound 分别放进一个立体声 Sound 的左右声道。
  how:
    en: Select exactly two mono Sounds, then Combine → Combine to stereo; check the channel order afterwards.
    zh: 选中恰好两个单声道 Sound，再选 Combine → Combine to stereo，之后检查左右声道顺序对不对。
  pitfalls:
  - en: The channel order is the list order, and it is easy to swap left and right by accident.
    zh: 声道顺序就是清单顺序，很容易不小心把左右对调。
  - en: Combining two stereo Sounds gives four channels, which most analysis tools will not accept.
    zh: 把两个立体声合起来会得到四个声道，多数分析工具无法接受。
  keywords:
  - combine to stereo
  - 立体声
  - 声道
  - channel
  - 左右
  - left right
  - 合并
- id: filter-pass-hann-band
  aliases:
  - Filter (pass Hann band)...
  control_types:
  - MenuItemControl
  title:
    en: Filter (pass Hann band)...
    zh: Filter (pass Hann band)...（保留频带）
  what:
    en: Keeps only the frequencies between the two you give, removing everything outside with a smooth
      Hann-shaped transition.
    zh: 只保留你指定的两个频率之间的成分，之外的都以平滑的 Hann 形过渡去除。
  how:
    en: Select the Sound, then Filter → Filter (pass Hann band)..., and give the lower and upper edge
      in Hz.
    zh: 选中 Sound，再选 Filter → Filter (pass Hann band)...，输入下限与上限频率（Hz）。
  concept:
    en: A Hann taper on the band edges avoids the ringing that a brick-wall filter would produce, which
      matters because that ringing smears the formants of the vowel you were trying to isolate.
    zh: 频带边缘用 Hann 渐变可以避免砖墙式滤波造成的振铃，因为这种振铃会把你正要分离的元音共振峰抹开。
  pitfalls:
  - en: Filtering is a destructive operation on the selected object; make a copy first if you need the
      original.
    zh: 滤波会直接改掉选中物件，原始资料要留着就先复制。
  - en: A band that is too narrow to contain the vowel turns the vowel into a noise-like sound; check
      by listening.
    zh: 频带窄到装不下这个元音，元音就会变成类似杂音的声音，要靠听来检查。
  keywords:
  - filter
  - 滤波
  - hann
  - 频带
  - band
  - pass band
  - 保留频带
  - 共振峰
- id: filter-one-formant
  aliases:
  - Filter (one formant)...
  control_types:
  - MenuItemControl
  title:
    en: Filter (one formant)...
    zh: Filter (one formant)...（单一共振峰滤波）
  what:
    en: Applies a time-domain filter that removes everything except one resonance, so you hear what one
      part of the vocal tract contributes.
    zh: 施加一个时域滤波器，只留下一个共振，听起来就是声道某一部分的贡献。
  how:
    en: Select the Sound, then Filter → Filter (one formant)...; give the formant frequency and bandwidth
      in Hz.
    zh: 选中 Sound，再选 Filter → Filter (one formant)...，输入共振峰频率与频宽（Hz）。
  concept:
    en: 'This is the classic way to demonstrate vowel colour: sweeping one formant while keeping the others
      fixed shows how much the tongue position depends on a single resonance.'
    zh: 这是示范元音音色最经典的方法：固定其他共振峰、只扫一个共振峰，能清楚看到舌位在多大程度上取决于单一共振。
  pitfalls:
  - en: The result is a strange, whispered-sounding vowel, not a natural token; do not use it for formant
      measurement.
    zh: 结果是听起来很怪、像耳语一样的元音，不是自然语流，不要拿它量共振峰。
  keywords:
  - filter one formant
  - 单一共振峰
  - 时域滤波
  - vowel
  - 元音
  - 音色
  - colour
  - 频宽
- id: pre-emphasize
  aliases:
  - Pre-emphasize (in-place)...
  control_types:
  - MenuItemControl
  title:
    en: Pre-emphasize (in-place)...
    zh: Pre-emphasize (in-place)...（预加重）
  what:
    en: Applies a first-order pre-emphasis to the whole signal in place, tilting the spectrum upwards
      by about 6 dB per octave.
    zh: 就地给整个讯号施加一阶预加重，把频谱每倍频程往上抬约 6 dB。
  how:
    en: Select the Sound, then Modify → Pre-emphasize (in-place)...; the object is changed immediately
      and irreversibly.
    zh: 选中 Sound，再选 Modify → Pre-emphasize (in-place)...，物件会立刻被就地改掉，无法回复。
  concept:
    en: Pre-emphasis flattens the source spectrum so that the tract filter stands out, which is why it
      belongs in LPC and in speech coding, and why it must never be applied before formant measurement.
    zh: 预加重把音源频谱拉平，让声道滤波器的特征凸显出来，所以它用于 LPC 与语音编码，也因此绝不能在量共振峰之前施加。
  pitfalls:
  - en: Formant frequencies stay roughly in place but their relative amplitudes change, so formant measurement
      on a pre-emphasised file is biased.
    zh: 共振峰频率大致不变但相对振幅改变，在预加重过的档案上量共振峰会有偏差。
  keywords:
  - pre-emphasize
  - 预加重
  - pre-emphasis
  - 频谱倾斜
  - tilt
  - lpc
  - 就地
  - in-place
- id: formula
  aliases:
  - Formula...
  control_types:
  - MenuItemControl
  title:
    en: Formula...
    zh: Formula...（公式运算）
  what:
    en: Applies a mathematical formula to every sample of the sound, replacing the waveform with the result.
    zh: 对声音的每一个样本套用数学公式，用结果取代原来的波形。
  how:
    en: Select the Sound, then Modify → Formula...; type an expression where x is time in seconds and
      z is the current sample value.
    zh: 选中 Sound，再选 Modify → Formula...，输入表达式，其中 x 是以秒为单位的時間，z 是目前的样本值。
  concept:
    en: 'The formula language is the most direct way to implement a signal-processing experiment: gain,
      clipping, adding noise and simulating a leaky integrator all become one line.'
    zh: 公式语言是实现讯号处理实验最直接的方式：增益、削波、加杂讯、模拟漏电积分器，都只要一行。
  pitfalls:
  - en: The formula replaces the data; a typo is unrecoverable, so work on a copy.
    zh: 公式会取代原有资料，打错一个字就无法回复，请在副本上操作。
  - en: z is the sample value, not the current value of the formula; referring to z on the right-hand
      side works but is easy to misread.
    zh: z 是样本值而不是公式的当前值，公式右边可以引用 z，但很容易看错。
  keywords:
  - formula
  - 公式
  - 运算
  - 修改
  - modify
  - sample
  - 样本
  - 表达式
  - expression
- id: reverse
  aliases:
  - Reverse
  control_types:
  - MenuItemControl
  title:
    en: Reverse
    zh: Reverse（反向）
  what:
    en: Plays the sound backwards by reversing the samples in time.
    zh: 把样本在时间上倒过来，让声音反向播放。
  how:
    en: Select the Sound, then Modify → Reverse; or inside the editor use Edit → Reverse selection (Ctrl-R)
      to reverse only the selection.
    zh: 选中 Sound，再选 Modify → Reverse；在编辑窗口里则用 Edit → Reverse selection（Ctrl-R）只反转选区。
  concept:
    en: 'Reversal is a good test of the temporal fine structure: a reversed vowel keeps its formants but
      sounds odd because the glottal pulses are now falling instead of rising.'
    zh: 反向是检验时间精细结构的好方法：反向元音的共振峰不变，但听感奇怪，因为声门脉冲由上升变成了下降。
  pitfalls:
  - en: Reverse is not an undo-able preview; it changes the object permanently.
    zh: Reverse 不是可还原的预览，它会永久改动物件。
  keywords:
  - reverse
  - 反向
  - 倒转
  - backwards
  - 时间反转
  - 时间
  - modify
- id: scale-peak
  aliases:
  - Scale peak...
  - Scale...
  control_types:
  - MenuItemControl
  title:
    en: Scale peak...
    zh: Scale peak...（振幅标准化）
  what:
    en: Rescales the whole sound so that its highest peak has the value you specify, usually 1.
    zh: 把整段声音重新缩放，使最高的峰值等于你指定的数值，通常是 1。
  how:
    en: Select the Sound, then Modify → Scale peak... and enter the new maximum peak value.
    zh: 选中 Sound，再选 Modify → Scale peak...，输入新的最大峰值。
  concept:
    en: 'This is normalisation, and it changes the relationship between recordings: after scaling, every
      file has the same peak, so absolute level comparisons are no longer possible.'
    zh: 这就是标准化，它改变了录音之间的关系：缩放之后每个档案的峰值都相同，就不能再做绝对音量的比较了。
  pitfalls:
  - en: Never scale a file you intend to use for loudness or intensity measurement; the information is
      gone.
    zh: 要用来量响度或强度的档案绝不可缩放，那份资讯已经消失了。
  - en: A click or a cough can be the peak, and scaling to it can make the speech inaudibly quiet.
    zh: 峰值可能只是一声爆音或咳嗽，按它缩放会让说话部分几乎听不见。
  keywords:
  - scale peak
  - 标准化
  - 振幅
  - amplitude
  - 峰值
  - peak
  - normalize
  - 归一化
  - 增益
- id: subtract-mean
  aliases:
  - Subtract mean
  control_types:
  - MenuItemControl
  title:
    en: Subtract mean
    zh: Subtract mean（减去平均值）
  what:
    en: Removes the DC offset by subtracting the mean amplitude of the sound from every sample.
    zh: 把声音的平均振幅从每个样本上减掉，消除直流偏移。
  how:
    en: Select the Sound, then Modify → Subtract mean; the change is applied in place.
    zh: 选中 Sound，再选 Modify → Subtract mean，变更就地生效。
  concept:
    en: A microphone can introduce a small constant offset, which wastes part of the available amplitude
      range and can bias measurements that assume zero mean, such as zero-crossing counts.
    zh: 麦克风可能引入小量恒定偏移，白白占掉可用的振幅范围，也会让假设平均值为零的量测（例如过零次数）产生偏差。
  pitfalls:
  - en: On a recording with long silences the mean is dominated by the silence, so the offset correction
      may be wrong.
    zh: 录音里有长段静音时，平均值由静音主导，偏移校正反而可能改错。
  keywords:
  - subtract mean
  - 平均值
  - 直流偏移
  - dc offset
  - 振幅
  - modify
- id: get-number-of-channels
  aliases:
  - Get number of channels
  control_types:
  - MenuItemControl
  title:
    en: Get number of channels
    zh: Get number of channels（声道数）
  what:
    en: 'Reports how many channels the Sound has: one for mono, two for stereo.'
    zh: 报告 Sound 有几个声道：单声道是 1，立体声是 2。
  how:
    en: Select the Sound, then Query → Get number of channels; the number appears in the Info window.
    zh: 选中 Sound，再选 Query → Get number of channels，数字会出现在 Info 窗口里。
  concept:
    en: 'The channel count tells you what the waveform display in the editor will look like: one trace
      for mono, two stacked traces for stereo.'
    zh: 声道数决定编辑窗口里的波形显示：单声道一条，立体声上下两条。
  pitfalls:
  - en: Two channels does not mean a proper stereo recording; it may be two microphones at different distances.
    zh: 两个声道不代表是真正的立体声录音，可能是两支距离不同的麦克风。
  keywords:
  - number of channels
  - 声道
  - channel
  - mono
  - 单声道
  - stereo
  - 立体声
  - query
- id: get-sampling-frequency
  aliases:
  - Get sampling frequency
  - Get sample rate
  control_types:
  - MenuItemControl
  title:
    en: Get sampling frequency
    zh: Get sampling frequency（取样频率）
  what:
    en: Reports the sampling frequency in Hz, that is how many samples of the waveform are stored per
      second.
    zh: 报告取样频率（Hz），也就是每秒储存多少个波形样本。
  how:
    en: Select the Sound, then Query → Get sampling frequency; the value appears in the Info window.
    zh: 选中 Sound，再选 Query → Get sampling frequency，数值会出现在 Info 窗口。
  concept:
    en: It fixes the Nyquist limit at half this value, so 44100 Hz allows analysis up to 22050 Hz while
      a 16 kHz telephone recording only reaches 8000 Hz, where the second formant of many vowels is already
      gone.
    zh: 它把奈奎斯特上限钉在它的一半：44100 Hz 可分析到 22050 Hz，而 16 kHz 的电话录音只到 8000 Hz，许多元音的第二共振峰已经不见了。
  pitfalls:
  - en: A microphone can record at 48 kHz while the file header says 44100 Hz; check both when the pitch
      sounds wrong.
    zh: 麦克风可能以 48 kHz 录制，但档头写 44100 Hz，音高听起来不对时两边都要查。
  keywords:
  - sampling frequency
  - 取样频率
  - 采样率
  - sample rate
  - hertz
  - nyquist
  - 奈奎斯特
  - query
- id: get-number-of-samples
  aliases:
  - Get number of samples
  control_types:
  - MenuItemControl
  title:
    en: Get number of samples
    zh: Get number of samples（样本数）
  what:
    en: Reports how many samples the Sound contains in total across its channels.
    zh: 报告 Sound 总共有多少个样本（所有声道加起来）。
  how:
    en: Select the Sound, then Query → Get number of samples; multiply by the sampling period to get the
      duration, or divide the sampling frequency by it to check.
    zh: 选中 Sound，再选 Query → Get number of samples，乘上取样周期就是长度，除以取样频率则可交叉核对。
  concept:
    en: Duration = number of samples / sampling frequency. Knowing all three makes a recording self-checking
      and catches files whose header lies about the rate.
    zh: 长度 = 样本数 / 取样频率。三个数字都掌握，记录就能自我核对，也能抓出档头谎报取样率的情况。
  pitfalls:
  - en: For a stereo sound the number is the total across both channels, not the number per channel.
    zh: 立体声的声音这个数字是两道声道加起来，不是每道的数目。
  keywords:
  - number of samples
  - 样本数
  - samples
  - 取样
  - 长度
  - duration
  - query
- id: get-nearest-zero-crossing
  aliases:
  - Get nearest zero crossing...
  control_types:
  - MenuItemControl
  title:
    en: Get nearest zero crossing...
    zh: Get nearest zero crossing...（最近过零点）
  what:
    en: Reports the time of the zero crossing closest to a given moment, which is a stable place to cut
      a sound without a click.
    zh: 报告离某一时刻最近的过零时间，这是切声音而不产生爆音的稳定位置。
  how:
    en: Select the Sound, then Query → Get nearest zero crossing... and give a time; in the editor the
      same job is done with Ctrl-, Ctrl-. and Ctrl-0.
    zh: 选中 Sound，再选 Query → Get nearest zero crossing... 并输入时间；编辑窗口里则用 Ctrl-,、Ctrl-. 与 Ctrl-0 做同样的事。
  concept:
    en: Cutting at a zero crossing avoids a step discontinuity between the last sample and zero, which
      would spread energy across the whole spectrum as a click.
    zh: 在过零点切割可以避免最后一个样本与零之间的阶跃不连续，否则这份能量会摊到整个频谱上成为爆音。
  pitfalls:
  - en: In a high-pitched vowel, successive zero crossings are only about a millisecond apart, so the
      offset from your target can still be audible.
    zh: 高音元音里相邻过零点只差约一毫秒，即使这样切，误差仍可能听得出来。
  keywords:
  - zero crossing
  - 过零
  - 切割
  - cut
  - click
  - 爆音
  - query
- id: get-intensity-db
  aliases:
  - Get intensity (dB)
  control_types:
  - MenuItemControl
  title:
    en: Get intensity (dB)
    zh: Get intensity (dB)（声强 dB）
  what:
    en: Reports the intensity of the sound expressed in dB relative to a reference intensity of 1e-12 W/m²
      (the hearing threshold), for the whole sound or the selection.
    zh: 报告声音以 dB 表示的声强，参考基准为 1e-12 W/m²（也就是听觉阈值），可针对整段声音或选区。
  how:
    en: Select the Sound (or a selection in the editor) and use this command; the number appears in the
      Info window.
    zh: 选中 Sound（或编辑窗口里的选区）后用这条指令，数字会出现在 Info 窗口。
  concept:
    en: This is calibrated intensity in the physical sense, on the same dB scale as the Intensity object;
      it only means something if your recording chain had a known sensitivity.
    zh: 这是物理意义上经过校正的声强，与 Intensity 物件是同一个 dB 刻度；只有录音链路灵敏度已知时这个数字才有意义。
  pitfalls:
  - en: An uncalibrated recording gives a meaningless number here; do not report it as an SPL value.
    zh: 未校正的录音在这里得到的数字没有意义，不要把它当成声压级报告。
  keywords:
  - intensity db
  - 声强
  - 分贝
  - decibel
  - spl
  - 校正
  - calibration
  - query
- id: change-duration
  aliases:
  - Change duration...
  control_types:
  - MenuItemControl
  title:
    en: Change duration...
    zh: Change duration...（改变时长）
  what:
    en: Stretches or compresses the time axis of a Pitch or Manipulation object by a constant factor,
      keeping the target structure aligned.
    zh: 以固定倍率拉伸或压缩 Pitch 或 Manipulation 物件的时间轴，同时保持目标结构对齐。
  how:
    en: Select the Pitch or Manipulation object, then Modify → Change duration..., and give the new duration
      in seconds or a factor.
    zh: 选中 Pitch 或 Manipulation 物件，再选 Modify → Change duration...，输入新的长度（秒）或倍率。
  concept:
    en: 'Time scaling of a target model is cleaner than time scaling of the waveform: the target values
      move but their relative shape is preserved, so you can compare the same prosodic pattern at two
      speaking rates.'
    zh: 对目标模型做时间缩放比直接缩放波形干净：目标数值移动但相对形状保留，因此可以比较同一语调模式在两种语速下的表现。
  pitfalls:
  - en: This changes the token, not the recording; the audio still has the original duration until you
      resynthesise.
    zh: 它改变的是语流物件而不是录音，音频在重新合成之前仍是原来的长度。
  - en: A factor of 2.0 halves every duration, which is easy to type as 2 and get backwards.
    zh: 倍率 2.0 会让所有时长减半，很容易打成 2 弄反。
  keywords:
  - change duration
  - 改变时长
  - 时长
  - duration
  - 时间轴
  - stretch
  - 拉伸
  - modify
  - manipulation
- id: to-sound-resynthesis
  aliases:
  - To Sound (resynthesis)...
  control_types:
  - MenuItemControl
  title:
    en: To Sound (resynthesis)...
    zh: To Sound (resynthesis)...（重合成）
  what:
    en: Rebuilds a sound from a Pitch and Manipulation object by generating a new source and filtering
      it with a formant model.
    zh: 由 Pitch 与 Manipulation 物件重建声音：产生新的音源，再用共振峰模型滤波。
  how:
    en: Select the Manipulation object and use Modify → To Sound (resynthesis)...; the resulting Sound
      is a new object in the list.
    zh: 选中 Manipulation 物件，用 Modify → To Sound (resynthesis)...，产生的 Sound 是清单里的新物件。
  concept:
    en: 'Resynthesis is the payoff of the source-filter model: because pitch and formants are controlled
      separately, you can build stimuli that violate natural speech, which is how intonation and vowel
      experiments are designed.'
    zh: 重合成是音源滤波模型的报偿：因为基频与共振峰分开控制，可以造出违反自然语音的刺激材料，语调与元音实验就是这样设计的。
  pitfalls:
  - en: The result sounds synthetic and is not a faithful round trip; never present it as the original
      recording.
    zh: 结果听起来是合成的，也不是无损往返，绝不要当成原录音呈现。
  - en: Resynthesis from a Pitch object alone has no formant model, so the vowels sound like a buzz.
    zh: 只用 Pitch 物件重合成时没有共振峰模型，元音听起来像一阵嗡鸣。
  keywords:
  - resynthesis
  - 重合成
  - to sound
  - 音源
  - source filter
  - 源滤波
  - 合成
  - synthesize
  - manipulate
- id: down-to-matrix
  aliases:
  - Down to Matrix
  control_types:
  - MenuItemControl
  title:
    en: Down to Matrix
    zh: Down to Matrix（降为矩阵）
  what:
    en: Converts the selected object into a Matrix, which is how you get raw numbers out of an analysis
      object.
    zh: 把选中物件转成 Matrix，这是把分析结果变成原始数字的方法。
  how:
    en: Select a Pitch, Intensity or Spectrum object and use Convert → Down to Matrix; the matrix holds
      one row per frame.
    zh: 选中 Pitch、Intensity 或 Spectrum 物件，用 Convert → Down to Matrix，矩阵每一列（行）对应一个分析窗。
  concept:
    en: Once the values are in a Matrix you can apply formulas to them, which is how Praat scripts rescale
      or smooth a contour without recomputing the analysis.
    zh: 数值一旦进了 Matrix 就能套用公式，Praat 脚本因此可以在不重新分析的情况下缩放或平滑曲线。
  pitfalls:
  - en: The matrix has no time labels; keep the time step and start time from the original object next
      to it.
    zh: 矩阵没有时间标签，要把原物件的时间步长与起始时间记在旁边。
  keywords:
  - down to matrix
  - 矩阵
  - 转换
  - 数值
  - numbers
  - contour
  - 曲线
  - convert
- id: file-menu
  aliases:
  - File
  control_types:
  - MenuItemControl
  title:
    en: The File menu of an editor window
    zh: 编辑窗口的 File 菜单
  what:
    en: 'Handles the file side of the object you are editing: opening another file, saving the current
      object, extracting the selection, and printing.'
    zh: 处理你正在编辑的那个物件的档案事务：开其他档案、储存目前物件、把选区取出，以及打印。
  how:
    en: In the Sound editor, File holds extraction and saving commands; in the TextGrid editor it holds
      Save TextGrid as text file...; in the Picture window it holds Save as EPS file... and Print...
    zh: 声音编辑窗口的 File 放的是取出与存档；TextGrid 编辑窗口放 Save TextGrid as text file...；Picture 窗口则放 Save as EPS file...
      与 Print...。
  concept:
    en: Editors work on a copy of the object shown in the window; File is where you turn that working
      copy into a permanent file.
    zh: 编辑窗口操作的是物件的副本，File 菜单就是把这份工作副本变成永久档案的地方。
  pitfalls:
  - en: Closing an editor without saving loses the annotation, not the sound; the sound is still in the
      Objects list.
    zh: 没存档就关掉编辑窗口，丢的是标注而不是声音，声音还在清单里。
  keywords:
  - file
  - 档案
  - 菜单
  - menu
  - save
  - 储存
  - extract
  - 取出
  - print
  - 打印
- id: edit-menu
  aliases:
  - Edit
  control_types:
  - MenuItemControl
  title:
    en: The Edit menu of an editor window
    zh: 编辑窗口的 Edit 菜单
  what:
    en: Cuts, copies and pastes within the sound or text being edited, and undoes what was done.
    zh: 在正在编辑的声音或文字里剪下、复制、贴上，并可以撤销刚才的操作。
  how:
    en: Edit → Copy selection to Sound clipboard, then Edit → Paste after selection in another Sound;
      Edit → Undo (Ctrl-Z) steps back.
    zh: Edit → Copy selection to Sound clipboard，再到另一个声音用 Edit → Paste after selection；Edit → Undo（Ctrl-Z）可逐步退回。
  concept:
    en: The sound clipboard holds one fragment at a time and is separate from the system clipboard, so
      it can carry a waveform between Praat's own windows.
    zh: 声音剪贴簿一次只放一个片段，而且与系统剪贴簿分开，因此它能在 Praat 自己的窗口之间搬运波形。
  pitfalls:
  - en: Paste over selection replaces the samples and cannot be undone by one Ctrl-Z in every case.
    zh: Paste over selection 会取代样本，不一定能用一次 Ctrl-Z 就还原。
  - en: The editor's Edit menu is not the Objects window's Copy... button; they copy different things.
    zh: 编辑窗口的 Edit 菜单与 Objects 窗口的 Copy... 按钮不是同一件事，复制的东西不同。
  keywords:
  - edit
  - 编辑
  - 菜单
  - cut
  - copy
  - paste
  - 剪贴
  - undo
  - 撤销
  - clipboard
  - 剪贴簿
- id: time-menu
  aliases:
  - Time
  control_types:
  - MenuItemControl
  title:
    en: The Time menu
    zh: Time 菜单
  what:
    en: 'Controls the time axis: zooming, scrolling, placing the cursor, and selecting or measuring a
      time range.'
    zh: 掌管时间轴：缩放、卷动、放置游标，以及选取或量测一段时间范围。
  how:
    en: Time → Zoom and scroll settings... for the zoom behaviour; Time → Move cursor to... to place the
      cursor numerically; the Query selection group gives the start, end and length of the selection.
    zh: Time → Zoom and scroll settings... 设定缩放行为；Time → Move cursor to... 用数字放置游标；Query selection 那组则给出选区的起讫与长度。
  concept:
    en: Every measurement in the Sound editor is a number of seconds on this axis, so the cursor, the
      selection and the zoom level are the three things you must keep straight.
    zh: 编辑窗口里的每个量测都是这条轴上的秒数，所以游标、选区与缩放层级这三件事一定要分清楚。
  pitfalls:
  - en: Zoom in (Ctrl-I) and Zoom out (Ctrl-O) change the view, not the data; Zoom to selection (Ctrl-N)
      is the one that centres your measurement.
    zh: Zoom in（Ctrl-I）与 Zoom out（Ctrl-O）只改变视图不改资料，Zoom to selection（Ctrl-N）才是把量测位置置中的那个。
  - en: Ctrl-O in a sound window zooms out; in the Objects window it opens a file. The same key means
      different things.
    zh: 声音窗口里的 Ctrl-O 是缩小，Objects 窗口里的 Ctrl-O 是开档案，同一个键意义不同。
  keywords:
  - time
  - 时间
  - 菜单
  - cursor
  - 游标
  - zoom
  - 缩放
  - selection
  - 选区
  - 时间轴
- id: new-menu-sound
  aliases:
  - Sound
  control_types:
  - MenuItemControl
  title:
    en: Sound (New menu)
    zh: Sound（New 菜单）
  what:
    en: 'A submenu of the New menu that creates a Sound from a description rather than from a file: Create
      Sound as pure tone..., Create Sound from formula..., Create Sound as tone complex..., Create Sound
      as gammatone..., Create Sound as Shepard tone... and Create Sound from VowelEditor....'
    zh: New 菜单下的子菜单，用描述而不是档案来创造 Sound：Create Sound as pure tone...、Create Sound from formula...、Create
      Sound as tone complex...、Create Sound as gammatone...、Create Sound as Shepard tone... 与 Create Sound
      from VowelEditor....
  how:
    en: New → Sound → Create Sound as pure tone... makes a sinusoid of a given frequency, Create Sound
      from formula... lets you write the waveform as a formula, Create Sound from VowelEditor... builds
      a vowel from formant values.
    zh: New → Sound → Create Sound as pure tone... 产生指定频率的正弦波，Create Sound from formula... 用公式写出波形，Create
      Sound from VowelEditor... 用共振峰数值造出元音。
  concept:
    en: 'A synthetic sound has a known answer, which makes it ideal test material: a 1000 Hz tone shows
      a wrong window length or a wrong pitch range more clearly than any recording.'
    zh: 合成声音的答案是已知的，因此是最理想的测试材料：1000 Hz 的纯音比任何录音都更能暴露窗长或基频范围设错。
  pitfalls:
  - en: Create Sound from formula... counts time in seconds from the start of the sound, so a formula
      copied from elsewhere may not match your sampling frequency.
    zh: Create Sound from formula... 的时间以秒计、从声音起点算起，从别处抄来的公式可能与你的取样频率对不上。
  - en: Create Sound as gammatone... and Create Sound as Shepard tone... do not make vowels, so do not
      expect formants in them.
    zh: Create Sound as gammatone... 与 Create Sound as Shepard tone... 做出来的不是元音，别指望在里面看到共振峰。
  - en: Extract selected sound (time from 0) starts the new object at zero, so all your time references
      shift.
    zh: Extract selected sound (time from 0) 让新物件从 0 开始，所有时间参照都会平移。
  - en: Reverse selection (Ctrl-R) reverses only the selection, not the whole sound.
    zh: Reverse selection（Ctrl-R）只反转选区，不是整段声音。
  keywords:
  - sound
  - 声音
  - 合成
  - synthesis
  - 纯音
  - pure tone
  - 公式
  - formula
  - 共振峰
  - formant
  - gammatone
  - shepard
- id: analyses-menu
  aliases:
  - Analyses
  control_types:
  - MenuItemControl
  title:
    en: The Analyses menu
    zh: Analyses 菜单
  what:
    en: Controls what analyses are drawn in the editor and how often they are sampled, and manages the
      log files.
    zh: 控制编辑窗口里画出哪些分析、以多密的时间步取样，并管理记录档案。
  how:
    en: Analyses → Show analyses... chooses which of waveform, spectrogram, pitch, intensity, formants
      and pulses are visible; Analyses → Time step settings... sets the step.
    zh: Analyses → Show analyses... 决定要显示波形、频谱、基频、强度、共振峰或脉冲中的哪些；Analyses → Time step settings... 设定时间步长。
  concept:
    en: The analyses shown here are drawn on the fly from the visible sound; the Pitch or Formant objects
      in the Objects list are separate, computed data.
    zh: 这里显示的分析是从可见的声音即时画出来的，清单里的 Pitch 或 Formant 物件则是另外算好的资料。
  pitfalls:
  - en: With a long visible window Praat may stop drawing the analyses altogether; zoom in and they come
      back.
    zh: 可见范围太长时 Praat 会干脆不画分析，放大就又出现了。
  - en: The log files write every change you make, which is useful for teaching and for audit trails but
      fills the disk quickly.
    zh: 记录档案会把你做的每个更动都写下来，教学与稽核很有用，但很快会占满磁碟。
  keywords:
  - analyses
  - 分析
  - 菜单
  - show analyses
  - 显示
  - log
  - 记录
  - 时间步
  - time step
- id: spectrogram-menu
  aliases:
  - Spectrogram
  control_types:
  - MenuItemControl
  title:
    en: The Spectrogram menu
    zh: Spectrogram 菜单
  what:
    en: Turns the spectrogram display on and off and opens the dialog that controls how it is computed
      and drawn.
    zh: 开关频谱图的显示，并打开控制它如何计算与绘制的对话框。
  how:
    en: Spectrogram → Show spectrogram toggles the display; Spectrogram → Spectrogram settings... opens
      the dialog with View range, Window length and Dynamic range.
    zh: Spectrogram → Show spectrogram 切换显示；Spectrogram → Spectrogram settings... 打开含 View range、Window
      length 与 Dynamic range 的对话框。
  concept:
    en: The spectrogram is the time-frequency view of the signal, and this menu is where you decide how
      much of the trade-off between time and frequency resolution you take.
    zh: 频谱图是讯号的时频视图，这个菜单决定你在时间与频率解析度之间做多少取舍。
  pitfalls:
  - en: The menu lives in the editor window, not in the Objects window; students hunt for it in the wrong
      place.
    zh: 这个菜单在编辑窗口里，不在 Objects 窗口，学生常在错误的地方找。
  - en: Show spectrogram only changes the display; it does not recompute the Spectrogram object with new
      settings.
    zh: Show spectrogram 只改显示，不会用新设定重新计算 Spectrogram 物件。
  keywords:
  - spectrogram
  - 频谱
  - 频谱图
  - 菜单
  - settings
  - 设定
  - 显示
  - display
  - 窗口
- id: pitch-menu
  aliases:
  - Pitch
  control_types:
  - MenuItemControl
  title:
    en: The Pitch menu
    zh: Pitch 菜单
  what:
    en: 'Controls the pitch contour drawn in the editor: whether it is shown, how it is computed, and
      how it is queried.'
    zh: 控制编辑窗口里画出的基频曲线：要不要显示、怎么算、怎么查询。
  how:
    en: Pitch → Show pitch toggles the contour; Pitch → Pitch settings... opens the floor, ceiling and
      time step; the Query submenu reads values at the cursor.
    zh: Pitch → Show pitch 切换曲线；Pitch → Pitch settings... 打开下限、上限与时间步长的设定；Query 附属菜单可读游标处的数值。
  concept:
    en: The pitch contour is drawn from a separate Pitch analysis with its own floor, ceiling and time
      step, which is why the picture can disagree with the Pitch object in the list.
    zh: 基频曲线来自一次独立的基频分析，有自己的上下限与时间步长，所以显示的曲线可能和清单里的 Pitch 物件不一致。
  pitfalls:
  - en: If the editor shows no pitch at all, check that Show pitch is on before concluding that the speaker
      has no pitch.
    zh: 编辑窗口完全没有基频时，先确认 Show pitch 有打开，再谈说话者有没有音高。
  - en: The blue numbers at the right edge give the floor, the ceiling and the value at the cursor; read
      them before trusting the contour.
    zh: 右缘的蓝色数字给出下限、上限与游标处的值，看曲线之前先读它们。
  keywords:
  - pitch
  - 基频
  - 菜单
  - contour
  - 曲线
  - settings
  - 设定
  - show pitch
  - 显示
  - query
- id: intensity-menu
  aliases:
  - Intensity
  control_types:
  - MenuItemControl
  title:
    en: The Intensity menu
    zh: Intensity 菜单
  what:
    en: Controls the intensity contour drawn in the editor, including whether it is shown and how its
      minimum pitch is set.
    zh: 控制编辑窗口里画出的强度曲线，包括要不要显示以及最低基频怎么设。
  how:
    en: Intensity → Show intensity toggles the contour; the settings let you set the minimum pitch used
      to compute it.
    zh: Intensity → Show intensity 切换曲线；设定里可以指定计算它所用的最低基频。
  concept:
    en: Intensity is energy, so the contour is smoothed and follows syllabic peaks; it is the fastest
      way to find where the stressed syllable is.
    zh: 强度是能量，所以曲线被平滑过、跟着音节峰值走，是找出重读音节最快的办法。
  pitfalls:
  - en: A pitch floor above the speaker's own F0 puts a visible ripple at the pitch period on the contour;
      the standard floor of 100 Hz is safe for ordinary speech.
    zh: 最低基频（Pitch floor）设得比说话者自己的基频还高，曲线上就会出现明显的音高周期波纹；预设的 100 Hz 对一般说话声是安全的。
  keywords:
  - intensity
  - 强度
  - 菜单
  - contour
  - 曲线
  - show intensity
  - 显示
  - 能量
- id: formants-menu
  aliases:
  - Formants
  control_types:
  - MenuItemControl
  title:
    en: The Formants menu
    zh: Formants 菜单
  what:
    en: 'Controls the formant display in the editor: whether it is shown, where the frequency range is
      set, and how the values are read off.'
    zh: 控制编辑窗口里的共振峰显示：要不要显示、频率范围怎么设、数值怎么读。
  how:
    en: Formants → Show formant toggles the red contour; the Formants & LPC menu opens the settings and
      the analysis commands; F1 and F2 read the values at the cursor.
    zh: Formants → Show formant 切换红色曲线；Formants & LPC 菜单打开设定与分析指令；按 F1、F2 读取游标处的数值。
  concept:
    en: Formant display is the red speckle pattern; a formant is a peak of the spectral envelope, and
      its frequency tells you about the shape of the vocal tract at that moment.
    zh: 共振峰显示就是红色斑点；共振峰是频谱包络的峰，它的频率告诉你那一刻声道的形状。
  pitfalls:
  - en: Show formant must be on and the frequency range must include F2, otherwise the second formant
      simply is not drawn.
    zh: Show formant 没打开、或者频率范围没涵盖 F2，第二个共振峰就根本不会被画出来。
  - en: The formant contour is computed from the visible sound with its own settings, which may differ
      from the Formant object in the list.
    zh: 共振峰曲线是用自己的设定从可见声音算出来的，可能与清单里的 Formant 物件不一致。
  keywords:
  - formants
  - 共振峰
  - 菜单
  - contour
  - 曲线
  - show formant
  - 显示
  - lpc
  - 频谱包络
- id: pulses-menu
  aliases:
  - Pulses
  control_types:
  - MenuItemControl
  title:
    en: The Pulses menu
    zh: Pulses 菜单
  what:
    en: Controls the display of glottal pulses, the instants at which the vocal folds close, computed
      by cross-correlation.
    zh: 控制声门脉冲的显示，也就是声带闭合的瞬间，由跨相关算出。
  how:
    en: Pulses → Show pulses marks each cycle on the waveform; the settings control the pitch range used
      to find the pulses.
    zh: Pulses → Show pulses 会在波形上标出每一个周期；设定里可调整寻找脉冲所用的音高范围。
  concept:
    en: 'Pulses make periodicity visible at the sample level: each mark is one glottal closure, so the
      spacing between marks is the period T0.'
    zh: 脉冲让周期性在样本层级看得见：每一个标记是一次声门闭合，标记间距就是周期 T0。
  pitfalls:
  - en: On unvoiced sound the pulses disappear or scatter; that is the algorithm telling you there is
      no reliable period there.
    zh: 清音上脉冲会消失或乱跳，那是演算法在说这里没有可靠周期。
  keywords:
  - pulses
  - 脉冲
  - 声门
  - glottal
  - 周期性
  - 显示
  - show pulses
  - 周期
- id: type-menu
  aliases:
  - Type
  control_types:
  - MenuItemControl
  title:
    en: Typing special symbols (older "Type" menu)
    zh: 输入特殊符号（舊版的「Type」菜单）
  what:
    en: Older Praat releases had a Type menu in the TextGrid editor for choosing the script you type in;
      in Praat 6.4 the same job is done by typing into the text window directly.
    zh: 旧版 Praat 的 TextGrid 编辑窗口有一个 Type 菜单，用来挑你要输入的书写系统；Praat 6.4 则改成直接在文字窗里输入。
  how:
    en: 'In Praat 6.4 there is no Type menu: type the label in the white text window at the top, and look
      up the symbol you need in Help → Phonetic symbols or Help → About special symbols.'
    zh: Praat 6.4 没有 Type 菜单：在顶部的白色文字窗里直接打标签，符号对照表在 Help → Phonetic symbols 与 Help → About special symbols。
  concept:
    en: Praat's text fields accept the IPA and many other scripts, and they also accept escape sequences,
      so a label like \%a can be written when the font lacks the symbol.
    zh: Praat 的文字栏位接受 IPA 与多种书写系统，也接受 escape 序列，字型缺字时可以用像 \%a 这样的写法。
  pitfalls:
  - en: Typing directly into the yellow tier strip does nothing; the label has to be typed in the white
      text window at the top.
    zh: 直接在黄色的层级条上打字没有作用，标签必须打在顶部的白色文字窗里。
  - en: If the font in the text window cannot show a symbol you get a placeholder box instead of the character.
    zh: 文字窗的字型如果显示不了某个符号，你看到的会是方框而不是那个字符。
  - en: 'Chinese labels are fine: type them directly, or use the Unicode escape form if the font is the
      problem.'
    zh: 中文标签可以直接打，若问题出在字型，就改用 Unicode escape 写法。
  keywords:
  - type
  - 输入
  - 字符集
  - ipa
  - 特殊符号
  - textgrid
  - 打字
  - 文字窗口
  - unicode
- id: tier-menu
  aliases:
  - Tier
  control_types:
  - MenuItemControl
  title:
    en: The Tier menu of the TextGrid editor
    zh: TextGrid 编辑窗口的 Tier 菜单
  what:
    en: Adds, renames, duplicates and removes the tiers of the TextGrid, and extracts a tier to the Objects
      list.
    zh: 为 TextGrid 增删层级、改名、复制层级，也可以把某一层取到 Objects 清单里。
  how:
    en: Tier → Add interval tier... for segments, Tier → Add point tier... for events, Tier → Rename tier...
      to rename, Tier → Remove entire tier to delete one you no longer need.
    zh: Tier → Add interval tier... 加区间层，Tier → Add point tier... 加点层，Tier → Rename tier... 改名，Tier →
      Remove entire tier 删掉不再需要的层。
  concept:
    en: 'A well-designed annotation has one tier per linguistic level: phone boundaries, syllables, words,
      and events. Keeping them apart lets you reuse the same segmentation at different levels.'
    zh: 好的标注每个语言层级各有一层：音素边界、音节、词、事件。分开存放，同一套切分才能在不同层级重复使用。
  pitfalls:
  - en: Removing a tier deletes its labels; there is no undo for a removed tier.
    zh: 移除层级会连带删掉标签，移除层级没有撤销。
  - en: A tier with a very long name takes horizontal space away from the labels, so keep names short.
    zh: 层级名称太长会占掉标签的显示空间，名称要短。
  - en: The two Add commands open a small dialog asking for the tier name, so a new tier starts unnamed
      if you just press OK.
    zh: 两个 Add 指令都会弹出小对话框要层级名称，直接按 OK 的话新层就没有名字。
  keywords:
  - tier
  - 层级
  - 区间层
  - 点层
  - add
  - 新增
  - remove
  - 移除
  - rename
  - 改名
  - textgrid
  - 标注
- id: margins-menu
  aliases:
  - Margins
  control_types:
  - MenuItemControl
  title:
    en: The Margins menu of the Picture window
    zh: Picture 窗口的 Margins 菜单
  what:
    en: 'Controls everything around the drawing area: the axes, the box, the tick marks and the margin
      texts.'
    zh: 掌管绘图区周围的一切：坐标轴、外框、刻度与边栏文字。
  how:
    en: Margins → Axes... sets the axis ranges, units and labels; Margins → One mark bottom... adds a
      tick; Margins → Text left... writes a side caption.
    zh: Margins → Axes... 设定坐标轴范围、单位与标签；Margins → One mark bottom... 加刻度；Margins → Text left... 写侧边说明文字。
  concept:
    en: For a spectrogram figure the two most important settings are the frequency range and the unit
      of the vertical axis; without them the reader cannot interpret the image.
    zh: 对频谱图来说，频率范围与纵轴单位是最重要的两项设定，没有它们读者无法解读这张图。
  pitfalls:
  - en: Logarithmic marks is for a frequency axis; on a linear time axis it produces nonsense spacing.
    zh: Logarithmic marks 是给频率轴用的，放在线性时间轴上只会排出乱七八糟的间距。
  - en: The default axis has no units, and a figure without units is usually rejected by journals.
    zh: 预设坐标轴没有单位，而没有单位的图通常会被期刊退件。
  keywords:
  - margins
  - 边距
  - 坐标轴
  - axes
  - 刻度
  - marks
  - 单位
  - 标签
  - picture
  - 图片
- id: world-menu
  aliases:
  - World
  control_types:
  - MenuItemControl
  title:
    en: The World menu of the Picture window
    zh: Picture 窗口的 World 菜单
  what:
    en: Draws objects into the Picture window in world coordinates, that is, at their real time and frequency
      values.
    zh: 以世界坐标把物件画进 Picture 窗口，也就是依照它们真实的时间与频率数值绘制。
  how:
    en: World → Text... writes a label at a chosen x and y; World → Draw line..., World → Draw rectangle...
      and World → Draw function... add the graphical elements of a figure.
    zh: World → Text... 在指定 x、y 位置写字；World → Draw line...、World → Draw rectangle... 与 World → Draw function...
      画出图里的各种图形元件。
  concept:
    en: 'World coordinates are the physical values: seconds on the x axis, hertz on the y axis. Drawing
      in world coordinates is what keeps a figure honest when you change the viewport.'
    zh: 世界坐标就是物理数值：x 轴是秒，y 轴是赫兹。用世界坐标绘图，变换视窗时图形才不会失真。
  pitfalls:
  - en: Typing a text position like 0.3 means 0.3 seconds on the x axis, not 0.3 of the window width.
    zh: 输入文字位置 0.3 指的是 x 轴上的 0.3 秒，不是视窗宽度的三成。
  keywords:
  - world
  - 世界坐标
  - 绘图
  - draw
  - text
  - 文字
  - 线条
  - line
  - 图形
- id: select-menu
  aliases:
  - Select
  control_types:
  - MenuItemControl
  title:
    en: The Select menu of the Picture window
    zh: Picture 窗口的 Select 菜单
  what:
    en: Chooses which part of the drawing area the mouse acts on, that is the inner or the outer viewport.
    zh: 决定鼠标作用在绘图区的哪一部分，也就是内视窗还是外视窗。
  how:
    en: Select → Mouse selects inner viewport makes the mouse act inside the axes; Select → Select inner
      viewport... draws the rectangle that defines the region to be enlarged.
    zh: Select → Mouse selects inner viewport 让鼠标作用在坐标轴以内；Select → Select inner viewport... 画出要放大的矩形区域。
  concept:
    en: 'Praat pictures have two viewports: the inner one is the part the axes describe, the outer one
      is the surrounding margin where titles and captions live.'
    zh: Praat 的图有内外两个视窗：内视窗是坐标轴描述的范围，外视窗是周围的边栏，标题与说明放在那里。
  pitfalls:
  - en: With the mouse set to the outer viewport, clicking in the middle of the figure does nothing, which
      looks like a broken Picture window.
    zh: 鼠标若设定在外视窗，点在图中央毫无反应，看起来像 Picture 窗口坏了。
  keywords:
  - select
  - 选择
  - viewport
  - 视窗
  - 内视窗
  - 外视窗
  - picture
  - 选择范围
- id: pen-menu
  aliases:
  - Pen
  control_types:
  - MenuItemControl
  title:
    en: The Pen menu of the Picture window
    zh: Picture 窗口的 Pen 菜单
  what:
    en: Sets the style, thickness and colour of the lines and symbols you draw.
    zh: 设定你画出的线条与符号的样式、粗细与颜色。
  how:
    en: Pen → Solid line or Dashed line picks the stroke; Pen → Line width... sets the thickness; Pen
      → Colour... and the named colours change the ink.
    zh: Pen → Solid line 或 Dashed line 选笔画样式；Pen → Line width... 设粗细；Pen → Colour... 与各个颜色名则改变墨色。
  concept:
    en: Line thickness and font size are what make a figure legible at journal column width, so they are
      set here rather than left to the default.
    zh: 线宽与字型大小是让图在期刊单栏宽度下仍然清楚的关键，所以在这里设定，而不是用预设值。
  pitfalls:
  - en: Praat's default line width looks fine on screen but can vanish when the figure is scaled down
      for print.
    zh: Praat 的预设线宽在屏幕上看着没问题，缩小排版时却可能整个看不见。
  - en: Colour alone is not enough for readers with colour vision deficiency; add line style or symbols
      as well.
    zh: 只靠颜色不够，色觉障碍读者分辨不出，要再配合线型或符号。
  keywords:
  - pen
  - 画笔
  - 线宽
  - 颜色
  - colour
  - 虚线
  - 线型
  - 粗细
  - 图形
- id: font-menu
  aliases:
  - Font
  control_types:
  - MenuItemControl
  title:
    en: The Font menu of the Picture window
    zh: Picture 窗口的 Font 菜单
  what:
    en: Chooses the typeface and size used for all text in the figure.
    zh: 选择图里所有文字所用的字型与大小。
  how:
    en: Font → pick a typeface and a size; the change applies to the text you draw afterwards, so redraw
      the labels if they look wrong.
    zh: Font → 挑一个字型与大小，变更只影响之后画出的文字，若旧标签不好看要重画。
  concept:
    en: A consistent sans-serif face at a known size is the usual journal requirement, and recording the
      size in your notes makes the figure reproducible.
    zh: 统一的无衬线字型与明确的大小通常是期刊要求，把大小记在笔记里，图才能被重现。
  pitfalls:
  - en: Changing the font does not update text that is already drawn; you have to erase and redraw it.
    zh: 改字型不会更新已经画好的文字，必须先擦掉再重画。
  keywords:
  - font
  - 字型
  - 字号
  - 文字
  - text
  - 图
  - 排版
  - picture
- id: spectrogram-settings
  aliases:
  - Spectrogram settings...
  control_types:
  - MenuItemControl
  title:
    en: Spectrogram settings...
    zh: Spectrogram settings...（频谱图设定）
  what:
    en: Opens the dialog that fixes the frequency range, the window length and the dynamic range used
      for the spectrogram.
    zh: 打开对话框，设定频谱图所用的频率范围、窗长与动态范围。
  how:
    en: Spectrogram → Spectrogram settings...; change the numbers and press OK. The settings are remembered
      across Praat sessions.
    zh: Spectrogram → Spectrogram settings...，改完数字按 OK，这些设定会保留到下次开启动程式。
  concept:
    en: 'These three numbers are the whole analysis: the frequency range says how much of the spectrum
      you look at, the window length says how precisely you can locate it, the dynamic range says how
      faint a detail stays visible.'
    zh: 这三个数字就是整个分析：频率范围决定你看多少频谱，窗长决定你能定位得多准，动态范围决定多弱的内容还看得见。
  pitfalls:
  - en: Praat only shows analyses for a limited visible time span; when the spectrogram disappears, zoom
      in rather than changing the settings.
    zh: Praat 只在有限的可见时间跨度内画分析，频谱图消失时该做的是放大而不是改设定。
  - en: A dynamic range of 70 dB makes most classroom recordings look almost white; 40 to 50 dB is usually
      more readable.
    zh: 动态范围设 70 dB 时，教室录音大多看起来几乎是白的，40 到 50 dB 通常更好读。
  keywords:
  - spectrogram settings
  - 频谱图设定
  - 窗口长度
  - 动态范围
  - 频率范围
  - 设定
  - dialog
- id: advanced-spectrogram-settings
  aliases:
  - Advanced spectrogram settings...
  control_types:
  - MenuItemControl
  title:
    en: Advanced spectrogram settings...
    zh: Advanced spectrogram settings...（进阶频谱设定）
  what:
    en: Opens the less often needed part of the spectrogram configuration, such as the colour scale, the
      window shape and the dynamic compression.
    zh: 打开较少用到的频谱设定，例如颜色刻度、窗形与动态压缩。
  how:
    en: Spectrogram → Advanced spectrogram settings...; leave the defaults unless you have a specific
      reason, and remember that a non-default window shape changes the bandwidth numbers.
    zh: Spectrogram → Advanced spectrogram settings...，没有特别理由就保持预设，并记得非预设窗形会让频宽数值跟着改变。
  concept:
    en: The colour scale is only a display mapping of energy to ink; it does not change the analysis,
      but it does change how easy it is to see a formant against the noise.
    zh: 颜色刻度只是把能量映射到颜色的显示方式，不改变分析本身，但会明显影响共振峰在杂讯背景上是否看得清楚。
  pitfalls:
  - en: A rainbow scale can make a reader over-read random energy as structure; greyscale is safer in
      print.
    zh: 彩虹配色会让读者把随机能量误读成结构，印刷品用灰阶比较安全。
  keywords:
  - advanced spectrogram
  - 进阶设定
  - 颜色
  - colour scale
  - 窗形
  - window shape
  - 压缩
  - compression
- id: spectrogram-window-length
  aliases:
  - Window length
  control_types:
  - MenuItemControl
  title:
    en: Window length (spectrogram)
    zh: Window length（频谱图窗长）
  what:
    en: The duration of the analysis window in seconds; it sets both the frequency resolution (bandwidth)
      and the time resolution of the spectrogram.
    zh: 分析窗的时长（秒），同时决定频谱图的频率解析度（频宽）与时间解析度。
  how:
    en: In Spectrogram settings..., type 0.005 for a broadband view of formants or 0.03 for a narrowband
      view of harmonics.
    zh: 在 Spectrogram settings... 里，填 0.005 得到看共振峰的宽带图，填 0.03 得到看泛音的窄带图。
  concept:
    en: 'For a Gaussian window the -3 dB bandwidth is about 1.3 / window length: 5 ms gives roughly 260
      Hz, 30 ms roughly 43 Hz. Longer window, finer frequency but blurred transitions.'
    zh: 以 Gaussian 窗为例，-3 dB 频宽约等于 1.3 / 窗长：5 毫秒约 260 Hz，30 毫秒约 43 Hz。窗越长，频率越精确，但过渡越模糊。
  pitfalls:
  - en: 0.0025 s is a reasonable compromise for a phonation study but is too short to resolve F2 properly
      in most vowels.
    zh: 0.0025 秒对发声研究还算折中，但多数元音的 F2 用它分辨不出来。
  - en: Using a 5 ms window when you need to see individual glottal pulses is the classic reason a pulse
      train looks like a solid band.
    zh: 想看个别声门脉冲却用 5 毫秒窗，是脉冲串看起来像一条实心带的经典原因。
  keywords:
  - window length
  - 窗长
  - 窗口
  - 分析窗
  - bandwidth
  - 频宽
  - resolution
  - 解析度
  - 0.005
  - 0.03
  - gaussian
- id: spectrogram-dynamic-range
  aliases:
  - Dynamic range
  control_types:
  - MenuItemControl
  title:
    en: Dynamic range (spectrogram)
    zh: Dynamic range（动态范围）
  what:
    en: How many dB below the maximum may a detail be and still be drawn as grey instead of white.
    zh: 细节要比最大值低多少 dB 才仍然画成灰色而不是白色。
  how:
    en: In Spectrogram settings..., set Dynamic range to about 40 to 60 dB for speech; smaller values
      show more detail, larger values flatten the picture.
    zh: 在 Spectrogram settings... 里，语音通常设 40 到 60 dB，数值更小显示更多细节，数值更大画面更扁平。
  concept:
    en: 'It is a display threshold on a relative scale: the darkest pixel is the maximum in the current
      view, and everything more than Dynamic range dB below it is pure white. It is not an absolute dB
      SPL scale.'
    zh: 它是相对刻度上的显示门槛：最深的像素是当前视野里的最大值，比它低超过动态范围数值的部分一律纯白。它不是绝对的声压级刻度。
  pitfalls:
  - en: A very small dynamic range (say 20 dB) makes a hiss in the recording look like the speech signal.
    zh: 动态范围太小（例如 20 dB）会让录音里的杂音看起来像语音讯号。
  - en: Because the reference is the maximum in the visible window, the picture changes brightness as
      you scroll.
    zh: 因为参考值是可见范围里的最大值，画面在卷动时会改变亮度。
  keywords:
  - dynamic range
  - 动态范围
  - db
  - 分贝
  - 对比
  - contrast
  - 白
  - grey
  - 灰阶
- id: spectrogram-view-range
  aliases:
  - View range
  control_types:
  - MenuItemControl
  title:
    en: View range (spectrogram)
    zh: View range（显示频率范围）
  what:
    en: The frequency band shown on the vertical axis, from the bottom of the spectrogram upwards.
    zh: 频谱图纵轴上显示的频率带，由下往上算。
  how:
    en: In Spectrogram settings..., set View range from 0 to 5000 Hz for vowels and fricatives, or to
      0 to 8000 Hz for sibilants.
    zh: 在 Spectrogram settings... 里，元音与擦音设 0 到 5000 Hz，咝音则设到 0 到 8000 Hz。
  concept:
    en: 'The upper limit cannot usefully exceed half the sampling frequency: above the Nyquist limit the
      values are zero and the area is drawn white, which is a frequent source of puzzlement.'
    zh: 上限不可能有效超过取样频率的一半：超过奈奎斯特上限的数值为零，那一块会被画成白色，这是很多人困惑的来源。
  pitfalls:
  - en: Setting the range to 25000 Hz on a 44100 Hz recording leaves the top half white; it is not a Praat
      fault.
    zh: 44.1 kHz 的录音把范围设到 25000 Hz 就会让上半部全白，这不是 Praat 的错。
  - en: Truncating the range hides the high-frequency noise that tells you the recording is noisy.
    zh: 把范围截短会藏起高频杂讯，而那正是判断录音品质的依据。
  keywords:
  - view range
  - 频率范围
  - 频率轴
  - nyquist
  - 奈奎斯特
  - 0-5000
  - 显示范围
- id: spectrogram-colour-scale
  aliases:
  - Colour scale
  control_types:
  - MenuItemControl
  title:
    en: Colour scale
    zh: Colour scale（颜色刻度）
  what:
    en: 'The mapping from energy density to ink: greyscale, or one of the colour schemes such as blue
      or rainbow.'
    zh: 把能量密度映射到墨色的方式：灰阶，或是蓝色、彩虹等配色。
  how:
    en: In the advanced spectrogram settings, or in the colour button of the editor, choose the scale
      you want and look at the same segment again.
    zh: 在进阶频谱设定里，或编辑窗口的颜色按钮上，选好配色后再看同一段讯号。
  concept:
    en: The colour scale only repaints existing energy values, so switching from greyscale to rainbow
      never changes the analysis, only your reading of it.
    zh: 颜色刻度只是把既有的能量值重新上色，从灰阶换成彩虹不会改变分析，只改变你对它的解读。
  pitfalls:
  - en: Rainbow scales introduce banding that can be mistaken for harmonic structure; use greyscale for
      measurement figures.
    zh: 彩虹配色会制造看起来像谐波结构的色带，做量测用图请用灰阶。
  keywords:
  - colour scale
  - 颜色
  - 配色
  - greyscale
  - 灰阶
  - rainbow
  - 彩虹
  - 显示
  - mapping
- id: show-spectrogram
  aliases:
  - Show spectrogram
  control_types:
  - MenuItemControl
  title:
    en: Show spectrogram
    zh: Show spectrogram（显示频谱图）
  what:
    en: Switches the spectrogram display in the editor on or off.
    zh: 开关编辑窗口里的频谱图显示。
  how:
    en: 'Spectrogram → Show spectrogram. If the picture does not appear, zoom in: Praat refuses to draw
      analyses over a very long visible window.'
    zh: Spectrogram → Show spectrogram。如果图没有出现，先放大：可见范围太长时 Praat 不会画分析。
  concept:
    en: The spectrogram is drawn from the visible sound only, so it is recomputed as you scroll and zoom,
      which is why scrolling can change the picture.
    zh: 频谱图只依据可见的声音绘制，卷动或缩放时会重新计算，所以卷动会让画面改变。
  pitfalls:
  - en: A blank area under the waveform usually means the analyses are hidden by the visible range, not
      that the analysis failed.
    zh: 波形下方一片空白通常是可见范围太长把分析藏起来了，不是分析失败。
  keywords:
  - show spectrogram
  - 显示频谱图
  - 开关
  - toggle
  - 频谱
  - 编辑器
- id: show-pitch
  aliases:
  - Show pitch
  control_types:
  - MenuItemControl
  title:
    en: Show pitch
    zh: Show pitch（显示基频）
  what:
    en: Switches the pitch contour in the editor on or off.
    zh: 开关编辑窗口里的基频曲线显示。
  how:
    en: Pitch → Show pitch; the contour is drawn in green, with the floor, the ceiling and the value at
      the cursor shown as numbers at the right edge.
    zh: Pitch → Show pitch；曲线画成绿色，右缘会有下限、上限与游标处数值的数字。
  concept:
    en: The pitch contour is computed on the fly for the visible part, with the pitch settings of the
      editor, which may differ from the Pitch object you computed in the Objects list.
    zh: 基频曲线是针对可见部分用编辑窗口的基频设定即时算出来的，可能和你在清单里算的 Pitch 物件不一致。
  pitfalls:
  - en: A contour that is a flat line at the ceiling or the floor is a settings problem, not a flat intonation.
    zh: 贴着上限或下限的平线是设定问题，不是语调真的平。
  keywords:
  - show pitch
  - 显示基频
  - 曲线
  - contour
  - green
  - 绿色
  - 开关
  - f0
- id: show-formant
  aliases:
  - Show formant
  control_types:
  - MenuItemControl
  title:
    en: Show formant
    zh: Show formant（显示共振峰）
  what:
    en: Switches the formant display in the editor on or off; the formants appear as red speckles over
      the spectrogram.
    zh: 开关编辑窗口里的共振峰显示，共振峰会以红色斑点叠在频谱图上。
  how:
    en: Formants → Show formant; use the Formants & LPC menu to set the frequency range so that F1, F2
      and F3 all fall inside it.
    zh: Formants → Show formant；用 Formants & LPC 菜单设定频率范围，让 F1、F2、F3 都落在范围之内。
  concept:
    en: Red speckles are the estimated formants at each frame; a formant that jumps between frames is
      a tracking artefact, and the eye is good at spotting the bad frames.
    zh: 红色斑点是每一格的共振峰估计值，在相邻格之间乱跳就是追踪假象，眼睛很擅长挑出这些坏格。
  pitfalls:
  - en: If the frequency range is too narrow, F2 and F3 disappear without any warning.
    zh: 频率范围太窄时，F2 与 F3 会无声无息地消失。
  - en: Formants over a fricative are noise, so switch the display off for consonants.
    zh: 擦音上的共振峰只是杂讯，分析辅音时请关掉这个显示。
  keywords:
  - show formant
  - 显示共振峰
  - 红色
  - red
  - speckle
  - 斑点
  - lpc
  - 开关
- id: show-intensity
  aliases:
  - Show intensity
  control_types:
  - MenuItemControl
  title:
    en: Show intensity
    zh: Show intensity（显示强度）
  what:
    en: Switches the intensity contour in the editor on or off.
    zh: 开关编辑窗口里的强度曲线显示。
  how:
    en: Intensity → Show intensity; the contour appears as a green line below the waveform.
    zh: Intensity → Show intensity；曲线会以绿色线条出现在波形下方。
  concept:
    en: The intensity contour is a smoothed energy envelope, which is why its peaks line up with syllable
      nuclei rather than with glottal pulses.
    zh: 强度曲线是平滑过的能量包络，所以它的峰值对应的是音节核心，而不是声门脉冲。
  pitfalls:
  - en: With the default minimum pitch too high, the contour ripples at every pitch period and the syllable
      peaks are hard to see.
    zh: 预设最低基频过高时，曲线会在每个音高周期上起伏，音节峰值就很难看出来。
  keywords:
  - show intensity
  - 显示强度
  - 轮廓
  - contour
  - 能量
  - 开关
  - green
- id: show-pulses
  aliases:
  - Show pulses
  control_types:
  - MenuItemControl
  title:
    en: Show pulses
    zh: Show pulses（显示脉冲）
  what:
    en: Switches the glottal pulse markers in the editor on or off.
    zh: 开关编辑窗口里的声门脉冲标记显示。
  how:
    en: Pulses → Show pulses; each mark is one glottal closure found by cross-correlation with a pulse
      train.
    zh: Pulses → Show pulses；每个标记都是用脉冲串做跨相关找到的一次声门闭合。
  concept:
    en: Pulses are the finest time reference Praat offers for periodicity, and they are what makes the
      period T0 directly measurable.
    zh: 脉冲是 Praat 在周期性上提供的最精细时间参照，也让周期 T0 可以直接量出来。
  pitfalls:
  - en: Pulses need a voiced sound; on a whisper or a fricative they are absent or meaningless.
    zh: 脉冲需要有声材料，耳语或擦音上没有脉冲，或脉冲没有意义。
  keywords:
  - show pulses
  - 显示脉冲
  - 声门
  - glottal
  - 周期
  - 标记
  - 开关
- id: show-analyses
  aliases:
  - Show analyses...
  control_types:
  - MenuItemControl
  title:
    en: Show analyses...
    zh: Show analyses...（选择要显示的分析）
  what:
    en: 'Opens a dialog where you tick which analyses the editor should draw: waveform, spectrogram, pitch,
      formants, intensity and pulses.'
    zh: 打开对话框，勾选编辑窗口要画哪些分析：波形、频谱、基频、共振峰、强度与脉冲。
  how:
    en: Analyses → Show analyses..., tick what you need, press OK. Tick only what the current task requires,
      because every extra display costs screen space.
    zh: Analyses → Show analyses...，勾选需要的项目，按 OK。只勾当前任务需要的，每多一种显示就少一分画面空间。
  concept:
    en: 'A first lab is usually ruined by clutter: waveform, spectrogram, red formants, green pitch and
      pulses all at once leave no room to see anything.'
    zh: 第一次实验课最常毁在画面太挤：波形、频谱、红色共振峰、绿色基频与脉冲同时显示，结果什么都看不清。
  pitfalls:
  - en: Turning off the waveform frees a lot of space and makes the spectrogram much easier to read.
    zh: 把波形关掉能腾出大量空间，频谱图会明显变得好读。
  keywords:
  - show analyses
  - 显示分析
  - 勾选
  - tick
  - 画面
  - 空间
  - 编辑器
  - 设定
- id: time-step-settings
  aliases:
  - Time step settings...
  control_types:
  - MenuItemControl
  title:
    en: Time step settings...
    zh: Time step settings...（时间步长设定）
  what:
    en: Sets how often the editor samples the sound when it draws analyses, either automatically or at
      a fixed step in seconds.
    zh: 设定编辑窗口画分析时多久取样一次，可以自动也可以固定成秒数。
  how:
    en: Analyses → Time step settings..., pick Automatic or Fixed and enter the step; a smaller step gives
      a denser and smoother contour but more computation.
    zh: Analyses → Time step settings...，选 Automatic 或 Fixed 并填入步长，步长小曲线更密更平滑，但计算量更大。
  concept:
    en: The time step is the frame rate of the analysis. The frequency resolution of the pitch tracker
      improves with a longer step, but short events are then missed.
    zh: 时间步长就是分析的帧率。基频分析的频率解析度会随步长变长而改善，但很短的事件也会因此被漏掉。
  pitfalls:
  - en: A step that is too long hides short consonants and short stops; 0.0025 to 0.01 s suits most classroom
      work.
    zh: 步长太长会藏起短短的辅音与塞音，0.0025 到 0.01 秒适合大多数课堂作业。
  - en: Automatic ties the step to the visible window, so a measurement you read on screen may not match
      the object you exported.
    zh: Automatic 会让步长随可见范围变动，所以你在画面上读到的数值可能和你汇出的物件不一致。
  keywords:
  - time step
  - 时间步长
  - 帧
  - frame
  - 解析
  - resolution
  - analyses
  - 设定
- id: pitch-settings
  aliases:
  - Pitch settings...
  control_types:
  - MenuItemControl
  title:
    en: Pitch settings...
    zh: Pitch settings...（基频设定）
  what:
    en: Opens the dialog with the pitch floor, the pitch ceiling and the time step used by the pitch contour
      drawn in the editor.
    zh: 打开对话框，设定编辑窗口所画基频曲线的下限、上限与时间步长。
  how:
    en: Pitch → Pitch settings...; set the floor and ceiling in Hz (75 to 600 Hz for adult speech) and
      the step, then press OK.
    zh: Pitch → Pitch settings...，填入下限与上限（成人语音 75 到 600 Hz）以及步长，按 OK。
  concept:
    en: The floor and ceiling define the range of periodicity the tracker will consider. Too narrow a
      range and real pitch gets rejected; too wide and the tracker locks onto a harmonic.
    zh: 下限与上限界定了追踪器会考虑的周期范围。范围太窄会拒绝真实的音高，太宽则会让追踪器锁到泛音上。
  pitfalls:
  - en: 'The ceiling is where octave errors start: with the default ceiling of 600 Hz a voice whose F0
      reaches 600 Hz is reported an octave too low.'
    zh: 八度跳错从上限开始：预设上限 600 Hz 时，基频到达 600 Hz 的声音会被报成一半。
  - en: For a child or an adolescent speaker, set the floor near 60 Hz and the ceiling near 800 Hz.
    zh: 儿童或青少年说话者要把下限设到约 60 Hz、上限设到约 800 Hz。
  keywords:
  - pitch settings
  - 基频设定
  - floor
  - ceiling
  - 下限
  - 上限
  - 八度
  - octave
  - hertz
- id: formant-settings
  aliases:
  - Formant settings...
  control_types:
  - MenuItemControl
  title:
    en: Formant settings...
    zh: Formant settings...（共振峰设定）
  what:
    en: 'Opens the dialog controlling the formant analysis: the time step, the maximum number of formants
      and the frequency range.'
    zh: 打开控制共振峰分析的对话框：时间步长、共振峰最大数目与频率范围。
  how:
    en: Formants → Formants & LPC menu → Formant settings...; the range must suit the speaker, for example
      0 to 5500 Hz for an adult female voice, about 0 to 5000 Hz for an adult male and 0 to 8000 Hz for
      a young child.
    zh: Formants → Formants & LPC menu → Formant settings...；范围要配合说话者，成年女性约 0 到 5500 Hz，成年男性约 0 到 5000 Hz，幼童 0 到 8000 Hz。
  concept:
    en: The number of formants should be roughly one per 1000 Hz of range, so Praat's standard of 5
      formants fits a 5500 Hz range. Each formant costs two poles, and extra poles fit noise rather than
      structure.
    zh: 共振峰的数目大约每 1000 Hz 一个，所以 Praat 在 5500 Hz 的范围里预设 5 个共振峰。每个共振峰用两个极点，多出来的极点是在拟合杂讯而不是结构。
  pitfalls:
  - en: Setting the maximum number of formants too low merges F2 and F3 and gives implausibly high vowels.
    zh: 共振峰最大数目设太低会把 F2 与 F3 合并，得到高得不合理的元音。
  - en: A male voice analysed with a 5000 Hz ceiling often shows a spurious high pole between F2 and F3.
    zh: 男声用 5000 Hz 上限分析时，F2 与 F3 之间常出现一个假的额外极点。
  keywords:
  - formant settings
  - 共振峰设定
  - 极点
  - poles
  - 频率范围
  - formant range
  - lpc
  - 步长
- id: formants-lpc-menu
  aliases:
  - Formants & LPC menu
  control_types:
  - MenuItemControl
  title:
    en: The Formants & LPC menu
    zh: Formants & LPC 菜单
  what:
    en: A submenu that gathers the formant analysis commands, such as To Formants (burg)..., To Formants
      (sl)... and the LPC commands.
    zh: 把共振峰分析指令集中起来的子菜单，例如 To Formants (burg)...、To Formants (sl)... 以及各种 LPC 指令。
  how:
    en: Formants → Formants & LPC menu → To Formants (burg)... creates a Formant object you can plot;
      the LPC items let you extract the filter itself.
    zh: Formants → Formants & LPC menu → To Formants (burg)... 会产生可绘图的 Formant 物件；LPC 相关项目则让你取出滤波器本身。
  concept:
    en: Burg's method is the default because it is stable on short frames; the simple LPC method is faster
      but can produce spurious poles.
    zh: Burg 法是预设，因为它在短分析窗上较稳定；简易 LPC 法较快，但可能产生假的极点。
  pitfalls:
  - en: Sl (simple LPC) formants can jump around on noisy frames; compare with Burg before publishing
      a value.
    zh: 在杂讯较多的分析窗上，Sl 法的共振峰会乱跳，发表数值前请先与 Burg 法比对。
  keywords:
  - formants lpc menu
  - 共振峰
  - lpc
  - burg
  - 分析
  - 菜单
  - formant object
- id: get-pitch
  aliases:
  - Get pitch
  control_types:
  - MenuItemControl
  title:
    en: Get pitch
    zh: Get pitch（取得基频）
  what:
    en: Reports the fundamental frequency at the cursor, in Hz, read straight from the pitch contour.
    zh: 报告游标处的基频（Hz），直接从基频曲线上读出来。
  how:
    en: In the editor, put the cursor where you want the value and choose Pitch → Get pitch (F5); the
      number appears in the Info window.
    zh: 在编辑窗口把游标放到想取值的位置，选 Pitch → Get pitch（F5），数字会出现在 Info 窗口。
  concept:
    en: This is a point measurement on an already computed contour, so it inherits every weakness of the
      pitch settings that produced it.
    zh: 这是在已算好的曲线上做点量测，因此会继承产生该曲线的基频设定的所有弱点。
  pitfalls:
  - en: Reading at the very edge of a voiced region often returns a boundary frame instead of the steady
      value.
    zh: 在有声区边缘取值常常读到的是边界格，而不是稳定的数值。
  keywords:
  - get pitch
  - 取得基频
  - f5
  - 游标
  - cursor
  - 读数
  - 测量
- id: get-first-formant
  aliases:
  - Get first formant
  control_types:
  - MenuItemControl
  title:
    en: Get first formant
    zh: Get first formant（取得 F1）
  what:
    en: Reports the frequency of the first formant at the cursor, in Hz.
    zh: 报告游标处第一共振峰的频率（Hz）。
  how:
    en: Put the cursor on a steady vowel and choose Formants → Get first formant (F1); repeat with F2
      for the second formant.
    zh: 把游标放在稳定的元音上，选 Formants → Get first formant（F1）；第二共振峰则用 F2。
  concept:
    en: 'F1 is mainly a jaw-height cue: it falls as the jaw opens. F2 is mainly a front-back and tongue-body
      cue, which is why the vowel quadrilateral is built on F1 and F2 together.'
    zh: F1 主要反映开口度：下巴越低 F1 越小。F2 主要反映舌位前后与舌体状态，所以元音四边形是靠 F1 与 F2 一起建立的。
  pitfalls:
  - en: Never read F1 from the middle of a glide or a nasal; the formants are moving or the model is failing.
    zh: 绝不要在滑音或鼻音中间读 F1，那里的共振峰在移动或模型根本不合。
  - en: Measure in the steady part of the vowel, not in the transition from the preceding consonant.
    zh: 要在元音的稳定段量测，不要在从前一个辅音过渡过来的那一段量。
  keywords:
  - get first formant
  - f1
  - 共振峰
  - formant
  - 游标
  - 测量
  - 元音
  - vowel
- id: get-second-formant
  aliases:
  - Get second formant
  control_types:
  - MenuItemControl
  title:
    en: Get second formant
    zh: Get second formant（取得 F2）
  what:
    en: Reports the frequency of the second formant at the cursor, in Hz.
    zh: 报告游标处第二共振峰的频率（Hz）。
  how:
    en: Place the cursor in the steady nucleus of the vowel and choose Formants → Get second formant (F2).
    zh: 把游标放在元音稳定的核心处，选 Formants → Get second formant（F2）。
  concept:
    en: F2 varies with tongue body position and with front-back tongue movement, so it carries most of
      the information that separates front from back vowels and /r/ from /l/.
    zh: F2 随舌体位置与前后移动而变，因此它携带了区分前后元音、以及 /r/ 与 /l/ 的大部分资讯。
  pitfalls:
  - en: F2 is the first formant to suffer when the formant range is too narrow for the speaker.
    zh: 频率范围对说话者来说太窄时，F2 是第一个受影响的共振峰。
  keywords:
  - get second formant
  - f2
  - 共振峰
  - formant
  - 游标
  - 舌位
  - 测量
- id: get-time-of-cursor
  aliases:
  - Get (time) of cursor...
  - Get cursor
  control_types:
  - MenuItemControl
  title:
    en: Get (time) of cursor...
    zh: Get (time) of cursor...（取得游标时间）
  what:
    en: Reports the time position of the cursor in seconds, so you can write down exactly where you measured.
    zh: 报告游标的时间位置（秒），让你能确切记下量测是在哪里做的。
  how:
    en: In the editor use Time → Get cursor (F6); in the Objects window the Query menu has the equivalent
      for the selected object.
    zh: 在编辑窗口用 Time → Get cursor（F6）；Objects 窗口的 Query 菜单里有对应的指令。
  concept:
    en: A measurement without a time stamp is not reproducible; the cursor time is what links a number
      in your notes to a place in the recording.
    zh: 没有时间戳的量测是不可重现的；游标时间就是把笔记里的数字连到录音上某个位置的依据。
  pitfalls:
  - en: The cursor time is measured from the start of the sound, so an extracted part that starts at zero
      has different times from the original.
    zh: 游标时间是从声音起点算的，所以截出的片段若从 0 开始，时间数字就和原档案不同。
  keywords:
  - get cursor
  - 游标
  - 时间
  - cursor time
  - f6
  - 量测
  - 秒
- id: get-frequency
  aliases:
  - Get frequency of cursor...
  - Get frequency at cursor...
  - Get frequency...
  control_types:
  - MenuItemControl
  title:
    en: Get frequency...
    zh: Get frequency...（取得游标频率）
  what:
    en: Reports the frequency under the cursor in the spectrogram, in Hz.
    zh: 报告频谱图上游标所在位置的频率（Hz）。
  how:
    en: Click in the spectrogram so that the frequency cursor is on a band, then use the Query command
      of the Spectrogram menu.
    zh: 在频谱图里点一下让频率游标落在某个band上，再用 Spectrogram 菜单里的查询指令。
  concept:
    en: 'This is the simplest way to read a formant or a fricative noise band: the frequency cursor picks
      out the horizontal band under it, and the number tells you its centre.'
    zh: 这是读共振峰或擦音噪声带最简单的方法：频率游标挑中它下面的水平频带，数字就是该频带的中心。
  pitfalls:
  - en: On a broad noise band the number is only the frequency under the cursor, not a meaningful centre
      frequency of the noise.
    zh: 在宽频噪声带上，这个数字只是游标所在频率，不是该噪声有意义的中心频率。
  keywords:
  - get frequency
  - 频率
  - 游标
  - cursor
  - 频谱图
  - 共振峰
  - 读取
- id: get-intensity
  aliases:
  - Get intensity of cursor...
  - Get intensity...
  control_types:
  - MenuItemControl
  title:
    en: Get intensity...
    zh: Get intensity...（取得游标强度）
  what:
    en: Reports the intensity at the cursor, in dB relative to the hearing threshold.
    zh: 报告游标处的强度（dB），以听觉阈值为零点。
  how:
    en: Put the cursor where you want the value and choose Intensity → Get intensity (F8).
    zh: 把游标放在想取值的位置，选 Intensity → Get intensity（F8）。
  concept:
    en: The scale is absolute, but an uncalibrated recording gives no true level, so the number compares
      syllables inside one recording and not across recordings.
    zh: 刻度是绝对的，但未校正的录音没有真正的声级，所以这个数值只能比较同一份录音里的音节，不能跨录音比较。
  pitfalls:
  - en: The value depends on the minimum pitch used in the intensity settings, so it is not comparable
      across files analysed with different settings.
    zh: 这个数值取决于强度设定中的最低基频，用不同设定分析不同档案时数值不能直接比较。
  keywords:
  - get intensity
  - 强度
  - 游标
  - cursor
  - f8
  - 能量
  - dB
- id: select-all
  aliases:
  - Select all
  title:
    en: Select all
    zh: Select all（全部选取）
  what:
    en: Extends the time selection to cover the whole sound, so that measurements and extractions act
      on everything.
    zh: 把时间选区扩展到涵盖整段声音，让量测与取出作用在全部内容上。
  how:
    en: In the Time menu use the Set selection group → Select... and type the range; in a script the same
      job is done by the command select all.
    zh: 在 Time 菜单的 Set selection 组用 Select... 输入范围；脚本里则用 select all 这条指令。
  concept:
    en: A selection with no bounds is what many extraction and measurement commands assume when you want
      the whole token.
    zh: 许多取出与量测指令在你想处理整个语流时，都预设了一个没有边界的选区。
  pitfalls:
  - en: Praat 6.4 does not show a Select all item in the Time menu; the tutorials that mention it mean
      the script command.
    zh: Praat 6.4 的 Time 菜单里并没有 Select all 这一项，教学里提到的其实是指脚本指令。
  - en: Ctrl-A in the editor zooms to the whole sound, it does not select it; the two are easy to confuse.
    zh: 编辑窗口里的 Ctrl-A 是缩放到整段声音，不是全选，两者很容易搞混。
  keywords:
  - select all
  - 全选
  - 选取
  - 选区
  - selection
  - ctrl-a
  - 时间范围
- id: set-cursor
  aliases:
  - Set cursor
  - Move cursor to...
  control_types:
  - MenuItemControl
  title:
    en: Move cursor to... / Set cursor
    zh: Move cursor to... / Set cursor（设定游标）
  what:
    en: Places the time cursor at a position you type in, so measurements can be taken at an exact, reproducible
      time.
    zh: 把时间游标放到你输入的位置，让量测能在精确且可重现的时刻进行。
  how:
    en: Time → Move cursor to... and enter the time in seconds; or click in the waveform to put the cursor
      there.
    zh: Time → Move cursor to... 输入秒数；或直接在波形上点一下把游标放过去。
  concept:
    en: The cursor is the shared reference between what you hear, what you see and what you measure; the
      numbers in the right margin follow it.
    zh: 游标是你听到的、看到的与量到的三者共用的参照点，右缘的数字都跟着它变。
  pitfalls:
  - en: Clicking in the spectrogram moves the cursor to that time, which is easy to do by accident while
      trying to read a frequency.
    zh: 在频谱图上点击会移动游标的时间位置，想读频率却不小心点到的情形很常见。
  keywords:
  - set cursor
  - move cursor
  - 游标
  - cursor
  - 定位
  - 时间
  - 秒
  - 测量
- id: zoom-show-all
  aliases:
  - Show all
  control_types:
  - MenuItemControl
  title:
    en: Show all
    zh: Show all（显示全部）
  what:
    en: Zooms out so that the whole sound fits in the window.
    zh: 缩小视图，让整段声音都出现在窗口内。
  how:
    en: Time → Show all (Ctrl-A), or click the all button at the top left of the editor.
    zh: Time → Show all（Ctrl-A），或点编辑窗口左上角的 all 按钮。
  concept:
    en: Zooming changes only the mapping from time to pixels; the data and the analysis settings stay
      as they are.
    zh: 缩放只改变时间与像素之间的对应关系，资料与分析设定都不变。
  pitfalls:
  - en: After Show all, Praat may stop drawing the analyses because the visible window is too long.
    zh: 执行 Show all 之后，因为可见范围太长，Praat 可能就不再画分析了。
  keywords:
  - show all
  - 显示全部
  - 缩小
  - zoom out
  - 全览
  - ctrl-a
- id: zoom-in
  aliases:
  - Zoom in
  control_types:
  - MenuItemControl
  title:
    en: Zoom in
    zh: Zoom in（放大）
  what:
    en: Magnifies the visible time range around the cursor or the selection.
    zh: 放大游标或选区附近的可见时间范围。
  how:
    en: Time → Zoom in (Ctrl-I), or click the in button at the top left of the editor.
    zh: Time → Zoom in（Ctrl-I），或点编辑窗口左上角的 in 按钮。
  concept:
    en: Zooming in on a steady vowel is what makes the spectrogram clean, because the analysis window
      then sits well inside the segment.
    zh: 放大到稳定元音上，频谱图才会干净，因为分析窗此时整个落在音段内部。
  pitfalls:
  - en: Zooming in does not increase the frequency resolution of the spectrogram; that is set by the window
      length.
    zh: 放大不会提升频谱图的频率解析度，那是由窗长决定的。
  keywords:
  - zoom in
  - 放大
  - 缩放
  - ctrl-i
  - 细节
  - 时间轴
- id: zoom-out
  aliases:
  - Zoom out
  control_types:
  - MenuItemControl
  title:
    en: Zoom out
    zh: Zoom out（缩小）
  what:
    en: Shows a wider stretch of time around the cursor or the selection.
    zh: 显示游标或选区周围更宽的一段时间。
  how:
    en: Time → Zoom out (Ctrl-O), or click the out button at the top left of the editor.
    zh: Time → Zoom out（Ctrl-O），或点编辑窗口左上角的 out 按钮。
  concept:
    en: Zooming out too far is what makes Praat stop drawing the analyses and what makes a formant look
      smeared.
    zh: 缩得太远正是 Praat 不再画分析、也让共振峰看起来糊掉的原因。
  pitfalls:
  - en: Ctrl-O here is zoom out, while Ctrl-O in the Objects window opens a file.
    zh: 这里的 Ctrl-O 是缩小，而 Objects 窗口里的 Ctrl-O 是开档案。
  keywords:
  - zoom out
  - 缩小
  - 缩放
  - ctrl-o
  - 全览
  - 时间轴
- id: zoom-to-selection
  aliases:
  - Zoom to selection
  control_types:
  - MenuItemControl
  title:
    en: Zoom to selection
    zh: Zoom to selection（缩放到选区）
  what:
    en: Zooms in so that exactly the selected time range fills the window.
    zh: 放大，让选中的时间范围刚好填满窗口。
  how:
    en: Select a range first, then Time → Zoom to selection (Ctrl-N), or click the sel button at the top
      left of the editor.
    zh: 先选一段范围，再 Time → Zoom to selection（Ctrl-N），或点编辑窗口左上角的 sel 按钮。
  concept:
    en: 'This is the standard move before measuring a segment: isolate the part, then read the formant
      or pitch value inside it.'
    zh: 这是量测音段之前的标准动作：先把该段分离出来，再读里面的共振峰或基频数值。
  pitfalls:
  - en: With no selection the command does nothing, so check that the selection is really highlighted.
    zh: 没有选区时这条指令不会有反应，要确认选区真的被选取了。
  keywords:
  - zoom to selection
  - 缩放到选区
  - ctrl-n
  - 选区
  - 量测
  - 放大
- id: zoom-back
  aliases:
  - Zoom back
  control_types:
  - MenuItemControl
  title:
    en: Zoom back
    zh: Zoom back（回到上一个视图）
  what:
    en: Returns to the previous zoom level, so you can undo an accidental zoom.
    zh: 回到上一个缩放层级，让你不小心放大之后还能退回去。
  how:
    en: Time → Zoom back (Ctrl-B), or click the bak button at the top left of the editor.
    zh: Time → Zoom back（Ctrl-B），或点编辑窗口左上角的 bak 按钮。
  concept:
    en: It works as a small undo stack for the view only; it never undoes a change to the data.
    zh: 它只是视图层的小型复原堆叠，不会撤销任何对资料的改变。
  pitfalls:
  - en: It is not an undo for edits; Ctrl-Z is the command for those.
    zh: 它不是编辑的撤销，编辑要用 Ctrl-Z。
  keywords:
  - zoom back
  - 返回
  - 复原
  - ctrl-b
  - 缩放
  - 上一个视图
- id: editor-zoom-buttons
  aliases:
  - all
  - in
  - out
  - sel
  - bak
  control_types:
  - ButtonControl
  title:
    en: The five zoom buttons
    zh: 五个缩放按钮
  what:
    en: 'A row of five small buttons at the top left of the Sound editor that zoom the time axis: all,
      in, out, sel and bak.'
    zh: 声音编辑窗口左上角一排五个小按钮，用来缩放时间轴：all、in、out、sel、bak。
  how:
    en: all shows the whole sound, in zooms in, out zooms out, sel zooms to the selection and bak goes
      back one step.
    zh: all 显示整段声音，in 放大，out 缩小，sel 缩放到选区，bak 退回一步。
  concept:
    en: These are the fastest way to navigate a long recording, because they work with the mouse while
      your attention stays on the signal.
    zh: 这五个按钮是浏览长录音最快的办法，因为它们用鼠标操作，你的注意力可以一直放在讯号上。
  pitfalls:
  - en: The names are cryptic out of context; they are not the same as the Time menu commands, which are
      clearer.
    zh: 脱离上下文看这些缩写很难懂，它们和 Time 菜单里的指令并不是同一套，菜单的名称比较清楚。
  - en: The bak button only steps back through views, so it cannot undo a wrong measurement.
    zh: bak 按钮只能在视图之间后退，无法撤销量错的数值。
  keywords:
  - zoom buttons
  - 缩放按钮
  - all
  - in
  - out
  - sel
  - bak
  - 工具栏
  - 编辑器
- id: group-button
  aliases:
  - Group
  control_types:
  - CheckBoxControl
  title:
    en: The Group button
    zh: Group（同步显示）
  what:
    en: Synchronises several editor windows so that they scroll and zoom together, which is how you compare
      a sound with its annotation.
    zh: 让多个编辑窗口同步卷动与缩放，也就是把声音与它的标注对照着看的方法。
  how:
    en: Push Group in every window you want to link; the windows then share a time axis and cannot be
      edited independently.
    zh: 在每一个要联结的窗口都按 Group，这些窗口就共用一条时间轴，而且不能各自独立编辑。
  concept:
    en: Grouping is the practical way to check that your annotation boundaries land where the acoustic
      events are, because both views always show the same time.
    zh: Grouping 是检查标注边界是否落在声学事件上的实用办法，因为两个视图永远显示同一段时间。
  pitfalls:
  - en: You cannot cut and paste in a grouped window; ungroup before editing.
    zh: 同步中的窗口不能剪贴，编辑前要先解除同步。
  - en: 'Grouping changes the view only, but the confusion it causes is real: students think the other
      window is frozen.'
    zh: Grouping 只改变视图，但造成的困惑很真实，学生会以为另一个窗口卡住了。
  keywords:
  - group
  - 同步
  - 联结
  - 同步显示
  - 编辑器
  - 对照
  - 时间轴
- id: textgrid-editor
  aliases:
  - TextGrid editor
  - TextGrid window
  title:
    en: The TextGrid editor
    zh: TextGrid 编辑窗口
  what:
    en: The window where you type the labels of a TextGrid; with a Sound also selected it shows the waveform
      and the spectrogram above the tiers.
    zh: 输入 TextGrid 标签的窗口；同时选中 Sound 时，它会在层级上方显示波形与频谱图。
  how:
    en: Select the TextGrid, hold Ctrl and click the Sound too, then click View & Edit; the sound is drawn
      above, the tiers below.
    zh: 选中 TextGrid，按住 Ctrl 再点 Sound，然后点 View & Edit；声音画在上方，层级在下方。
  concept:
    en: The text window at the very top always shows the label of the interval or point under the cursor;
      you type there and the tier updates immediately.
    zh: 最上方的文字窗永远显示游标所在区间或点的标签，你在那里打字，层级会立即更新。
  pitfalls:
  - en: Typing into the yellow tier strip does not work; the label has to be typed in the white text window
      at the top.
    zh: 在黄色的层级条上打字没有用，标签必须打在顶部的白色文字窗里。
  - en: If only the TextGrid was selected when you pressed View & Edit, there is no waveform above the
      tiers and you lose the acoustic reference.
    zh: 如果按 View & Edit 时只选了 TextGrid，层级上方就没有波形，你会失去声学参照。
  - en: A TextGrid that does not cover the whole sound leaves a stretch of audio with no tiers, and Praat
      will not let you extend it by typing.
    zh: 没有涵盖整段声音的 TextGrid 会留下一段没有层级的音讯，而且 Praat 不允许你靠打字补上。
  keywords:
  - textgrid editor
  - 文本网格
  - 编辑器
  - 标注
  - annotation
  - tier
  - 层级
  - 打字
  - 白色文字窗
- id: editor-textgrid-button
  aliases:
  - TextGrid button
  control_types:
  - ButtonControl
  title:
    en: The TextGrid button in the Sound editor
    zh: 声音编辑窗口的 TextGrid 按钮
  what:
    en: A button in the Sound editor that creates or opens a TextGrid for the sound you are looking at,
      so you can start annotating without leaving the window.
    zh: 声音编辑窗口里的一个按钮，为你正在看的声音建立或打开 TextGrid，让你不用离开窗口就能开始标注。
  how:
    en: Click the TextGrid button at the top of the Sound editor; Praat adds a TextGrid covering the sound
      and shows its tiers below the waveform.
    zh: 点声音编辑窗口上方的 TextGrid 按钮，Praat 会加一个涵盖该声音的 TextGrid，并在波形下方显示层级。
  concept:
    en: It saves the round trip through the Objects window, but the tier it creates is empty and unnamed
      unless you rename it.
    zh: 它省去在 Objects 窗口里绕一圈，但建立的层级是空的、没有名字，除非你重新命名。
  pitfalls:
  - en: The button's position differs between versions and it is drawn on the canvas, so it is not a normal
      Windows button.
    zh: 这个按钮在不同版本位置不同，而且它是画在画布上的，不是普通的 Windows 按钮。
  - en: If you use it after the sound has been edited, the TextGrid covers the edited sound, not the file
      on disk.
    zh: 如果在编辑过声音之后才按它，TextGrid 对应的是编辑后的声音，不是硬盘上的档案。
  keywords:
  - textgrid button
  - 文本网格按钮
  - 标注
  - annotation
  - 编辑器
  - 建立
- id: boundary-tier
  aliases:
  - Boundary tier
  title:
    en: The boundary tier (the yellow strip)
    zh: 边界层（黄色条）
  what:
    en: The narrow yellow strip under the tiers that holds the boundary positions; it is a working area,
      not a place to type labels.
    zh: 层级下方那条窄窄的黄色条，用来放边界位置；它是工作区域，不是打标签的地方。
  how:
    en: Drag the boundary handles in the yellow strip to move boundaries; type the labels in the white
      text window above.
    zh: 拖动黄色条上的边界把手可以移动边界；标签则打在上面的白色文字窗里。
  concept:
    en: The yellow tier shows the segmentation of the interval tier below it, so you can see the boundaries
      in the same time frame as the labels.
    zh: 黄色层显示的是下方区间层的切分情况，让你能在与标签相同的时间框架里看到边界。
  pitfalls:
  - en: 'This is the classic beginner trap: students try to type in the yellow strip and conclude that
      Praat has frozen.'
    zh: 这就是经典的初学者陷阱：学生在黄色条上打字，然后以为 Praat 卡住了。
  - en: Dragging a boundary snaps it to the boundaries or points of the other tiers, which is helpful
      but surprising the first time.
    zh: 拖动边界会吸附到其他层的边界或点上，这很方便，但第一次遇到会吓一跳。
  keywords:
  - boundary tier
  - 边界层
  - 黄色
  - yellow
  - 切分
  - 边界
  - 拖动
  - drag
  - 陷阱
- id: add-interval-tier
  aliases:
  - Add interval tier...
  - Add interval tier
  control_types:
  - MenuItemControl
  title:
    en: Add interval tier...
    zh: Add interval tier...（新增区间层）
  what:
    en: Adds a new interval tier to the TextGrid, which is the tier type that holds segments such as phones
      or words.
    zh: 为 TextGrid 新增一个区间层，也就是存放音段、音素或词的那种层级类型。
  how:
    en: Tier → Add interval tier..., then type the name of the new tier and press Enter.
    zh: Tier → Add interval tier...，输入新层级的名称后按 Enter。
  concept:
    en: 'Interval tiers and point tiers behave differently: an interval tier must cover the whole time
      domain with consecutive intervals, while points may be sparse.'
    zh: 区间层与点层的行为不同：区间层必须以连续的区间覆盖整个时间范围，点则可以稀疏分布。
  pitfalls:
  - en: The new tier is added at the top, so the tier you were working on moves down and its number changes.
    zh: 新层会加在最上方，你原本在处理的层会往下移，编号也跟着变。
  - en: The dialog asks for a name; pressing OK straight away leaves you with an unnamed tier.
    zh: 对话框会要一个名称，直接按 OK 会得到一个没有名字的层级。
  keywords:
  - add interval tier
  - 新增
  - 区间层
  - tier
  - 层级
  - textgrid
  - 音段
- id: add-point-tier
  aliases:
  - Add point tier...
  - Add point tier
  control_types:
  - MenuItemControl
  title:
    en: Add point tier...
    zh: Add point tier...（新增点层）
  what:
    en: Adds a new point tier to the TextGrid, for events that have a time but no duration.
    zh: 为 TextGrid 新增一个点层，用来记录有时刻但没有时长的事件。
  how:
    en: Tier → Add point tier..., name it, then click in the tier to insert points and type a label for
      each.
    zh: Tier → Add point tier...，命名之后在层内点击插入点，再为每个点输入标签。
  concept:
    en: 'Point tiers are the right home for events that are not segments: release bursts, glottal stops,
      gestures, or the moments of maximum flow.'
    zh: 点层适合放不是音段的事件：释爆点、喉塞、手势，或气流最大的时刻。
  pitfalls:
  - en: Putting a phone label in a point tier loses the duration of that phone.
    zh: 把音素标签放进点层会丢掉该音素的时长。
  - en: A point is inserted on the tier that is currently active, so check which tier is selected first.
    zh: 点会插入到目前作用中的那一层，插入前先确认当前是哪一层。
  keywords:
  - add point tier
  - 新增
  - 点层
  - tier
  - 层级
  - event
  - 事件
  - 释爆
- id: tier-buttons
  aliases:
  - Tier buttons
  title:
    en: The tier buttons
    zh: 层级按钮（Tier 按钮）
  what:
    en: The row of small buttons that selects which tier is active for typing, adding boundaries or removing
      points.
    zh: 一排用来选择「当前作用层级」的小按钮，决定打字、加边界或删点作用在哪一层。
  how:
    en: Click the number of the tier you want to work on; the active tier is shown in red with a pointing
      hand next to it.
    zh: 点你要处理的那一层的编号，当前层会以红色显示，左边还会出现一只手指。
  concept:
    en: Only one tier is active at a time, so clicking in a tier or choosing a tier button decides where
      the next action will happen.
    zh: 同一时间只有一层是作用中的，所以在某一层里点击或按下层级按钮，就决定了下一个动作作用在哪一层。
  pitfalls:
  - en: Typing goes into the wrong tier when the active tier was not noticed; the boundary you just made
      is in the tier above.
    zh: 没注意到当前作用层时，标签就会打到错的层里，刚做的边界跑到上面那层去了。
  keywords:
  - tier buttons
  - 层级按钮
  - 当前层
  - active tier
  - 选择
  - 标注
- id: textgrid-toolbar
  aliases:
  - TextGrid toolbar
  title:
    en: The TextGrid toolbar
    zh: TextGrid 工具列
  what:
    en: The strip of buttons above the tiers that holds the text field, the annotation commands and the
      tier controls.
    zh: 层级上方那排按钮，装着文字栏位、标注指令与层级控制。
  how:
    en: Use it to type the current interval or point, to insert or remove a boundary, and to switch tiers
      without moving the mouse into the tiers.
    zh: 用它来输入当前区间或点的文字、插入或删除边界，以及不移动鼠标就切换层级。
  concept:
    en: The toolbar is the TextGrid equivalent of the Sound editor's top strip; it is where the label
      text and the editing commands meet.
    zh: 工具列相当于声音编辑窗口顶部的那一条，标签文字与编辑指令在这里汇合。
  pitfalls:
  - en: The white text field at the top of the toolbar is the only place where typing changes a label.
    zh: 工具列上方的白色文字栏位是唯一能靠打字改变标签的地方。
  keywords:
  - textgrid toolbar
  - 工具列
  - 按钮
  - 文字栏位
  - 标注
  - 插入
  - boundary
- id: picture-window
  aliases:
  - Picture window
  - Praat Picture
  title:
    en: The Picture window
    zh: Picture 窗口
  what:
    en: 'The window where Praat assembles publication figures: waveforms, spectrograms, contours, axes,
      labels and pens.'
    zh: Praat 组装出版图件的窗口：波形、频谱图、曲线、坐标轴、标签与画笔都在这里。
  how:
    en: Any object with a Plot command can be drawn here; then use Margins, World, Select, Pen and Font
      to finish the figure, and File to export it.
    zh: 任何带 Plot 指令的物件都能画到这里，再用 Margins、World、Select、Pen 与 Font 完成图面，最后用 File 汇出。
  concept:
    en: 'The Picture window is a typesetting environment rather than a viewer: the point of it is that
      you can produce a figure that meets a journal''s requirements and can be re-made later.'
    zh: Picture 窗口是排版环境而不是检视器：它的价值在于你能做出符合期刊要求的图，而且以后还能重做出来。
  pitfalls:
  - en: The Picture window starts empty and nothing happens until you plot something into it.
    zh: Picture 窗口一开始是空的，在有东西 Plot 进去之前它不会做任何事。
  - en: A figure made with default settings has no axis units and a hairline border; journals will ask
      you to fix both.
    zh: 用预设设定做出来的图没有坐标轴单位、边框也细得几乎看不见，期刊会要求你改。
  keywords:
  - picture window
  - 图片窗口
  - 图
  - figure
  - 出版
  - publication
  - 绘图
  - 排版
- id: picture-axes
  aliases:
  - Axes...
  control_types:
  - MenuItemControl
  title:
    en: Axes...
    zh: Axes...（坐标轴）
  what:
    en: Sets the axis ranges, units, labels and tick marks of the figure.
    zh: 设定图的坐标轴范围、单位、标签与刻度。
  how:
    en: Margins → Axes..., then fill in the minimum, the maximum and the label for the horizontal and
      the vertical axis.
    zh: Margins → Axes...，填入水平轴与垂直轴的最小值、最大值与标签。
  concept:
    en: For a spectrogram the horizontal axis is time in seconds and the vertical axis is frequency in
      hertz; writing those units into the axis labels is what makes the figure self-explanatory.
    zh: 对频谱图来说水平轴是秒、垂直轴是赫兹，把这些单位写进轴标签，图才能自己说明自己。
  pitfalls:
  - en: A vertical axis in kHz when the data are in Hz is a very common mistake in student figures.
    zh: 数据是 Hz 却把纵轴写成 kHz，是学生图件里很常见的错误。
  - en: Tick marks at 0.05 s make a one-second figure look busy; round the ranges sensibly.
    zh: 一秒的图上刻度每 0.05 秒一个会显得很挤，刻度间隔要合理取舍。
  keywords:
  - axes
  - 坐标轴
  - 单位
  - 标签
  - tick
  - 刻度
  - 频率
  - 时间
  - picture
- id: picture-draw-inner-box
  aliases:
  - Draw inner box
  control_types:
  - MenuItemControl
  title:
    en: Draw inner box
    zh: Draw inner box（画内框）
  what:
    en: Draws a rectangle around the plotting area, the frame that separates the data from the margins.
    zh: 在绘图区四周画一个方框，把资料区与边栏隔开。
  how:
    en: Margins → Draw inner box; the box is drawn around the inner viewport that the axes describe.
    zh: Margins → Draw inner box，方框会画在坐标轴所描述的内视窗四周。
  concept:
    en: A frame tells the reader where the data end, which matters when a spectrogram is printed with
      a lot of white margin around it.
    zh: 边框告诉读者资料到哪里为止，频谱图四周留白很多印刷时这一点特别重要。
  pitfalls:
  - en: A hairline box disappears in print; increase the line width before submitting.
    zh: 细线框在印刷时会消失，投稿前记得加粗线宽。
  keywords:
  - draw inner box
  - 内框
  - 方框
  - box
  - 边框
  - picture
  - 绘图
- id: picture-text
  aliases:
  - Text...
  control_types:
  - MenuItemControl
  title:
    en: Text... (in the Picture window)
    zh: Text...（Picture 窗口的文字）
  what:
    en: Writes a text label at a chosen position in world coordinates, using the current font and pen.
    zh: 在世界坐标的指定位置写一段文字，用的是目前的字型与画笔设定。
  how:
    en: World → Text..., then type the text and give its x and y position in the data's own units.
    zh: World → Text...，输入文字并给出 x 与 y 位置，单位要用资料本身的单位。
  concept:
    en: Because the position is in data coordinates, the label stays attached to the feature it names
      when the axes are later rescaled.
    zh: 因为位置用的是资料坐标，之后调整坐标轴时标签仍然贴在它所指的物件上。
  pitfalls:
  - en: Positions are in data units, so 0.5 in the x field is half a second, not half the picture width.
    zh: 位置用的是资料单位，x 栏填 0.5 是半秒，不是图宽的一半。
  - en: Special characters such as IPA need the right font; otherwise they show as boxes.
    zh: IPA 之类的特殊符号需要对应的字型，否则会显示成方框。
  keywords:
  - text
  - 文字
  - 标签
  - label
  - world
  - 坐标
  - picture
  - 标题
- id: picture-logarithmic-marks
  aliases:
  - Logarithmic marks
  control_types:
  - MenuItemControl
  title:
    en: Logarithmic marks
    zh: Logarithmic marks（对数刻度）
  what:
    en: Adds tick marks on a logarithmic scale, which is what a frequency axis needs when the range spans
      more than a decade.
    zh: 在对数刻度上加刻度，当频率范围跨过一个数量级以上时，频率轴就需要它。
  how:
    en: Margins → Logarithmic marks, then choose Logarithmic marks left..., right..., bottom... or top...
      to say which axis it applies to.
    zh: Margins → Logarithmic marks，再选 Logarithmic marks left...、right...、bottom... 或 top... 来指定作用在哪条轴。
  concept:
    en: A linear frequency axis from 0 to 5000 Hz puts almost all the speech structure into the bottom
      tenth of the plot; a log axis spreads it out.
    zh: 0 到 5000 Hz 的线性频率轴会把几乎所有语音结构挤在图的最下面十分之一，对数轴才能把它展开。
  pitfalls:
  - en: Logarithmic marks cannot be used on an axis that starts at zero, because log zero is undefined.
    zh: 对数刻度不能用在从 0 开始的轴上，因为 log 0 没有定义。
  - en: State in the caption that the frequency axis is logarithmic, otherwise readers will read the spacing
      as linear.
    zh: 要在图说里写明频率轴是对数的，否则读者会以为间距是线性的。
  keywords:
  - logarithmic marks
  - 对数刻度
  - 频率轴
  - frequency axis
  - 刻度
  - picture
  - 间距
- id: picture-save-as-eps
  aliases:
  - Save as EPS file...
  - Export as EPS file...
  control_types:
  - MenuItemControl
  title:
    en: Save as EPS file...
    zh: Save as EPS file...（汇出 EPS）
  what:
    en: Writes the figure as an EPS vector file, the format most journals still require for line art.
    zh: 把图写成 EPS 向量档，这仍是多数期刊对线条图件要求的格式。
  how:
    en: Picture window → File → Save as EPS file..., choose a name; the fontless variants export the IPA
      symbols as outlines instead of text.
    zh: Picture 窗口 → File → Save as EPS file...，指定档名；无字型版本会把 IPA 符号转成外框而不是文字。
  concept:
    en: Vector output stays sharp at any magnification, which matters because a journal will scale your
      figure to fit its column.
    zh: 向量输出放大后依然锐利，这很重要，因为期刊会把你的图缩放到栏宽。
  pitfalls:
  - en: EPS keeps only vector information; a raster image pasted into the picture is still raster in the
      EPS.
    zh: EPS 只保留向量资讯，贴进图里的点阵影像在 EPS 里依然是点阵。
  - en: Text in EPS needs the font to be available on the journal's machine; the fontless export avoids
      that problem.
    zh: EPS 里的文字需要期刊那台机器有对应字型，无字型汇出可以避开这个问题。
  keywords:
  - save as eps
  - 汇出
  - eps
  - 向量
  - vector
  - 出版
  - publication
  - 图
  - picture
- id: picture-save-as-pdf
  aliases:
  - Save as PDF file...
  control_types:
  - MenuItemControl
  title:
    en: Save as PDF file...
    zh: Save as PDF file...（汇出 PDF）
  what:
    en: Writes the figure as a PDF file, which many journals now accept and which preserves vector drawings.
    zh: 把图写成 PDF 档，现在很多期刊接受这个格式，而且会保留向量绘图。
  how:
    en: Picture window → File → Save as PDF file..., then choose the name and folder.
    zh: Picture 窗口 → File → Save as PDF file...，再选档名与资料夹。
  pitfalls:
  - en: A PDF of a rasterised spectrogram is very large; export vector line art as PDF and raster spectrograms
      as PNG or TIFF.
    zh: 点阵化的频谱图存成 PDF 会非常大，向量线条图用 PDF，点阵频谱图用 PNG 或 TIFF。
  keywords:
  - save as pdf
  - 汇出
  - pdf
  - 向量
  - 出版
  - 图
  - picture
- id: picture-save-as-png
  aliases:
  - Save as 300-dpi PNG file...
  - Save as 600-dpi PNG file...
  control_types:
  - MenuItemControl
  title:
    en: Save as ... PNG file...
    zh: Save as ... PNG file...（汇出 PNG）
  what:
    en: Writes the figure as a PNG raster image at 300 or 600 dots per inch, the right choice for a spectrogram.
    zh: 把图写成 300 或 600 dpi 的 PNG 点阵影像，频谱图就该用这个。
  how:
    en: Picture window → File → Save as 300-dpi PNG file... for a normal printed figure, or the 600-dpi
      version for a large poster-sized figure.
    zh: Picture 窗口 → File → Save as 300-dpi PNG file... 用于一般印刷尺寸的图，海报尺寸的大图则用 600 dpi 版本。
  concept:
    en: 300 dpi is the usual minimum for line art in print; below that the letters start to look ragged.
    zh: 印刷线条图通常以 300 dpi 为下限，低于这个值字边就会显得毛躁。
  pitfalls:
  - en: Check the pixel size of the exported file against the size you need; a 300 dpi export of a small
      window gives a small image.
    zh: 要核对汇出档的像素尺寸与你需要的尺寸相符，小窗口的 300 dpi 汇出仍然只是小图。
  keywords:
  - save as png
  - 汇出
  - png
  - dpi
  - 点阵
  - raster
  - 频谱图
  - 图片
- id: picture-save-as-praat-picture
  aliases:
  - Save as praat picture file...
  control_types:
  - MenuItemControl
  title:
    en: Save as praat picture file...
    zh: Save as praat picture file...（存成 Praat 图档）
  what:
    en: Saves the figure in Praat's own picture format, which keeps every editable element so you can
      come back and change it.
    zh: 用 Praat 自己的图档格式储存，会保留所有可编辑元件，之后还能回来修改。
  how:
    en: Picture window → File → Save as praat picture file...; reopen it later with File → Read from praat
      picture file...
    zh: Picture 窗口 → File → Save as praat picture file...；之后用 File → Read from praat picture file... 读回来。
  concept:
    en: 'This is Praat''s editable figure format: the axes, the pen settings and the drawn objects are
      all stored, so a figure can be revised without redoing the analysis.'
    zh: 这是 Praat 的可编辑图档格式：坐标轴、画笔设定与画出的物件都存下来了，图件可以修改而不必重做分析。
  pitfalls:
  - en: It is a Praat-only format; send the exported EPS or PNG to your collaborators.
    zh: 这是 Praat 专用的格式，给同伴时要另外汇出 EPS 或 PNG。
  keywords:
  - praat picture file
  - 图档
  - 储存
  - 可编辑
  - editable
  - picture
  - praat
- id: picture-print
  aliases:
  - Print...
  control_types:
  - MenuItemControl
  title:
    en: Print... (Picture window)
    zh: Print...（Picture 窗口的列印）
  what:
    en: Prints the figure, after letting you set up the page and the printer.
    zh: 列印这张图，列印前可以先设定版面与打印机。
  how:
    en: Picture window → File → Page setup... to choose the paper, then File → Print... (Ctrl-P).
    zh: Picture 窗口 → File → Page setup... 选纸张，再 File → Print...（Ctrl-P）。
  pitfalls:
  - en: Printing in colour on a greyscale figure can make the two channels indistinguishable on paper.
    zh: 灰阶图用彩色列印，两个声道在纸上会分不出来。
  keywords:
  - print
  - 列印
  - 打印
  - page setup
  - 版面
  - picture
  - 图
- id: picture-copy-to-clipboard
  aliases:
  - Copy to clipboard
  control_types:
  - MenuItemControl
  title:
    en: Copy to clipboard
    zh: Copy to clipboard（复制到剪贴簿）
  what:
    en: Copies the figure to the system clipboard so you can paste it into a slide deck or a word processor.
    zh: 把图复制到系统剪贴簿，方便贴进简报或文字处理器。
  how:
    en: Picture window → Edit → Copy to clipboard (Ctrl-C), then paste into your document.
    zh: Picture 窗口 → Edit → Copy to clipboard（Ctrl-C），再贴进你的文件。
  pitfalls:
  - en: The pasted image is a raster snapshot; for a submission you should still export a vector file.
    zh: 贴上的是点阵快照，要投稿还是应该汇出向量档。
  keywords:
  - copy to clipboard
  - 剪贴簿
  - 复制
  - 图片
  - 图片汇出
  - paste
  - 贴上
- id: picture-erase-all
  aliases:
  - Erase all
  control_types:
  - MenuItemControl
  title:
    en: Erase all
    zh: Erase all（清除全部）
  what:
    en: Removes everything drawn in the Picture window, leaving an empty canvas.
    zh: 把 Picture 窗口里画的所有东西清掉，留下空白画布。
  how:
    en: Picture window → Edit → Erase all (Ctrl-E); this cannot be undone, so save the figure first.
    zh: Picture 窗口 → Edit → Erase all（Ctrl-E）；这个动作无法撤销，先存档再清除。
  pitfalls:
  - en: Erasing the picture does not delete the Pitch or Formant objects in the Objects list, so nothing
      is lost scientifically.
    zh: 清掉图不会删掉清单里的 Pitch 或 Formant 物件，资料层面没有损失。
  keywords:
  - erase all
  - 清除
  - 清空
  - erase
  - 删除
  - picture
  - 画布
- id: picture-save-as-sound
  aliases:
  - Export as sound file...
  - Save as sound file...
  control_types:
  - MenuItemControl
  title:
    en: Export as sound file...
    zh: Export as sound file...（把图导出成声音）
  what:
    en: Turns a picture of a sound back into an audio file, by playing the picture's function as a filter
      over a glottal source.
    zh: 把声音的图重新变成音档，做法是把图上的函数当成滤波器，作用在声门音源上。
  how:
    en: Available in the window that exports a picture as a sound file (for example the Demo window or
      a sound editor); choose a sampling frequency and a file name.
    zh: 在可以把图导出成声音的窗口里（例如 Demo 窗口或声音编辑窗口）使用，设定取样频率与档名。
  concept:
    en: 'It is the inverse of analysis in spirit: because the picture is a filter, exporting it as a sound
      lets you hear exactly what the picture represents.'
    zh: 在精神上它是分析的反向操作：因为图就是滤波器，把它导出成声音就能听到图所代表的东西。
  pitfalls:
  - en: The result is a synthesis, so it sounds like a filtered buzz rather than the original speaker.
    zh: 结果是合成，听起来像被滤波的嗡鸣而不是原说话者。
  keywords:
  - export as sound file
  - 导出声音
  - sound file
  - 合成
  - synthesis
  - 演示
  - demo
  - picture
- id: keyboard-shortcuts
  aliases:
  - Keyboard shortcuts
  - Shortcuts
  - Keyboard
  title:
    en: Keyboard shortcuts in Praat
    zh: Praat 的键盘快捷键
  what:
    en: The key combinations that work across Praat's windows, from opening a file to reading values at
      the cursor.
    zh: 在 Praat 各窗口都有效的组合键，从开档到读取游标处的数值都有。
  how:
    en: 'Objects window: Ctrl-O read file, Ctrl-L long sound, Ctrl-M search manual, Ctrl-Q quit. Editor:
      Ctrl-A show all, Ctrl-I zoom in, Ctrl-N zoom to selection, Ctrl-B zoom back, Tab play selection,
      F1-F3 formants, F5 pitch, F6 cursor, F8 intensity.'
    zh: Objects 窗口：Ctrl-O 读档、Ctrl-L 开长声音、Ctrl-M 搜寻手册、Ctrl-Q 离开。编辑窗口：Ctrl-A 显示全部、Ctrl-I 放大、Ctrl-N 缩放到选区、Ctrl-B
      回上一视图、Tab 播放选区、F1–F3 读共振峰、F5 读基频、F6 读游标、F8 读强度。
  concept:
    en: 'The same key can mean different things in different windows, because each window has its own
      command table: Ctrl-O opens a file in the Objects window but zooms out in a sound window.'
    zh: 同一个键在不同窗口意义不同，因为每个窗口都有自己的指令表：Ctrl-O 在 Objects 窗口是开档，在声音窗口是缩小。
  pitfalls:
  - en: Ctrl-O zoomed out instead of opening a dialog is a common surprise; check which window has focus.
    zh: Ctrl-O 变成缩小而不是开对话框很常见，先确认焦点在哪个窗口。
  - en: In the TextGrid editor, Ctrl-1 to Ctrl-8 add an interval on that tier, and Ctrl-Shift-1 to Ctrl-Shift-9
      add a boundary on that tier.
    zh: 在 TextGrid 编辑窗口，Ctrl-1 到 Ctrl-8 在该层新增区间，Ctrl-Shift-1 到 Ctrl-Shift-9 在该层新增边界。
  - en: Some versions also toggle the editor displays with single letters; check your own version rather
      than assuming, because the assignments are not stable across releases.
    zh: 某些版本还能用单键切换编辑窗口的显示，但各版本指派并不固定，与其假设不如先在自己这一版试一次。
  keywords:
  - keyboard shortcut
  - 快捷键
  - 键盘
  - ctrl
  - f1
  - f5
  - f6
  - f8
  - tab
  - 组合键
  - praat
- id: textgrid-menu
  aliases:
  - TextGrid
  control_types:
  - MenuItemControl
  title:
    en: The TextGrid menu of the TextGrid editor
    zh: TextGrid 编辑窗口的 TextGrid 菜单
  what:
    en: 'Menu of the TextGrid editor: TextGrid settings, moving between tiers and intervals, drawing the
      grid into the Picture window, and extracting a TextGrid to the Objects list.'
    zh: TextGrid 编辑窗口自己的菜单：TextGrid 设定、在层级与区间之间移动、把网格画进 Picture 窗口，以及把 TextGrid 取回清单。
  how:
    en: TextGrid → Select next tier (Alt+Down) moves the active tier; TextGrid → Extract selected TextGrid
      (preserve times) puts the annotation into the Objects list.
    zh: TextGrid → Select next tier（Alt+Down）切换作用中的层；TextGrid → Extract selected TextGrid (preserve times)
      把标注放进清单。
  concept:
    en: Preserve times keeps the original absolute time axis when you extract; time from 0 shifts the
      whole grid to start at zero.
    zh: preserve times 取用时会保留原本的绝对时间轴；time from 0 则把整张网格平移到从 0 开始。
  pitfalls:
  - en: This TextGrid menu belongs to the editor; the Objects window has no such menu.
    zh: 这个 TextGrid 菜单属于编辑窗口，Objects 窗口里没有这个菜单。
  - en: A TextGrid whose time domain does not overlap the sound makes the editor complain when you open
      it.
    zh: TextGrid 的时间范围与声音不重叠时，打开编辑窗口会发出警告。
  keywords:
  - textgrid menu
  - 文本网格菜单
  - 层级切换
  - select tier
  - 取出
  - extract
  - 时间轴
- id: interval-menu
  aliases:
  - Interval
  control_types:
  - MenuItemControl
  title:
    en: The Interval menu of the TextGrid editor
    zh: TextGrid 编辑窗口的 Interval 菜单
  what:
    en: 'Menu for working with the intervals of the selected tier: aligning an interval to the audio,
      adding an interval on a chosen tier, and reading the interval''s boundaries and label.'
    zh: 用来处理当前层区间的菜单：对齐区间、在指定层新增区间，以及读取区间的起讫与标签。
  how:
    en: Interval → Add interval on tier 1 (Ctrl-1) creates an interval on the first tier at the cursor;
      Interval → Get label of interval reads the text back.
    zh: Interval → Add interval on tier 1（Ctrl-1）在第一层的游标处新增区间；Interval → Get label of interval 把标签读回来。
  concept:
    en: Align interval (Ctrl-D) shifts the interval boundaries so that they line up with the acoustic
      events in the sound, which is how you check a segmentation against the waveform.
    zh: Align interval（Ctrl-D）会移动区间边界，让它们与声音里的声学事件对齐，这就是把切分与波形互相检验的方法。
  pitfalls:
  - en: Ctrl-1 to Ctrl-8 add an interval on tier 1 to 8, so the number refers to the tier, not to a keyboard
      row.
    zh: Ctrl-1 到 Ctrl-8 是在第 1 到第 8 层新增区间，数字指的是层级不是键盘的行。
  keywords:
  - interval menu
  - 区间菜单
  - add interval
  - 新增区间
  - align
  - 对齐
  - ctrl-1
  - 标签
- id: boundary-menu
  aliases:
  - Boundary
  control_types:
  - MenuItemControl
  title:
    en: The Boundary menu of the TextGrid editor
    zh: TextGrid 编辑窗口的 Boundary 菜单
  what:
    en: 'Menu for inserting and removing boundaries and points: add on the selected tier, add on any tier,
      add on all tiers, move to the nearest zero crossing, or remove.'
    zh: 插入与删除边界、点的菜单：在作用层新增、在任一层新增、在所有层新增、移到最近过零点，或删除。
  how:
    en: Put the cursor where you want the boundary and press **Enter** (Boundary → Add on selected tier);
      Ctrl-F1 to Ctrl-F8 add on tier 1 to 8, and Ctrl-F9 adds on all tiers at once.
    zh: 把游标放到要放边界的位置按 **Enter**（即 Boundary → Add on selected tier）；Ctrl-F1 到 Ctrl-F8 在第 1 到第 8 层新增，Ctrl-F9
      则一次在所有层新增。
  concept:
    en: Enter acts on the tier that is currently active, which is why the tier you were working on may
      not be the one that changes.
    zh: Enter 作用在目前作用中的那一层，所以你本来在处理的层未必就是会变动的那一层。
  pitfalls:
  - en: Adding on all tiers (Ctrl-F9) inserts a boundary everywhere at once; there is no undo for it.
    zh: Ctrl-F9 会在所有层同时插入边界，而且无法撤销。
  - en: Move to nearest zero crossing snaps the boundary to a point where the waveform crosses zero, which
      avoids clicks when you cut the sound there.
    zh: Move to nearest zero crossing 会把边界吸附到波形过零的位置，在那里切声音可以避免爆音。
  keywords:
  - boundary menu
  - 边界菜单
  - add boundary
  - 新增边界
  - enter
  - 点
  - point
  - 过零
  - zero crossing
- id: spell-menu
  aliases:
  - Spell
  control_types:
  - MenuItemControl
  title:
    en: The Spell menu of the TextGrid editor
    zh: TextGrid 编辑窗口的 Spell 菜单
  what:
    en: Checks the spelling of the words in your tiers against a lexicon, and lets you add unknown words
      to a user dictionary.
    zh: 用词库检查各层里单词的拼写，并让你把词库没有的字加入个人字典。
  how:
    en: Spell → Check spelling in tier (Ctrl-Alt-L) walks through the selected tier; Spell → Add selected
      word to user dictionary teaches Praat a new word.
    zh: Spell → Check spelling in tier（Ctrl-Alt-L）会逐个检查当前层；Spell → Add selected word to user dictionary
      让 Praat 学会一个新词。
  concept:
    en: 'A spell checker is a dictionary lookup, so it knows your target language''s orthography and nothing
      about phonology: a phonetic transcription will be flagged everywhere.'
    zh: 拼写检查就是查词典，它知道的是目标语言的正字法，完全不懂音系，所以纯音系转写会被处处标红。
  pitfalls:
  - en: Do not use the spell checker on a tier of IPA labels; every label will be reported as a misspelling.
    zh: 不要对 IPA 标签层使用拼写检查，每个标签都会被报成拼错。
  keywords:
  - spell menu
  - 拼写
  - 检查
  - checker
  - 词典
  - lexicon
  - 字典
  - textgrid
- id: add-on-selected-tier
  aliases:
  - Add on selected tier
  control_types:
  - MenuItemControl
  title:
    en: Add on selected tier
    zh: Add on selected tier（在作用层新增）
  what:
    en: Inserts a boundary (or, on a point tier, a point) at the cursor time on the tier that is currently
      active.
    zh: 在游标时刻、于目前作用中的那一层插入一个边界（在点层上则是插入一个点）。
  how:
    en: Place the cursor on the acoustic event, then press **Enter** or choose Boundary → Add on selected
      tier. The active tier is drawn in red with a pointing hand.
    zh: 把游标放在声学事件上，按 **Enter** 或选 Boundary → Add on selected tier。作用中的那一层会以红色显示并带一只手指。
  concept:
    en: 'The Enter shortcut is the same command as the menu item, which is why the manual keeps referring
      to "the shortcut: Enter".'
    zh: 'Enter 快捷键与这个菜单项目是同一条指令，所以手册才会一直写「shortcut: Enter」。'
  pitfalls:
  - en: If nothing appears to happen, the active tier is not the one you are looking at; check the red
      tier number.
    zh: 如果看起来没反应，多半是作用中的层不是你以为的那一层，看一下红色显示的层编号。
  keywords:
  - add on selected tier
  - 新增
  - 作用层
  - active tier
  - enter
  - 边界
  - boundary
  - 游标
- id: add-interval-on-tier
  aliases:
  - Add interval on tier 1
  - Add interval on tier 2
  - Add interval on tier 3
  - Add interval on tier 4
  - Add interval on tier 5
  - Add interval on tier 6
  - Add interval on tier 7
  - Add interval on tier 8
  control_types:
  - MenuItemControl
  title:
    en: Add interval on tier N
    zh: Add interval on tier N（在第 N 层新增区间）
  what:
    en: Creates a new interval at the cursor time on the chosen tier, without changing the other tiers.
    zh: 在游标时刻于指定的那一层建立新区间，其他层不受影响。
  how:
    en: Interval → Add interval on tier 1 ... on tier 8, or press Ctrl-1 to Ctrl-8. The number is the
      tier, so the tier must exist first.
    zh: Interval → Add interval on tier 1 ... on tier 8，或按 Ctrl-1 到 Ctrl-8。数字指的是层级，所以那一层必须先存在。
  concept:
    en: 'Adding to one tier only is how you record a phonetic detail that cuts across a word boundary:
      the word tier stays intact while the phone tier gets its own segment.'
    zh: 只加到某一层，是记录横跨词界的音系细节的办法：词层保持原样，音素层有自己的音段。
  pitfalls:
  - en: Ctrl-1 adds an interval on tier 1; it does not select tier 1, and the active tier is unchanged.
    zh: Ctrl-1 是在第一层新增区间，不是切换到第一层，作用中的层并没有改变。
  keywords:
  - add interval on tier
  - 新增区间
  - 层级
  - ctrl-1
  - tier
  - interval
  - 标注
- id: add-on-all-tiers
  aliases:
  - Add on all tiers
  control_types:
  - MenuItemControl
  title:
    en: Add on all tiers
    zh: Add on all tiers（在所有层新增）
  what:
    en: Inserts a boundary at the cursor time on every tier at once, which is how you mark an event that
      cuts across all your levels.
    zh: 在游标时刻同时于所有层插入边界，用来标记横跨各层级的事件。
  how:
    en: Boundary → Add on all tiers (Ctrl-F9). It is a single point in time, so all tiers get a boundary
      at exactly the same moment.
    zh: Boundary → Add on all tiers（Ctrl-F9）。它只是时间轴上的一个点，所以所有层会在完全相同的时刻各得到一个边界。
  concept:
    en: A shared boundary across tiers is how you mark a moment that is linguistically relevant at every
      level, such as the start of a word that also begins a new phrase.
    zh: 各层共用的边界用来标记在每个层级都重要的时刻，例如一个既是词首也是短语起点的字。
  pitfalls:
  - en: 'There is no single undo for this: removing the boundaries again takes one Remove per tier.'
    zh: 这个动作没有一次撤销，要清掉得逐层各删一次。
  keywords:
  - add on all tiers
  - 所有层
  - 新增
  - 边界
  - ctrl-f9
  - boundary
  - event
  - 事件
- id: rename-tier
  aliases:
  - Rename tier...
  control_types:
  - MenuItemControl
  title:
    en: Rename tier...
    zh: Rename tier...（层级改名）
  what:
    en: Changes the name of the selected tier, which is what appears on the tier button and in the exported
      annotation.
    zh: 改变作用中的那一层的名称，这个名称会显示在层级按钮上，也会出现在汇出的标注档里。
  how:
    en: Tier → Rename tier..., type the new name and press Enter.
    zh: Tier → Rename tier...，输入新名称后按 Enter。
  pitfalls:
  - en: Renaming a tier does not change its content; adding a tier and renaming it are two different operations.
    zh: 改层级名不会改到内容；新增一层与给层改名是两件不同的事。
  keywords:
  - rename tier
  - 层级改名
  - tier
  - 层级
  - 命名
  - name
  - textgrid
- id: duplicate-tier
  aliases:
  - Duplicate tier...
  control_types:
  - MenuItemControl
  title:
    en: Duplicate tier...
    zh: Duplicate tier...（复制层级）
  what:
    en: Copies the selected tier, with its labels, into a new tier of the same type.
    zh: 把作用中的那一层连同标签复制成一个新的同类型层级。
  how:
    en: Tier → Duplicate tier..., then name the copy. It is the fast way to start a second transcription
      of the same token.
    zh: Tier → Duplicate tier...，再给副本命名。这是开始做第二份转写的快捷方式。
  concept:
    en: Two independent transcriptions of the same token are how you measure inter-annotator agreement
      without a second transcriber in the room.
    zh: 同一语流的两份独立转写，是在自己房间里就能量测标注者一致性的方法。
  pitfalls:
  - en: The copy keeps the original labels, so remember to clear them before re-transcribing.
    zh: 副本会保留原来的标签，重新转写前记得先清空。
  keywords:
  - duplicate tier
  - 复制层级
  - tier
  - 层级
  - 转写
  - transcription
  - 一致性
- id: remove-entire-tier
  aliases:
  - Remove entire tier
  control_types:
  - MenuItemControl
  title:
    en: Remove entire tier
    zh: Remove entire tier（移除整层）
  what:
    en: Deletes the selected tier and all its labels from the TextGrid.
    zh: 把作用中的那一层连同全部标签从 TextGrid 里删掉。
  how:
    en: Tier → Remove entire tier. Make sure the tier you want to keep is the active one before you press
      it.
    zh: Tier → Remove entire tier。按之前先确认要保留的那一层才是作用中的层。
  pitfalls:
  - en: There is no undo for removing a tier, so export the TextGrid first if the work matters.
    zh: 移除层级没有撤销，工作重要的话先汇出 TextGrid。
  - en: Removing the only tier leaves a TextGrid you cannot type into.
    zh: 把唯一的一层删掉，会得到一个没法输入的 TextGrid。
  keywords:
  - remove entire tier
  - 移除层级
  - 删除
  - tier
  - 层级
  - 标签
  - labels
- id: remove-text-from-tier
  aliases:
  - Remove all text from tier
  control_types:
  - MenuItemControl
  title:
    en: Remove all text from tier
    zh: Remove all text from tier（清空层级文字）
  what:
    en: Deletes every label in the selected tier but keeps the tier and its boundaries.
    zh: 把作用中的那一层的所有标签清空，但层级与边界都保留。
  how:
    en: Tier → Remove all text from tier. It is the right tool when you want to re-transcribe a tier without
      redoing the segmentation.
    zh: Tier → Remove all text from tier。想重新转写某一层但不想重做切分时，这是对的工具。
  pitfalls:
  - en: This deletes the labels but keeps the boundaries, which is exactly the difference from Remove
      entire tier.
    zh: 它删掉标签但保留边界，这正是与 Remove entire tier 的差别。
  keywords:
  - remove all text from tier
  - 清空
  - 标签
  - 层级
  - tier
  - 重转写
  - transcribe
- id: select-next-tier
  aliases:
  - Select next tier
  - Select previous tier
  control_types:
  - MenuItemControl
  title:
    en: Select next tier / Select previous tier
    zh: Select next tier / Select previous tier（切换作用层）
  what:
    en: Moves the active tier up or down, so your typing, your boundaries and your deletions all apply
      to a different tier.
    zh: 把作用中的层往上或往下移一层，让你打的标签、插的边界与删的内容换到另一层去。
  how:
    en: TextGrid → Select next tier (Alt+Down) and Select previous tier (Alt+Up), or click the tier button
      in the toolbar.
    zh: TextGrid → Select next tier（Alt+Down）与 Select previous tier（Alt+Up），也可以直接点工具列上的层级按钮。
  pitfalls:
  - en: If you type a label and it appears in the wrong tier, you changed the active tier and forgot about
      it.
    zh: 标签打进了错的层，多半是你切换了作用层却忘了。
  keywords:
  - select next tier
  - 切换层级
  - active tier
  - 作用层
  - alt
  - 上下层
- id: check-spelling-in-tier
  aliases:
  - Check spelling in tier
  - Check spelling in interval
  control_types:
  - MenuItemControl
  title:
    en: Check spelling in tier
    zh: Check spelling in tier（检查层级拼写）
  what:
    en: Walks through the words in the tier and reports the ones that are not in the lexicon.
    zh: 逐个检查该层里的字词，并指出词库里没有的那些。
  how:
    en: Spell → Check spelling in tier (Ctrl-Alt-L) or Spell → Check spelling in interval, then follow
      the corrections it offers.
    zh: Spell → Check spelling in tier（Ctrl-Alt-L）或 Spell → Check spelling in interval，然后跟着它给的修正做。
  pitfalls:
  - en: The spell checker works on words, so use it on a word tier and never on a tier of IPA.
    zh: 拼写检查是针对单词的，只用在词层上，绝不要用在 IPA 层。
  keywords:
  - check spelling
  - 拼写检查
  - 词库
  - lexicon
  - tier
  - 层级
  - 纠错
- id: textgrid-settings
  aliases:
  - TextGrid settings...
  - TextGrid preferences...
  control_types:
  - MenuItemControl
  title:
    en: TextGrid settings...
    zh: TextGrid settings...（TextGrid 设定）
  what:
    en: Opens the preferences for the TextGrid editor, such as the font used for the labels and the tier
      display.
    zh: 打开 TextGrid 编辑窗口的偏好设定，例如标签所用字型与层级的显示方式。
  how:
    en: TextGrid → TextGrid settings...; the settings are remembered across sessions, like all Praat preferences.
    zh: TextGrid → TextGrid settings...；和其他 Praat 偏好一样，这些设定会保留到下次开启动程式。
  pitfalls:
  - en: A font that lacks the IPA symbols makes every label look wrong even though the text is correct.
    zh: 字型缺了 IPA 符号时，即使文字正确，每个标签看起来都不对。
  keywords:
  - textgrid settings
  - 设定
  - preferences
  - 字型
  - font
  - ipa
  - 显示
- id: phonetic-symbols
  aliases:
  - Phonetic symbols
  - About special symbols
  control_types:
  - MenuItemControl
  title:
    en: Phonetic symbols / About special symbols
    zh: Phonetic symbols / About special symbols（音标与特殊符号）
  what:
    en: Opens Praat's tables of IPA characters and of the special symbols that can be written as escape
      sequences.
    zh: 打开 Praat 的 IPA 字符表，以及可用 escape 序列书写的特殊符号表。
  how:
    en: Help → Phonetic symbols shows the IPA keyboard layout to follow, and Help → About special symbols
      lists the backslash trigraphs.
    zh: Help → Phonetic symbols 给出 IPA 键盘对照表，Help → About special symbols 列出反斜线三元序列。
  concept:
    en: Praat can store any Unicode character in a label; the escape form exists for fonts and for file
      formats that cannot represent them.
    zh: Praat 的标签可以储存任何 Unicode 字符；escape 写法的存在，是为了兼顾字型与无法表示这些字符的档案格式。
  pitfalls:
  - en: A symbol you cannot type on your keyboard can still be pasted from this table.
    zh: 键盘上打不出来的符号，可以直接从这里复制粘贴。
  keywords:
  - phonetic symbols
  - 音标
  - ipa
  - 特殊符号
  - special symbols
  - 字符表
  - help
- id: canvas-drawing-area
  aliases:
  - drawingArea
  - PraatDrawingArea1 Praat
  control_types:
  - PaneControl
  title:
    en: The drawing area
    zh: 绘图区
  what:
    en: 'The part of a Praat window where the sound itself is drawn: the waveform, the spectrogram, the
      pitch track, the formant lines. Praat draws it by itself, so no other control is inside it.'
    zh: Praat 窗口里真正画声音的那一块：波形、频谱图、基频轨迹、共振峰线。Praat 自己绘制，所以里面不会再有别的控件。
  how:
    en: Click inside it to move the time cursor; drag to select a time range. The buttons below the drawing
      area (all / in / out / sel / bak) decide what the other windows show.
    zh: 在里面点击可移动时间游标，拖曳可选取一段时间范围。绘图区下方的按钮（all / in / out / sel / bak）决定其他窗口显示哪一段。
  concept:
    en: Every view is a different representation of the same time axis. The waveform shows amplitude over
      time, the spectrogram shows energy per frequency over time, the pitch track shows the dominant frequency
      over time.
    zh: 这些视图是同一条时间轴的不同表示：波形看时间上的振幅，频谱图看时间上各频率的能量，基频轨迹看时间上的主导频率。
  pitfalls:
  - en: The window that is drawn is chosen with the buttons under the drawing area, not with the menu
      above it.
    zh: 下方绘图区显示哪一个视图，是由绘图区下面的按钮决定的，不是上方菜单决定的。
  - en: Praat keeps drawing the canvas even when it is covered by another window; a screenshot of a hidden
      canvas shows the window in front of it.
    zh: 即使被别的窗口遮住，Praat 仍然在画这个绘图区；截取被遮住的绘图区会截到挡在它前面的窗口。
  keywords:
  - drawing area
  - canvas
  - drawingArea
  - 绘图区
  - 画布
  - waveform
  - spectrogram
  - 波形
  - 频谱
- id: canvas-spectrogram
  aliases:
  - 'canvas kind: spectrogram'
  control_types: []
  title:
    en: A spectrogram view
    zh: 频谱图视图
  what:
    en: 'A picture of the sound in the time-frequency plane: horizontal is time, vertical is frequency,
      and the brightness is the energy at that moment and frequency.'
    zh: 声音在时间-频率平面上的样子：横轴是时间，纵轴是频率，亮度代表该时刻该频率上的能量。
  how:
    en: 'To make one: select the Sound, then Analyse → Spectrogram → Show spectrogram. Pick the window
      length before you do, because it decides how wide the bands are.'
    zh: 产生方式：先选中 Sound，再选 Analyse → Spectrogram → Show spectrogram。窗长要在做之前先决定，它决定频带有多宽。
  concept:
    en: A window of length 0.005 s gives you the frequency resolution; a window of 0.05 s gives you the
      time resolution. You cannot have both, and this trade-off is the single most important knob in Praat's
      analysis.
    zh: 0.005 秒的窗给你频率分辨率，0.05 秒的窗给你时间分辨率。两者不可兼得，这个取舍是 Praat 分析里最重要的一个旋钮。
  pitfalls:
  - en: A long window smears the formants into one blob, and students then conclude that the vowel has
      no formants.
    zh: 窗长过大会把共振峰糊成一团，学生于是以为这个元音没有共振峰。
  - en: A short window makes the picture look noisy; that is the time-frequency trade-off, not a broken
      analysis.
    zh: 窗长过小会让图看起来很吵；这是时间频率取舍的结果，不是分析出错。
  keywords:
  - spectrogram
  - 频谱
  - 频谱图
  - window length
  - 窗长
  - time-frequency
- id: canvas-waveform
  aliases:
  - 'canvas kind: waveform'
  control_types: []
  title:
    en: A waveform view
    zh: 波形视图
  what:
    en: 'The sound drawn as amplitude against time: the height of the shape is the instantaneous pressure,
      the spacing of the peaks is the period of the vibration.'
    zh: 声音画成时间-振幅：形状的高度是瞬时压力，波峰之间的间距是振动的周期。
  how:
    en: The Sound editor always shows the waveform on top. Select a range with the mouse, or use Time
      → Selection to type the numbers.
    zh: Sound 编辑器上方永远显示波形。用鼠标拖选一段，或用 Time → Selection 直接输入数字。
  concept:
    en: 'The waveform is what a microphone records: pressure over time. Everything Praat analyses is computed
      from it, so a clipped or noisy recording limits every later step.'
    zh: 波形就是麦克风录到的东西：随时间变化的压力。Praat 之后算的一切都从它出发，所以录坏了或爆音了，后面每一步都会受影响。
  pitfalls:
  - en: A waveform that touches the top or the bottom of the box is clipped, and the analysis of a clipped
      sound is meaningless.
    zh: 波形顶到或触到方框上下缘就是失真（clipping），失真声音的分析结果没有意义。
  - en: In the Sound editor the vertical scale changes when you zoom, so the height of the wave says nothing
      about the loudness unless the scale is visible.
    zh: Sound 编辑器里放大时纵轴会变，所以不看清标尺就不能用波形高度判断响度。
  keywords:
  - waveform
  - 波形
  - amplitude
  - 振幅
  - clipping
  - 失真
- id: canvas-pitch
  aliases:
  - 'canvas kind: pitch'
  control_types: []
  title:
    en: A pitch track
    zh: 基频轨迹视图
  what:
    en: The dominant frequency of the sound over time, drawn as a line or as dots. Where the line is missing,
      Praat found no periodic voice.
    zh: 声音随时间变化的主导频率，画成一条线或一串点。线断掉的地方表示 Praat 没找到周期性的浊音。
  how:
    en: Make it with Analyse → Pitch → Show pitch, and set the pitch range first (for adult speech 75-600
      Hz is a common choice).
    zh: 用 Analyse → Pitch → Show pitch 产生，并且先设好基频范围（成人语音常用 75-600 Hz）。
  concept:
    en: 'Pitch is perceived logarithmically: doubling the frequency raises the note by an octave, not
      by the same amount. A semitone is about 6 % of frequency.'
    zh: 音高是按对数感知的：频率翻倍是升一个八度，而不是升同样多。一个半音大约是频率的 6 %。
  pitfalls:
  - en: The pitch range must contain the voice, or the track is empty and students think the sound has
      no pitch at all.
    zh: 基频范围没框住这个声音时轨迹会全空，学生会以为声音完全没有基频。
  - en: Unvoiced sounds (fricatives, stops) have no pitch, and the gaps in the track are correct, not
      an error.
    zh: 清音（擦音、塞音）本来就没有基频，轨迹上的空缺是正确的，不是出错。
  keywords:
  - pitch
  - 基频
  - f0
  - pitch track
  - 基频轨迹
  - semitone
  - 半音
- id: canvas-formants
  aliases:
  - 'canvas kind: formants'
  control_types: []
  title:
    en: A formant view
    zh: 共振峰视图
  what:
    en: The resonance frequencies of the vocal tract over time, drawn as curves. A vowel's identity is
      mostly the pattern of these curves.
    zh: 声道共振频率随时间的变化，画成几条曲线。元音的音色主要就靠这几条曲线的格局。
  how:
    en: Make it with Analyse → Formants → Show formants. The maximum number of formants must be set before
      you do, and it has to be larger than the number of resonances you care about.
    zh: 用 Analyse → Formants → Show formants 产生。做之前要先设最大共振峰数，而且要比你关心的共振数还多。
  concept:
    en: 'Formants are the resonances of the vocal tract: they are determined by the shape of the tube,
      not by the pitch of the voice.'
    zh: 共振峰是声道的共振：由管道的形状决定，与嗓音的基频无关。
  pitfalls:
  - en: A formant that is close to another one cannot be separated, and the curves merge. That is physics,
      not a bug.
    zh: 两个共振峰靠得太近时无法分开，曲线会并在一起，这是物理规律而不是 bug。
  - en: Too few formants and the highest one is simply not shown; students then 'discover' that a vowel
      has two formants.
    zh: 最大共振峰数设太少时，最高的那个根本不会画出来，学生于是「发现」某元音只有两个共振峰。
  keywords:
  - formant
  - 共振峰
  - vocal tract
  - 声道
  - vowel
  - 元音
- id: canvas-intensity
  aliases:
  - 'canvas kind: intensity'
  control_types: []
  title:
    en: An intensity view
    zh: 强度视图
  what:
    en: The smoothed energy of the sound over time, in dB. It follows the envelope of the waveform.
    zh: 声音随时间变化的平滑能量，单位是 dB，走的是波形的包络。
  how:
    en: Make it with Analyse → Intensity → Show intensity, or Analyse → To Intensity... to get an Intensity
      object you can measure.
    zh: 用 Analyse → Intensity → Show intensity 产生；用 Analyse → To Intensity... 可以得到可测量的 Intensity 物件。
  concept:
    en: 'Intensity is an energy measure, so it is sensitive to the recording level: a microphone turned
      down gives a quiet curve everywhere.'
    zh: 强度是能量度量，所以对录音电平很敏感：麦克风调小了，整条曲线都会偏低。
  pitfalls:
  - en: Comparing two speakers with different recording levels tells you about the microphone, not about
      the voice.
    zh: 拿不同录音电平的两位说话人比较，得到的是麦克风的信息，不是嗓音的信息。
  keywords:
  - intensity
  - 强度
  - energy
  - 能量
  - dB
  - envelope
  - 包络
- id: ow-dynamic-row
  aliases: []
  control_types:
  - ButtonControl
  title:
    en: The selection-dependent button row
    zh: 随选中物件变化的按钮列
  what:
    en: 'The row of buttons under the Objects list is not fixed: Praat rebuilds it from the type of the
      selected object, so the same slot offers different commands for a Sound, a TextGrid or a Pitch.'
    zh: Objects 清单下方那一列按钮不是固定的：Praat 会根据选中物件的类型重新排它，同一个位置对 Sound、TextGrid、Pitch 给的是不同指令。
  how:
    en: Select something in the list and the row appears; select nothing and it disappears. Nine of its
      entries are cascade buttons that open a menu, while To Intensity... is a plain button that opens
      a dialog.
    zh: 在清单里选中东西，这一列就出现，没有选中就整列消失。其中九个是会展开菜单的层叠按钮，只有 To Intensity... 是按下就开对话框的按钮。
  concept:
    en: 'The row is Praat''s dynamic menu: every button asks the selected object what can be done with
      it, which is why one button can be a menu for one type and a dialog for another.'
    zh: 这一列就是 Praat 的动态菜单：每个按钮都在问「这个物件能做什么」，所以同一个按钮对一种类型是菜单，对另一种类型是对话框。
  pitfalls:
  - en: 'Nothing selected means no buttons: students often report that the panel is broken when it is
      only waiting for a selection.'
    zh: 没选中就没有按钮，不少学生会以为面板坏了，其实它只是在等你选东西。
  - en: The buttons change with the selection, so a click that worked for a Sound may be a different command
      for a TextGrid.
    zh: 按钮会跟着选中物件变，对 Sound 有效的一次点击，对 TextGrid 可能是另一条指令。
  keywords:
  - dynamic menu
  - 动态菜单
  - 按钮列
  - 动态按钮
  - button row
  - 选中最重要
- id: ow-query-get-value-at-time
  aliases:
  - Get value at time...
  control_types:
  - MenuItemControl
  title:
    en: Get value at time...
    zh: Get value at time...（取某时刻的振幅）
  what:
    en: A Query command that reports the amplitude of a Sound at a given time, interpolated between the
      two nearest samples.
    zh: Query 菜单里的指令，报告 Sound 在指定时刻的振幅，数值在前后两个样本之间内插。
  how:
    en: Select the Sound, open Query and choose Get value at time..., type the time in seconds; the number
      appears in the Info window.
    zh: 选中 Sound，打开 Query 选 Get value at time...，输入秒数，数值会出现在 Info 窗口里。
  concept:
    en: A Sound is a sampled signal, so a value at time is really a value at sample index t divided by
      the sampling period; Praat reconstructs a smooth value with sinc interpolation by default.
    zh: Sound 是取样讯号，所以「某时刻的数值」其实就是取样编号（时间除以取样周期）处的数值；Praat 预设用 sinc 内插还原出平滑的数值。
  pitfalls:
  - en: The time is in seconds from the start of the object, not a sample number and not a frame number.
    zh: 这里的時間是物件起算的秒数，不是取样编号，也不是帧编号。
  - en: If the time lies outside the samples of the sound, the result is the value of the nearest sample
      rather than an interpolated one.
    zh: 如果時間落在声音样本范围之外，结果是最近那个样本的数值，而不是内插出来的。
  keywords:
  - get value at time
  - 取值
  - 振幅
  - amplitude
  - query
  - 查询
  - 秒
- id: ow-query-get-mean
  aliases:
  - Get mean...
  control_types:
  - MenuItemControl
  title:
    en: Get mean...
    zh: Get mean...（平均值）
  what:
    en: 'A Query command that reports the average of the selected object over a chosen time range: the
      mean amplitude of a Sound, or the mean of a curve such as a Pitch track.'
    zh: Query 菜单里的指令，报告选中物件在指定时间范围内的平均值：Sound 是平均振幅，曲线物件如基频轨迹则是曲线的平均值。
  how:
    en: Select the object, open Query and choose Get mean..., set the time range in seconds and read the
      answer in the Info window.
    zh: 选中物件，打开 Query 选 Get mean...，设定时间范围（秒），答案在 Info 窗口里。
  concept:
    en: The mean amplitude of a voiced sound is close to zero, because the waveform oscillates around
      zero; a mean far from zero points to a DC offset or a recording fault, not to loudness.
    zh: 有声声音的平均振幅接近零，因为波形是绕着零上下振荡的；平均值离零很远，通常反映直流偏移或录音问题，而不是响度。
  pitfalls:
  - en: A mean over the whole sound is dominated by the loudest part; give the range you are actually
      interested in.
    zh: 整段声音的平均会被最响的部分带跑，要给你真正关心的那个时间范围。
  - en: A mean near zero does not mean the sound is silent; for amplitude use Get root-mean-square...
      instead.
    zh: 平均接近零不代表没声音，要看振幅请用 Get root-mean-square...。
  keywords:
  - get mean
  - 平均
  - 均值
  - mean
  - amplitude
  - 振幅
  - query
- id: ow-query-get-energy
  aliases:
  - Get energy...
  control_types:
  - MenuItemControl
  title:
    en: Get energy...
    zh: Get energy...（能量）
  what:
    en: A Query command that reports the energy of the selected Sound over a time range, that is the sum
      of the squared sample values.
    zh: Query 菜单里的指令，报告选中 Sound 在一段时间内的能量，也就是样本值的平方和。
  how:
    en: Select the Sound, open Query and choose Get energy..., set the range in seconds, and read the
      number in the Info window.
    zh: 选中 Sound，打开 Query 选 Get energy...，设定时间范围（秒），数字在 Info 窗口里。
  concept:
    en: 'Energy is the raw quantity behind loudness measures: it grows with the square of the amplitude,
      so doubling the amplitude quadruples the energy. The intensity contour in Praat is a smoothed, relative
      version of the same idea.'
    zh: 能量是响度量背后的原始量，它随振幅的平方增长，振幅加倍能量就变四倍。Praat 的强度曲线是同一个想法经过平滑与相对化之后的版本。
  pitfalls:
  - en: The absolute number depends on the units of the samples; compare two sounds only when they were
      recorded and stored in the same way.
    zh: 绝对数值取决于样本单位，只有录音与储存方式相同的两个声音才适合直接比较。
  keywords:
  - get energy
  - 能量
  - energy
  - 强度
  - query
  - 查询
- id: ow-query-get-rms
  aliases:
  - Get root-mean-square...
  control_types:
  - MenuItemControl
  title:
    en: Get root-mean-square...
    zh: Get root-mean-square...（均方根）
  what:
    en: A Query command that reports the root-mean-square amplitude of a Sound over a time range, the
      standard way to state how large a signal is.
    zh: Query 菜单里的指令，报告 Sound 在一段时间内的均方根振幅，这是说明讯号大小最常用的方式。
  how:
    en: Select the Sound, open Query and choose Get root-mean-square..., set the range, and compare the
      answer across tokens or speakers.
    zh: 选中 Sound，打开 Query 选 Get root-mean-square...，设定范围，就可以拿这个数字在语流或说话者之间比较。
  concept:
    en: RMS is the square root of the mean of the squared samples, so it grows linearly with amplitude
      while energy grows quadratically. It is the amplitude measure that appears in the definition of
      sound pressure level.
    zh: 均方根是平方样本平均值的平方根，所以振幅加倍时它加倍，能量却是四倍。声压级的定义用的就是这一种振幅量。
  pitfalls:
  - en: 'RMS hides the peak: a short click can have a low RMS but a very high peak value.'
    zh: 均方根会藏住峰值：短短一声爆音可以均方根很低，峰值却很高。
  keywords:
  - rms
  - root-mean-square
  - 均方根
  - 振幅
  - loudness
  - 响度
  - query
- id: ow-harmonicity-ac
  aliases:
  - To Harmonicity (ac)...
  control_types:
  - MenuItemControl
  title:
    en: To Harmonicity (ac)...
    zh: To Harmonicity (ac)...（自相关谐振度）
  what:
    en: Computes a Harmonicity object from the selected Sound with the autocorrelation method, giving
      the harmonic-to-noise ratio of each frame in dB.
    zh: 用自相关法从选中的 Sound 算出 Harmonicity 物件，逐格给出以 dB 表示的谐波与噪声比。
  how:
    en: Select the Sound, open Analyse periodicity and choose To Harmonicity (ac)...; Praat asks for the
      pitch range and the time step, and adds a Harmonicity object to the list.
    zh: 选中 Sound，打开 Analyse periodicity 选 To Harmonicity (ac)...，Praat 会问基频范围与时间步长，然后在清单里加上一个 Harmonicity
      物件。
  concept:
    en: Harmonicity, often written HNR, falls sharply at the onset of voicing, and that dip is expected.
      It is a quick way to separate voiced from unvoiced material.
    zh: 谐振度常写作 HNR，它在有声起点会陡降，那个凹陷是预期现象。它是快速区分有声与清音的好工具。
  pitfalls:
  - en: In silence the harmonicity is undefined; Praat marks those frames as undefined rather than giving
      a number of zero.
    zh: 静音段的谐振度其实是未定义的，Praat 会把那些格标成未定义，而不是给一个零。
  keywords:
  - harmonicity
  - 谐振度
  - hnr
  - 自相关
  - autocorrelation
  - 清浊
  - voicing
- id: ow-filter-stop-band
  aliases:
  - Filter (stop Hann band)...
  control_types:
  - MenuItemControl
  title:
    en: Filter (stop Hann band)...
    zh: Filter (stop Hann band)...（滤掉频带）
  what:
    en: Removes a band of frequencies from the selected Sound with a smooth Hann-shaped filter and leaves
      the rest of the spectrum in place.
    zh: 用平滑的 Hann 形滤波器把选中 Sound 的一段频率去掉，其余频谱保留不动。
  how:
    en: Select the Sound, open Filter and choose Filter (stop Hann band)...; type the low and high edge
      of the band you want to delete, and a new Sound object appears in the list.
    zh: 选中 Sound，打开 Filter 选 Filter (stop Hann band)...，填上要去掉的那一段频率的下限与上限，清单里会出现一个新的 Sound 物件。
  concept:
    en: The Hann window gives a gentle roll-off, so the edges of the removed band are blurred rather than
      cut off, which avoids the ringing you would hear from a brick-wall filter.
    zh: Hann 窗的边缘是渐渐斜下去的，所以被去掉频带的边缘是模糊而不是一刀切掉，也避免了砖墙式滤波器带来的振铃。
  pitfalls:
  - en: Removing a band changes the timbre of the sound; use it to probe what a region contributes, not
      to clean up a recording for publication.
    zh: 去掉一段频率会改变音色，它适合用来检验某段频率的贡献，不是用来把录音修好发表。
  keywords:
  - filter
  - 滤波
  - stop band
  - 频带
  - hann
  - 去除频带
- id: ow-filter-pre-emphasis
  aliases:
  - Filter (pre-emphasis)...
  control_types:
  - MenuItemControl
  title:
    en: Filter (pre-emphasis)...
    zh: Filter (pre-emphasis)...（预加重）
  what:
    en: Applies a first-order pre-emphasis filter to the selected Sound, boosting the high frequencies
      relative to the low ones.
    zh: 对选中的 Sound 做一阶预加重滤波，把高频相对低频抬高。
  how:
    en: Select the Sound, open Filter and choose Filter (pre-emphasis)...; the result is a new Sound object
      with a tilted spectrum.
    zh: 选中 Sound，打开 Filter 选 Filter (pre-emphasis)...，结果是一个频谱被倾斜的新 Sound 物件。
  concept:
    en: Pre-emphasis is the inverse of the glottal source tilt, so it flattens the spectrum before LPC
      analysis and lets the LPC coefficients model the vocal tract rather than the source.
    zh: 预加重正好抵消声门源的频谱倾斜，让频谱变平，这样 LPC 系数据来描述声道，而不是描述声源。
  pitfalls:
  - en: Never measure formants on a pre-emphasised copy; the tilt has already moved the peaks.
    zh: 绝不要在预加重过的副本上量共振峰，倾斜已经把峰位挪走了。
  - en: Pre-emphasis also lifts high-frequency noise, so it is a poor choice for fricative consonants.
    zh: 预加重也会把高频杂音一起拉高，用在擦音上并不合适。
  keywords:
  - filter
  - 滤波
  - pre-emphasis
  - 预加重
  - 倾斜
  - lpc
- id: ow-combine-cross-correlate
  aliases:
  - Cross-correlate...
  control_types:
  - MenuItemControl
  title:
    en: Cross-correlate...
    zh: Cross-correlate...（互相关）
  what:
    en: 'Cross-correlates two selected Sounds: the result is a new Sound object whose shape is the correlation
      function, so its peak marks the time lag at which the two sounds match best.'
    zh: 把选中的两个 Sound 做互相关：结果是一个新的 Sound 物件，形状就是相关函数，它的峰指出两个声音最吻合的时间延迟。
  how:
    en: Select the two Sounds (Ctrl+click), open Combine and choose Cross-correlate...; Praat asks how
      to scale the result and adds a new Sound to the list. Open that Sound and look for its peak.
    zh: 用 Ctrl 选两个 Sound，打开 Combine 选 Cross-correlate...，Praat 会问结果要如何缩放，然后在清单里加上一个新的 Sound，打开它找峰。
  concept:
    en: Cross-correlation measures similarity as a function of lag. A peak at a negative lag means the
      second sound starts later than the first by that amount, which is how alignment is measured.
    zh: 互相关衡量的是相似度随延迟的变化，峰出现在负延迟，表示第二个声音比第一个晚这么多开始，这正是对齐音流的量法。
  pitfalls:
  - en: 'The result is a Sound, not a number: the lag has to be read off the peak of that new object.'
    zh: 结果是物件而不是数字，延迟要从那个新物件的峰上读出来。
  - en: 'The order of the two sounds matters, because cross-correlation is not commutative: swapping them
      reverses the result.'
    zh: 两个声音的先后顺序会影响结果，因为互相关不可交换，对调之后结果会左右翻转。
  keywords:
  - cross-correlate
  - 互相关
  - correlation
  - 相关
  - 延迟
  - lag
  - 对齐
- id: ow-combine-autocorrelate
  aliases:
  - Autocorrelate...
  control_types:
  - MenuItemControl
  title:
    en: Autocorrelate...
    zh: Autocorrelate...（自相关）
  what:
    en: 'Autocorrelates a selected Sound with itself: the result is a new Sound object that is the autocorrelation
      function, whose peaks fall on the multiples of the pitch period.'
    zh: 把选中的 Sound 跟自己做自相关：结果是一个新的 Sound 物件，也就是自相关函数，它的峰正好落在基频周期的整数倍上。
  how:
    en: Select one Sound and choose Autocorrelate... from the dynamic menus; Praat asks how to scale the
      result and adds the new Sound to the list. Open it and find the first peak.
    zh: 选中一个 Sound，在动态按钮的菜单里选 Autocorrelate...，Praat 会问结果要如何缩放，然后把新的 Sound 加进清单，打开它找第一个峰。
  concept:
    en: The distance between the peaks of the autocorrelation function is the base period, and its reciprocal
      is F0. This is the same idea the pitch tracker uses, and the function is symmetric around zero lag.
    zh: 自相关函数峰与峰之间的距离就是基周期，倒数就是 F0，这正是基频追踪器用的同一个想法，而且这个函数在零延迟左右是对称的。
  pitfalls:
  - en: 'The result is a Sound, not a number: the period has to be read off the peak of that new object.'
    zh: 结果是物件而不是数字，周期要从那个新物件的峰上读出来。
  - en: This command has moved between menus across Praat versions; in recent versions it sits with the
      periodicity commands, in older ones it was under Combine.
    zh: 这条指令在不同版本里换过位置：新版与周期分析指令放在一起，旧版则在 Combine 底下。
  keywords:
  - autocorrelate
  - 自相关
  - autocorrelation
  - 基频
  - 周期
  - period
- id: workflow-new-praat-script
  aliases:
  - New Praat script
  title:
    en: Writing a Praat script
    zh: 写 Praat 脚本
  what:
    en: A script is a text file of Praat commands that runs by itself, so a sequence you do by hand every
      time can be done in one go.
    zh: 脚本是一个由 Praat 指令组成的文字档，可以自己跑，让你每次手动做的一串动作一次完成。
  how:
    en: Choose Praat → New Praat script to open the script editor, type the commands, and press Run in
      the Run menu. Use File → Save to store it as a .praat file; the file name then appears in the window
      title, and the script can be reopened with Open Praat script....
    zh: 选 Praat → New Praat script 打开脚本编辑窗口，输入指令后在 Run 菜单按 Run 执行。用 File → Save 存成 .praat 档，档名会出现在窗口标题上，之后可用
      Open Praat script... 再打开。
  concept:
    en: A script is a list of menu commands and action commands executed in order, so it reproduces exactly
      the clicks you would have made, including the mistakes.
    zh: 脚本是一串依序执行的菜单指令与动作指令，所以它重现的正是你手动会做的点击，连出错的地方都一样。
  pitfalls:
  - en: Dynamic commands such as Play only work when the right object is selected; otherwise Praat says
      the command is not available for the current selection.
    zh: 像 Play 这样的动态指令只有在选对物件时才可用，否则 Praat 会说这条指令对目前的选取不可用。
  - en: A script has no undo history, so test it on a copy of the sound before you let it loose on your
      data.
    zh: 脚本没有撤销纪录，所以先在声音副本上试过，再拿去处理正式资料。
  - en: 'A script records the commands you typed, not the data: a wrong file path is not recorded and
      will fail again on the next run.'
    zh: 脚本记的是你打下的指令，不是资料：错误的档案路径不会被记下来，下次执行还会再错一次。
  - en: Keep the script as plain text; if your editor saves it with a different extension, Open Praat
      script... will not list it.
    zh: 脚本要保持纯文字，如果编辑器用别的副档名存档，Open Praat script... 就不会把它列出来。
  keywords:
  - script
  - 脚本
  - praat script
  - run
  - 执行
  - 编辑器
  - editor
  - 自动化
  - automation
  - .praat
- id: praat-menu-goodies
  aliases:
  - Goodies
  control_types:
  - MenuItemControl
  title:
    en: Goodies
    zh: Goodies（小工具）
  what:
    en: 'A submenu of the Praat menu with a few small utilities: Calculator..., Report difference of two
      proportions..., Save Demo window as PDF file... and Stop playing sound.'
    zh: Praat 菜单下的一个子菜单，放着几个小工具：Calculator...、Report difference of two proportions...、Save Demo window
      as PDF file... 以及 Stop playing sound。
  how:
    en: Praat → Goodies → Calculator... (Ctrl-U) evaluates a formula and shows the result; Stop playing
      sound (Esc) silences a sound that is still playing.
    zh: Praat → Goodies → Calculator...（Ctrl-U）可以算式子并显示结果；Stop playing sound（Esc）可让还在播放的声音立刻停下。
  concept:
    en: The calculator uses the same formula language as the rest of Praat, so it is the quickest place
      to test a formula before you put it into a script.
    zh: 计算机用的是 Praat 到处都在用的公式语言，所以在把公式写进脚本之前，计算器是最快的测试场所。
  pitfalls:
  - en: 'The menu is called Goodies for a reason: these items are for occasional use, not part of a normal
      analysis.'
    zh: 这个菜单叫 Goodies（杂项）是有原因的：里面的项目是偶尔用的，不是常规分析的一环。
  - en: Stop playing sound only stops the audio; it does not clear the objects in the list.
    zh: Stop playing sound 只是停止发声，不会清掉清单里的物件。
  keywords:
  - goodies
  - 小工具
  - 杂项
  - 计算器
  - calculator
  - 公式
  - formula
  - 统计
  - statistics
- id: praat-menu-settings
  aliases:
  - Settings
  control_types:
  - MenuItemControl
  title:
    en: Settings
    zh: Settings（设定）
  what:
    en: 'A submenu of the Praat menu that opens the settings dialogues: Buttons..., Text reading settings...,
      Text writing settings..., CJK font style settings..., Sound recording settings..., Sound playing
      settings... and LongSound settings....'
    zh: Praat 菜单下的一个子菜单，打开各个设定对话框：Buttons...、Text reading settings...、Text writing settings...、CJK font
      style settings...、Sound recording settings...、Sound playing settings... 与 LongSound settings....
  how:
    en: Use Sound playing settings... to choose the audio device and the volume, LongSound settings...
      for the buffer length of long sound files, and Text reading settings... to repair garbled characters
      in text files.
    zh: Sound playing settings... 用来选声音装置与音量，LongSound settings... 设定长音档的缓冲长度，Text reading settings...
      用来修好文字档里的乱码。
  concept:
    en: The settings are global, so a change made in one lab session is still in force in the next one;
      a wrong sound device is the usual reason that Praat plays nothing at all.
    zh: 这些设定是全域的，所以在一堂实验课改过的设定，下一堂课仍然有效；最常见的「Praat 完全没声音」原因就是声音装置设错。
  pitfalls:
  - en: Sound playing settings... changes the output device only; it does not make a recording that was
      too quiet louder.
    zh: Sound playing settings... 只改输出装置，不会把录得太轻的录音变大声。
  - en: Changing the text reading settings changes how every file you open is decoded; reset them if a
      file suddenly looks wrong.
    zh: 改文字读取设定会影响之后每个档案的解码方式，档案突然变得怪怪的就把设定改回去。
  keywords:
  - settings
  - 设定
  - 偏好
  - preferences
  - 声音装置
  - sound device
  - 缓冲
  - buffer
  - 字体
  - font
  - 按钮
  - buttons
- id: praat-menu-technical
  aliases:
  - Technical
  control_types:
  - MenuItemControl
  title:
    en: Technical
    zh: Technical（技术性工具）
  what:
    en: 'A submenu of the Praat menu for diagnostics and internal information: Report memory use, Report
      system properties, Report font properties, List readable types of objects, Create C interface...
      and Praat test....'
    zh: Praat 菜单下的一个子菜单，放诊断与内部资讯的工具：Report memory use、Report system properties、Report font properties、List
      readable types of objects、Create C interface... 与 Praat test....
  how:
    en: Praat → Technical → Report memory use tells you how much memory the current objects take; List
      readable types of objects shows which file types this build can read.
    zh: Praat → Technical → Report memory use 告诉你目前的物件占了多少记忆体；List readable types of objects 显示这个版本能读哪些档案类型。
  concept:
    en: These commands report on the program rather than on the linguistics, which makes them the right
      first stop when Praat misbehaves and the wrong stop for a phonetics question.
    zh: 这些指令报告的是程式本身而不是语言学，所以 Praat 行为异常时它们是第一站，语音学问题则不是。
  pitfalls:
  - en: 'Report memory use is a diagnostic, not a limit: Praat does not stop you from building a huge
      object, it only tells you the cost.'
    zh: Report memory use 是诊断而不是上限：Praat 不会阻止你做出巨大的物件，它只是告诉你代价。
  - en: Create C interface... writes files for programmers; it is not a way to export your analysis.
    zh: Create C interface... 是写给程序设计师用的档案，不是汇出分析结果的方式。
  keywords:
  - technical
  - 技术
  - 诊断
  - diagnostic
  - 记忆体
  - memory
  - 物件类型
  - object types
  - 介面
  - interface
- id: praat-menu-quit
  aliases:
  - Quit
  control_types:
  - MenuItemControl
  title:
    en: Quit
    zh: Quit（离开）
  what:
    en: Closes Praat and ends the session. Objects that were never written to a file are lost.
    zh: 关闭 Praat，结束这次工作。从未写成档案的物件会消失。
  how:
    en: 'Praat → Quit (Ctrl-Q). Before you use it, save every object you want to keep: the Save menu writes
      them out one at a time.'
    zh: Praat → Quit（Ctrl-Q）。用之前先把要保留的物件都存盘，Save 菜单要一个一个写出去。
  concept:
    en: Praat keeps its objects in memory, not on disk, so quitting is the one moment when unsaved annotations
      and unsaved measurements are definitely lost.
    zh: Praat 的物件放在记忆体里，不在硬盘上，所以 Quit 那一刻，没有存盘的标注与量测就一定没有了。
  pitfalls:
  - en: Quitting does not ask whether your objects are saved; a TextGrid made in the lab can vanish without
      warning.
    zh: Quit 不会问你物件有没有存盘，实验课上刚做出来的 TextGrid 可能毫无预警地消失。
  - en: 'Saving a TextGrid is a separate step: use Save → Save as text file... before you quit, not afterwards.'
    zh: 存 TextGrid 是另一个步骤，要在离开之前用 Save → Save as text file...，而不是之后。
  keywords:
  - quit
  - 离开
  - 关闭
  - exit
  - 结束
  - 存档
  - save
  - 资料流失
  - data loss
  - ctrl-q
- id: workflow-record-mono-sound
  aliases:
  - Record mono Sound...
  title:
    en: Recording a sound from the microphone (mono)
    zh: 用麦克风录音（单声道）
  what:
    en: Opens the SoundRecorder window, where you record your voice from one microphone channel and then
      copy the recording into Praat as a Sound object.
    zh: 打开 SoundRecorder 录音窗口，从一个麦克风声道录下你的声音，再把录音复制成 Praat 里的 Sound 物件。
  how:
    en: Choose New → Record mono Sound... (Ctrl-R). Pick the input device, press Record, speak, then press
      Stop; when you are satisfied, use the button next to the name field to copy the recording into the
      Objects window, where it appears as a Sound object.
    zh: 选 New → Record mono Sound...（Ctrl-R）。挑好输入装置，按 Record 说话，再按 Stop；满意之后，用名称输入框旁边的按钮把录音复制到 Objects
      窗口，它就会成为一个 Sound 物件。
  concept:
    en: The recording arrives as 16-bit samples at the sampling frequency of the input device, so the
      microphone, not Praat, decides how much of the spectrum is captured.
    zh: 录音进来时是 16-bit 的样本，取样频率由输入装置决定，也就是麦克风决定你记录到多少频谱内容。
  pitfalls:
  - en: On Windows the input device is chosen in the Windows sound settings, not in Praat; if the level
      meter stays flat, Praat is listening to the wrong device.
    zh: 在 Windows 上，输入装置要在 Windows 的声音设定里选，不是在 Praat 里；电平表一直是平的，多半是 Praat 接错装置了。
  - en: The recording buffer is finite (20 megabytes by default), so a long take stops at the buffer limit.
    zh: 录音缓冲是有限的（预设 20 MB），录太长会在缓冲上限处停住。
  - en: If the recording is too long to keep in memory, use the File menu of the SoundRecorder window
      to write it to a sound file on disk instead.
    zh: 录音太长、记忆体放不下时，用 SoundRecorder 窗口的 File 菜单把它写成硬盘上的音档。
  - en: If the microphone input is not set, Praat records silence instead of complaining.
    zh: 如果麦克风输入没有设定，Praat 会静默录到一片空白，而不会报错。
  - en: Record stereo Sound... needs a stereo input; with a mono headset it gives two nearly identical
      channels, not a real stereo pair.
    zh: Record stereo Sound... 需要双声道输入，用单声道耳麦只会得到两个几乎一样的声道，不是真正的立体声。
  keywords:
  - record
  - microphone
  - 录音
  - 麦克风
  - mono
  - 单声道
  - soundrecorder
  - 录音窗口
  - sampling
  - 取样
- id: new-menu-tiers
  aliases:
  - Tiers
  control_types:
  - MenuItemControl
  title:
    en: Tiers (New menu)
    zh: Tiers（New 菜单）
  what:
    en: 'A submenu of the New menu that creates tier-like objects on their own: Create empty PointProcess...,
      Create Poisson process..., Create PitchTier..., Create FormantGrid..., Create IntensityTier...,
      Create DurationTier... and Create AmplitudeTier....'
    zh: New 菜单下的子菜单，单独建立各种层级式物件：Create empty PointProcess...、Create Poisson process...、Create PitchTier...、Create
      FormantGrid...、Create IntensityTier...、Create DurationTier... 与 Create AmplitudeTier....
  how:
    en: New → Tiers → Create PitchTier... gives a curve of pitch values over time that you can draw by
      hand; Create empty PointProcess... gives a list of points with no events.
    zh: New → Tiers → Create PitchTier... 会给你一条可手绘的基频曲线；Create empty PointProcess... 给出的是一个没有任何事件的时间点清单。
  concept:
    en: A tier is a value or an interval attached to a time span. PitchTier, IntensityTier, DurationTier
      and AmplitudeTier are the same idea with different physical quantities attached to it.
    zh: 层级就是把一个数值或一个区间绑在某个时间跨度上。PitchTier、IntensityTier、DurationTier、AmplitudeTier 是同一个观念，只是挂上去的物理量不同。
  pitfalls:
  - en: 'These tiers have no sound behind them, so their times are abstract numbers: build a target with
      them, then resynthesise.'
    zh: 这些层级背后没有声音，时间只是抽象的数字：通常先用它们做出目标，再重合成。
  - en: Create Poisson process... produces random event times, which is a way to practise boundary placement
      rather than a phonetic model.
    zh: Create Poisson process... 产生随机的点事件时间，是练习打点位置的方法，不是语音模型。
  keywords:
  - tiers
  - 层级
  - pitchtier
  - formantgrid
  - intensitytier
  - durationtier
  - amplitude
  - pointprocess
  - 曲线
  - curve
  - 目标
  - target
- id: new-menu-create-corpus
  aliases:
  - Create Corpus...
  control_types:
  - MenuItemControl
  title:
    en: Create Corpus...
    zh: Create Corpus...（建立语料物件）
  what:
    en: 'Creates a Corpus object: a set of recordings together with the annotation that belongs to them,
      kept as one object so that a whole collection can be handled at once.'
    zh: 建立一个 Corpus 物件：把一批录音与对应的标注放在一起当成一个物件，让整份语料可以一次处理。
  how:
    en: New → Create Corpus... asks for the files that make up the corpus and how they are annotated.
      The result is one Corpus object in the list, not a set of separate Sounds.
    zh: New → Create Corpus... 会问语料由哪些档案组成、以及标注放在哪里。结果是清单里的一个 Corpus 物件，而不是一堆分开的 Sound。
  concept:
    en: A corpus bundles speech data with its labels, so a query over the corpus can ask acoustic questions
      across many tokens at once, which is how corpora are used in phonetics and speech technology.
    zh: 语料把语音资料与标签绑在一起，于是可以对整个语料做声学问题的检索，这正是语音学与语音技术使用语料的方式。
  pitfalls:
  - en: Create Corpus... expects annotation that already exists; it does not transcribe your recordings
      for you.
    zh: Create Corpus... 需要已经存在的标注，它不会替你转写录音。
  - en: 'A corpus is a different object from a TextGrid: it holds many tokens, each with its own time
      axis.'
    zh: Corpus 与 TextGrid 是不同的物件，它装着许多语流，每一语流有自己的时间轴。
  keywords:
  - corpus
  - 语料
  - 语料库
  - collection
  - 集合
  - 建立
  - create
  - 标注
  - annotation
- id: new-menu-tables
  aliases:
  - Tables
  control_types:
  - MenuItemControl
  title:
    en: Tables (New menu)
    zh: Tables（New 菜单）
  what:
    en: 'A submenu of the New menu that creates Table objects: Create Table with column names..., Create
      Table without column names..., Create TableOfReal..., Data sets from the literature, and simple
      statistical tables such as Create simple Confusion....'
    zh: New 菜单下的子菜单，建立 Table 物件：Create Table with column names...、Create Table without column names...、Create
      TableOfReal...、Data sets from the literature、Create simple Confusion...、Create simple Covariance...、Create
      simple Correlation... 与 Create empty EditCostsTable....
  how:
    en: New → Tables → Create Table with column names... gives a grid with a header row; Data sets from
      the literature supplies classic measurement tables such as the Peterson and Barney formant table
      for testing.
    zh: New → Tables → Create Table with column names... 给出带表头列名的表格；Data sets from the literature 提供经典量测表，例如
      Peterson 与 Barney 的共振峰表，可用来测试。
  concept:
    en: 'A Table is a rectangular grid of numbers with named columns, the natural shape for a measurement
      table: one row per token, one column per variable.'
    zh: Table 是带列名的数字方格，是量测表最自然的形式：每一列是一个语流，每一行是一个变项。
  pitfalls:
  - en: Create Table without column names... gives numbered columns only, so keep a note of what column
      3 means.
    zh: Create Table without column names... 只给编号栏名，所以要自己记着第 3 栏是什么。
  - en: The literature data sets are old measurements with their own conventions; they are test material,
      not evidence about your own speakers.
    zh: 文献数据集是旧测量，各有自己的约定，它是测试材料，不是关于你自己说话者的证据。
  keywords:
  - table
  - 表格
  - data
  - 数据
  - column
  - 栏
  - literature
  - 文献
  - formant table
  - 共振峰表
  - confusion
  - 混淆
  - correlation
  - 相关
- id: new-menu-stats-generics
  aliases:
  - Stats
  - Generics
  control_types:
  - MenuItemControl
  title:
    en: Stats, Generics (New menu)
    zh: Stats、Generics（New 菜单）
  what:
    en: 'Two submenus of the New menu. Stats holds statistical tools such as Multidimensional scaling;
      Generics creates the generic data structures: Matrix, Photo, Polygon, Strings, Create Permutation...
      and Polynomial.'
    zh: New 菜单下的两个子菜单。Stats 放统计工具，例如 Multidimensional scaling；Generics 建立通用资料结构：Matrix、Photo、Polygon、Strings、Create
      Permutation... 与 Polynomial。
  how:
    en: New → Generics → Matrix creates a grid of numbers from a formula, New → Generics → Strings creates
      a list of text lines; New → Stats → Multidimensional scaling opens the tutorial for placing items
      in a map of similarity.
    zh: New → Generics → Matrix 用公式建立数字方格，New → Generics → Strings 建立文字列清单；New → Stats → Multidimensional
      scaling 是把项目摆到相似度地图上的教学。
  concept:
    en: Multidimensional scaling turns a table of dissimilarities into a map, which is how phonological
      features are often pictured as distances between vowels.
    zh: Multidimensional scaling 把一张不相似度表变成一张地图，语言学音韵特征常这样画成元音之间的距离。
  pitfalls:
  - en: Both submenus build data structures rather than analyse a sound; analysis lives in the dynamic
      buttons of the Objects window.
    zh: 这两个子菜单都是建立资料结构，不是分析声音，分析在 Objects 窗口的动态按钮里。
  - en: Generic objects such as Matrix and Strings carry no time axis, so nothing can be plotted against
      a recording.
    zh: Matrix、Strings 这类通用物件没有时间轴，没法拿来和录音对照作图。
  keywords:
  - stats
  - 统计
  - generics
  - 通用
  - multidimensional scaling
  - mds
  - matrix
  - 矩阵
  - strings
  - 字符串
  - permutation
  - polynomial
  - 多项式
- id: new-menu-synthesis
  aliases:
  - Acoustic synthesis (Klatt)
  - Articulatory synthesis
  - Text-to-speech synthesis
  control_types:
  - MenuItemControl
  title:
    en: The three synthesis menus (New menu)
    zh: 三个合成菜单（New 菜单）
  what:
    en: Three submenus of the New menu that build speech from a model. Acoustic synthesis (Klatt) creates
      a KlattGrid or a KlattGrid from a vowel; Articulatory synthesis creates an articulation, a speaker,
      an artword or a vocal tract; Text-to-speech synthesis creates a SpeechSynthesizer.
    zh: New 菜单下三个用模型造语音的子菜单。Acoustic synthesis (Klatt) 建立 KlattGrid 或由元音得到 KlattGrid；Articulatory synthesis
      建立发音动作、发音人、artword 或声道；Text-to-speech synthesis 建立 SpeechSynthesizer。
  how:
    en: New → Acoustic synthesis (Klatt) → Create KlattGrid... makes a source-filter model with formant
      targets; New → Articulatory synthesis → Create Articulation... starts from vocal tract shape; New
      → Text-to-speech synthesis → Create SpeechSynthesizer... is the full text-to-speech route.
    zh: New → Acoustic synthesis (Klatt) → Create KlattGrid... 会做出带共振峰目标的源滤模型；New → Articulatory synthesis
      → Create Articulation... 从声道形状开始；New → Text-to-speech synthesis → Create SpeechSynthesizer... 则是完整的文字转语音路径。
  concept:
    en: 'Klatt synthesis is a cascade of resonators driven by a glottal source: change a formant target
      and the vowel changes, which is why it is the classic tool for teaching what formants are.'
    zh: Klatt 合成是一串由声门源驱动的共振器，改动共振峰目标元音就跟着变，所以它是教「共振峰是什么」最经典的工具。
  pitfalls:
  - en: Synthesised vowels are artefacts of the model, not recordings, so a formant measured on them is
      only as good as the model.
    zh: 合成的元音是模型的产物而不是录音，在它上面量到的共振峰，好坏只等同于模型的好坏。
  - en: KlattGrid, Articulation and SpeechSynthesizer are different object types; the commands of one
      do not accept the others.
    zh: KlattGrid、Articulation 与 SpeechSynthesizer 是不同的物件类型，一个的指令不能接受另一个。
  keywords:
  - synthesis
  - 合成
  - klatt
  - klattgrid
  - 共振峰
  - formant
  - vocal tract
  - 声道
  - tts
  - 语音合成
  - phone
  - 音素
  - source filter
  - 源滤
- id: new-menu-constraint-grammars
  aliases:
  - Constraint grammars
  control_types:
  - MenuItemControl
  title:
    en: Constraint grammars
    zh: Constraint grammars（约束文法）
  what:
    en: 'A submenu of the New menu that creates Optimality Theory grammars: an OT learning tutorial, Create
      NoCoda grammar, Create place assimilation grammar, Create place assimilation distribution, Create
      tongue-root grammar..., Create metrics grammar... and Create multi-level metrics grammar....'
    zh: New 菜单下的子菜单，建立最优性理论（OT）文法：一个 OT learning 教学、Create NoCoda grammar、Create place assimilation grammar、Create
      place assimilation distribution、Create tongue-root grammar...、Create metrics grammar... 与 Create
      multi-level metrics grammar....
  how:
    en: New → Constraint grammars → Create NoCoda grammar gives a ready-made OT grammar to experiment
      with; the OT learning tutorial explains how the ranked constraints produce the possible outputs.
    zh: New → Constraint grammars → Create NoCoda grammar 直接给你一个可以改的 OT 文法；OT learning 教学说明排序过的限制如何产生可能的输出。
  concept:
    en: 'Optimality Theory models a language as a ranking of constraints: the winner is the candidate
      that violates the highest ranked constraint least, which is a formal way of stating what phonology
      prefers.'
    zh: 最优性理论把语言表述成一套有排序的限制，胜出者是违反最高排序限制最少的那一个，这是把语音学偏好写成形式化的方式。
  pitfalls:
  - en: An OT grammar generates possible forms; it does not tell you which form a speaker actually produced.
    zh: OT 文法生成的是可能的形式，并不告诉你说话人实际说出了哪一个。
  - en: Changing the constraint ranking changes the whole output, so keep the ranking visible when you
      report a result.
    zh: 改动限制排序就会改变整份输出，所以报告结果时要把排序写出来。
  keywords:
  - ot
  - optimality
  - 约束
  - constraint
  - 文法
  - grammar
  - 音系
  - phonology
  - tutorial
  - 教学
  - assimilation
  - 同化
- id: new-menu-neural-networks
  aliases:
  - Symmetric neural networks
  - Feedforward neural networks
  control_types:
  - MenuItemControl
  title:
    en: Symmetric and feedforward neural networks
    zh: 对称式与前馈式神经网络
  what:
    en: 'Two submenus of the New menu that create neural networks. The symmetric kind: Create empty Network...,
      Create rectangular Network..., Create rectangular Network (vertical)... and Create Net as deep belief
      network.... The feedforward kind: Create FFNet..., Create iris example... and Advanced.'
    zh: New 菜单下两个建立神经网络的子菜单。对称式有 Create empty Network...、Create rectangular Network...、Create rectangular
      Network (vertical)... 与 Create Net as deep belief network....；前馈式有 Create FFNet...、Create iris example...
      与 Advanced。
  how:
    en: New → Feedforward neural networks → Create FFNet... builds a network with input and output layers
      that you can train; New → Symmetric neural networks → Create rectangular Network... builds the symmetric,
      auto-associative kind.
    zh: New → Feedforward neural networks → Create FFNet... 建立有输入层与输出层、可加以训练的网路；New → Symmetric neural
      networks → Create rectangular Network... 建立对称式（自联想）网路。
  concept:
    en: A feedforward network maps an input vector to an output vector through hidden layers; a symmetric
      network instead reconstructs its own input, which is why it appears in unsupervised and speech-encoding
      work.
    zh: 前馈式网路把输入向量经隐藏层映射成输出向量，对称式网路反而重建自己的输入，因此在无监督学习与语音编码的研究里常见。
  pitfalls:
  - en: These are advanced research objects and are outside a first-year phonetics lab; the iris example
      is a teaching example, not a language sample.
    zh: 这些是进阶的研究物件，超出第一年语音学实验课的范围，iris 例子是教学示例而不是语言样本。
  - en: A network needs data in a very specific shape, so a Table with the wrong column layout cannot
      be used directly.
    zh: 网路需要特定形状的资料，栏位配置不对的表格不能直接丢进去。
  keywords:
  - neural network
  - 神经网络
  - ffnet
  - symmetric
  - 对称
  - feedforward
  - 前馈
  - train
  - 训练
  - deep belief
  - 深度学习
- id: workflow-read-sound-file
  aliases:
  - Read from special sound file
  title:
    en: Getting a sound file into Praat
    zh: 把音档读进 Praat
  what:
    en: 'The Open menu is how a recording on disk becomes a Praat object: Read from file... is the normal
      route, Read from special sound file is the fallback for formats Praat cannot recognise by itself,
      such as raw sound data.'
    zh: Open 菜单是硬盘上的录音变成 Praat 物件的入口：一般用 Read from file...，Read from special sound file 则是给 Praat 自己认不出的档案格式用的。
  how:
    en: Open → Read from file... (Ctrl-O) and pick the file; Praat recognises WAV, AIFF, MP3, FLAC, NeXT/Sun
      and NIST files, and asks for the name of the new Sound object. Choose Read from special sound file
      only when that fails.
    zh: Open → Read from file...（Ctrl-O）选择档案；Praat 认得 WAV、AIFF、MP3、FLAC、NeXT/Sun 与 NIST 等格式，然后问你要新 Sound
      物件的名字。只有前一步失败时才用 Read from special sound file。
  concept:
    en: 'Whatever the format, Praat converts everything into one internal form: a sampled waveform with
      a declared sampling frequency, and that frequency sets the range you can analyse.'
    zh: 不管原来是哪种格式，Praat 都会转成同一种内部形式：带取样频率的取样波形，而这个取样频率决定你能分析的频率范围。
  pitfalls:
  - en: Read from file... loads the whole file into memory; for a recording of hours use Open long sound
      file... instead.
    zh: Read from file... 会把整个档案载入记忆体，录制数小时的长音档要改用 Open long sound file...。
  - en: 'The object you get is a copy: editing it afterwards does not change the file on disk.'
    zh: 读进来的是副本：之后改这个物件不会改到硬盘上的档案。
  - en: The same recording opened twice under two names is still one recording; do not treat it as two
      speakers.
    zh: 同一份录音用两个名字打开两次仍然只是同一段录音，别把它当成两位说话者。
  - en: A raw file read with the wrong endianness or the wrong sampling frequency sounds like noise, not
      like a damaged recording.
    zh: 原始档案若用错位元组或错取样频率读进来，听起来就是杂讯，而不是受损的录音。
  - en: Each item reads only the format named in it; they are not a general raw-import tool.
    zh: 每个项目只读它所指的格式，并不是通用的原始档案汇入工具。
  keywords:
  - read
  - open
  - 读取
  - 读档
  - wav
  - aiff
  - mp3
  - flac
  - 音档
  - 格式
  - format
  - 声音
  - sound
- id: open-menu-tableofreal
  aliases:
  - Read TableOfReal from headerless spreadsheet file...
  control_types:
  - MenuItemControl
  title:
    en: Read TableOfReal from headerless spreadsheet file...
    zh: Read TableOfReal from headerless spreadsheet file...（读无表头表格）
  what:
    en: 'Reads a spreadsheet file that has no header row into a TableOfReal object: a table of numbers
      in which each column carries a label of its own.'
    zh: 把没有表头的电子表格档读成 TableOfReal 物件，一份数字表格，每一栏都有自己的名称。
  how:
    en: Open → Read TableOfReal from headerless spreadsheet file..., pick the file; Praat asks how many
      rows and columns it has and what the column names should be.
    zh: Open → Read TableOfReal from headerless spreadsheet file...，选择档案；Praat 会问它有几行几栏，以及各栏要叫什么名字。
  concept:
    en: A TableOfReal is a Table whose columns are labelled vectors of numbers, so it holds one variable
      per column with a name attached, exactly the shape of a formant table or an F1 and F2 measurement
      table.
    zh: TableOfReal 是每一栏都带名称的数字向量表，也就是一栏一个变项，这正是共振峰表或 F1、F2 量测表的形状。
  pitfalls:
  - en: You must supply the row and column counts yourself, and a wrong count silently truncates the data.
    zh: 行数与栏数要自己填，填错会让资料被悄悄截掉。
  - en: The files it expects are numbers only, so a column of labels has to be typed in afterwards.
    zh: 它要的是纯数字的无表头档案，标签那一栏得事后自己补上。
  keywords:
  - tableofreal
  - 表格
  - 无表头
  - headerless
  - spreadsheet
  - 电子表格
  - 变项
  - variable
  - 共振峰表
  - formant table
  - f1
  - f2
- id: help-menu-faq-reporting
  aliases:
  - Frequently asked questions
  - Reporting a problem?
  control_types:
  - MenuItemControl
  title:
    en: Frequently asked questions, Reporting a problem?
    zh: 常见问题与问题回报
  what:
    en: Two support pages. Frequently asked questions collects the questions students ask most often;
      Reporting a problem? explains how to report a bug to the Praat author.
    zh: 两个支持用的页面。Frequently asked questions 收集学生最常问的问题；Reporting a problem? 说明怎样把程式错误回报给 Praat 的作者。
  how:
    en: Help → Frequently asked questions when something behaves oddly; Help → Reporting a problem? when
      you are sure it is a bug. A report needs the Praat version, the exact steps and the smallest example
      that shows it.
    zh: 行为怪异时先看 Help → Frequently asked questions，确定是程式错误再打开 Help → Reporting a problem?。回报时要给版本、准确的步骤，以及能重现问题的最小例子。
  concept:
    en: 'Most cases of ''Praat does not work'' are settings, not bugs: the sound device, the decimal separator
      and a stale selection explain a large share of them.'
    zh: 大部分「Praat 坏了」其实是设定问题而不是错误：声音装置、小数点符号、以及残留的选区，就能解释很大一部分。
  pitfalls:
  - en: Check the Frequently asked questions first, because reporting a bug that is already documented
      takes longer to help you than reading the answer.
    zh: 先看常见问题，回报一个已经被记录在案的错误，比自己读解答花的时间更长。
  - en: A report without the version number and the exact steps cannot be reproduced, so it cannot be
      fixed.
    zh: 没有版本编号与确切步骤的报告无法重现，也就无法修复。
  keywords:
  - faq
  - 常见问题
  - questions
  - 回报
  - report
  - 错误
  - bug
  - 支持
  - support
  - version
  - 版本
  - 重现
  - reproduce
- id: help-menu-project-pages
  aliases:
  - What’s new?
  - What's new?
  - Acknowledgments
  - License
  control_types:
  - MenuItemControl
  title:
    en: What’s new?, Acknowledgments, License
    zh: What’s new?、Acknowledgments、License（计划相关页面）
  what:
    en: 'Three pages about the project itself: What’s new? lists the changes in recent Praat versions,
      Acknowledgments credits the people who contributed, and License states the terms under which Praat
      is free software.'
    zh: 三个关于这个计划本身的页面：What’s new? 列出近几个版本的变化，Acknowledgments 致谢贡献者，License 说明 Praat 作为自由软件的授权条款。
  how:
    en: Help → What’s new? before a new term, to see which commands have changed; Help → License to see
      that Praat may be used freely in your teaching.
    zh: 新学期开始前看看 Help → What’s new?，就知道哪些指令变了；Help → License 可以看到 Praat 在教学中可以自由使用。
  concept:
    en: Praat is free and open software, and the licence page is the formal statement of that; the acknowledgements
      page lists the linguists and phoneticians whose work the methods rest on.
    zh: Praat 是自由开放软件，License 页就是这件事的正式声明；Acknowledgments 页则列出这些方法所依赖的语言学家与语音学家。
  pitfalls:
  - en: What’s new? describes the newest release, which may be newer than the copy you are running.
    zh: What’s new? 讲的是最新的版本，可能比你手上这一版还新。
  - en: Cite the Praat manual and the version in your report, which is the convention in phonetics.
    zh: 在报告里引用 Praat 手册与版本编号，这是语音学的惯例。
  keywords:
  - whats new
  - 更新
  - 版本
  - version
  - acknowledgments
  - 致谢
  - license
  - 授权
  - 自由软件
  - free software
  - 引用
  - cite
- id: help-menu-privacy-updates
  aliases:
  - Privacy and security
  - Checking for updates?
  control_types:
  - MenuItemControl
  title:
    en: Privacy and security, Checking for updates?
    zh: Privacy and security、Checking for updates?（隐私与版本检查）
  what:
    en: Two pages about Praat and the internet. Privacy and security explains what Praat does with your
      data and with what it sends out; Checking for updates? asks the Praat website whether a newer release
      exists.
    zh: 两个关于 Praat 与网路的页面。Privacy and security 说明 Praat 怎么对你的资料与对外传送的内容；Checking for updates? 会向 Praat
      网站询问有没有更新的版本。
  how:
    en: Help → Checking for updates? tells you whether a newer Praat exists. Read Help → Privacy and security
      if you handle sensitive recordings in a lab.
    zh: Help → Checking for updates? 可以知道有没有更新的 Praat。若你在实验室处理敏感的录音，先读 Help → Privacy and security。
  concept:
    en: Praat is a local program, so your recordings are analysed on your own machine; the pages that
      mention the internet are about version checks and about what you yourself send to other programs.
    zh: Praat 是本地程式，录音在你自己的机器上分析；谈到网路的那几页，讲的是版本检查，以及你自己传给其他程式的内容。
  pitfalls:
  - en: On a machine without internet access these pages may show nothing useful; the version is on the
      Praat → About Praat window too.
    zh: 没有网路时这些页面可能什么都看不到，版本编号在 Praat → About Praat 窗口里也有。
  - en: Sending sensitive recordings to an online service and calling it analysis in Praat means the data
      has left your machine.
    zh: 把敏感录音送到线上服务再当成是用 Praat 做分析，资料已经离开你的机器了。
  keywords:
  - privacy
  - 隐私
  - security
  - 安全
  - updates
  - 更新
  - 版本检查
  - internet
  - 网路
  - 数据
  - data
  - 资料保护
- id: workflow-scripting-tutorial
  aliases:
  - Scripting tutorial
  title:
    en: Learning the Praat scripting language
    zh: 学习 Praat 脚本语言
  what:
    en: The official online tutorial that takes you from a one-line script to loops, variables, procedures
      and reading files.
    zh: 官方线上教学，从一行脚本一路带到循环、变量、程序与读档。
  how:
    en: Help → Scripting tutorial opens it in your browser; work through it in order, because each page
      builds on the previous one. Write each example in a script editor next to the tutorial and run it
      as you read.
    zh: Help → Scripting tutorial 会在浏览器里打开，请照顺序读，因为每一页都建立在前一页之上。一边读一边把例子写进脚本编辑窗口并执行。
  concept:
    en: 'Scripting is procedural: the statements run in the order you write them, which is why a wrong
      selection produces an error at the line where the command is unavailable.'
    zh: 脚本是程序式的：语句照你写的顺序执行，所以选错物件时，出错的就是那条指令所在的那一行。
  pitfalls:
  - en: 'The tutorial is online: on a lab machine without internet, keep a local copy of the pages.'
    zh: 教学是线上的，实验课机器没有网路时要自己留一份本地页面。
  - en: 'Read the error messages: ''command not available'' means the wrong selection, a syntax error
      means the line itself is wrong.'
    zh: 要看错误讯息：「指令不可用」是选错物件，语法错误则是那一行写错了。
  - en: The scripting tutorial assumes the formula language, so read the formulas tutorial first.
    zh: 脚本教学预设你已经懂公式语言，所以先读公式教学。
  - en: A script is plain text, so an editor that adds smart quotes or changes the encoding will break
      it.
    zh: 脚本是纯文字，用会自动换引号或改变编码的编辑器存档会破坏脚本。
  keywords:
  - scripting
  - 脚本
  - tutorial
  - 教学
  - 学习
  - manual
  - 手册
  - loops
  - 循环
  - 变数
  - variables
- id: help-menu-functions
  aliases:
  - Functions
  control_types:
  - MenuItemControl
  title:
    en: Functions
    zh: Functions（函数清单）
  what:
    en: 'Opens the manual''s list of built-in functions: every function that can appear in a formula,
      with its syntax and an example.'
    zh: 打开手册里的内建函数清单，所有能用在公式里的函数，附上语法与范例。
  how:
    en: Help → Functions, then look up the function you need. The same list is reachable from the formula
      editor, but this page is the reference version.
    zh: Help → Functions，然后查你要的函数。公式编辑器里也有同一份清单，但这一页是参考版本。
  concept:
    en: This is where you check the exact name and the argument order of a function, for example whether
      a logarithm takes one value or two.
    zh: 在这里查函数的准确名称与参数顺序，例如对数是接受一个值还是两个。
  pitfalls:
  - en: 'Function names are English and case-sensitive: abs works, Abs does not.'
    zh: 函数名称是英文而且大小写敏感，abs 可以，Abs 不行。
  - en: Not every function that exists can be used everywhere; some work only inside scripts.
    zh: 不是每个存在的函数都能到处用，有些只能在脚本里用。
  keywords:
  - functions
  - 函数
  - list
  - 清单
  - formula
  - 公式
  - reference
  - 参考
  - syntax
  - 语法
  - 内建
  - built-in
- id: workflow-demo-window
  aliases:
  - Demo window
  title:
    en: The Demo window
    zh: Demo 窗口（示范窗口）
  what:
    en: 'Opens the manual section about Praat''s Demo window: a window in which a script can draw and
      ask the user for input, used for demonstrations, presentations and experiments.'
    zh: 打开手册中关于 Demo 窗口的说明：那是一个可以让脚本绘图、可以向使用者提问的窗口，用在示范、简报与实验上。
  how:
    en: 'Help → Demo window explains what the Demo window can do. The window itself only exists through
      a script: a script creates it with demo, draws on it, and then waits for a click with demoWaitForInput
      or demoClicked.'
    zh: Help → Demo window 会说明 Demo 窗口能做什么。这个窗口本身只能透过脚本存在：脚本用 demo 打开它、在上面绘图，再用 demoWaitForInput 或 demoClicked
      等待使用者点击。
  concept:
    en: 'Because the demo window is script-driven, the same program can be handed to a participant as
      an experiment: it draws the stimulus, records the answer and stores it.'
    zh: 因为 Demo 窗口由脚本驱动，同一个程式可以直接交给受试者当实验：它画出刺激、记录反应并存档。
  pitfalls:
  - en: 'The Demo window is a scripting feature, not a guided tour of Praat: nothing appears until a script
      puts something there.'
    zh: Demo 窗口是脚本功能，不是 Praat 的导览：没有脚本放东西进去，窗口里就是空的。
  - en: A script that waits for input stays blocked until the user clicks, so a frozen screen can be a
      waiting script and not a crash.
    zh: 等待输入的脚本会一直卡住，直到使用者点击，所以画面不动可能是脚本在等，不一定是当机。
  - en: The Demo window is not the Objects window and not an editor; it is a separate window that a script
      controls.
    zh: Demo window 不是 Objects 窗口，也不是编辑窗口，它是由脚本控制的另一个窗口。
  - en: It needs a script to be of any use; opening the page alone does not create one.
    zh: 它需要脚本才有用，单纯打开这一页不会产生一个 Demo window。
  keywords:
  - demo
  - 示范
  - 窗口
  - script
  - 脚本
  - experiment
  - 实验
  - input
  - 输入
  - drawing
  - 绘图
- id: help-menu-interoperability
  aliases:
  - Interoperability
  - Programming
  control_types:
  - MenuItemControl
  title:
    en: Interoperability, Programming
    zh: Interoperability、Programming（与外部软体整合）
  what:
    en: Two pages for people who need Praat to work with other software. Interoperability explains how
      Praat talks to other programs and languages; Programming describes how to use Praat as a library
      or from a program.
    zh: 两个写给需要 Praat 与其他软体一起工作的人的页面。Interoperability 说明 Praat 如何与其他程式和语言沟通；Programming 介绍如何把 Praat 当成套件或从程式里调用。
  how:
    en: Help → Interoperability when you want to move data between Praat and R, Python or MATLAB; Help
      → Programming when you want to call Praat from your own code.
    zh: 想在 Praat 与 R、Python 或 MATLAB 之间搬资料时看 Help → Interoperability，想从自己的程式呼叫 Praat 时看 Help → Programming。
  concept:
    en: Praat keeps its data in plain text formats on purpose, so the easiest way to analyse speech with
      another tool is usually to save the data and read it in there.
    zh: Praat 刻意把资料存成纯文字格式，所以要与其他工具一起分析语音，最简单的做法通常就是把资料存出来，在那边读进去。
  pitfalls:
  - en: These pages are for programmers; they are not needed for the ordinary analysis work of the lab.
    zh: 这两页是给程序设计师看的，实验课的常规分析不需要它们。
  - en: Calling Praat from another program means starting a new process, so the two do not share memory.
    zh: 从别的程式呼叫 Praat 意味着启动一个新行程，两边并不共享记忆体。
  keywords:
  - interoperability
  - 整合
  - programming
  - 程式设计
  - python
  - r
  - matlab
  - api
  - 呼叫
  - call
  - interface
  - 介面
  - 套件
  - library
- id: sound-editor
  aliases:
  - Sound editor
  title:
    en: The Sound editor
    zh: Sound 编辑窗口
  what:
    en: 'The window Praat opens for a Sound: the waveform on top, the time axis underneath, and its own
      menu bar with File, Edit, Time, Play, Sound, Analyses, Spectrogram, Pitch, Intensity, Formants,
      Pulses and Help.'
    zh: Praat 为声音（Sound）打开的窗口：上面是波形，下面是时间轴，窗口本身有专属菜单列 File、Edit、Time、Play、Sound、Analyses、Spectrogram、Pitch、Intensity、Formants、Pulses、Help。
  how:
    en: Select the Sound in the Objects list and click View & Edit. The analyses you switch on here (Show
      spectrogram, Show pitch, Show formants) are drawn live on the part of the sound that is visible.
    zh: 在 Objects 清单里选中 Sound 后点 View & Edit。在这里打开的分析（Show spectrogram、Show pitch、Show formants）是针对可见范围即时绘制的。
  concept:
    en: 'The editor is a time-axis workbench: every view in it shares one horizontal axis, so the cursor,
      the selection and the zoom level are three readings of the same seconds.'
    zh: 编辑窗口是一张以时间为轴的工作台：里面每个视图共用同一条水平轴，游标、选区与缩放层级是同一组秒数的三种读法。
  pitfalls:
  - en: 'The Sound editor has no TextGrid menu: the TextGrid command is a button, which is easy to mistake
      for a menu.'
    zh: Sound 编辑窗口没有 TextGrid 菜单，开 TextGrid 的是一颗按钮，很容易被当成菜单。
  - en: Closing the editor does not delete the Sound; the object stays in the Objects list.
    zh: 关掉编辑窗口不会删除 Sound，物件仍然留在 Objects 清单里。
  - en: A LongSound opens a window that looks the same but cannot be edited.
    zh: LongSound 开出来的窗口看起来一样，却不能编辑。
  keywords:
  - sound editor
  - 声音编辑窗口
  - 编辑器
  - 波形
  - waveform
  - 时间轴
  - praat
- id: textgrid-editor-window
  aliases:
  - TextGrid editor window
  title:
    en: The TextGrid editor window
    zh: TextGrid 编辑窗口
  what:
    en: 'The window where you type annotation: the tiers sit below the sound, and the white text field
      at the top receives whatever you type.'
    zh: 输入标注的窗口：层级在声音下方，最上方的白色文字栏位接收你打进去的字。
  how:
    en: Select the TextGrid in the Objects list and click View & Edit. Add the Sound to the selection
      with Ctrl+click if you want the waveform and the spectrogram above the tiers.
    zh: 在 Objects 清单里选中 TextGrid 后点 View & Edit。若希望层级上方有波形与频谱图，按住 Ctrl 再点一下 Sound 一起选中。
  concept:
    en: 'Tiers are the bridge between the acoustic signal and linguistic categories: each tier holds one
      hypothesis about the same timeline, such as phones, syllables or words.'
    zh: 层级是声学讯号与语言类别之间的桥：每一层都对同一条时间线提出一个假设，例如音素、音节或词。
  pitfalls:
  - en: Opening the TextGrid on its own gives tiers without a waveform, so you lose the acoustic reference.
    zh: 只开 TextGrid 就没有波形，你会失去声学参照。
  - en: Look for the red tier number to see which tier is active; only one tier takes your typing at a
      time.
    zh: 要看红色显示的层级编号才知道哪一层在作用，同一时间只有一层接收你打的字。
  keywords:
  - textgrid editor window
  - 文本网格窗口
  - 标注
  - tier
  - 层级
  - 编辑器
- id: editor-window
  aliases:
  - Editor window
  title:
    en: The editor window
    zh: 编辑窗口
  what:
    en: 'Any Praat window that shows one object for looking and editing: a Sound, a LongSound, a TextGrid,
      a Pitch, a Formant, an Intensity or a Table.'
    zh: 任何用来检视与编辑单一物件的 Praat 窗口：Sound、LongSound、TextGrid、Pitch、Formant、Intensity 或 Table 都可以。
  how:
    en: 'Every editor has the same shape: a menu bar, a drawing area and buttons around it. You can keep
      several open at once, and each one remembers its own zoom level.'
    zh: 每个编辑窗口的构造都一样：菜单列、绘图区，以及周围的按钮。可以同时开好几个，而且各自记得自己的缩放层级。
  concept:
    en: An editor shows a copy for you to work on. Changes made in the editor stay in that copy until
      you extract them or publish them as an object.
    zh: 编辑窗口显示的是一份供你操作的副本。在窗口里做的更动会留在副本上，要经由取出或发布才回到物件。
  pitfalls:
  - en: Each editor keeps its own zoom level, so two editors side by side can show the same sound at different
      scales.
    zh: 每个编辑窗口有自己的缩放层级，两个窗口并排看同一段声音时比例可能不同。
  - en: 'The Picture window is not an editor: it draws objects but shows no data you can select or measure.'
    zh: Picture 窗口不是编辑窗口：它只画图，不显示可选取或可量测的资料。
  keywords:
  - editor window
  - 编辑窗口
  - 编辑器
  - praat
  - 物件
  - object
- id: editor-window-title
  aliases:
  - 1. Sound demo_vowel
  title:
    en: The editor window title
    zh: 编辑窗口的标题
  what:
    en: The title bar carries the object label exactly as the Objects list shows it, for example "1. Sound
      demo_vowel". The number in front is the object's index in that list.
    zh: 标题列显示的正是物件在 Objects 清单里的标签，例如「1. Sound demo_vowel」，前面的数字是它在清单里的编号。
  how:
    en: 'Read the number to know which object is in front of you: a window titled "2. ..." is the second
      object you loaded, and the same number appears in the Objects list.'
    zh: 看编号就知道你面对的是哪一个物件：标题写着「2. ...」的窗口对应你载入的第二个物件，同样的编号也出现在 Objects 清单里。
  concept:
    en: The title is a link back to the Objects list. Since the drawing area carries no label of its own,
      the title is the only place where the editor says which object it is showing.
    zh: 标题是回到 Objects 清单的线索。绘图区本身没有标签，所以标题是编辑窗口唯一会说明自己在显示哪一个物件的地方。
  pitfalls:
  - en: The number changes when objects are removed, so it is not a permanent identifier.
    zh: 物件被移除后编号会变，不要把它当成永久的识别码。
  - en: The title is the object label, not the file name on disk; renaming the object changes the title.
    zh: 标题是物件标签，不是硬盘上的档名，物件改名后标题就跟着变。
  keywords:
  - window title
  - 窗口标题
  - 物件编号
  - object index
  - 标签
  - label
- id: window-minimize
  aliases:
  - Minimize
  control_types:
  - ButtonControl
  title:
    en: Minimize
    zh: Minimize（最小化）
  what:
    en: The standard window button that shrinks the editor to the taskbar without closing it.
    zh: 标准的窗口按钮，把编辑窗口缩到工作列，但窗口并没有关闭。
  how:
    en: Click it when the editor gets in the way. The object stays in the Objects list and the window
      comes back when you click its taskbar entry.
    zh: 编辑窗口挡路时按它，物件仍留在 Objects 清单里，从工作列点回来就恢复。
  pitfalls:
  - en: A minimized editor is still open, and the sound is still loaded; only the window is off screen.
    zh: 最小化的编辑窗口仍然开着，声音也仍然载着，只是窗口不在画面上。
  keywords:
  - minimize
  - 最小化
  - 窗口
  - window
  - 工作列
  - taskbar
- id: window-maximize
  aliases:
  - Maximize
  control_types:
  - ButtonControl
  title:
    en: Maximize
    zh: Maximize（最大化）
  what:
    en: Expands the editor window to fill the screen, which gives the drawing area more pixels and therefore
      more detail on screen.
    zh: 把编辑窗口展开到整个萤幕，绘图区会多出许多像素，萤幕上也就看得到更多细节。
  how:
    en: Click it, or double-click the title bar. Clicking it again (the button becomes Restore) puts the
      window back to its previous size.
    zh: 按一下，或双击标题列；再按一次（按钮会变成 Restore）就回到原来的大小。
  pitfalls:
  - en: 'A bigger window shows more of the sound, but no analysis setting changes: the zoom level is a
      separate thing.'
    zh: 窗口变大只是看得到更多声音，分析设定并没有跟着变，缩放层级是另一件事。
  - en: The position of the canvas buttons is drawn by Praat itself and can differ between window sizes.
    zh: 画布上的按钮位置由 Praat 自己绘制，窗口大小不同时位置也可能不同。
  keywords:
  - maximize
  - 最大化
  - 窗口
  - 萤幕
  - screen
  - 编辑器
- id: window-close
  aliases:
  - Close
  control_types:
  - ButtonControl
  title:
    en: Close
    zh: Close（关闭）
  what:
    en: Closes the editor window and throws away any unsaved changes made inside it.
    zh: 关闭编辑窗口，并把窗口里尚未存档的更动丢掉。
  how:
    en: Click it when you are done. If the editor holds an edited Sound or a TextGrid with labels, Praat
      may ask whether to save first.
    zh: 做完事就可以按。若窗口里的 Sound 被改过，或 TextGrid 已打了标签，Praat 可能先问你要不要存档。
  concept:
    en: Closing an editor never deletes an object. Praat's objects live in the Objects list, and only
      Remove takes them away from there.
    zh: 关闭编辑窗口绝不会删除物件。Praat 的物件住在 Objects 清单里，只有 Remove 才会把它们拿走。
  pitfalls:
  - en: Closing a TextGrid editor with unsaved labels loses the annotation; the Sound itself is still
      there.
    zh: 带着没存档的标签关掉 TextGrid 编辑窗口，标注就没了，声音本身还在。
  - en: This is the editor's close button, not the one that quits Praat; quitting is Praat → Quit.
    zh: 这是编辑窗口的关闭按钮，不是离开 Praat 的按钮，离开程式要用 Praat → Quit。
  keywords:
  - close
  - 关闭
  - 窗口
  - 离开
  - quit
  - 编辑器
- id: praat-child-window-class
  aliases:
  - PraatChildWindow1 Praat
  control_types:
  - WindowControl
  title:
    en: The Praat child window class
    zh: Praat 子窗口类别
  what:
    en: 'The Windows class Praat gives to its own secondary windows: the Picture window and every editor.
      The Objects window has a different class, PraatShell1 Praat.'
    zh: Praat 给自己次要窗口使用的 Windows 类别：Picture 窗口与每一个编辑窗口都是它；Objects 窗口则是另一个类别 PraatShell1 Praat。
  how:
    en: 'On Praat 6.4.12 in Windows this class is visible in the accessibility tree. The title is what
      tells the two apart: "Praat Picture" for the figure window, "1. Sound demo_vowel" for an editor.'
    zh: 在 Windows 上的 Praat 6.4.12，这个类别会出现在无障碍树里。真正区分两者的是标题：「Praat Picture」是图件窗口，「1. Sound demo_vowel」是编辑窗口。
  concept:
    en: The class tells you what kind of window you are in, the title tells you what it is showing. Both
      are needed, because the class alone would group the Picture window together with the editors.
    zh: 类别告诉你这是哪一种窗口，标题告诉你它正在显示什么。两者都需要，因为只看类别会把 Picture 窗口与编辑窗口混在一起。
  pitfalls:
  - en: The class name is a Windows implementation detail, not something Praat shows in its own menus.
    zh: 这个类别名是 Windows 的实现细节，Praat 自己的菜单里看不到。
  - en: 'A class-prefix rule on its own is not enough to identify an editor: the title check is what makes
      it safe.'
    zh: 只靠类别前缀无法认定编辑窗口，真正让人放心的是对标题的检查。
  keywords:
  - window class
  - 窗口类别
  - PraatChildWindow1 Praat
  - 无障碍
  - accessibility
  - 编辑窗口
  - picture
- id: praat-shell-window-class
  aliases:
  - PraatShell1 Praat
  control_types:
  - WindowControl
  title:
    en: The Praat Objects window class
    zh: Praat Objects 窗口类别
  what:
    en: The Windows class of the main Praat window, the one titled "Praat Objects" that holds the list
      of objects.
    zh: Praat 主窗口的 Windows 类别，也就是标题为「Praat Objects」、装着物件清单的那个窗口。
  how:
    en: It is the only Praat window that is not a child window, so it stays on screen while you work in
      the editors.
    zh: 它是唯一不是子窗口的 Praat 窗口，所以你在编辑窗口里工作时会一直留在后面。
  concept:
    en: 'Everything Praat knows is reachable from this one window: reading files, choosing objects and
      opening the editors. The editors are views onto what this list holds.'
    zh: Praat 知道的一切都从这个窗口出发：读档、选物件、打开编辑窗口。编辑窗口只是这个清单所持内容的视图。
  pitfalls:
  - en: Do not close the Objects window while you work; it is the way back to the object list.
    zh: 工作期间不要关掉 Objects 窗口，那是回到物件清单的入口。
  keywords:
  - praat shell
  - PraatShell1 Praat
  - objects window
  - 物件清单
  - 主窗口
- id: editor-drawing-area
  aliases:
  - Praat drawing area
  control_types:
  - PaneControl
  title:
    en: The drawing area
    zh: 绘图区
  what:
    en: The large pane in an editor window where Praat itself paints the waveform, the spectrogram, the
      pitch track or the formant lines. In the accessibility tree it is the pane named "drawingArea".
    zh: 编辑窗口里那块大面板，Praat 在上面自行画出波形、频谱图、基频轨迹或共振峰线；在无障碍树里它的名称是「drawingArea」。
  how:
    en: Click inside it to place the time cursor and drag to select a range. Which view is shown is decided
      by the zoom buttons at the top left, not by the menu above.
    zh: 在里面点击可放置时间游标，拖曳可选取一段范围。显示哪一个视图由左上角的缩放按钮决定，不是上方的菜单。
  concept:
    en: Praat draws the canvas itself, so the accessibility tree can give its position but not its content.
      What you see there is always a view of the same time axis.
    zh: Praat 自行绘制这块画布，所以无障碍树给得出它的位置，却给不出里面的内容。你在那里看到的，永远是同一条时间轴的某个视图。
  pitfalls:
  - en: The rectangle reported for the drawing area is the scrollable extent, not the visible part, so
      it can look larger than the window.
    zh: 绘图区报出来的矩形是卷动范围而不是可见范围，所以可能看起来比窗口还大。
  - en: 'No control lives inside the drawing area: the buttons drawn there belong to Praat''s own canvas,
      not to Windows.'
    zh: 绘图区里面没有任何独立控件，画在那里的按钮属于 Praat 自己的画布，不属于 Windows。
  keywords:
  - drawing area
  - 绘图区
  - 画布
  - drawingArea
  - 波形
  - 频谱图
  - 编辑窗口
- id: scroll-thumb-position
  aliases:
  - Position
  control_types:
  - ThumbControl
  title:
    en: The scroll bar thumb (Position)
    zh: 卷轴滑块（Position）
  what:
    en: The draggable handle in a scroll bar. It shows how much of the content is visible and where that
      visible part sits in the whole.
    zh: 卷轴上可拖曳的把手，显示目前看得到多少内容，以及这一段在整个内容里的位置。
  how:
    en: Drag it to jump to another stretch of the sound or of the picture. In an editor the horizontal
      bar moves along the time axis; in the Picture window it moves the figure itself.
    zh: 拖动它可以跳到声音（或图件）的另一段。在编辑窗口里水平卷轴沿时间轴移动；在 Picture 窗口里移动的是整张图。
  concept:
    en: 'The thumb is a map of the whole: a thumb that fills the bar means you are seeing everything,
      a small thumb means you are zoomed in on a short stretch.'
    zh: 滑块就是整份内容的一张地图：滑块占满卷轴表示你看到全部，滑块很小表示你正放大看一小段。
  pitfalls:
  - en: The scroll bar changes the view, never the data; the sound itself is unchanged.
    zh: 卷轴只改变视图，绝不改变资料，声音本身没有变。
  - en: There is one Position thumb per scroll bar, so a window with a horizontal and a vertical bar shows
      two of them.
    zh: 每条卷轴各有一个 Position 滑块，所以同时有水平与垂直卷轴的窗口会出现两个。
  keywords:
  - position
  - 卷轴
  - 滑块
  - thumb
  - scrollbar
  - 卷动
  - 时间轴
- id: scroll-line-buttons
  aliases:
  - Line up
  - Line down
  control_types:
  - ButtonControl
  title:
    en: Line up and Line down
    zh: Line up 与 Line down（卷轴逐行）
  what:
    en: The two small buttons at the ends of a vertical scroll bar. Each click scrolls by one line, the
      smallest step the scroll bar offers.
    zh: 垂直卷轴两端的两颗小按钮，每按一次卷动一行，是卷轴最小的步进。
  how:
    en: Click Line up or Line down to nudge the view. In an editor they move the picture slightly up or
      down; in the Picture window they shift the figure itself.
    zh: 按 Line up 或 Line down 可以小幅移动视图。在编辑窗口里是把画面微微上下移，在 Picture 窗口里移动的是整张图。
  pitfalls:
  - en: One line is a very small step, so scrolling a long file this way takes many clicks; use the page
      buttons instead.
    zh: 一行是很小的步进，用这种方式卷过一段长档案要按很多次，改用翻页按钮更快。
  keywords:
  - line up
  - line down
  - 卷动
  - scrollbar
  - 逐行
  - 上下
- id: scroll-page-buttons
  aliases:
  - Page up
  - Page down
  - Page right
  control_types:
  - ButtonControl
  title:
    en: Page up, Page down and Page right
    zh: Page up、Page down 与 Page right（卷轴翻页）
  what:
    en: The scroll bar buttons that move the view by one screenful at a time, in the vertical or in the
      horizontal direction.
    zh: 一次移动一整个画面高度的卷轴按钮，方向有垂直也有水平。
  how:
    en: Page down and Page up step through the sound a screen at a time; Page right does the same horizontally.
      They are the quick way to skim a long recording.
    zh: Page down 与 Page up 逐屏浏览声音，Page right 则在水平方向做同样的事，这是快速浏览长录音的办法。
  concept:
    en: A page is defined by the window size, so the same click covers more time in a maximised window
      than in a small one. The samples themselves never move.
    zh: 一页的长度由窗口大小决定，所以同一个按键在最大化窗口里覆盖的时间比在小窗口里更多，底下的样本不会移动。
  pitfalls:
  - en: Which of these buttons a window shows varies with the window and the release; check the button
      you actually see.
    zh: 这些按钮具体出现哪几个，会随窗口与版本而变，先看看画面上实际有哪一颗。
  - en: 'A page is defined by the window size, so a section you scrolled past is not a measurement: measure
      it by number.'
    zh: 一页的长度由窗口大小决定，卷过去的那一段不等于一次量测，要用数字量。
  keywords:
  - page up
  - page down
  - page right
  - 翻页
  - 卷动
  - scrollbar
  - 逐屏
- id: scroll-column-buttons
  aliases:
  - Column left
  - Column right
  control_types:
  - ButtonControl
  title:
    en: Column left and Column right
    zh: Column left 与 Column right（卷轴逐栏）
  what:
    en: The two small buttons at the ends of a horizontal scroll bar. Each click scrolls by one column,
      a small horizontal step.
    zh: 水平卷轴两端的两颗小按钮，每按一次卷动一栏，是水平方向的小步进。
  how:
    en: In an editor they shift the visible stretch of the sound slightly to the left or to the right;
      the time axis under the cursor does not move.
    zh: 在编辑窗口里它们把可见的声音片段微微左右移动，游标下的时间轴不会跟着动。
  pitfalls:
  - en: The step is small and the sound is usually long, so these buttons are easy to overlook; most scrolling
      is done with the mouse wheel.
    zh: 步进很小、声音通常很长，所以这两颗按钮常被忽略，多数卷动是用滑鼠滚轮完成的。
  keywords:
  - column left
  - column right
  - 卷轴
  - scrollbar
  - 水平
  - 左右
- id: picture-window-menu-bar
  aliases:
  - Picture window menu bar
  control_types:
  - MenuItemControl
  title:
    en: The Picture window menu bar
    zh: Picture 窗口的菜单列
  what:
    en: 'The eight menus of the Picture window: File, Edit, Margins, World, Select, Pen, Font and Help.
      All of them act on the figure, not on the sound.'
    zh: Picture 窗口的八个菜单：File、Edit、Margins、World、Select、Pen、Font、Help，它们作用的对象是图件，不是声音。
  how:
    en: Margins sets the axes and the frame, World draws things in data coordinates, Select chooses which
      viewport the mouse acts on, Pen sets line style and width, Font sets the typeface, File exports
      the figure.
    zh: Margins 设定坐标轴与外框，World 以资料坐标绘图，Select 决定鼠标作用在哪个视窗，Pen 设定线型与线宽，Font 设定字型，File 负责汇出图件。
  concept:
    en: 'The Picture window is the typesetting half of Praat: the Objects window and the editors produce
      the data, this window turns it into a figure a journal will accept.'
    zh: Picture 窗口是 Praat 的排版那一半：Objects 窗口与编辑窗口产出资料，这个窗口把资料变成期刊肯收的图。
  pitfalls:
  - en: Only File, Edit and Help are shared with the editor windows; Margins, World, Select, Pen and Font
      exist only here.
    zh: 八个菜单里只有 File、Edit、Help 也出现在编辑窗口，Margins、World、Select、Pen、Font 只在这里有。
  - en: The Picture window starts empty, so the menus look unresponsive until something has been plotted
      into it.
    zh: Picture 窗口一开始是空的，在有东西 Plot 进去之前，菜单看起来像没反应。
  keywords:
  - picture menu bar
  - 图片窗口菜单
  - margins
  - world
  - pen
  - font
  - 排版
  - picture
- id: sound-editor-menu-bar
  aliases:
  - Sound editor menu bar
  control_types:
  - MenuItemControl
  title:
    en: The Sound editor menu bar
    zh: Sound 编辑窗口的菜单列
  what:
    en: 'The twelve menus of the Sound editor: File, Edit, Time, Play, Sound, Analyses, Spectrogram, Pitch,
      Intensity, Formants, Pulses and Help.'
    zh: Sound 编辑窗口的十二个菜单：File、Edit、Time、Play、Sound、Analyses、Spectrogram、Pitch、Intensity、Formants、Pulses、Help。
  how:
    en: 'Time and Play deal with the time axis and with hearing the sound, Sound with the waveform, Analyses
      with what is drawn, and each analysis menu with one analysis: Spectrogram, Pitch, Intensity, Formants,
      Pulses.'
    zh: Time 与 Play 处理时间轴与试听，Sound 处理波形，Analyses 决定画面上画什么，而每个分析菜单各管一种分析：Spectrogram、Pitch、Intensity、Formants、Pulses。
  concept:
    en: 'The menu names are the concepts of phonetics: a spectrogram is a time-frequency view, a pitch
      contour is F0 over time, an intensity contour is energy over time, formants are the resonances of
      the vocal tract.'
    zh: 这些菜单名就是语音学的概念：频谱图是时频视图，基频曲线是随时间变化的 F0，强度曲线是随时间变化的能量，共振峰则是声道的共振。
  pitfalls:
  - en: There is no TextGrid menu in the Sound editor; the TextGrid command is a button, not a menu item.
    zh: Sound 编辑窗口没有 TextGrid 菜单，开 TextGrid 的是一颗按钮，不是菜单项目。
  - en: These menus exist only in the editor; the Objects window has Praat, New, Open, Save and Help instead.
    zh: 这些菜单只存在于编辑窗口，Objects 窗口那边是 Praat、New、Open、Save、Help。
  keywords:
  - sound editor menu
  - 声音编辑菜单
  - time
  - play
  - analyses
  - 频谱
  - 基频
  - 编辑窗口
- id: textgrid-editor-menu-bar
  aliases:
  - TextGrid editor menu bar
  control_types:
  - MenuItemControl
  title:
    en: The TextGrid editor menu bar
    zh: TextGrid 编辑窗口的菜单列
  what:
    en: 'The menus of the TextGrid editor: File, Edit, TextGrid, Interval, Boundary, Tier, Spell, Time,
      Play and Help. They act on the tiers and on the text in them.'
    zh: TextGrid 编辑窗口的菜单：File、Edit、TextGrid、Interval、Boundary、Tier、Spell、Time、Play、Help，作用的对象是层级与层里的文字。
  how:
    en: Boundary inserts and removes boundaries, Tier adds and removes tiers, Interval reads and edits
      the interval under the cursor, Spell checks the words against a lexicon.
    zh: Boundary 插入与删除边界，Tier 增删层级，Interval 读取与修改游标下的区间，Spell 用词库检查字词。
  concept:
    en: 'A TextGrid editor is a table with a time axis: the tiers are the rows, the boundaries are the
      separators between the cells, and the text is what you put in the cells.'
    zh: TextGrid 编辑窗口是一张带时间轴的表：层级是列（栏），边界是格与格之间的分隔线，文字就是你填进格里的内容。
  pitfalls:
  - en: Praat 6.4 has no Type menu here; the symbol you need is looked up in Help → Phonetic symbols.
    zh: Praat 6.4 这里没有 Type 菜单，需要的符号要在 Help → Phonetic symbols 里查。
  - en: 'The menu names here differ from the Sound editor: in that window a boundary is added with Enter,
      not from a Boundary menu.'
    zh: 这里的菜单名与 Sound 编辑窗口不同：在那边加边界是按 Enter，不是从 Boundary 菜单来。
  keywords:
  - textgrid menu bar
  - 文本网格菜单
  - boundary
  - tier
  - interval
  - spell
  - 标注
- id: sound-editor-and-picture-window
  aliases:
  - Sound editor and Picture window
  title:
    en: Sound editor or Picture window?
    zh: Sound 编辑窗口还是 Picture 窗口？
  what:
    en: 'The two windows look similar but do different jobs: the Sound editor works with the sound itself,
      the Picture window works with a figure drawn from objects.'
    zh: 两个窗口看起来相似，工作内容却不同：Sound 编辑窗口处理声音本身，Picture 窗口处理由物件画成的图件。
  how:
    en: To measure something, stay in the Sound editor and use the Time, Pitch or Formants menus. To make
      a figure, use Plot in the Objects window and finish the job in the Picture window.
    zh: 要量测就留在 Sound 编辑窗口，用 Time、Pitch 或 Formants 菜单；要做图就在 Objects 窗口点 Plot，再到 Picture 窗口完成。
  concept:
    en: The editor is where analysis happens and the numbers are trustworthy; the Picture window is where
      presentation happens, and the numbers have to be written on the axes by hand.
    zh: 编辑窗口是分析发生的地方，数字才可靠；Picture 窗口是呈现的地方，数字得自己写在坐标轴上。
  pitfalls:
  - en: 'You cannot select a time range in the Picture window: measuring there is impossible.'
    zh: 在 Picture 窗口里没法选取时间范围，要量测根本做不到。
  - en: 'The Picture window is a child window like the editors, but it is not an editor: it has no cursor
      and no time axis.'
    zh: Picture 窗口与编辑窗口同属子窗口，但它不是编辑窗口：没有游标，也没有时间轴。
  keywords:
  - sound editor
  - picture window
  - 编辑窗口
  - 图片窗口
  - 差别
  - 量测
- id: textgrid-tier-structure
  aliases:
  - TextGrid tier structure
  title:
    en: The tier structure of a TextGrid
    zh: TextGrid 的层级结构
  what:
    en: A TextGrid holds one or more tiers. An interval tier holds segments that tile the whole time domain;
      a point tier holds events that have a time but no duration.
    zh: 一个 TextGrid 含一层或多层。区间层放的是铺满整个时间范围的音段，点层放的是有时刻却没有时长的事件。
  how:
    en: Tier → Add interval tier... for phones, syllables or words, and Tier → Add point tier... for events
      such as release bursts. Name each tier after the level it carries.
    zh: 音素、音节或词用 Tier → Add interval tier...，释爆这类事件用 Tier → Add point tier...，每一层按它承载的层级命名。
  concept:
    en: 'One tier per linguistic level is the standard design: a phone tier and a word tier over the same
      sound let you reuse one segmentation at two levels, and a word boundary inside a word shows up as
      one tier crossing another.'
    zh: 每个语言层级一层是标准做法：同一段声音上的音素层与词层，让你能在两个层级复用同一套切分；词界落在词中间时，就会显示成层与层的交错。
  pitfalls:
  - en: An interval tier must cover the whole time domain; a TextGrid that stops early leaves audio with
      no tiers.
    zh: 区间层必须覆盖整个时间范围，TextGrid 提早结束会让后面一段音讯没有层级。
  - en: Putting a phone label in a point tier throws away its duration.
    zh: 把音素标签放进点层，它的时长就丢掉了。
  - en: Only one tier is active at a time, so a label can land in the wrong tier if you forget which one
      is active.
    zh: 同一时间只有一层作用中，忘了当前是哪一层，标签就会打进错的层。
  keywords:
  - tier structure
  - 层级结构
  - interval tier
  - point tier
  - 区间层
  - 点层
  - textgrid
  - 标注
- id: textgrid-text-window
  aliases:
  - TextGrid text window
  title:
    en: The white text window of the TextGrid editor
    zh: TextGrid 编辑窗口的白色文字窗
  what:
    en: The text field at the top of the TextGrid editor. It shows the label of the interval or point
      under the cursor, and it is the only place where typing changes a label.
    zh: TextGrid 编辑窗口最上方的文字栏位，显示游标所在区间或点的标签，也是唯一能靠打字改变标签的地方。
  how:
    en: Click the interval you want to label, click into the white field, type, and press Enter. The tier
      updates as soon as you commit the text.
    zh: 点要标注的区间，再点进白色栏位，打字后按 Enter，层级会立刻更新。
  pitfalls:
  - en: Typing into the yellow boundary strip does nothing at all, which is the classic beginner trap.
    zh: 在黄色边界条上打字完全没有作用，这是最经典的初学者陷阱。
  - en: The field shows the label of whatever is under the cursor, so move the cursor first if the text
      looks wrong.
    zh: 这个栏位显示的是游标下那个区间或点的标签，如果文字不对，先移动游标。
  keywords:
  - text window
  - 文字窗
  - 打字
  - 标签
  - label
  - textgrid
  - 陷阱
- id: textgrid-with-sound
  aliases:
  - TextGrid with Sound
  title:
    en: Opening a TextGrid with its Sound
    zh: 让 TextGrid 带着声音一起打开
  what:
    en: Praat can show the TextGrid below the sound, so the waveform and the spectrogram stay visible
      while you type the labels.
    zh: Praat 可以把 TextGrid 显示在声音下方，让你打标签时波形与频谱图一直留在画面上。
  how:
    en: In the Objects list, click the TextGrid, hold Ctrl and click the Sound, then click View & Edit
      once. Praat opens one window with the sound above and the tiers below.
    zh: 在 Objects 清单里点 TextGrid，按住 Ctrl 再点 Sound，然后点一次 View & Edit，Praat 会开一个窗口：上面是声音，下面是层级。
  concept:
    en: Segmentation is a hypothesis about the acoustics, so it has to be checked against them. Seeing
      both at once turns labelling from a memory task into a measurement task.
    zh: 切分是对声学事件的假设，所以必须对照声学来检验。两者同时可见，标注才从凭记忆变成真正的量测。
  pitfalls:
  - en: Only one View & Edit is needed; clicking it twice can open a second editor window with the sound
      alone.
    zh: 只要按一次 View & Edit，按两次反而会多开一个只有声音的编辑窗口。
  - en: Ctrl+click adds a second object; a plain click on the Sound replaces the selection.
    zh: 按住 Ctrl 才是加选，直接点 Sound 会取代原本的选取。
  keywords:
  - textgrid with sound
  - 声音与标注
  - ctrl
  - 双选
  - view and edit
  - 声学参照
- id: extract-selected-textgrid
  aliases:
  - Extract selected TextGrid
  control_types:
  - MenuItemControl
  title:
    en: Extract selected TextGrid
    zh: Extract selected TextGrid（取出标注）
  what:
    en: Takes the annotation out of the TextGrid editor and puts it into the Objects list, where it becomes
      a TextGrid object of its own.
    zh: 把标注从 TextGrid 编辑窗口取出来，放进 Objects 清单，成为一个独立的 TextGrid 物件。
  how:
    en: TextGrid → Extract selected TextGrid (preserve times) keeps the original absolute time axis; the
      (time from 0) variant shifts the whole grid to start at zero.
    zh: TextGrid → Extract selected TextGrid (preserve times) 保留原本的绝对时间轴；(time from 0) 这个版本则把整张网格平移到从
      0 开始。
  concept:
    en: 'Extracting is how a careful annotation becomes a durable object: it can then be saved, inspected,
      measured or used in a script.'
    zh: 取出就是让用心的标注变成持久的物件：之后它可以被存档、被检视、被量测，也能写进脚本。
  pitfalls:
  - en: 'Extracting does not save: the object in the list is fine, but the file on disk is still missing.'
    zh: 取出不等于存档：清单里的物件没问题，但硬盘上仍然没有档案。
  - en: Extracting with time from 0 shifts every time reference, which breaks any comparison with the
      original recording.
    zh: 用 time from 0 取出会让所有时间参照平移，与原始录音的任何对照都会错位。
  keywords:
  - extract textgrid
  - 取出
  - textgrid
  - 物件
  - objects list
  - 时间轴
- id: sound-editor-button-row
  aliases:
  - Sound editor button row
  control_types:
  - ButtonControl
  title:
    en: The button row of the Sound editor
    zh: Sound 编辑窗口的按钮列
  what:
    en: 'The row of small controls above the drawing area: the five zoom buttons (all, in, out, sel, bak)
      at the left and the Group checkbox on the right.'
    zh: 绘图区上方的一排小控制：左边是五个缩放按钮（all、in、out、sel、bak），右边是 Group 选框。
  how:
    en: Use the zoom buttons to change how much of the sound you see, and tick Group to tie this window
      to the other editors so they scroll and zoom together.
    zh: 用缩放按钮决定看得到多少声音，勾选 Group 则把这个窗口与其他编辑窗口联结，让它们同步卷动与缩放。
  pitfalls:
  - en: The TextGrid button is drawn by Praat on the canvas, so it does not behave like an ordinary Windows
      button.
    zh: TextGrid 按钮是 Praat 画在画布上的，行为与普通 Windows 按钮不同。
  - en: The five zoom buttons change the time axis only; no analysis setting is touched by them.
    zh: 五个缩放按钮只改变时间轴，不会动到任何分析设定。
  keywords:
  - button row
  - 按钮列
  - zoom buttons
  - group
  - 编辑器
  - 缩放
  - 同步
- id: editor-time-cursor
  aliases:
  - Time cursor
  title:
    en: The time cursor
    zh: 时间游标
  what:
    en: The vertical line in the drawing area that marks one instant on the time axis. Every numeric reading
      in the editor is taken at that instant.
    zh: 绘图区里标示时间轴上某一时刻的垂直线，编辑窗口里每一个数值都是在这一刻取的。
  how:
    en: Click in the drawing area to move the cursor, or place it at an exact time from the Time menu.
      Read values with F5 for pitch, F1 and F2 for formants, F6 for the cursor time and F8 for intensity.
    zh: 在绘图区点击可以移动游标，也可以在 Time 菜单里把它放到精确时刻。按 F5 读基频、F1 与 F2 读共振峰、F6 读游标时刻、F8 读强度。
  concept:
    en: Because the cursor fixes the instant of measurement, moving it by one pixel changes the number.
      A measurement should always be reported together with the time it was taken at.
    zh: 因为游标决定了量测的时刻，移动一个像素数值就变了，所以报告量测结果时要一并说明取值时刻。
  pitfalls:
  - en: Moving the cursor after reading the value does not change the number you have already written
      down.
    zh: 读完数值之后再移动游标，不会改变你已经记下的那个数。
  - en: 'The cursor and the selection are different: some measurements are about the selection, not about
      the cursor.'
    zh: 游标与选区不同，有些量测是关于选区而不是关于游标。
  keywords:
  - time cursor
  - 时间游标
  - 游标
  - cursor
  - f5
  - f6
  - 量测
- id: editor-time-selection
  aliases:
  - Time selection
  title:
    en: The time selection
    zh: 时间选区
  what:
    en: The shaded stretch of the sound between two selection marks. It is the unit that gets played,
      extracted, measured and copied.
    zh: 两个选区记号之间被标示出来的一段声音，播放、取出、量测与复制都以它为单位。
  how:
    en: Drag in the drawing area to select, or type the numbers into the selection fields of the Time
      menu. Then play the selection, or extract it with Sound → Extract selected sound.
    zh: 在绘图区拖曳可以选取，也可以在 Time 菜单的选区栏位输入数字，然后播放选区，或用 Sound → Extract selected sound 把它取出。
  concept:
    en: A selection is a hypothesis about where a phone or a word is, so its boundaries should be moved
      until they line up with the acoustic events you can see.
    zh: 选区是你对某个音素或词位置的假设，所以边界应该移动到与你看得见的声学事件对齐为止。
  pitfalls:
  - en: A rough selection is still played and measured exactly, so a bad selection gives confidently wrong
      numbers.
    zh: 粗估的选区照样会被精确播放与量测，选区不准就会得到看起来很确定的错误数字。
  - en: Extract with preserve times keeps the original time axis; time from 0 shifts everything to the
      start.
    zh: 用 preserve times 取出会保留原本的时间轴，用 time from 0 则把所有时间平移到起点。
  keywords:
  - time selection
  - 时间选区
  - 选区
  - selection
  - 拖曳
  - extract
  - 取出
- id: sound-clipboard
  aliases:
  - Sound clipboard
  title:
    en: The sound clipboard
    zh: 声音剪贴簿
  what:
    en: A place inside Praat that holds one fragment of a sound, ready to be pasted into another sound.
      It is separate from the Windows clipboard.
    zh: Praat 内部的一个位置，放着一段剪下的声音，随时可以贴到另一个声音里，它与 Windows 剪贴簿是分开的。
  how:
    en: Select a stretch of the sound, use Edit → Copy selection to Sound clipboard, then in the other
      sound choose one of the Edit menu's paste commands to put it after or over the selection.
    zh: 先选取一段声音，用 Edit → Copy selection to Sound clipboard，再到另一个声音用 Edit 菜单里的贴上指令，把它贴在选区之后或选区之上。
  concept:
    en: Because it holds samples rather than text, it is the only way to move a fragment of audio between
      two Praat editors without going through a file.
    zh: 因为它装的是样本而不是文字，所以这是把一段音讯在两个 Praat 编辑窗口之间搬动、而不用绕经档案的唯一办法。
  pitfalls:
  - en: Ctrl+C in an editor does not put anything in the Windows clipboard, so pasting into a word processor
      gives you nothing.
    zh: 编辑窗口里的 Ctrl+C 不会把东西放进 Windows 剪贴簿，所以贴进文字处理器是贴不出东西的。
  - en: The sound clipboard holds one fragment at a time, so a second copy replaces the first.
    zh: 声音剪贴簿一次只放一个片段，第二次复制会取代前一个。
  keywords:
  - sound clipboard
  - 声音剪贴簿
  - copy
  - paste
  - 剪贴
  - 复制
  - 贴上
- id: editor-analysis-menus
  aliases:
  - Analysis menus in the Sound editor
  control_types:
  - MenuItemControl
  title:
    en: The five analysis menus
    zh: 五个分析菜单
  what:
    en: 'Spectrogram, Pitch, Intensity, Formants and Pulses are five menus with the same shape: each switches
      its own display on and off, opens its settings, and can read values at the cursor.'
    zh: Spectrogram、Pitch、Intensity、Formants、Pulses 这五个菜单结构相同：各自切换自己的显示、打开自己的设定，也都能在游标处读值。
  how:
    en: Switch on the display you need, for example Pitch → Show pitch, and set the parameters first in
      Pitch settings... before you judge what you see.
    zh: 打开你要的显示，例如 Pitch → Show pitch，并且在判断画面之前先在 Pitch settings... 里把参数设好。
  concept:
    en: 'These five displays are five views of one signal: energy over frequency and time, the dominant
      frequency, the total energy, the resonances of the vocal tract, and the instants of glottal closure.'
    zh: 这五种显示是同一段讯号的五个视图：时频上的能量、主导频率、总能量、声道的共振，以及声带闭合的瞬间。
  pitfalls:
  - en: The display is computed live from the visible sound, so it is not the same thing as the Pitch
      or Formant object in the Objects list.
    zh: 这些显示是从可见声音即时算出来的，与清单里的 Pitch 或 Formant 物件不是同一件事。
  - en: A pitch range that does not contain the voice leaves the contour empty, which looks like missing
      data.
    zh: 基频范围没有框住这个声音时曲线会全空，看起来像资料不见了。
  keywords:
  - analysis menus
  - 分析菜单
  - spectrogram
  - pitch
  - intensity
  - formants
  - pulses
  - 显示
- id: multiple-editor-windows
  aliases:
  - Several editor windows
  title:
    en: Several editor windows at once
    zh: 同时打开多个编辑窗口
  what:
    en: Praat lets you keep several editors open at the same time, for example the sound on top and its
      TextGrid below, and each one keeps its own view.
    zh: Praat 允许同时开着好几个编辑窗口，例如上面是声音、下面是它的 TextGrid，每个窗口各自保留自己的视图。
  how:
    en: Open the Sound, then open the TextGrid, and both windows appear. Push Group in them to make them
      scroll and zoom together.
    zh: 先开 Sound、再开 TextGrid，两个窗口都会出现。在两个窗口都按 Group，它们就会同步卷动与缩放。
  concept:
    en: Comparing a segmentation with the acoustics needs two views on the same sound; grouping removes
      the guesswork of keeping the time axis aligned by eye.
    zh: 要把切分与声学对照，需要同一段声音的两个视图；Group 免去了用眼睛维持时间轴对齐的猜测。
  pitfalls:
  - en: A grouped window cannot be edited; ungroup before cutting and pasting.
    zh: 同步中的窗口不能编辑，要剪贴前先解除同步。
  - en: Students often think the second window has frozen; it is simply showing the same time range.
    zh: 学生常以为第二个窗口卡住了，其实它只是显示同一段时间。
  keywords:
  - editor windows
  - 多个窗口
  - group
  - 同步
  - 对照
  - 比较
- id: window-label-ambiguity
  aliases:
  - Same label, different window
  title:
    en: The same label in different windows
    zh: 同一个名称在不同窗口
  what:
    en: Each Praat window has its own command table, so a label such as Play, File or Select means something
      slightly different depending on where it is.
    zh: Praat 的每个窗口都有自己的指令表，所以 Play、File、Select 这样的名称在不同窗口里意义略有不同。
  how:
    en: 'Check the title bar before you act: the Objects window, the Sound editor, the TextGrid editor
      and the Picture window each have their own File, Edit and Help.'
    zh: 动作之前先看标题列：Objects 窗口、Sound 编辑窗口、TextGrid 编辑窗口与 Picture 窗口各有自己的 File、Edit、Help。
  concept:
    en: 'This is why the manual repeats a command under every window that offers it: the same name is
      a different command in a different window, and a shortcut key follows the window that has the focus.'
    zh: 所以手册会在每个提供该指令的窗口下重复它：同名指令在不同窗口是不同的指令，快捷键则跟着有焦点的窗口走。
  pitfalls:
  - en: Ctrl-O opens a file in the Objects window and zooms out in a sound window.
    zh: Ctrl-O 在 Objects 窗口是开档，在声音窗口是缩小。
  - en: The Help menu of the Objects window and the Help menu of an editor open different pages of the
      manual.
    zh: Objects 窗口的 Help 与编辑窗口的 Help 打开的是手册里不同的页。
  keywords:
  - same label
  - 名称
  - 不同窗口
  - 指令表
  - shortcut
  - 快捷键
  - 菜单
- id: picture-window-viewports
  aliases:
  - Inner and outer viewport
  title:
    en: The inner and the outer viewport
    zh: 内视窗与外视窗
  what:
    en: The Picture window has two drawing areas. The inner viewport holds the data described by the axes;
      the outer viewport is the surrounding margin where titles and captions go.
    zh: Picture 窗口有两个绘图区：内视窗放坐标轴所描述的资料，外视窗是周围的边栏，标题与说明放在那里。
  how:
    en: Select → Mouse selects inner viewport makes the mouse act on the data; the outer viewport is used
      for placing text and the frame around the figure.
    zh: Select → Mouse selects inner viewport 让鼠标作用在资料上；外视窗则用来放文字与图件四周的外框。
  concept:
    en: 'The split keeps the figure honest: text drawn in world coordinates stays attached to the data,
      while text in the outer margin stays where you put it.'
    zh: 这样的分工让图保持诚实：画在世界坐标里的文字会跟着资料走，画在外视窗里的文字则留在你放的位置。
  pitfalls:
  - en: With the mouse set to the outer viewport, clicking in the middle of the figure does nothing and
      the window looks broken.
    zh: 鼠标设定在外视窗时，点在图中央毫无反应，看起来像窗口坏了。
  - en: It is the Select menu, not the Margins menu, that decides which viewport the mouse works on.
    zh: 决定鼠标作用在哪一个视窗的是 Select 菜单，不是 Margins 菜单。
  keywords:
  - viewport
  - 视窗
  - 内视窗
  - 外视窗
  - picture
  - 边栏
  - 图
- id: workflow-record-stereo-sound
  aliases:
  - Record stereo Sound...
  title:
    en: Recording a sound with two channels (stereo)
    zh: 双声道录音（立体声）
  what:
    en: Records with two channels at once, so you can keep two microphones, or two sides of a room, apart.
    zh: 同时录两个声道，让两支麦克风或房间的两侧分开保留。
  how:
    en: Choose New → Record stereo Sound.... In the SoundRecorder you can then copy the whole recording
      into the Objects window, or only the left or the right channel, using the buttons next to the name
      field.
    zh: 选 New → Record stereo Sound...。在 SoundRecorder 窗口里，你可以把整段录音复制到 Objects 窗口，也可以只复制左声道或右声道，用名称输入框旁边的按钮决定。
  concept:
    en: 'Two channels are not automatically two speakers: they are two microphones in two places, so the
      channels differ in level and in timing as well as in timbre.'
    zh: 两个声道并不自动等于两个人的声音，它们是两支放在不同位置的麦克风，所以左右声道在音量、时间与音色上都会不同。
  pitfalls:
  - en: A stereo file read into Praat is one object with two channels; use Read separate channels from
      sound file... if you want one Sound per channel.
    zh: 立体声档案读进 Praat 是一个含两个声道的物件；要左右各一个 Sound，就用 Read separate channels from sound file...。
  - en: Recording in stereo fills the buffer twice as fast, so the maximum recording time is roughly halved.
    zh: 立体声录音消耗缓冲快一倍，所以最长录音时间大约减半。
  keywords:
  - record
  - stereo
  - 录音
  - 立体声
  - 双声道
  - channel
  - 声道
  - microphone
  - 麦克风
  - buffer
  - 缓冲
- id: workflow-stop-recording
  aliases:
  - Stop
  title:
    en: Stop (ending a recording or a playback)
    zh: Stop（停止录音或播放）
  what:
    en: 'Stops whatever is running: in the SoundRecorder it ends the recording, in the editors it cuts
      off the playback.'
    zh: 停止正在进行的动作：在 SoundRecorder 里是结束录音，在编辑窗口里是截断播放。
  how:
    en: In the SoundRecorder, press Stop to end the take; the recording stays in the window until you
      copy it into the Objects window. The Play menu of the Sound editor has a Stop as well, which cuts
      playback short.
    zh: 在 SoundRecorder 里按 Stop 结束这一段，录音还留在窗口里，等你复制出去；声音编辑窗口的 Play 菜单里也有 Stop，可以截断播放。
  concept:
    en: A recording is only stored data once you copy it into the Objects window or write it to disk,
      so Stop by itself never loses anything.
    zh: 录音在复制进 Objects 窗口或写成档案之前都只是暂存资料，所以 Stop 本身不会弄丢东西。
  pitfalls:
  - en: Stop ends the take but does not save it; afterwards you still have to copy the recording into
      the Objects window.
    zh: Stop 只是结束录制，不会存档，之后仍要把录音复制进 Objects 窗口。
  - en: Stop in the Play menu stops the sound, it does not interrupt an analysis that is running.
    zh: Play 菜单里的 Stop 只停声音，不会中止正在跑的分析。
  keywords:
  - stop
  - 停止
  - 录音
  - record
  - playback
  - 播放
  - 结束
  - end
- id: workflow-annotate-textgrid
  aliases:
  - Read from special tier file...
  title:
    en: Annotating a sound with a TextGrid
    zh: 用 TextGrid 标注声音
  what:
    en: A TextGrid is a set of labelled intervals on the time axis of your sound; making one and putting
      boundaries and labels in it turns a recording into linguistic data.
    zh: TextGrid 是声音时间轴上的一组带标签区间；建立它并在里面放边界与标签，就是把一段录音变成语言资料的过程。
  how:
    en: Select the Sound and choose Annotate → To TextGrid... for an empty grid over the same time range,
      or Open → Read from special tier file... for an existing one. Then select the Sound and the TextGrid
      together, click View & Edit, press Enter at the cursor to add a boundary, and type the label.
    zh: 选中 Sound 后选 Annotate → To TextGrid...，会在同样的时间范围上建立空网格；也可以用 Open → Read from special tier file...
      读入已有的标注。同时选中 Sound 与 TextGrid 后点 View & Edit，在游标处按 Enter 加入边界，再在文字方块里输入标签。
  concept:
    en: 'Tiers are your hypotheses about the utterance: one tier for phones, one for syllables or words,
      one point tier for events such as a release burst, all on the sound''s time axis.'
    zh: 各层就是你对这段语流的假设：一层放音素，一层放音节或词，一层放释爆点这类事件，全部共用同一条时间轴。
  pitfalls:
  - en: A TextGrid without its Sound has no waveform, so you cannot see where a sound is; select both
      objects before View & Edit.
    zh: 没有配对 Sound 的 TextGrid 没有波形，看不到声音在哪里；View & Edit 之前要同时选中两个物件。
  - en: Labels belong in the white text field, not in the yellow boundary tier; typing in the tier changes
      nothing.
    zh: 标签要打在白色文字方块里，不是黄色的边界层；在层里打字不会改到标签。
  - en: To TextGrid... creates an empty grid; it does not transcribe anything for you.
    zh: To TextGrid... 只产生空网格，不会帮你转写。
  keywords:
  - annotate
  - textgrid
  - 标注
  - 文本网格
  - tier
  - 层级
  - boundary
  - 边界
  - interval
  - 区间
  - 标签
- id: workflow-sound-editor
  aliases:
  - View spectral slice
  title:
    en: Reading a sound in the Sound editor
    zh: 在声音编辑窗口读声音
  what:
    en: The Sound editor draws the waveform, and usually the spectrogram, the pitch contour and the intensity
      contour, on one shared time axis that you can zoom, measure and annotate.
    zh: 声音编辑窗口把波形，通常还有频谱图、基频曲线与强度曲线，画在同一条时间轴上，你可以放大、量测并标注。
  how:
    en: Select the Sound and click View & Edit. The horizontal axis is time in seconds and the vertical
      axis is amplitude; use the Time menu to zoom, click in the picture to move the cursor, and click
      on the spectrogram to open a spectral slice and read the spectrum at that instant.
    zh: 选中 Sound 后点 View & Edit。横轴是以秒为单位的时间，纵轴是振幅；用 Time 菜单放大，在图上点击移动游标，点频谱图可打开频谱切片，读出那一瞬间的频谱。
  concept:
    en: The waveform shows the signal, the spectrogram shows where its energy sits in frequency, and the
      pitch and intensity curves are analyses drawn on the same axis, so one boundary can be checked against
      all of them at once.
    zh: 波形显示讯号本身，频谱图显示能量落在哪些频率上，基频与强度曲线则是画在同一时间轴上的分析结果，所以一个边界可以同时对照这几种图形来检查。
  pitfalls:
  - en: Clicking in the editor moves the cursor; clicking and dragging selects a time range, and the analysis
      commands then use that selection.
    zh: 在编辑窗口单击是移动游标，按住拖动是选一段时间范围，之后的分析指令用的就是这个选区。
  - en: The zoom commands of the Time menu change the view, not the data; the sound itself is unchanged.
    zh: Time 菜单里的缩放只改变视图，资料本身并没有变。
  - en: 'The white stripes at the very start and end of a spectrogram are normal: the analysis window
      has no data there.'
    zh: 频谱图最开头与最末尾的白边是正常现象，分析窗在那些位置没有资料。
  keywords:
  - sound editor
  - 编辑窗口
  - 波形
  - waveform
  - 时间轴
  - time axis
  - 光标
  - cursor
  - zoom
  - 放大
  - spectrogram
  - 频谱图
- id: workflow-pitch
  aliases:
  - Extract visible pitch contour
  title:
    en: Measuring pitch (F0)
    zh: 量测基频（F0）
  what:
    en: 'Pitch analysis produces a Pitch object: a time series of fundamental frequency estimates with
      a voiced or unvoiced decision for every frame.'
    zh: 基频分析会产生一个 Pitch 物件：随时间变化的基频估计序列，每一格还标出有声或无声。
  how:
    en: Select the Sound, then Analyse periodicity → To Pitch..., and set the pitch floor (75 Hz by default)
      and ceiling (600 Hz by default) so they bracket your speaker. The Pitch object appears in the list;
      in the editor, Extract visible pitch contour copies the drawn contour into a queryable object.
    zh: 选中 Sound 后选 Analyse periodicity → To Pitch...，设定基频下限（预设 75 Hz）与上限（预设 600 Hz），让它们框住说话者的音高。Pitch
      物件会出现在清单里；在编辑窗口里，Extract visible pitch contour 可把画出来的曲线复制成可查询的物件。
  concept:
    en: 'The floor and the ceiling bound the search: the algorithm looks for repetitions between them,
      so a range that is wrong gives octave errors or a flat line rather than a plausible wrong number.'
    zh: 上下限界定了搜索范围：演算法只在这之间找重复周期，所以范围设错会得到八度跳错或一条平线，而不是看似合理的错值。
  pitfalls:
  - en: A floor of 75 Hz with a ceiling of 600 Hz suits a typical adult speaker; the octave error starts
      when the speaker's F0 reaches the ceiling, so raise the ceiling for a child.
    zh: 下限 75 Hz、上限 600 Hz 适合一般成人说话者；八度跳错发生在基频碰到上限的时候，所以儿童的声音要把上限调高。
  - en: An unvoiced consonant has no periodicity; Praat still returns a value or marks the frame unvoiced,
      so check the voicing decisions.
    zh: 清音没有周期性，Praat 仍会给出数值或标成无声，所以有声与无声的判定要自己检查。
  - en: A gap in the contour is an unvoiced frame, not a pitch of zero.
    zh: 曲线上的空缺代表无声，不是音高等于零。
  keywords:
  - pitch
  - 基频
  - f0
  - periodicity
  - 周期性
  - analyse
  - 分析
  - contour
  - 曲线
  - voiced
  - 有声
  - octave
  - 八度
- id: workflow-formant
  aliases:
  - Extract visible formant contour
  title:
    en: Measuring formants
    zh: 量测共振峰
  what:
    en: Formant analysis fits an all-pole LPC model to successive frames of the spectrum and returns the
      resonance frequencies of the vocal tract over time.
    zh: 共振峰分析把全极点 LPC 模型套到频谱的连续分析窗上，回传声道共振频率随时间的变化。
  how:
    en: Select the Sound, then Analyse spectrum → To Formant (burg)...; the dialog asks for the time step,
      the maximum number of formants and the formant range. The Formant object appears in the list; in
      the editor, Extract visible formant contour copies the F1 and F2 curves into a new object.
    zh: 选中 Sound 后选 Analyse spectrum → To Formant (burg)...，对话框会问时间步长、共振峰最大数目与共振峰范围。Formant 物件会出现在清单里；在编辑窗口里，Extract
      visible formant contour 可把看得到的 F1、F2 曲线复制成新物件。
  concept:
    en: The vocal tract acts as a filter and its resonances shape the spectrum; because LPC models poles
      only, it fits formants well but not the anti-resonances of nasals.
    zh: 声道是一个滤波器，它的共振塑造了频谱形状；LPC 只模拟极点，对共振峰拟合得好，对鼻音的反共振却拟合不了。
  pitfalls:
  - en: 'The formant range has to match the speaker: Praat''s standard 5500 Hz suits an adult female voice,
      about 5000 Hz an adult male and about 8000 Hz a young child.'
    zh: 共振峰范围必须配合说话者：Praat 的预设 5500 Hz 适合成年女性，成年男性约 5000 Hz，幼童约 8000 Hz。
  - en: More formants is not better; the extra poles usually fit the noise floor rather than real resonances.
    zh: 共振峰不是越多越好，多出来的极点通常只是在拟合杂讯底噪。
  - en: A formant that jumps by a factor of two between frames is usually a tracking failure, not a real
      acoustic event.
    zh: 共振峰在相邻两格之间跳了一倍，多半是 LPC 追踪失败，不是真实的声学事件。
  keywords:
  - formant
  - 共振峰
  - lpc
  - burg
  - 频谱
  - spectrum
  - analyse
  - 分析
  - f1
  - f2
  - 声道
  - vocal tract
- id: workflow-intensity
  aliases:
  - Extract visible intensity contour
  title:
    en: Measuring intensity
    zh: 量测强度
  what:
    en: Intensity analysis turns the waveform into a contour of short-time energy in dB, which follows
      the syllabic peaks and the stress of the utterance.
    zh: 强度分析把波形变成以 dB 表示的短时能量曲线，用来追踪音节峰值与语流的重音。
  how:
    en: Select the Sound and click To Intensity...; Praat asks for the pitch floor, the minimum pitch that
      has to be resolved (100 Hz by default) and adds an Intensity object to the list. Draw it with Plot,
      or copy the curve out of the editor with Extract visible intensity contour.
    zh: 选中 Sound 后点 To Intensity...，Praat 会问必须分辨的最低基频（Pitch floor，预设 100 Hz），然后在清单里加上一个 Intensity 物件。用 Plot 画出来，或用
      Extract visible intensity contour 把编辑窗口里的曲线复制出来。
  concept:
    en: 'Intensity is an energy measure: it is the short-time energy of the signal in dB relative to the
      hearing threshold, so it inherits the periodicity of the voice.'
    zh: 强度是能量量：它把分析窗内的信号短时能量换算成 dB，以听觉阈值为零点，因此会带上声带周期的起伏。
  pitfalls:
  - en: 'The pitch floor sets the length of the analysis window (3.2 divided by the pitch floor): set it
      too high for the speaker and the curve ripples at the pitch period, set it too low and the curve
      is smeared.'
    zh: 最低基频（Pitch floor）决定分析窗的长度（3.2 除以最低基频）：设得比说话者的基频还高，曲线上会出现音高周期的波纹；设得太低，曲线则被抹平。
  - en: Do not read intensity as loudness; it says nothing about pitch or spectral shape.
    zh: 不要把强度当成响度，它既不讲音高也不讲频谱形状。
  - en: Higher on the plot means more energy on an absolute scale (0 dB is the hearing threshold), but an
      uncalibrated recording means the level is not a true SPL.
    zh: 曲线较高表示能量较多，刻度是绝对的（0 dB 为听觉阈值），但未校正的录音得不到真正的声压级。
  keywords:
  - intensity
  - 强度
  - 能量
  - energy
  - db
  - contour
  - 曲线
  - 分析
  - analyse
  - 响度
- id: workflow-convert
  aliases:
  - Convert to stereo
  - Convert to mono
  title:
    en: Converting a sound to another representation
    zh: 把声音转成另一种表示
  what:
    en: 'The Convert button changes how a sound is represented without changing the recording itself:
      another channel layout, another sampling frequency, or another kind of object.'
    zh: Convert 按钮改变声音的表现方式，而不是录音内容：换声道配置、换取样频率，或换成另一种物件。
  how:
    en: Select the Sound and click Convert. The leaves include Convert to mono and Convert to stereo,
      Resample..., Extract part..., and commands that turn the sound into a Pitch, Intensity or Manipulation
      object. Each choice adds a new object to the list and leaves the original untouched.
    zh: 选中 Sound 后点 Convert，其中的项目包括 Convert to mono、Convert to stereo、Resample...、Extract part...，以及把声音转成
      Pitch、Intensity 或 Manipulation 物件的指令。每个选择都会在清单里加上新物件，原件不受影响。
  concept:
    en: 'Resampling changes the sampling frequency and therefore the usable frequency range: at 16 kHz
      the Nyquist limit is 8 kHz, so nothing above that survives in the file.'
    zh: 重取样会改变取样频率，也因此改变可用频率范围：16 kHz 时奈奎斯特上限是 8 kHz，超过 8 kHz 的成分就不存在了。
  pitfalls:
  - en: Resampling down throws away frequency information; never resample before an analysis you intend
      to publish.
    zh: 向下重取样会丢掉频率资讯，要发表的分析绝不要在重取样之后才做。
  - en: Convert to mono averages the channels and can change the timbre noticeably on a stereo recording.
    zh: Convert to mono 是把左右声道平均，立体声录音的音色可能明显改变。
  - en: Extract part... takes a time slice out of the sound; the new object is a copy, the original is
      not cut.
    zh: Extract part... 取的是声音的一段，新物件是副本，原件不会被挖掉。
  keywords:
  - convert
  - 转换
  - mono
  - mono
  - stereo
  - 单声道
  - 立体声
  - resample
  - 重取样
  - extract part
  - 取出
- id: workflow-export-results
  aliases:
  - Save as tab-separated file...
  - Save as comma-separated file...
  - Save as semicolon-separated file...
  title:
    en: Getting your results out of Praat
    zh: 把结果带出 Praat
  what:
    en: Objects live in memory and disappear when Praat closes; the Save menu writes them to a file that
      other software can read.
    zh: 物件活在记忆体里，关掉 Praat 就消失；Save 菜单把它们写成档案，让别的软体也读得到。
  how:
    en: 'Select the object, then choose a command from the Save menu: Save as tab-separated file... for
      a Table, Save as WAV file... for a Sound, Save as text file... for any object, and Save TextGrid
      as text file... in the TextGrid editor for annotation. Give the file a name and a folder, then confirm.'
    zh: 先选中物件，再从 Save 菜单挑指令：Table 用 Save as tab-separated file...，声音用 Save as WAV file...，任何物件用 Save as
      text file...，标注则在 TextGrid 编辑窗口用 Save TextGrid as text file...。指定档名与资料夹后确认。
  concept:
    en: 'A Praat object and its file are two different things: the file is a snapshot in a format other
      programs can read, the object stays in memory with Praat''s own types.'
    zh: Praat 物件与档案是两回事：档案是写下来、别的程式也读得懂的快照，物件则留在记忆体里，带着 Praat 自己的型别。
  pitfalls:
  - en: Save only affects the selected object; objects derived from it are not saved with it.
    zh: Save 只作用于选中的物件，衍生出来的下游物件不会跟着一起存。
  - en: Saving a Sound as a WAV file keeps the sampling frequency but not your microphone calibration.
    zh: 声音存成 WAV 会保留取样频率，但不会保留麦克风的校正值。
  - en: 'Export the annotation before you clean up the Objects list: removing the Sound also removes its
      TextGrid.'
    zh: 清理 Objects 清单前先把标注汇出；移除 Sound 会连它的 TextGrid 一起移除。
  keywords:
  - save
  - 储存
  - 存盘
  - 汇出
  - export
  - tab separated
  - 定位字元
  - table
  - 表格
  - wav
  - 档案
  - file
- id: workflow-open-praat-script
  aliases:
  - Open Praat script...
  title:
    en: Reopening a saved script
    zh: 重新打开已存的脚本
  what:
    en: Opens a .praat file from disk in the script editor, so a script you wrote last week is one click
      away.
    zh: 把硬盘上的 .praat 档在脚本编辑窗口打开，让你上周写的脚本一下就能用到。
  how:
    en: Choose Praat → Open Praat script..., pick the file, and the script appears in the editor; from
      a new script you reach the same place with File → Open.... Save it under a clear name, because the
      file name is what you will recognise in the folder.
    zh: 选 Praat → Open Praat script...，选择档案，脚本就出现在编辑窗口里；从新建的脚本用 File → Open... 也能到同一处。存档时给个清楚的名字，因为日后在资料夹里靠的就是这个档名。
  concept:
    en: Scripts are plain text, so they can be versioned, mailed and read by anyone; a script that documents
      an analysis is better evidence than a screenshot of it.
    zh: 脚本是纯文字，所以可以纳入版本管制、可以电邮、任何人都读得懂；一个记录分析过程的脚本，比一张截图更有说服力。
  pitfalls:
  - en: Opening a script does not run it; you still press Run yourself.
    zh: 打开脚本不会自动执行，还是要自己按 Run。
  - en: The script works on the objects that are in the list at that moment, so select the sound before
      you press Run.
    zh: 脚本作用在当下清单里的物件，所以按 Run 之前先把声音选好。
  keywords:
  - open script
  - 打开脚本
  - praat script
  - 脚本
  - .praat
  - 编辑器
  - editor
  - 档案
  - file
  - 重开
- id: workflow-formulas-tutorial
  aliases:
  - Formulas tutorial
  title:
    en: The formula language (numbers, strings, arrays)
    zh: 公式语言（数字、文字、阵列）
  what:
    en: The tutorial for Praat's formula language, the notation used to calculate with objects and to
      fill tables and matrices.
    zh: Praat 公式语言的教学，也就是用来计算物件、填表格与矩阵的记法。
  how:
    en: 'Help → Formulas tutorial opens it in your browser. Formulas appear in dialogs such as Sound:
      Formula..., in scripts after the word formula, and in the Table and Matrix editors.'
    zh: 'Help → Formulas tutorial 会在浏览器里打开。公式出现在像 Sound: Formula... 这样的对话框里、脚本中 formula 关键字之后，以及 Table
      与 Matrix 编辑窗口中。'
  concept:
    en: A formula works on the attributes of an object, for example the samples of a sound or the cells
      of a matrix, so one expression can rewrite or summarise a whole object.
    zh: 公式作用在物件的属性上，例如声音的样本或矩阵的格子，所以一个表达式就能改写或总结整个物件。
  pitfalls:
  - en: In a formula x is time in seconds, so sin (2*pi*1000*x) is a 1000 Hz tone while sin (1000*x) is
      not.
    zh: 公式中的 x 是以秒为单位的時間，sin (2*pi*1000*x) 才是 1000 Hz 正弦波，sin (1000*x) 不是。
  - en: A formula changes the object in place; make a copy first if the original has to stay intact.
    zh: 公式是就地改变物件的，原件要保留就先复制一份。
  - en: The scripting tutorial assumes the formula language, so read the formulas tutorial first.
    zh: 脚本教学预设你已经懂公式语言，所以先读公式教学。
  - en: A script is plain text, so an editor that adds smart quotes or changes the encoding will break
      it.
    zh: 脚本是纯文字，用会自动换引号或改变编码的编辑器存档会破坏脚本。
  keywords:
  - formula
  - 公式
  - 计算
  - tutorial
  - 教学
  - matrix
  - 矩阵
  - table
  - 表格
  - 数字
  - numbers
- id: type-sound
  aliases:
  - Sound type
  title:
    en: The Sound type
    zh: Sound 类型
  what:
    en: 'The type name of a sampled waveform in the Objects list, where it appears as 1. Sound demo_vowel:
      a start time, a duration, a sampling frequency and the samples themselves.'
    zh: 清单里取样波形的类型名，显示为「1. Sound demo_vowel」：装着起始时间、长度、采样率与样本本身。
  how:
    en: Read one with Open → Read from file..., record one with New → Record mono Sound..., or synthesise
      one with New → Sound → Create Sound from formula.... Select it and click View & Edit to see the
      waveform.
    zh: 用 Open → Read from file... 读入，用 New → Record mono Sound... 录音，或用 New → Sound → Create Sound from
      formula... 合成。选中后点 View & Edit 就看得到波形。
  concept:
    en: A Sound is the only object that carries the recording itself. Every Pitch, Formant, Intensity
      and Spectrogram object is an interpretation of it, computed from the same samples.
    zh: Sound 是唯一承载录音本身的物件，Pitch、Formant、Intensity 与 Spectrogram 都是从同一批样本算出来的解释。
  pitfalls:
  - en: The number in front of the type is the object index, so 2. Sound demo_vowel is the second object,
      not a second channel.
    zh: 类型前面的数字是物件编号，「2. Sound demo_vowel」表示第二个物件，不是第二个声道。
  - en: A Sound read from disk is a copy in memory; the file on disk only changes when you save it.
    zh: 从磁盘读进来的 Sound 是记忆体里的副本，硬盘上的档案要存过才会改变。
  - en: Renaming the object does not rename the file.
    zh: 改物件名称不会改到硬盘上的档名。
  keywords:
  - sound
  - type
  - 声音
  - 类型
  - 对象
  - 物件
  - 波形
  - 采样率
- id: type-pitch
  aliases:
  - Pitch type
  title:
    en: The Pitch type
    zh: Pitch 类型
  what:
    en: 'The type name of a fundamental frequency track in the Objects list: one F0 estimate per analysis
      frame, plus a voiced or unvoiced decision for every frame.'
    zh: 基频轨迹的类型名：每个分析窗一个 F0 估计值，每一格还标出有声或无声。
  how:
    en: Create it from a Sound with Analyse periodicity → To Pitch.... In the list it shows as 3. Pitch;
      Plot draws the contour and Query reads the value at the cursor.
    zh: 由 Sound 用 Analyse periodicity → To Pitch... 产生。清单里显示为「3. Pitch」，Plot 画曲线，Query 读游标处的数值。
  concept:
    en: 'Pitch is an estimate, not a truth: the algorithm searches for repetitions between the pitch floor
      and ceiling you set, so a wrong range gives octave errors rather than a plausible wrong number.'
    zh: 基频是估计值而不是真相：演算法只在你设定的上下限之间找重复周期，所以范围设错会得到八度跳错，而不是看似合理的错值。
  pitfalls:
  - en: A gap in the contour means an unvoiced frame, not zero hertz.
    zh: 曲线上的空缺代表无声格，不是 0 Hz。
  - en: The pitch contour drawn in the editor uses its own settings and can differ from the Pitch object
      in the list.
    zh: 编辑窗口里画出的基频曲线用自己的设定，可能与清单里的 Pitch 物件不一致。
  - en: A Pitch object is data you can query frame by frame, not a picture.
    zh: Pitch 物件是可以逐格查询的资料，不是图。
  keywords:
  - pitch
  - 基频
  - f0
  - 类型
  - object
  - 物件
  - voiced
  - 有声
  - octave
  - 八度
- id: type-intensity
  aliases:
  - Intensity type
  title:
    en: The Intensity type
    zh: Intensity 类型
  what:
    en: 'The type name of an intensity contour in the Objects list: the short-time energy of the sound
      in dB relative to the hearing threshold, one value per analysis frame.'
    zh: 强度曲线的类型名：声音短时能量的 dB 值（以听觉阈值为零点），每个分析窗一个。
  how:
    en: Make it with the To Intensity... command on a selected Sound, then click Plot to draw the contour.
      The dialog asks for the pitch floor you want to resolve.
    zh: 在选中的 Sound 上用 To Intensity... 产生，再点 Plot 画出曲线。对话框会问你希望分辨的最低基频。
  concept:
    en: Intensity is an energy measure, so it follows syllabic peaks and stress rather than fine structure,
      and its dB reference is the hearing threshold, the same for every file.
    zh: 强度是能量量，所以跟着音节峰值与重音走而不反映精细结构，它的 dB 基准是听觉阈值，每个档案都一样。
  pitfalls:
  - en: Higher on the contour does not automatically mean louder speech; the scale is absolute, so an
      uncalibrated recording is not a true SPL.
    zh: 曲线较高不一定代表说得更响；刻度是绝对的，所以未校正的录音不是真正的声压级。
  - en: With a pitch floor above the speaker's own F0 the curve ripples at the pitch period on a high voice.
    zh: 最低基频（Pitch floor）设得比说话者自己的基频还高时，高音声线的曲线上会出现音高周期的波纹。
  keywords:
  - intensity
  - 强度
  - 类型
  - energy
  - 能量
  - db
  - contour
  - 曲线
- id: type-textgrid
  aliases:
  - TextGrid type
  title:
    en: The TextGrid type
    zh: TextGrid 类型
  what:
    en: 'The type name of an annotation grid in the Objects list: labelled intervals and points that all
      share one time axis.'
    zh: 标注网格的类型名：共用同一时间轴的标注区间与点。
  how:
    en: Create it from a Sound with Annotate → To TextGrid..., or from scratch with New → Create TextGrid....
      Select it together with its Sound and click View & Edit to annotate.
    zh: 由 Sound 用 Annotate → To TextGrid... 产生，或用 New → Create TextGrid... 从头建立。选中它连同 Sound 再点 View &
      Edit 就能标注。
  concept:
    en: A TextGrid is your hypothesis about the utterance, not evidence. It shares the sound's time axis,
      which is what lets a segment boundary be read against a formant value.
    zh: TextGrid 是你对这段语流的假设而不是证据。它与声音共用时间轴，所以音段边界才能对着共振峰数值来读。
  pitfalls:
  - en: 'A TextGrid knows nothing about acoustics: the labels are yours and they can be wrong.'
    zh: TextGrid 不含任何声学资讯，标签是你自己打的，可能是错的。
  - en: TextGrid and Sound are separate objects, so removing the sound leaves the annotation behind, but
      the annotation then means nothing.
    zh: TextGrid 与 Sound 是两个独立物件，移除声音会留下标注，只是那标注从此失去意义。
  keywords:
  - textgrid
  - 文本网格
  - 类型
  - annotation
  - 标注
  - tier
  - 层级
- id: type-formant
  aliases:
  - Formant
  title:
    en: The Formant type
    zh: Formant 类型
  what:
    en: 'The type name of a formant track in the Objects list: formant frequencies and bandwidths estimated
      for each analysis frame.'
    zh: 共振峰轨迹的类型名：每个分析窗估计出的共振峰频率与频宽。
  how:
    en: Make it with Analyse spectrum → To Formant (burg)..., then Plot to draw F1, F2 and F3 over time,
      or Query to read a single value.
    zh: 用 Analyse spectrum → To Formant (burg)... 产生，再用 Plot 画出 F1、F2、F3 曲线，或用 Query 读取单值。
  concept:
    en: A formant is a resonance of the vocal tract, that is a peak of the spectral envelope. The tract
      filters the glottal source, so vowel quality is largely the shape of these peaks.
    zh: 共振峰是声道的共振，也就是频谱包络上的峰。声道替声门音源滤波，所以元音音色大致就是这些峰的形状。
  pitfalls:
  - en: Formants are meaningful only for vowels and voiced sonorants, although Praat happily returns numbers
      for fricatives.
    zh: 共振峰只对元音与有声响音有意义，Praat 却照样会给擦音返回数值。
  - en: A formant that jumps by a factor of two between frames is usually a tracking failure, not a real
      acoustic event.
    zh: 共振峰在相邻两格之间跳了一倍，多半是追踪失败，不是真实的声学事件。
  keywords:
  - formant
  - 共振峰
  - f1
  - f2
  - f3
  - 类型
  - lpc
  - 频宽
  - bandwidth
- id: type-formantgrid
  aliases:
  - FormantGrid
  title:
    en: The FormantGrid type
    zh: FormantGrid 类型
  what:
    en: 'The type name of a formant grid in the Objects list: formant and bandwidth targets stored as
      points in time, not as evenly spaced frames.'
    zh: 共振峰网格的类型名：共振峰与频宽以时间上的点（目标值）储存，而不是等距的分析窗。
  how:
    en: 'Create one with New → Tiers → Create FormantGrid..., add points to its formant and bandwidth
      tiers, and use Sound & FormantGrid: Filter to synthesise a sound from it.'
    zh: '用 New → Tiers → Create FormantGrid... 建立，在共振峰层与频宽层加点，再用 Sound & FormantGrid: Filter 由它合成声音。'
  concept:
    en: A FormantGrid is a target model of the vocal tract filter, so you can change the formants and
      hear the result. That is how source-filter experiments are built.
    zh: FormantGrid 是声道滤波器的目标模型，你可以改变共振峰再听结果，音源滤波实验就是这样搭出来的。
  pitfalls:
  - en: 'It is not the Formant object: FormantGrid holds editable targets, Formant holds measured frames.'
    zh: 它不是 Formant 物件：FormantGrid 放可编辑的目标，Formant 放量测到的分析窗。
  - en: Values are interpolated between points, so two far apart points describe a smooth slide rather
      than a constant.
    zh: 点与点之间是内插的，两个相距很远的点描述的是平滑滑动而不是固定值。
  keywords:
  - formantgrid
  - 共振峰网格
  - 目标
  - target
  - 合成
  - synthesis
  - 类型
- id: type-spectrogram
  aliases:
  - Spectrogram type
  title:
    en: The Spectrogram type
    zh: Spectrogram 类型
  what:
    en: 'The type name of a spectrogram in the Objects list: a time-by-frequency array of energy densities
      computed from a sound.'
    zh: 频谱图的类型名：由声音算出的时间乘以频率的能量密度阵列。
  how:
    en: Make it with Analyse spectrum → To Spectrogram..., then View & Edit to display it. The window
      length, frequency range and dynamic range you chose are fixed inside the object.
    zh: 用 Analyse spectrum → To Spectrogram... 产生，再用 View & Edit 显示。你选的窗长、频率范围与动态范围已经固定在物件里。
  concept:
    en: A spectrogram is a stack of spectra over time, so it trades time resolution against frequency
      resolution, and the window length decides both.
    zh: 频谱图是时间上的一叠频谱，因此要在时间解析度与频率解析度之间取舍，而窗长同时决定这两者。
  pitfalls:
  - en: Changing the display settings later does not recompute the object.
    zh: 之后改显示设定并不会重新计算这个物件。
  - en: A window that is too long smears the transitions you are trying to label.
    zh: 窗太长会把你要标注的过渡抹平。
  keywords:
  - spectrogram
  - 频谱图
  - 类型
  - 窗长
  - window
  - 能量
  - energy
- id: type-table
  aliases:
  - Table
  title:
    en: The Table type
    zh: Table 类型
  what:
    en: 'The type name of a spreadsheet in the Objects list: named columns that hold numbers or text,
      one row per observation.'
    zh: 试算表的类型名：有名称的栏位，可以放数字或文字，一列一个观察值。
  how:
    en: Create one with New → Tables → New Table..., read one with Open → Read Table from tab-separated
      file..., and edit it in the Table editor.
    zh: 用 New → Tables → New Table... 建立，或用 Open → Read Table from tab-separated file... 读入，再在 Table 编辑窗口里修改。
  concept:
    en: 'The Table is where per-token measurements live: duration, mean F0, F1 and F2 in one row per token,
      which is the format every statistics package can read.'
    zh: Table 是逐语流量测结果的归属地：时长、平均 F0、F1 与 F2，一列一个语流，任何统计软体都读得懂。
  pitfalls:
  - en: Mixing text and numbers in one column turns the whole column into text and blocks arithmetic on
      it.
    zh: 同一栏混放文字与数字会让整栏变成文字，之后无法对这一栏做算术。
  - en: A Table has no time axis, so keep the time step or the token times somewhere else.
    zh: Table 没有时间轴，时间步长或语流时间要记在别处。
  keywords:
  - table
  - 表格
  - 试算表
  - 类型
  - column
  - 栏位
  - measurement
  - 量测
- id: type-tableofreal
  aliases:
  - TableOfReal
  title:
    en: The TableOfReal type
    zh: TableOfReal 类型
  what:
    en: 'The type name of a numeric table in the Objects list: rows and columns of real numbers, where
      every row and column may carry a title.'
    zh: 数值表的类型名：实数构成的行列，每一行与每一列都可以带标题。
  how:
    en: Read one with Open → Read TableOfReal from headerless spreadsheet file..., or create one with
      Create TableOfReal... in the New → Tables submenu, and label rows and columns with the Change row
      labels... and Set column label commands.
    zh: 用 Open → Read TableOfReal from headerless spreadsheet file... 读入，或用 New → Tables 里的 Create TableOfReal...
      建立，再用 Change row labels... 与 Set column label 等指令加标签。
  concept:
    en: 'A TableOfReal is the input format of Praat''s statistics: correlation, principal component analysis
      and covariance all take labelled numeric tables rather than free spreadsheets.'
    zh: TableOfReal 是 Praat 统计功能的输入格式：相关分析、主成分分析与协方差都吃带标签的数值表，而不是随意的试算表。
  pitfalls:
  - en: All values are numbers, so a missing cell cannot be typed as a dash or as NA.
    zh: 所有格都是数字，缺失值不能写成破折号或 NA。
  - en: Row labels carry the grouping variable, so a table read without headers has to be labelled by
      hand.
    zh: 列标签带着分组变数，所以读进来没有标题的表要自己补标签。
  keywords:
  - tableofreal
  - 数值表
  - 类型
  - 统计
  - statistics
  - row label
  - 列标签
- id: type-matrix
  aliases:
  - Matrix
  title:
    en: The Matrix type
    zh: Matrix 类型
  what:
    en: The type name of a plain two-dimensional array of numbers in the Objects list, without row or
      column labels.
    zh: 二维数字阵列的类型名，没有行列标签。
  how:
    en: Create one with New → Tables → New Matrix... or read one with Open → Read Matrix from raw text
      file...; the Table editor shows it as a grid of numbers.
    zh: 用 New → Tables → New Matrix... 建立，或用 Open → Read Matrix from raw text file... 读入，Table 编辑窗口会把它显示成数字网格。
  concept:
    en: 'A Matrix is what you get when the labels are dropped: a rectangular array of numbers, which suits
      surfaces such as a frequency-by-time energy map.'
    zh: Matrix 就是去掉标签之后的表：规则的数值阵列，适合放频率乘以时间的能量表面这类资料。
  pitfalls:
  - en: Rows and columns are easy to swap, and a transposed matrix still looks plausible with every value
      in the wrong place.
    zh: 列与行很容易不小心对调，转置后的矩阵看起来仍然合理，但每个数值都错位了。
  - en: Use Convert → Down to Matrix to get the raw numbers out of a Pitch or Intensity object.
    zh: 用 Convert → Down to Matrix 可以把 Pitch 或 Intensity 物件变成原始数字。
  keywords:
  - matrix
  - 矩阵
  - 类型
  - 二维
  - 阵列
  - numbers
  - 数字
  - grid
  - 网格
- id: type-strings
  aliases:
  - Strings
  title:
    en: The Strings type
    zh: Strings 类型
  what:
    en: 'The type name of a list of strings in the Objects list: an ordered sequence of text items, such
      as a list of file names.'
    zh: 字串清单的类型名：一串有顺序的文字项目，例如一串档名。
  how:
    en: Read one with Open → Read Strings from raw text file..., which takes one string per line. The
      New menu can also build a Strings object from a folder listing.
    zh: 用 Open → Read Strings from raw text file... 读入，一行一个字串。New 菜单也可以由资料夹清单建立一个 Strings 物件。
  concept:
    en: 'Strings is Praat''s simplest data structure: text only, no numbers and no time, which makes it
      the natural index for a set of recordings.'
    zh: Strings 是 Praat 最简单的资料结构：只装文字，没有数字也没有时间，因此很适合当一组录音的索引。
  pitfalls:
  - en: Every line becomes one string, so a trailing empty line adds an empty item.
    zh: 每一行都会变成一个字串，结尾多一行空行就会多出一个空项目。
  - en: A Strings object cannot hold the numbers of a measurement; use a Table for that.
    zh: Strings 装不下量测数值，那种资料要用 Table。
  keywords:
  - strings
  - 字串
  - 类型
  - 清单
  - list
  - 档名
  - filename
  - 文字
- id: type-corpus
  aliases:
  - Corpus
  title:
    en: The Corpus type
    zh: Corpus 类型
  what:
    en: 'The type name of a corpus in the Objects list: a table whose two columns, Sound and Annotation,
      pair each sound file in a folder with the annotation file of the same name.'
    zh: 语料库的类型名：一个两栏的表格，Sound 与 Annotation 两栏把资料夹里的每个声音档与同名标注档配成一对。
  how:
    en: Make it with New → Create Corpus..., choosing the folder with sound files, the sound file extension,
      the annotation folder and the annotation extension. One row appears per sound file.
    zh: 用 New → Create Corpus... 建立，指定声音档资料夹、音档副档名、标注资料夹与标注副档名，每个声音档会出现一列。
  concept:
    en: 'A Corpus is a Table in Praat''s technical sense, but its meaning is fixed: one row per recording,
      with the two file names that belong together, which is a complete but compact description of one.'
    zh: 在 Praat 的技术意义上 Corpus 就是 Table，但它的意义是固定的：一列一个录音，配上属于同一笔的两个档名，这是简明却完整的描述。
  pitfalls:
  - en: The Corpus only stores file names, so nothing is read into memory and the table stays small.
    zh: Corpus 只存档名，不会把任何东西读进记忆体，所以表格一直很小。
  - en: Both extensions must match the files on disk, otherwise the table comes out empty or half filled.
    zh: 两个副档名都要和硬盘上的档案吻合，否则表格会全空或只有一半。
  - en: The Annotation column is filled only for the recordings whose annotation file actually exists.
    zh: 只有标注档确实存在的录音，Annotation 那一栏才会填上档名。
  keywords:
  - corpus
  - 语料库
  - 类型
  - 资料夹
  - folder
  - 标注
  - annotation
  - 配对
- id: type-texttier
  aliases:
  - TextTier
  title:
    en: The TextTier type
    zh: TextTier 类型
  what:
    en: 'The type name of a point tier in Praat 6.4: a tier of labelled points, each with a time and a
      mark, inside a TextGrid.'
    zh: Praat 6.4 点层的类型名：一层带标签的点，每点有时间与标记，属于 TextGrid 之中。
  how:
    en: Create one with Annotate → To TextTier, or add it in the TextGrid editor with Tier → Add point
      tier.... The label of a point is typed in the white text window at the top.
    zh: 用 Annotate → To TextTier 建立，或在 TextGrid 编辑窗口用 Tier → Add point tier... 加入。点的标签打在顶部的白色文字窗里。
  concept:
    en: 'A point tier records events that happen at an instant rather than over an interval: a fricative
      release burst, a glottal stop, a word boundary.'
    zh: 点层用来记发生在某一瞬间而不是延续一段时间的事件：擦音的释爆点、喉塞闭合、词界。
  pitfalls:
  - en: A point has no duration, so a phone label in a point tier loses the timing of the phone.
    zh: 点没有时长，把音素标签放进点层会丢掉音素的起止时间。
  - en: Older manuals call this type PointTier; Praat 6.4 names it TextTier.
    zh: 旧手册把这个类型写成 PointTier，Praat 6.4 的名称是 TextTier。
  keywords:
  - texttier
  - 点层
  - 层级
  - tier
  - point
  - 点
  - 类型
  - 事件
  - event
- id: type-intervaltier
  aliases:
  - IntervalTier
  title:
    en: The IntervalTier type
    zh: IntervalTier 类型
  what:
    en: 'The type name of an interval tier: a sequence of labelled intervals that follow one another and
      cover the whole time domain.'
    zh: 区间层的类型名：一串首尾相接、覆盖整个时间范围的带标签区间。
  how:
    en: Create one with Annotate → To IntervalTier, or add it in the TextGrid editor with Tier → Add interval
      tier.... Each boundary splits the tier, and each interval carries a label.
    zh: 用 Annotate → To IntervalTier 建立，或在 TextGrid 编辑窗口用 Tier → Add interval tier... 加入。每个边界把该层分开，每个区间带一个标签。
  concept:
    en: 'An interval tier has the shape of a phonetic transcription: every instant of the recording belongs
      to exactly one labelled segment.'
    zh: 区间层正是语音转写的形状：录音的每一瞬间都恰好属于一个有标签的音段。
  pitfalls:
  - en: The tier covers the whole time domain, so there is always one interval even where you have typed
      nothing.
    zh: 这一层覆盖整个时间范围，所以即使没打字也总有一个区间。
  - en: Adding a boundary in one tier does not move the boundaries of the other tiers.
    zh: 在一层里加边界不会移动其他层的边界。
  keywords:
  - intervaltier
  - 区间层
  - 层级
  - tier
  - 音段
  - segment
  - 类型
- id: type-pointtier
  aliases:
  - PointTier
  title:
    en: PointTier, the older name for a point tier
    zh: PointTier，点层的旧名称
  what:
    en: The older name for a point tier. In Praat 6.4 the type is called TextTier and the command is To
      TextTier, but PointTier is still what many manuals and scripts use.
    zh: 点层的旧名称。Praat 6.4 的类型名称是 TextTier、指令是 To TextTier，但许多手册与脚本仍写 PointTier。
  how:
    en: If a script or a tutorial says PointTier, read it in Praat 6.4 as the point tier you create with
      Annotate → To TextTier.
    zh: 如果脚本或教学写 PointTier，在 Praat 6.4 里就把它当作用 Annotate → To TextTier 建立的点层。
  concept:
    en: 'The rename is only a name change: the data structure, the way a point is stored and the way you
      edit it have not changed.'
    zh: 这只是改了个名字：资料结构、点的储存方式与编辑方式都没有变。
  pitfalls:
  - en: Mixing the two names in one set of notes confuses students, because it is the same thing either
      way.
    zh: 在同一份讲义里混用两个名字会让学生困惑，因为指的都是同一个东西。
  keywords:
  - pointtier
  - 点层
  - 旧名称
  - 层级
  - texttier
  - tier
  - point
  - 改名
- id: type-durationtier
  aliases:
  - DurationTier
  title:
    en: The DurationTier type
    zh: DurationTier 类型
  what:
    en: 'The type name of a duration tier: points that carry a relative duration, used to stretch or compress
      a recording in time.'
    zh: 时长层的类型名：带着相对时长的点，用来把录音在时间上拉长或压短。
  how:
    en: 'Create one with New → Tiers → Create DurationTier..., or extract it from a Manipulation object
      with Manipulate: Extract duration tier.'
    zh: '用 New → Tiers → Create DurationTier... 建立，或用 Manipulate: Extract duration tier 从 Manipulation
      物件取出。'
  concept:
    en: 'The duration value is relative: a point with duration 1.5 at 0.5 s means everything before that
      moment is played 1.5 times as slowly, with linear interpolation between points.'
    zh: 这里的时长是相对值：在 0.5 秒处放一个时长 1.5 的点，表示那一刻之前的音都按 1.5 倍速度播放，点与点之间做线性内插。
  pitfalls:
  - en: The tier says how time should change; it contains no audio of its own.
    zh: 这一层描述时间该怎么改变，本身不含声音。
  - en: The values are relative, so 1.0 means the original speed and not one second.
    zh: 数值是相对值，1.0 表示原速，不是一秒。
  keywords:
  - durationtier
  - 时长层
  - 层级
  - 相对时长
  - duration
  - manipulation
  - 类型
- id: concept-sound-file-formats
  aliases:
  - Sound files
  title:
    en: Sound files on disk
    zh: 硬盘上的音档
  what:
    en: 'The files Praat reads as Sound or LongSound objects: WAV, AIFF, FLAC, MP3, Ogg and others, each
      with a header that declares its sampling frequency and its channels.'
    zh: Praat 读成 Sound 或 LongSound 物件的硬盘档案：WAV、AIFF、FLAC、MP3、Ogg 等，每个档头都声明采样率与声道数。
  how:
    en: Open → Read from file... opens such a file into memory and Open → Open long sound file... keeps
      it on disk; the Save menu writes the same formats back.
    zh: Open → Read from file... 把档案读进记忆体，Open → Open long sound file... 让它留在硬盘上，Save 菜单可以写回同样的格式。
  concept:
    en: Sampling frequency and channel count are properties of the file, and they decide what can be measured
      afterwards, because the Nyquist limit is half the sampling frequency.
    zh: 采样率与声道数是档案的属性，它们决定之后能量什么，因为奈奎斯特上限就是采样率的一半。
  pitfalls:
  - en: A compressed format such as MP3 is fine for listening but has already thrown information away.
    zh: MP3 这类压缩格式可以听，但资讯早就被丢掉了。
  - en: The file header can disagree with the recording, so check the sampling frequency with Info before
      you measure.
    zh: 档头可能和实际录音不一致，量测前先用 Info 查看采样率。
  - en: 'There is no ''Sound files'' object in the Objects list: the list holds the objects Praat has
      already read, and a Corpus holds the file names of a whole folder.'
    zh: Objects 清单里并没有「Sound files」这种物件：清单装的是 Praat 已经读进来的物件，而 Corpus 装的才是整个资料夹的档名。
  keywords:
  - sound files
  - 音档
  - wav
  - aiff
  - flac
  - mp3
  - 档案
  - file
  - 采样率
  - 声道
- id: cmd-create-textgrid
  aliases:
  - Create TextGrid
  title:
    en: Create TextGrid...
    zh: Create TextGrid...（建立文本网格）
  what:
    en: A New-menu command that creates an empty TextGrid over a time domain you type in, with the tier
      names you give and a choice of which tiers are point tiers.
    zh: New 菜单里的指令，在你自己输入的时间范围上建立一个空 TextGrid，并指定各层名称以及哪些是点层。
  how:
    en: New → Create TextGrid..., then give the start and end time in seconds and the tier names; the
      object appears in the list, ready for labelling.
    zh: New → Create TextGrid...，填入起讫秒数与各层名称，物件就会出现在清单里等着你标注。
  concept:
    en: Making the grid by hand is right when there is no recording yet, for instance when you plan the
      tier design of a corpus; making it from a Sound guarantees that both time domains coincide.
    zh: 没有录音时手工建立网格是对的，例如你要先规划整批语料的层级设计；由 Sound 生成则保证两者的时间范围完全重合。
  pitfalls:
  - en: 'The grid starts empty: nothing is transcribed for you.'
    zh: 网格一开始是空的，不会帮你转写。
  - en: The time domain must match the sound you will annotate later, or the tiers will not line up with
      the audio.
    zh: 时间范围要和之后要标注的声音一致，否则层级与音讯对不上。
  - en: A tier with an empty name is legal but impossible to recognise later.
    zh: 层级名称留空虽然合法，但之后完全认不出来。
  keywords:
  - create textgrid
  - 建立
  - 文本网格
  - textgrid
  - tier
  - 层级
  - 新建
  - new
- id: cmd-create-corpus
  aliases:
  - Create Corpus
  title:
    en: Create Corpus...
    zh: Create Corpus...（建立语料库）
  what:
    en: A New-menu command that builds a Corpus object by listing the sound files in a folder and pairing
      them with the annotation files of the same name.
    zh: New 菜单里的指令，列出某个资料夹里的声音档，并与同名标注档配对，建立一个 Corpus 物件。
  how:
    en: New → Create Corpus..., then give the folder with sound files, the sound file extension, the annotation
      folder and the annotation extension. One row appears per sound file.
    zh: New → Create Corpus...，填入声音档资料夹、音档副档名、标注资料夹与标注副档名，每个声音档会出现一列。
  concept:
    en: It is the fastest way to organise a corpus for batch processing, because the Corpus is the index
      that says which sound goes with which annotation.
    zh: 这是为批次处理整理语料最快的做法，因为 Corpus 就是那份索引，说明哪个声音配哪个标注。
  pitfalls:
  - en: 'Nothing is read into memory: the Corpus only stores file names, so it stays small even for thousands
      of recordings.'
    zh: 不会把任何东西读进记忆体：Corpus 只存档名，所以即使上千笔录音也很小。
  - en: A wrong extension gives an empty corpus rather than an error message.
    zh: 副档名写错会得到空的语料库，而不是错误讯息。
  keywords:
  - create corpus
  - 建立
  - 语料库
  - corpus
  - 资料夹
  - folder
  - annotation
  - 标注
- id: cmd-record-mono-sound
  aliases:
  - Record mono Sound
  title:
    en: Record mono Sound...
    zh: Record mono Sound...（录单声道声音）
  what:
    en: A New-menu command that opens the Sound recorder and captures your voice or any input as a single-channel
      Sound object.
    zh: New 菜单里的指令，打开录音窗口，把你的声音或任何输入录成单声道的 Sound 物件。
  how:
    en: New → Record mono Sound..., press Record in the SoundRecorder window, then Stop and Save. The
      new Sound appears in the Objects list.
    zh: New → Record mono Sound...，在 SoundRecorder 窗口按 Record 录音，结束后按 Stop 与 Save，新 Sound 会出现在清单里。
  concept:
    en: The recording is sampled at the sampling frequency the recorder is set to, and everything you
      measure afterwards is limited by it, so a 16 kHz recording cannot show the fine structure of a fricative.
    zh: 录音会以设定的采样率取样，之后所有量测都受它限制，16 kHz 的录音显示不出擦音的精细结构。
  pitfalls:
  - en: On a laptop with no input device the recorder opens but records silence.
    zh: 没有输入装置的笔电上，录音窗口照开，却录到一片静音。
  - en: Check the input level before recording an hour of speech.
    zh: 录一小时的语音之前，先检查输入电平。
  keywords:
  - record mono sound
  - 录音
  - 麦克风
  - microphone
  - 单声道
  - mono
  - new
  - 采样率
- id: cmd-record-stereo-sound
  aliases:
  - Record stereo Sound
  title:
    en: Record stereo Sound...
    zh: Record stereo Sound...（录立体声声音）
  what:
    en: A New-menu command that opens the Sound recorder with two channels, so that your input is captured
      as a stereo Sound object.
    zh: New 菜单里的指令，打开双声道的录音窗口，把输入录成立体声的 Sound 物件。
  how:
    en: New → Record stereo Sound...; in the SoundRecorder window both channels are drawn, so you can
      check that the left and right inputs really differ.
    zh: New → Record stereo Sound...，SoundRecorder 窗口里会画出两个声道，可以检查左右输入是否真的不同。
  concept:
    en: Two channels give two views of the same event, which is useful when a lavalier and a headset microphone
      are worn at the same time.
    zh: 两个声道给你同一事件的两份视角，同时戴领夹麦与头戴麦时特别有用。
  pitfalls:
  - en: 'Two channels are not automatically a stereo recording: they may be two microphones in different
      places.'
    zh: 两个声道不自动等于真正的立体声录音，可能是两支放在不同位置的麦克风。
  - en: Analyses such as To Pitch... work on one channel, so extract one channel first if you need a contour.
    zh: To Pitch... 之类的分析只用一个声道，要做曲线就先取出一个声道。
  keywords:
  - record stereo sound
  - 录音
  - 立体声
  - stereo
  - 双声道
  - microphone
  - 麦克风
- id: cmd-read-from-file
  aliases:
  - Read from file
  title:
    en: Read from file...
    zh: Read from file...（从档案读入）
  what:
    en: The Open-menu command that reads an audio file into memory and puts a Sound object in the Objects
      list.
    zh: Open 菜单里的指令，把音档读进记忆体，并在清单里放一个 Sound 物件。
  how:
    en: Open → Read from file... (Ctrl-O), choose the file, and Praat asks for the name of the new object.
      The three dots in the label mean that a dialog follows.
    zh: Open → Read from file...（Ctrl-O），选择档案，Praat 会问新物件要叫什么名字。标签末尾的三个点是表示后面会开对话框。
  concept:
    en: Praat converts every format it reads into the same internal representation, a sampled waveform
      with a declared sampling frequency, so the format on disk stops mattering once the file is loaded.
    zh: Praat 读进来的各种格式都会转成同一种内部表示，也就是带采样率的取样波形，所以档案一旦载入，原始格式就不再重要。
  pitfalls:
  - en: It reads one file at a time; for a stereo file use Read separate channels from sound file... to
      get one Sound per channel.
    zh: 一次只读一个档案，立体声档要用 Read separate channels from sound file... 才会左右声道各得到一个 Sound。
  - en: A very long file is loaded completely into memory and can freeze Praat; use Open long sound file...
      instead.
    zh: 很长的档案会整个载入记忆体，可能让 Praat 当机，要改用 Open long sound file...。
  keywords:
  - read from file
  - 读取
  - 读档
  - 音档
  - wav
  - aiff
  - 声音
  - sound
  - ctrl-o
- id: cmd-read-table-tab-separated
  aliases:
  - Read Table from tab-separated file
  title:
    en: Read Table from tab-separated file...
    zh: Read Table from tab-separated file...（读表格型文字档）
  what:
    en: An Open-menu command that reads a plain text file whose columns are separated by tab characters
      into a Table object with real numeric columns.
    zh: Open 菜单里的指令，把以定位字元分栏的纯文字档读成 Table 物件，每一栏都是真正的数值栏位。
  how:
    en: Open → Read Table from tab-separated file..., choose the file; the first line is read as the column
      names unless the file starts with a special marker.
    zh: Open → Read Table from tab-separated file...，选择档案；除非档案开头有特殊标记，第一行会被当作栏位名称。
  concept:
    en: 'Tab-separated text is the format that survives everything: Praat, R, Python and Excel all read
      it, so it is the safe way to hand measurements to a statistician.'
    zh: 定位字元分隔的文字是最稳的交换格式：Praat、R、Python 与 Excel 都读得，所以把量测交给统计学者时用它最安全。
  pitfalls:
  - en: If the file uses spaces or commas instead of tabs, the whole row lands in a single column.
    zh: 档案若用空白或逗号而非定位字元分栏，整列会被塞进同一栏。
  - en: A spreadsheet exported with a Chinese locale may put the decimal comma in the wrong place.
    zh: 中文语系的试算表汇出时可能把小数逗号放错位置。
  keywords:
  - read table
  - tab separated
  - 读取
  - 表格
  - 定位字元
  - csv
  - 量测
  - 栏位
- id: cmd-read-tableofreal-headerless
  aliases:
  - Read TableOfReal from headerless spreadsheet file
  title:
    en: Read TableOfReal from headerless spreadsheet file...
    zh: Read TableOfReal from headerless spreadsheet file...（读无标题的数值表）
  what:
    en: An Open-menu command that reads a spreadsheet file without a header line into a TableOfReal object,
      that is a grid of numbers.
    zh: Open 菜单里的指令，把没有标题列的试算表档案读成 TableOfReal 物件，也就是一片数字网格。
  how:
    en: Open → Read TableOfReal from headerless spreadsheet file..., choose the file; the numbers are
      read row by row and you add the labels afterwards if you need them.
    zh: Open → Read TableOfReal from headerless spreadsheet file...，选择档案，数字会逐列读入，需要标签的话之后再补上。
  concept:
    en: This is the way to bring a bare data file into Praat's statistics, which need labelled numbers
      rather than a spreadsheet with formatting.
    zh: 这是把纯数据档带进 Praat 统计功能的途径，因为统计需要的是带标签的数字，而不是有格式的试算表。
  pitfalls:
  - en: Because the file has no header, nothing tells you which column is which; label them yourself.
    zh: 档案没有标题，没有任何东西告诉你哪一栏是哪一栏，标签要自己加。
  - en: Text cells break the reading, because this format accepts numbers only.
    zh: 文字格会让读取失败，因为这个格式只接受数字。
  keywords:
  - read tableofreal
  - headerless
  - 读取
  - 数值表
  - 统计
  - spreadsheet
  - 无标题
- id: cmd-read-matrix-raw-text
  aliases:
  - Read Matrix from raw text file
  title:
    en: Read Matrix from raw text file...
    zh: Read Matrix from raw text file...（读矩阵文字档）
  what:
    en: An Open-menu command that reads a plain text file of numbers into a Matrix object, one matrix
      row for every line of the file.
    zh: Open 菜单里的指令，把纯数字文字档读成 Matrix 物件，档案每一行对应矩阵的一列（横列）。
  how:
    en: Open → Read Matrix from raw text file..., choose the file. A file with a text header is not accepted;
      read that one as a Table instead.
    zh: Open → Read Matrix from raw text file...，选择档案。带文字抬头的档案不能这样读，请改读成 Table。
  concept:
    en: 'A Matrix is the simplest numeric container: the values keep their order but lose every label,
      which is exactly what a raw data file offers.'
    zh: Matrix 是最简单的数值容器：数值保留顺序却丢掉所有标签，正好对应一个纯数据档。
  pitfalls:
  - en: No labels means you must keep a note of what the rows and the columns were.
    zh: 没有标签，你就必须自己记下每一行每一列是什么。
  - en: Rows and columns can end up transposed without any warning.
    zh: 列与行可能在没有任何提示的情况下被对调。
  keywords:
  - read matrix
  - raw text
  - 读取
  - 矩阵
  - matrix
  - 数字
  - numbers
- id: cmd-read-strings-raw-text
  aliases:
  - Read Strings from raw text file
  title:
    en: Read Strings from raw text file...
    zh: Read Strings from raw text file...（读字串文字档）
  what:
    en: An Open-menu command that reads a simple text file into a Strings object, one string per line.
    zh: Open 菜单里的指令，把简单文字档读成 Strings 物件，一行一个字串。
  how:
    en: Open → Read Strings from raw text file..., choose the file. It is the easy alternative to the
      generic Read from file..., which needs Praat's own text format.
    zh: Open → Read Strings from raw text file...，选择档案。它是一般性的 Read from file... 之外的方便做法，后者需要 Praat 自己的文字格式。
  concept:
    en: Strings is Praat's text-only data structure, so a file of names, labels or words comes in without
      any conversion.
    zh: Strings 是 Praat 只装文字的资料结构，所以一档案名、标签或词语进来时不需要任何转换。
  pitfalls:
  - en: Every line becomes one string, including empty lines.
    zh: 每一行都会变成一个字串，空行也算。
  - en: A file with a header line gives you that header line as your first string.
    zh: 档案若有抬头行，第一个字串就是这个抬头。
  keywords:
  - read strings
  - raw text
  - 读取
  - 字串
  - strings
  - 清单
  - list
- id: cmd-read-special-tier-file
  aliases:
  - Read from special tier file
  title:
    en: Read from special tier file...
    zh: Read from special tier file...（读取特殊层级的档案）
  what:
    en: An Open-menu command that reads tier (annotation) data from a file in one of the special formats
      Praat understands, instead of reading an audio file.
    zh: Open 菜单里的指令，从 Praat 能读的某种特殊格式读取层级（标注）资料，而不是读音档。
  how:
    en: Open → Read from special tier file..., choose the file; Praat recognises the format and builds
      a TextGrid or a tier object from the labels it finds.
    zh: Open → Read from special tier file...，选择档案，Praat 会认出格式，并从标签建立一个 TextGrid 或层级物件。
  concept:
    en: Annotation does not always begin life as a Praat file, and this command is the bridge for the
      formats that other tools write.
    zh: 标注不一定一开始就是 Praat 的档案，这条指令就是为其他工具写出来的格式搭的桥。
  pitfalls:
  - en: 'It reads labels only: the sound is a separate object that you still have to open.'
    zh: 它只读标签，声音是另一个物件，你还是得另外打开。
  - en: For your own annotation use Save TextGrid as text file...; this command is for foreign formats.
    zh: 自己的标注请用 Save TextGrid as text file...，这条指令是给外来格式用的。
  keywords:
  - read from special tier file
  - 读取
  - 层级
  - tier
  - 标注
  - annotation
  - 格式
- id: concept-time-axis
  aliases:
  - Time axis
  title:
    en: The time axis
    zh: 时间轴
  what:
    en: The common scale, in seconds, on which a Sound, its analyses and its annotation are all placed,
      so that a measurement and a label can be compared.
    zh: 声音、各项分析与标注共同放置的秒数刻度，让量测与标签可以直接对照。
  how:
    en: Every analysis object has a time step and a start time, and in the editor the cursor and the selection
      are positions on this axis. Read the cursor position with Query → Get (time) of cursor....
    zh: 每个分析物件都有时间步长与起始时间；在编辑窗口里游标与选区就是这条轴上的位置，可用 Query → Get (time) of cursor... 读取。
  concept:
    en: 'Praat''s shared time axis is what makes annotation and measurement interchangeable: the formant
      value at 1.234 s and the segment labelled at 1.234 s refer to the same instant.'
    zh: Praat 共用的时间轴让标注与量测可以互换：1.234 秒处的共振峰数值与同一时刻的音段标签指的是同一个瞬间。
  pitfalls:
  - en: Time in seconds and time in samples are different, and the sampling frequency converts between
      them.
    zh: 秒与样本数是两种时间，要靠采样率换算。
  - en: Extract part... starts the new object at zero unless you ask it to preserve the times.
    zh: Extract part... 默认让新物件从 0 开始，除非你要求保留时间。
  keywords:
  - time axis
  - 时间轴
  - 时间
  - seconds
  - 秒
  - 对齐
  - alignment
  - cursor
  - 游标
- id: concept-sampling-frequency
  aliases:
  - Sampling frequency
  title:
    en: Sampling frequency
    zh: 采样率
  what:
    en: The number of waveform samples stored per second, written as for example 44100 Hz; together with
      the duration it fixes how much of the recording you have.
    zh: 每秒储存多少个波形样本，例如 44100 Hz；它与长度一起决定你手上拥有多少录音资料。
  how:
    en: Read it with Query → Get sampling frequency, or look at the sampling frequency line in Info. Convert
      → Resample... changes it.
    zh: 用 Query → Get sampling frequency 读取，或看 Info 里的采样率那一行，Convert → Resample... 可以改变它。
  concept:
    en: 'The sampling frequency is not a quality setting but a measurement grid: it decides the finest
      time structure you can see and, through the Nyquist limit, the highest frequency you can analyse.'
    zh: 采样率不是品质设定，而是量测的网格：它决定你能看到多细的时间结构，也通过奈奎斯特上限决定你能分析多高的频率。
  pitfalls:
  - en: A microphone may record at 48 kHz while the file header says 44100 Hz, and then the pitch comes
      out wrong.
    zh: 麦克风可能以 48 kHz 录制，档头却写 44100 Hz，这时算出来的音高会不对。
  - en: Resampling downwards loses frequency information that cannot be recovered.
    zh: 向下重取样丢掉的频率资讯无法找回。
  keywords:
  - sampling frequency
  - 采样率
  - 取样频率
  - hertz
  - sample rate
  - 网格
  - nyquist
- id: concept-nyquist-limit
  aliases:
  - Nyquist limit
  title:
    en: The Nyquist limit
    zh: 奈奎斯特上限
  what:
    en: The highest frequency that can be represented in a sampled signal, equal to half the sampling
      frequency; 44100 Hz therefore allows analysis up to 22050 Hz.
    zh: 取样讯号所能表示的最高频率，等于采样率的一半，所以 44100 Hz 最多只能分析到 22050 Hz。
  how:
    en: Keep the limit in mind when you choose a formant range or a spectrogram view range, because a
      request above the limit cannot return anything useful.
    zh: 选择共振峰范围或频谱图的检视范围时要记住这个上限，超过上限的要求得不到有用的结果。
  concept:
    en: The sampling theorem says that a signal must be band-limited to half the sampling frequency, otherwise
      the frequencies above the limit fold back into the audible range as aliasing.
    zh: 取样定理要求讯号的频宽不超过采样率的一半，否则超过上限的频率会折叠回可听范围，形成混叠。
  pitfalls:
  - en: At 16 kHz the limit is 8 kHz, where the second formant of many vowels has already gone.
    zh: 16 kHz 时上限是 8 kHz，许多元音的第二共振峰已经不见了。
  - en: Raising the sampling frequency in the recorder does not bring back detail the microphone never
      captured.
    zh: 把录音的采样率调高，不会带回麦克风本来就没收到的细节。
  keywords:
  - nyquist
  - 奈奎斯特
  - 上限
  - limit
  - 混叠
  - aliasing
  - 采样率
  - 频率上限
- id: concept-formant
  aliases:
  - What is a formant
  title:
    en: What is a formant?
    zh: 什么是共振峰？
  what:
    en: 'A resonance of the vocal tract: a peak in the spectral envelope of a vowel, reported as a frequency
      (F1, F2, F3) and a bandwidth.'
    zh: 声道的共振，也就是元音频谱包络上的峰，以频率（F1、F2、F3）与频宽来报告。
  how:
    en: Estimate them with Analyse spectrum → To Formant (burg)..., then read the values with Plot or
      Query, and choose the formant range to match the speaker.
    zh: 用 Analyse spectrum → To Formant (burg)... 估计，再用 Plot 或 Query 读数值；共振峰范围要配合说话者来选。
  concept:
    en: 'The vocal tract filters the glottal source, so the spectrum of a vowel is the source spectrum
      shaped by the tract: F1 relates mostly to mouth opening, F2 mostly to tongue position and lip rounding.'
    zh: 声道替声门音源滤波，所以元音的频谱是被声道塑形后的音源频谱：F1 主要关系到口腔开度，F2 主要关系到舌位与圆唇。
  pitfalls:
  - en: Tracking formants on a male voice with the female standard of 5500 Hz can lose formants in the
      low region; Praat's own FAQ says to set the maximum formant down to 5000 Hz.
    zh: 用女声的预设 5500 Hz 上限追踪成年男声，低频区的共振峰会消失；Praat 自己的问答说这时要把上限降到 5000 Hz。
  - en: A single frame of a formant is meaningful only if the vowel is steady at that moment.
    zh: 共振峰的单帧数值只有在那个位置的元音是稳定时才有意义。
  keywords:
  - formant
  - 共振峰
  - 定义
  - definition
  - f1
  - f2
  - 频谱包络
  - 声道
- id: concept-fundamental-frequency
  aliases:
  - Fundamental frequency
  title:
    en: Fundamental frequency
    zh: 基频
  what:
    en: The rate at which the vocal folds vibrate, in hertz. For a voiced sound it is the spacing between
      the harmonics in the spectrum and the period of the waveform.
    zh: 声带每秒振动的次数，以赫兹表示；对有声语音来说，它是频谱中泛音的间距，也是波形的周期。
  how:
    en: Estimate it with Analyse periodicity → To Pitch..., set the floor and the ceiling to the range
      of the speaker, and read the values from the Pitch object or from the contour.
    zh: 用 Analyse periodicity → To Pitch... 估计，把上下限设成说话者的范围，再从 Pitch 物件或曲线读数值。
  concept:
    en: 'Praat estimates periodicity by autocorrelation or cross-correlation: it looks for how often the
      waveform repeats inside the analysis window, which needs at least two pitch periods to be reliable.'
    zh: Praat 用自相关或跨相关估计周期性：在分析窗内寻找波形多久重复一次，这至少需要两个基频周期才可靠。
  pitfalls:
  - en: An F0 value that is exactly half or twice the true value is an octave error, and a badly chosen
      range causes it.
    zh: F0 数值正好是真实值的一半或两倍就是八度跳错，范围设不好就会发生。
  - en: A missing value means an unvoiced frame, not a zero.
    zh: 缺失值代表无声格，不是零。
  keywords:
  - fundamental frequency
  - 基频
  - f0
  - 估计
  - estimate
  - 自相关
  - autocorrelation
  - 周期性
- id: concept-sound-and-analysis
  aliases:
  - Sound and its analysis objects
  title:
    en: A Sound and its analysis objects
    zh: Sound 与它的分析物件
  what:
    en: 'The difference between the recording itself and the objects computed from it: a Sound holds samples,
      while Pitch, Formant, Intensity and Spectrogram hold derived numbers for the same time axis.'
    zh: 录音本身与由它算出的物件之间的分别：Sound 装着样本，Pitch、Formant、Intensity 与 Spectrogram 装着同一条时间轴上的衍生数值。
  how:
    en: You always analyse a Sound, and the result is a new object in the list while the Sound stays untouched.
      Removing the Sound also removes the objects that depend on it.
    zh: 分析的对象永远是 Sound，结果是清单里的新物件，Sound 本身不受影响；移除 Sound 会连带移除依赖它的物件。
  concept:
    en: Because the analysis objects are separate, you can change the settings and recompute, or keep
      several versions of the same analysis side by side for comparison.
    zh: 因为分析物件是独立的，你可以改设定重算，也可以把同一份分析的多个版本并排留着比较。
  pitfalls:
  - en: 'Analysis objects are not pictures: they are numbers you can query, tabulate and plot.'
    zh: 分析物件不是图，而是可以查询、制表与绘图的数值。
  - en: The analyses drawn inside the editor are computed on the fly and are not the same objects as the
      ones in the list.
    zh: 编辑窗口里画出的分析是即时算的，与清单里的物件不是同一个东西。
  keywords:
  - sound
  - analysis
  - 声音
  - 分析
  - 物件
  - object
  - 衍生
  - derived
  - pitch
  - formant
- id: concept-tier-types
  aliases:
  - Interval tier, point tier and duration tier
  title:
    en: Interval tier, point tier and duration tier
    zh: 区间层、点层与时长层
  what:
    en: 'The three kinds of tier in Praat: an interval tier holds labelled spans, a point tier holds labelled
      instants, and a duration tier holds relative durations.'
    zh: Praat 里三种层级的分别：区间层放有标签的时段，点层放有标签的瞬间，时长层放相对时长。
  how:
    en: 'Choose the kind when you create the tier: Annotate → To IntervalTier or Annotate → To TextTier,
      and New → Tiers → Create DurationTier....'
    zh: 建立层级时要选种类：Annotate → To IntervalTier 或 Annotate → To TextTier，以及 New → Tiers → Create DurationTier....
  concept:
    en: 'The choice follows the shape of what you describe: a phone lasts, an event happens at an instant,
      and a time-stretch factor is a property of a whole stretch of time.'
    zh: 选择依据是你所描述之物的形状：音素有延续，事件发生在某一瞬间，而时间伸缩因子是整段时间的属性。
  pitfalls:
  - en: Only interval and point tiers live in a TextGrid; a duration tier is a separate object.
    zh: 只有区间层与点层能放进 TextGrid，时长层是独立物件。
  - en: Putting a phone in a point tier loses its duration, which is exactly what you wanted to measure.
    zh: 把音素放进点层会丢掉它的时长，而那正是你要量的东西。
  keywords:
  - interval tier
  - point tier
  - duration tier
  - 区间层
  - 点层
  - 时长层
  - 层级
  - tier
- id: concept-corpus-and-table
  aliases:
  - Corpus versus Table
  title:
    en: Corpus and Table
    zh: Corpus 与 Table 的分别
  what:
    en: 'A Corpus is a Table with a fixed meaning: two columns, Sound and Annotation, one row per recording,
      whereas a Table is a general spreadsheet whose columns you choose.'
    zh: Corpus 是有固定意义的 Table：两栏 Sound 与 Annotation，一列一个录音；Table 则是栏位由你决定的通用试算表。
  how:
    en: New → Create Corpus... builds a Corpus from a folder, and New → Tables → New Table... builds an
      empty Table. Open the Corpus with View & Edit to see the pairs of file names.
    zh: New → Create Corpus... 由资料夹建立 Corpus，New → Tables → New Table... 建立空 Table；用 View & Edit 打开 Corpus
      就能看到成对的档名。
  concept:
    en: A corpus is a collection of recordings plus their annotations, so a table that pairs a sound file
      with its annotation file is a small but complete description of one.
    zh: 语料库是录音加上它们的标注，所以一份把声音档与标注档配成对的表格，虽然小，却是对一笔语料的完整描述。
  pitfalls:
  - en: 'Do not rename the columns of a Corpus: those two names are what the corpus commands expect.'
    zh: 不要改 Corpus 的栏名：这两个名称就是语料库指令所期待的。
  - en: A Corpus does not check that the files exist, so its list can be out of date.
    zh: Corpus 不会检查档案是否存在，所以它的列表可能已经过时。
  keywords:
  - corpus
  - table
  - 语料库
  - 表格
  - 配对
  - pair
  - 差异
  - difference
- id: concept-object-based-design
  aliases:
  - Object-based design
  title:
    en: What it means that Praat works with objects
    zh: Praat 以物件运作为何
  what:
    en: 'The idea behind Praat: everything you work with is an object in the list, and each command says
      which type of object it acts on, so one sound can feed many analyses.'
    zh: Praat 背后的观念：你处理的一切都是清单里的物件，每条指令都指明它作用在哪一种物件上，所以同一段声音可以喂给多种分析。
  how:
    en: Select an object and the buttons on the right of the Objects window change to the commands that
      make sense for it, which is how the interface follows the data.
    zh: 选中物件后，Objects 窗口右边的按钮会变成对它有意义的那几条指令，介面就是这样跟着资料走的。
  concept:
    en: 'Object-based design is why Praat keeps your data in memory instead of in files: a Pitch object
      stays attached to the Sound it came from, and removing the Sound removes the Pitch with it.'
    zh: 以物件为中心的设计，正是 Praat 把资料留在记忆体而不是档案里的原因：Pitch 物件依附在它来源的 Sound 上，移除 Sound 就会连 Pitch 一起移除。
  pitfalls:
  - en: Objects live in memory, so quitting Praat without saving loses them.
    zh: 物件活在记忆体里，退出 Praat 前没有存档就全部消失。
  - en: Two objects can carry the same name, so select them by their position in the list rather than
      by name.
    zh: 两个物件可以同名，要靠清单里的位置而不是名称来分辨。
  keywords:
  - object
  - 对象
  - 物件
  - 资料模型
  - data model
  - 设计
  - memory
  - 记忆体
- id: concept-info-and-object-menu
  aliases:
  - Info button and object menu
  title:
    en: The Info button and the object menu
    zh: Info 按钮与物件菜单
  what:
    en: 'The two ways to find out what Praat holds: the Info button prints a short plain-text report about
      the selected object, and the object''s own menu lists the commands that apply to it.'
    zh: 查知 Praat 手里有什么的两条路：Info 按钮印出选中物件的简短纯文字报告，而物件自己的菜单列出适用于它的指令。
  how:
    en: Select an object and click Info to see its type, name, duration and sampling frequency; for the
      manual page of that type use the object-specific help button or Help → Types of objects.
    zh: 选中物件后点 Info，看它的类型、名称、长度与采样率；要读该类型的手册页，可以用物件专属的说明按钮或 Help → Types of objects。
  concept:
    en: 'Info is the cheapest check in Praat: before you measure, ask the object what it is, because most
      beginner errors come from measuring the wrong thing.'
    zh: Info 是 Praat 里最便宜的检查：量测之前先问物件它是什么，因为初学者的错误大多出在量错了对象。
  pitfalls:
  - en: Info describes the object in memory, not the file on disk, so a resampled copy still reports the
      rate you gave it.
    zh: Info 讲的是记忆体里的物件而不是硬盘上的档案，重取样的副本仍会报出你给的采样率。
  - en: Inspect goes one level deeper and lists every field, which is slow on a long Sound.
    zh: Inspect 再往下一层，会列出每个栏位，对长声音很慢。
  keywords:
  - info
  - object menu
  - 物件菜单
  - 查询物件
  - 摘要
  - report
  - 类型
  - type
  - 检查
