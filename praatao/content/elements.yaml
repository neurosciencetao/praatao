- id: objects-menu-save
  aliases:
  - Save
  control_types:
  - MenuItemControl
  title:
    en: The Save menu (Objects window)
    zh: Save 菜单（Objects 窗口）
  what:
    en: Writes the selected object out to a file on disk, so that the data survives after Praat is closed.
      The commands it offers depend on the type of the selected object.
    zh: 把选中的物件写成硬盘上的档案，让资料在关闭 Praat 之后仍然存在。它提供的指令随选中物件的类型而变。
  how:
    en: Select the object first, then pick a command such as Save as WAV file... for a Sound or Save as
      text file... for a Table or a TextGrid. With nothing selected the Save menu is empty.
    zh: 先选中物件，再挑指令：声音用 Save as WAV file...，表格或 TextGrid 用 Save as text file...。没有选中任何物件时，Save 菜单是空的。
  concept:
    en: Praat's own text format is plain ASCII, so annotations and tables stay readable in any text editor,
      while sound is written as binary WAV that keeps the sampling frequency.
    zh: Praat 的原生文字格式是纯 ASCII，所以标注与表格在任何文字编辑器里都读得懂；声音则写成二进位的 WAV，并保留取样频率。
  pitfalls:
  - en: 'Saving is per object: a Table you derived from a Sound is not saved when you save the Sound.'
    zh: 存档是逐一物件做的：从声音算出来的表格，不会因为你存了声音就一起被存下来。
  - en: Save as text file... writes the numbers of a Table or the labels of a TextGrid, not a sound wave.
    zh: Save as text file... 写出来的是表格的数字或 TextGrid 的标签，不是声音波形。
  - en: Save only affects the selected object; objects that depend on it are not saved with it.
    zh: Save 只作用于选中的物件，依赖它的下游物件不会跟着一起存。
  - en: Saving a Sound as a WAV file keeps the sampling frequency but not your microphone calibration.
    zh: 声音存成 WAV 会保留取样频率，但不会保留麥克风的校正值。
  keywords:
  - save
  - 储存
  - 存盘
  - 导出
  - export
  - wav
  - 文字档
  - text file
  - 档案
  - file
- id: objects-menu-help
  aliases:
  - Help
  control_types:
  - MenuItemControl
  title:
    en: The Help menu (Objects window)
    zh: Help 菜单（Objects 窗口）
  what:
    en: 'Opens the built-in documentation: the guided introduction, the manual pages, the object types,
      the two tutorials, and the pages about the project itself.'
    zh: 打开内建文件：入门导览、手册各页、物件类型、两个教程，以及关于这个计划本身的说明页。
  how:
    en: Help → Praat Intro (Ctrl-Shift-?) for the guided tour, Help → Search Praat manual... (Ctrl-M)
      to look a command up, Help → Go to manual page... to jump straight to a page whose name you know.
    zh: Help → Praat Intro（Ctrl-Shift-?）是导览，Help → Search Praat manual...（Ctrl-M）用来查指令，Help → Go to manual
      page... 可直接跳到你知道名字的那一页。
  concept:
    en: 'The Help menu is a set of doors into the manual. Praat Intro is a tutorial built around the same
      order as a first lab: open a sound, look at it, analyse it, annotate it.'
    zh: Help 菜单是一排通往手册的门。Praat Intro 是按第一堂实验课的顺序编排的教学：开声音、看声音、分析、标注。
  pitfalls:
  - en: The manual is in English only and describes the interface precisely; it does not teach you phonetics.
    zh: 手册只有英文，它把介面讲得很精确，却不会教你语音学。
  - en: On a machine without internet access these entries may do nothing; keep a local copy of the manual.
    zh: 没有网路时这些项目可能毫无反应，记得保留一份本地手册。
  - en: The Help menu of the Objects window and the Help menu inside an editor show different pages.
    zh: Objects 窗口的 Help 与编辑窗口内的 Help 内容并不相同。
  keywords:
  - help
  - 帮助
  - 说明
  - 手册
  - manual
  - 入门
  - intro
  - 教程
  - tutorial
  - 搜索
  - search
- id: open-menu-read-from-file
  aliases:
  - Read from file...
  control_types:
  - MenuItemControl
  title:
    en: Read from file...
    zh: Read from file...（从档案读入）
  what:
    en: Reads a sound file into memory and puts a Sound object in the list. It recognises the common audio
      formats, including WAV, AIFF, MP3 and FLAC.
    zh: 把音档读进记忆体，在清单里放一个 Sound 物件。它认得常见的音档格式，包括 WAV、AIFF、MP3 与 FLAC。
  how:
    en: Open → Read from file... (Ctrl-O), choose the file, and Praat asks for the name of the new object.
      The file name becomes the object name by default.
    zh: Open → Read from file...（Ctrl-O），选择档案，Praat 会问新物件要叫什么名字，默认会用档名作为物件名。
  concept:
    en: A Sound holds samples, a sampling frequency and a start time. The sampling frequency is not a
      quality setting but the number of samples per second, and it fixes the highest frequency you can
      analyse.
    zh: Sound 装着样本、取样频率与起始时间。取样频率不是品质设定，而是每秒多少样本，它决定你能分析到的最高频率。
  pitfalls:
  - en: For a long recording this loads everything into memory and Praat may freeze; use Open long sound
      file... instead.
    zh: 长录音用这一条会把全部内容载入记忆体，Praat 可能当机，要改用 Open long sound file...。
  - en: Reading a file twice under two names gives you two objects, not two speakers.
    zh: 同一份档案读两次、给了两个名字，得到的是两个物件，不是两位说话者。
  - en: Read from file... reads one file; for a stereo file use Read separate channels from sound file...
      to get one Sound per channel.
    zh: Read from file... 一次只读一个档案，立体声档要用 Read separate channels from sound file... 才会得到左右声道各一个 Sound。
  - en: If the file is very long, Read from file... loads all of it into memory and may freeze Praat;
      use Open long sound file... instead.
    zh: 档案很长时 Read from file... 会全部载入记忆体，可能让 Praat 当机，要改用 Open long sound file...。
  - en: Do not open the same file twice under two names and then treat them as two speakers; they are
      the same recording.
    zh: 别把同一份档案用两个名字打开就当成两位说话者，那是同一段录音。
  keywords:
  - read from file
  - 读取
  - 读档
  - wav
  - aiff
  - mp3
  - flac
  - 音档
  - sound
  - ctrl-o
  - 取样频率
  - sampling frequency
- id: open-menu-long-sound
  aliases:
  - Open long sound file...
  control_types:
  - MenuItemControl
  title:
    en: Open long sound file...
    zh: Open long sound file...（开启长声音档）
  what:
    en: Creates a LongSound object that stays on disk. Praat reads only a short window into memory each
      time it plays or draws the sound.
    zh: 建立留在硬盘上的 LongSound 物件。Praat 每次播放或绘制时只把一小段读进记忆体。
  how:
    en: Open → Open long sound file... (Ctrl-L), pick the file. The editor looks like the Sound editor
      but cannot be edited, and analyses are computed on the fly.
    zh: Open → Open long sound file...（Ctrl-L），选择档案。编辑窗口看起来像声音编辑窗口，但不能编辑，分析则是即时算出来的。
  concept:
    en: The buffer length is set by LongSound settings... (Praat menu → Settings) and defaults to 60 seconds.
      LongSound suits a whole conversation, but it cannot be turned into Pitch or Formant objects.
    zh: 缓冲长度由 Praat 菜单 → Settings 里的 LongSound settings... 决定，预设是 60 秒。LongSound 适合整段对话，但无法再转成 Pitch 或
      Formant 物件。
  pitfalls:
  - en: 'LongSound and Sound look alike but are not: the type name in the list tells them apart, and Analyse
      periodicity cannot make a Pitch object from a LongSound.'
    zh: LongSound 与 Sound 看起来像却不是同一回事，看清单里的类型名就知道，而且 Analyse periodicity 无法从 LongSound 产生 Pitch 物件。
  - en: You cannot cut and paste in a LongSound editor; use Extract part... on a copy instead.
    zh: LongSound 编辑窗口不能剪贴，要截片段请改用 Copy... 之后的 Extract part...。
  - en: Beginners confuse LongSound with Sound; the giveaway is the type name in the Objects list, and
      the fact that Analyse periodicity cannot make a Pitch object from it.
    zh: 初学者常把 LongSound 当成 Sound，看清单里的类型名就知道差别，LongSound 无法用 Analyse periodicity 产生 Pitch 物件。
  - en: LongSound cannot be edited, so cutting and pasting is not available.
    zh: LongSound 不能编辑，没有剪贴功能。
  keywords:
  - long sound
  - 长声音
  - longsound
  - 长音档
  - 记忆体
  - memory
  - 缓冲
  - buffer
  - 串流
  - streaming
  - ctrl-l
- id: open-menu-separate-channels
  aliases:
  - Read separate channels from sound file...
  control_types:
  - MenuItemControl
  title:
    en: Read separate channels from sound file...
    zh: Read separate channels from sound file...（分别读取声道）
  what:
    en: Reads a multi-channel audio file and creates one Sound object per channel instead of one combined
      stereo Sound.
    zh: 读取多声道音档，每个声道各建立一个 Sound 物件，而不是合成一个立体声 Sound。
  how:
    en: Open → Read separate channels from sound file..., choose the file, and Praat creates a separate
      Sound for each channel it finds.
    zh: Open → Read separate channels from sound file...，选择档案，Praat 会为侦测到的每个声道各建一个 Sound。
  concept:
    en: 'Channel separation is effectively a high-pass filter: what the microphone hears equally in both
      channels cancels out, so rumble and room noise are attenuated.'
    zh: 声道分离其实是一个高通滤波，左右声道听到一样的成分会互相抵消，所以低频隆隆声与房间杂音都被削弱。
  pitfalls:
  - en: For a genuine stereo recording the two microphones were in different places, so the channels are
      not interchangeable.
    zh: 真正的立体声录音里两个麦克风位置不同，左右声道并不可互换。
  - en: This gives you two Sound objects, not a stereo one; Combine is the command that puts two mono
      sounds back together as stereo.
    zh: 这条指令给你两个 Sound 物件而不是一个立体声物件，要合成立体声得用 Combine。
  - en: 'Using separate channels for a genuine stereo recording is wrong: the two microphones were in
      different places, so the channels are not interchangeable.'
    zh: 真正的立体声录音不该分别取声道：两个麦克风位置不同，左右并不可互换。
  keywords:
  - separate channels
  - 声道
  - 分别
  - stereo
  - 立体声
  - channel
  - 分离
  - 合并
  - combine
  - 高通
  - high pass
- id: open-menu-table-tab
  aliases:
  - Read Table from tab-separated file...
  control_types:
  - MenuItemControl
  title:
    en: Read Table from tab-separated file...
    zh: Read Table from tab-separated file...（读表格型文字档）
  what:
    en: Reads a text file whose columns are separated by tab characters into a Table object, with one
      row per line of the file.
    zh: 把以定位字元分栏的文字档读成 Table 物件，档案的每一行对应表格的一列。
  how:
    en: Open → Read Table from tab-separated file..., pick the file, and the numbers are read column by
      column. Use it for files that came out of a spreadsheet with tab separators.
    zh: Open → Read Table from tab-separated file...，选择档案，数字会逐栏读进来。电子表格汇出成定位字元分栏的档案就用这一条。
  concept:
    en: 'A Table is the bridge between a spreadsheet and an analysis: once the numbers are in a Table,
      Praat''s statistics and drawing commands can work on them column by column.'
    zh: Table 是电子表格与分析之间的桥，数字进了 Table 之后，Praat 的统计与绘图指令就能逐栏处理。
  pitfalls:
  - en: Text before the first number is taken as the header, so a file whose first line is data loses
      that line.
    zh: 第一个数字之前的文字会被当作表头，若档案第一行就是资料，这一行就丢了。
  - en: A decimal comma instead of a decimal point makes the column unreadable, and Praat will complain
      about non-numeric text.
    zh: 若用小数逗号而不是小数点，整栏会读不出来，Praat 会抱怨出现非数字的文字。
  - en: If the file uses spaces or commas instead of tabs, the whole row lands in one column; use the
      matching command instead.
    zh: 档案若用空白或逗号而非定位字元分栏，整列会被塞进同一栏，要改用对应的指令。
  - en: Text files with a header line of column names need the names to survive; check the first row after
      reading.
    zh: 带栏位名称抬头列的文字档，名称能不能留下来要看读完后第一行。
  keywords:
  - table
  - 表格
  - tab
  - 定位字元
  - 分隔
  - separated
  - 读取
  - read
  - csv
  - 栏
  - column
  - 表头
  - header
  - 电子表格
  - spreadsheet
- id: workflow-read-table-file
  aliases:
  - Read Table from semicolon-separated file...
  - Read Table from whitespace-separated file...
  - Read TableOfReal from headerless spreadsheet file...
  title:
    en: Bringing a data table into Praat
    zh: 把数据表读进 Praat
  what:
    en: Reads a plain text file of numbers into a Table object, so measurements made in other software
      can be analysed, sorted or plotted in Praat.
    zh: 把纯文字的数值档案读成 Table 物件，让别处量到的数据也能在 Praat 里分析、排序或绘图。
  how:
    en: Open → Read Table from tab-separated file... for tab-separated text, or the semicolon and whitespace
      variants for files saved with other separators; the first line becomes the column names unless the
      file starts with a special marker.
    zh: 定位字元分隔的文字档用 Open → Read Table from tab-separated file...，其他分隔符就用分号或空白字元的版本；第一行会成为栏位名称，除非档案开头有特殊标记。
  concept:
    en: A Table with one row per token and one column per variable is the standard bridge between Praat
      and any statistics package, and the format you should hand in with a lab report.
    zh: 一列一个语流、一栏一个变数的 Table，是 Praat 与任何统计软体之间的标准桥梁，也是实验报告该附上的格式。
  pitfalls:
  - en: If the file uses spaces or commas instead of the separator you chose, the whole row lands in one
      column and the values are lost.
    zh: 档案用的分隔符和你选的不符时，整列会被塞进同一栏，数值就全丢了。
  - en: Text cells and empty cells come in as empty strings, not as missing numbers, so check the first
      row after reading.
    zh: 文字格与空格读进来都是空字串，不是缺失值，读完要检查第一行。
  - en: Choosing the wrong separator gives one column instead of many, or an error about non-numeric text.
    zh: 选错分隔符的结果是整份档案变成一栏，或是出现非数字文字的报错。
  - en: In a comma-separated file the decimal point and the thousands separator both use the comma, so
      the numbers must be cleaned first.
    zh: 逗号分隔的档案里小数点与千分位都占用逗号，数字必须先清理过。
  - en: Excel on a Chinese locale may export a comma as the decimal separator, which shifts every value
      into the wrong column.
    zh: 中文语系的 Excel 可能用逗号当小数点，汇出后每一格数值都会错位。
  - en: Text cells and empty cells both come in as empty strings, not as missing numbers.
    zh: 文字格与空格读进来都是空字串，不是缺失值。
  keywords:
  - table
  - 表格
  - 读入
  - read
  - 试算表
  - 数据
  - data
  - 分隔
  - separator
  - spreadsheet
- id: open-menu-raw-text-objects
  aliases:
  - Read Matrix from raw text file...
  - Read Strings from raw text file...
  control_types:
  - MenuItemControl
  title:
    en: Read Matrix from raw text file..., Read Strings from raw text file...
    zh: 从原始文字档建立 Matrix 与 Strings
  what:
    en: Two low-level readers. Read Matrix from raw text file... makes a Matrix object, a rectangular
      grid of numbers; Read Strings from raw text file... makes a Strings object, a list of text lines.
    zh: 两个低阶的读入指令。Read Matrix from raw text file... 建立 Matrix 物件，也就是数字方格；Read Strings from raw text file...
      建立 Strings 物件，也就是一列文字列。
  how:
    en: Open → Read Matrix from raw text file... for numbers arranged in rows and columns; Open → Read
      Strings from raw text file... for one text item per line, such as a list of file names.
    zh: Open → Read Matrix from raw text file... 适合按行列排好的数字；Open → Read Strings from raw text file...
      适合一行一个文字项目，例如一串档名。
  concept:
    en: 'These two objects carry no time axis and no sampling frequency: they are the containers Praat
      uses for data that is not speech, such as a table of measurements or a list of files.'
    zh: 这两种物件不带时间轴，也不带取样频率，它们是 Praat 用来装非语音资料的容器，例如量测表或档案清单。
  pitfalls:
  - en: A Matrix is numbers only, so text in the file makes the command stop with an error.
    zh: Matrix 只放数字，档案里出现文字会让指令报错停下。
  - en: Strings keeps the lines as they are, including empty ones, so a trailing blank line becomes an
      empty item.
    zh: Strings 会原样保留每一行，空行也算一项，所以档案结尾的换行会变成一个空项目。
  - en: If the file contains a text header, read it as a Table instead; a Matrix tolerates only numbers.
    zh: 档案若含文字抬头，请改读成 Table，Matrix 只接受数字。
  keywords:
  - matrix
  - 矩阵
  - strings
  - 字符串
  - raw
  - 原始
  - text file
  - 文字档
  - numbers
  - 数字
  - line
  - 行
  - 方格
  - grid
- id: new-menu-create-textgrid
  aliases:
  - Create TextGrid...
  control_types:
  - MenuItemControl
  title:
    en: Create TextGrid...
    zh: Create TextGrid...（建立标注网格）
  what:
    en: 'Creates an empty TextGrid object: a set of tiers on a time axis, with no sound attached and no
      labels yet.'
    zh: 建立一个空的 TextGrid 物件：时间轴上的若干层级，既没有附上声音，也还没有任何标签。
  how:
    en: New → Create TextGrid... asks for the number of tiers and their names, and whether they should
      be interval tiers or point tiers. For an existing recording use Annotate → To TextGrid... instead.
    zh: New → Create TextGrid... 会问层级的数目与名称，以及要做区间层级还是点层级。若已有录音，改用 Annotate → To TextGrid....
  concept:
    en: A TextGrid separates the time structure of an utterance from its labels, so one annotation can
      be checked against a new recording, and different tiers can carry different levels of description.
    zh: TextGrid 把语流的时间结构与标签分开，所以同一份标注可以拿去比对新的录音，不同层级也能放不同层次的描述。
  pitfalls:
  - en: A TextGrid created here has no Sound, so the editor shows tiers without a waveform and you cannot
      hear what you label.
    zh: 这里建立的 TextGrid 没有附上声音，编辑窗口只显示层级没有波形，你听不到自己标注的东西。
  - en: Choosing point tiers when you meant interval tiers leaves you with a tier that cannot hold a phone
      label.
    zh: 本来想要区间层级却选了 point tier，结果是一个放不下音段标签的层级。
  - en: The time domain must match the sound you will annotate, otherwise the tiers do not line up with
      the audio.
    zh: 時間範圍要和之後要標註的聲音一致，否則層級與音訊對不上。
  - en: A tier named "" (empty) is legal but impossible to recognise later; name your tiers.
    zh: 層級名稱留空雖然合法，但之後完全認不出來，請一定要命名。
  keywords:
  - textgrid
  - 标注
  - 网格
  - 层级
  - tier
  - 区间
  - interval
  - 点
  - point
  - 建立
  - create
  - 空网格
